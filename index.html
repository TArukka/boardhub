<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>BoardHub — Storyboard OS</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   BoardHub Complete — Classy & Jazzy
   ══════════════════════════════════════════════════════════════ */
:root {
  --bg: #F5EEDC;
  --surface: rgba(255,248,240,0.96);
  --text: #2C1E16;
  --text-secondary: #5A4A3E;
  --accent: #D4A843;
  --accent-glow: rgba(212,168,67,0.35);
  --accent2: #C17A5E;
  --glass-border: rgba(255,255,255,0.3);
  --shadow: 0 8px 32px rgba(28,25,23,0.1);
  --radius: 14px;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
  --font-heading: 'Cormorant Garamond', serif;
  --font-ui: 'Figtree', sans-serif;
}
body.dark {
  --bg: #2C1E16;
  --surface: rgba(44,30,22,0.96);
  --text: #F5EEDC;
  --text-secondary: #B8A99A;
  --accent: #D4A843;
  --accent-glow: rgba(212,168,67,0.25);
  --accent2: #C17A5E;
  --glass-border: rgba(255,255,255,0.08);
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  transition: background var(--transition), color var(--transition);
  overflow-x: hidden;
  height: 100vh;
  user-select: none;
}
#root { height:100vh; display:flex; }

/* ═══════ GLOBAL CLASSES ═══════ */
.card{background:var(--surface);border:1px solid var(--glass-border);border-radius:14px;transition:border-color .2s,box-shadow .2s;}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow);}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-family:var(--font-ui);font-size:.85rem;font-weight:500;cursor:pointer;transition:all .18s;border:none;outline:none;}
.btn-dark{background:var(--text);color:var(--bg);} .btn-dark:hover{opacity:0.9;}
.btn-outline{background:transparent;color:var(--text-secondary);border:1px solid var(--glass-border);} .btn-outline:hover{border-color:var(--text);color:var(--text);}
.btn-ghost{background:transparent;color:var(--text-secondary);border:none;padding:6px 10px;}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;} .btn-danger:hover{background:#FEE2E2;}
.tag{display:inline-block;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:4px;}
.tag-green{background:#E8F5EC;color:#276b3e;} .tag-yellow{background:#FEF9E7;color:#92700b;} .tag-gray{background:#F0EDE9;color:var(--text-secondary);} .tag-red{background:#FDEDED;color:#9B1C1C;}
.input-box{background:var(--bg);border:1px solid var(--glass-border);border-radius:8px;padding:8px 12px;font-family:var(--font-ui);font-size:.85rem;color:var(--text);outline:none;width:100%;transition:border-color .2s;}
.input-box:focus{border-color:var(--text);}
.label{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-secondary);}
.tab-btn{padding:10px 0;margin-right:24px;background:none;border:none;cursor:pointer;font-family:var(--font-ui);font-size:.85rem;font-weight:500;transition:all .15s;margin-bottom:-1px;}
.fade-up{animation:fadeUp .35s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* ═══════ SIDEBAR ═══════ */
.sidebar{width:220px;min-width:220px;border-right:1px solid var(--glass-border);height:100vh;position:fixed;top:0;left:0;background:var(--surface);display:flex;flex-direction:column;padding:22px 14px 18px;z-index:30;overflow-y:auto;}
.main-content{margin-left:220px;flex:1;padding:24px 32px;overflow-y:auto;height:100vh;box-sizing:border-box;}

/* ═══════ MOBILE ═══════ */
.bottom-tab-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;background:var(--surface);backdrop-filter:blur(12px);border-top:1px solid var(--glass-border);padding:4px 0 env(safe-area-inset-bottom,0);height:56px;}
.mobile-header{display:none;position:sticky;top:0;z-index:50;background:var(--surface);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-border);padding:14px 16px;align-items:center;justify-content:space-between;}
.fab{display:none;position:fixed;bottom:72px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--text);color:var(--bg);border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:70;align-items:center;justify-content:center;font-size:1.5rem;}
@keyframes moreSheetIn{from{opacity:0;transform:translateY(100%);}to{opacity:1;transform:translateY(0);}}
.more-sheet-overlay{position:fixed;inset:0;z-index:90;animation:moreOverlayIn .2s ease;}
@keyframes moreOverlayIn{from{opacity:0;}to{opacity:1;}}
.more-sheet{position:fixed;bottom:0;left:0;right:0;z-index:91;background:var(--surface);border-radius:18px 18px 0 0;padding:12px 16px env(safe-area-inset-bottom,16px);animation:moreSheetIn .3s cubic-bezier(.32,.72,.5,1.02);max-height:70vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(28,25,23,.15);}
.more-sheet-handle{width:36px;height:4px;border-radius:4px;background:var(--text-secondary);margin:0 auto 16px;}
.more-sheet-item{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:10px;border:none;background:none;cursor:pointer;font-family:var(--font-ui);font-size:.95rem;font-weight:500;color:var(--text);width:100%;transition:background .15s;}
.more-sheet-item:active{background:var(--bg);}
.more-sheet-item.active-sheet{background:var(--accent-glow);}
@media(max-width:768px){
  .sidebar{display:none;}
  .main-content{margin-left:0;padding:0 16px 80px;height:auto;min-height:calc(100vh - 56px);overflow-y:auto;}
  .bottom-tab-bar{display:flex;align-items:stretch;justify-content:space-around;}
  .mobile-header{display:flex;}
  .fab{display:flex;}
}
.bottom-tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;border:none;background:none;cursor:pointer;font-family:var(--font-ui);font-size:.62rem;font-weight:600;color:var(--text-secondary);padding:6px 2px;transition:color .15s;}
.bottom-tab-item.active{color:var(--text);}

/* ═══════ DASHBOARD, POMODORO, ETC ═══════ */
.stat-card{padding:12px 16px;display:flex;align-items:center;gap:12px;}
.project-card{padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.task-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--glass-border);}
.task-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--glass-border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.task-check.done{background:var(--text);border-color:var(--text);}
.task-check.done::after{content:'';width:5px;height:9px;border:2px solid var(--bg);border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px);}
.progress-ring{transform:rotate(-90deg);}

/* ═══════ COMMAND PALETTE ═══════ */
@keyframes cmdIn{from{opacity:0;transform:scale(.97) translateY(-8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.cmd-overlay{position:fixed;inset:0;z-index:9999;background:rgba(28,25,23,.5);display:flex;align-items:flex-start;justify-content:center;padding-top:min(20vh,160px);}
.cmd-palette{width:min(560px,92vw);background:var(--surface);border:1px solid var(--glass-border);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.3);overflow:hidden;animation:cmdIn .2s cubic-bezier(.32,.72,.5,1.02);}
.cmd-input-wrap{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--glass-border);}
.cmd-input{flex:1;border:none;outline:none;background:transparent;font-family:var(--font-ui);font-size:1rem;color:var(--text);}
.cmd-results{max-height:340px;overflow-y:auto;padding:8px;}
.cmd-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:background .1s;font-size:.88rem;}
.cmd-item:hover,.cmd-item.cmd-active{background:var(--accent-glow);}
.cmd-item-title{font-weight:600;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmd-kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:5px;background:var(--bg);border:1px solid var(--glass-border);font-size:.68rem;font-weight:600;color:var(--text-secondary);}
.cmd-footer{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--glass-border);font-size:.72rem;color:var(--text-secondary);}

/* ═══════ QUICK CAPTURE ═══════ */
@keyframes quickCaptureIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.quick-capture{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:85;background:var(--surface);border:1px solid var(--glass-border);border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;animation:quickCaptureIn .25s;min-width:320px;max-width:min(480px,90vw);}
.quick-capture input{flex:1;border:none;outline:none;background:transparent;font-family:var(--font-ui);font-size:.9rem;color:var(--text);}

/* ═══════ RICH EDITOR ═══════ */
.rich-editor{outline:none;word-break:break-word;overflow-y:auto;min-height:80px;}
.rich-editor:empty:before{content:attr(data-placeholder);color:var(--text-secondary);pointer-events:none;}
.rich-toolbar-btn{display:flex;align-items:center;justify-content:center;width:28px;height:26px;border:none;background:transparent;border-radius:5px;cursor:pointer;color:var(--text-secondary);transition:background .12s,color .12s;flex-shrink:0;}
.rich-toolbar-btn:hover{background:var(--bg);color:var(--text);}

/* ═══════ LIGHTBOX ═══════ */
.lightbox{position:fixed;inset:0;background:rgba(10,8,6,.92);z-index:200;display:flex;align-items:center;justify-content:center;cursor:zoom-out;}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;cursor:default;}

/* ═══════ GANTT ═══════ */
.gantt-bar{transition:opacity .12s,box-shadow .12s;}
.gantt-bar:hover{opacity:.88;}

/* ═══════ COVER EDIT ═══════ */
.cover-wrap{position:relative;overflow:hidden;}
.cover-edit-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;opacity:0;transition:all .25s;cursor:pointer;}
.cover-wrap:hover .cover-edit-overlay{background:rgba(0,0,0,.45);opacity:1;}
</style>
</head>

<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useMemo, useCallback, useContext, createContext } = React;

// ══════════════════════════════════════════════════════════════
// UTILITIES
// ══════════════════════════════════════════════════════════════
const localDateISO = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const addDays = (s,d) => { const dt=new Date(s+'T12:00:00'); dt.setDate(dt.getDate()+d); return localDateISO(dt); };
const todayISO = () => localDateISO();
const deadlineInfo = dl => {
  if(!dl) return null;
  const diff=daysBetween(todayISO(),dl);
  const date = new Date(dl+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
  if(diff<0) return {label:'atrasado '+Math.abs(diff)+'d',date,color:'#9B1C1C',bg:'#FDEDED',urgent:true};
  if(diff===0) return {label:'hoje!',date,color:'#9B1C1C',bg:'#FDEDED',urgent:true};
  if(diff===1) return {label:'amanhã',date,color:'#92700b',bg:'#FEF9E7',urgent:true};
  if(diff<=7) return {label:'em '+diff+'d',date,color:'#92700b',bg:'#FEF9E7',urgent:false};
  return {label:'em '+diff+'d',date,color:'var(--text-secondary)',bg:'var(--bg)',urgent:false};
};
const statusTag = s => ({'Em Andamento':'tag-green','Pausado':'tag-yellow','Concluído':'tag-gray','Cancelado':'tag-red'}[s]||'tag-gray');
const fmtBRL = v => { const n=Number(v); return n&&!isNaN(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0}):null; };
const fmtShort = d => { if(!d) return ''; const dt=new Date(d+'T12:00:00'); return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); };

// ══════════════════════════════════════════════════════════════
// SEED DATA
// ══════════════════════════════════════════════════════════════
const _sd = (o) => { const d=new Date(); d.setDate(d.getDate()+o); return localDateISO(d); };
const SEED = {
  projects:[
    {id:1,type:'work',title:"Comercial Nike Summer",client:"Wieden+Kennedy",status:"Em Andamento",startDate:_sd(-14),deadline:_sd(21),deleted:false,cover:"https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&q=80&w=1200",notes:"Referências de motion blur.",mentors:[],researchNotes:[],projectTasks:[{id:1,text:"Roughs v1",status:"Fazendo",startDate:localDateISO(),dueDate:_sd(7)},{id:2,text:"Cores finais",status:"Pendente",startDate:_sd(8),dueDate:_sd(14)}],timelineEvents:[],shotsTotal:12,shotsDone:4,budget:2500,paid:false},
    {id:2,type:'personal',title:"Graphic Novel 'Ecos'",client:"Projeto Autoral",status:"Pausado",startDate:_sd(-45),deadline:_sd(60),deleted:false,cover:"https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=1200",notes:"Estudo de arquitetura brutalista.",mentors:[],researchNotes:[],projectTasks:[],timelineEvents:[]},
    {id:3,type:'work',title:"Série Documental — Amazônia",client:"TV Cultura",status:"Concluído",startDate:_sd(-90),deadline:_sd(-30),deleted:false,cover:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=1200",notes:"Projeto concluído.",mentors:[],researchNotes:[],projectTasks:[{id:3,text:"Entrega final",status:"Concluído"}],timelineEvents:[]}
  ],
  clients:[
    {id:1,name:"Fernanda Costa",company:"O2 Filmes",email:"fer@o2.com",role:"Produtora Executiva",status:"Ativo",notes:"",photo:"",deleted:false},
    {id:2,name:"Carlos Mendes",company:"Freelance",email:"carlos@gmail.com",role:"Diretor",status:"Lead",notes:"",photo:"",deleted:false}
  ],
  mentors:[{id:1,name:"Hayao Miyazaki",area:"Narrativa Visual",medium:"Animação",notes:"Estudar uso de silêncio.",links:"",active:true,main:true,photo:"",photos:[null,null,null,null],deleted:false}],
  notes:[{id:1,title:"Ideia para Curta",content:"Um robô que quer ser pintor.",date:"Hoje",deleted:false}],
  tasks:[{id:1,text:"Revisar roughs do Nike",done:false,noteId:null}],
  socialPosts:[],
  galleryPosts:[],
  galleryFolders:[{id:'work',label:'Work',deleted:false},{id:'movie-studies',label:'Movie Studies',deleted:false},{id:'sketchbooks',label:'Sketchbook',deleted:false}],
  noteGroups:[{id:'notes',label:'Notas',icon:'file-text'},{id:'projects',label:'Mini Projetos',icon:'folder-open'}]
};

// ══════════════════════════════════════════════════════════════
// LOCAL STORAGE & BACKUP
// ══════════════════════════════════════════════════════════════
const LS_KEY = 'boardhub_v2';
const lsLoad = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch { return null; } };
const lsSave = s => { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {} };
const THEME_KEY = 'boardhub_theme';
const getTheme = () => { try { return localStorage.getItem(THEME_KEY) || 'dark'; } catch { return 'dark'; } };

const BH_HISTORY_KEY = 'boardhub_backup_history';
const bhSig = s => { const str = JSON.stringify(s); let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return String(h); };
const bhHistoryLoad = () => { try { return JSON.parse(localStorage.getItem(BH_HISTORY_KEY)) || []; } catch { return []; } };
const bhLastAtKey = 'boardhub_backup_last_at';
let _bhLastAt = null;
const bhLastAt = () => { if(_bhLastAt!==null)return _bhLastAt; try{const v=localStorage.getItem(bhLastAtKey);if(v){_bhLastAt=v;return v;}}catch{} const l=bhHistoryLoad(); _bhLastAt=(l[0]&&l[0].at)||''; return _bhLastAt; };
const bhMarkCaptured = at => { _bhLastAt=at; try{localStorage.setItem(bhLastAtKey,at);}catch{} };
const bhRetention = list => {
  const dailies=[], others=[];
  list.forEach(e=>(e.reason==='daily'?dailies:others).push(e));
  const byWeekday=new Map();
  dailies.forEach(e=>{ const wd=new Date(e.at).getDay(); const cur=byWeekday.get(wd); if(!cur||e.at>cur.at) byWeekday.set(wd,e); });
  const keptDailies=[...byWeekday.values()];
  const keptOthers=[], seenDays=new Set();
  others.forEach((e,i)=>{ if(i<6){keptOthers.push(e);seenDays.add(e.at.slice(0,10));return;} const day=e.at.slice(0,10); if(!seenDays.has(day)){keptOthers.push(e);seenDays.add(day);} });
  return [...keptDailies,...keptOthers.slice(0,12)].sort((a,b)=>a.at<b.at?1:-1);
};
const bhCapture = (state, reason) => {
  try {
    if(!state || !state.projects) return false;
    const sig = bhSig(state);
    let list = bhHistoryLoad();
    if(reason==='daily'){ const wd=new Date().getDay(); const sameSlot=list.find(e=>e.reason==='daily'&&new Date(e.at).getDay()===wd); if(sameSlot&&sameSlot.sig===sig&&sameSlot.at.slice(0,10)===localDateISO())return false; }
    else { if(list[0]&&list[0].sig===sig)return false; }
    const entry = { at: new Date().toISOString(), reason, sig, state };
    list = bhRetention([entry, ...list]);
    localStorage.setItem(BH_HISTORY_KEY, JSON.stringify(list));
    bhMarkCaptured(entry.at);
    const last = bhLastAt();
    if(!last || Date.now()-new Date(last).getTime()>30*60*1000) bhMarkCaptured(new Date().toISOString());
    return true;
  } catch { return false; }
};

// ══════════════════════════════════════════════════════════════
// INDEXEDDB IMAGE STORE (batched reads)
// ══════════════════════════════════════════════════════════════
const IDB_NAME='boardhub_images', IDB_STORE='images';
let _idb=null, _idbP=null;
const openIdb = () => {
  if(_idb?.objectStoreNames) { try { _idb.transaction(IDB_STORE,'readonly').abort(); return Promise.resolve(_idb); } catch { _idb=null; } }
  if(_idbP) return _idbP;
  _idbP = new Promise((res,rej) => { const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE); r.onsuccess=e=>{_idb=e.target.result;_idbP=null;res(_idb);}; r.onerror=e=>{_idbP=null;rej(e.target.error);}; });
  return _idbP;
};
const idbPut = (k,b) => openIdb().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).put(b,k);t.oncomplete=()=>res();t.onerror=e=>rej(e.target.error);}));
const _readQ=[];
let _readScheduled=false;
const _flushReads=()=>{ _readScheduled=false; const batch=_readQ.splice(0,_readQ.length); if(!batch.length)return; openIdb().then(db=>{try{const tx=db.transaction(IDB_STORE,'readonly');const store=tx.objectStore(IDB_STORE);batch.forEach(item=>{try{const r=store.get(item.key);r.onsuccess=e=>item.res(e.target.result);r.onerror=()=>item.res(undefined);}catch{item.res(undefined);}});tx.onerror=()=>batch.forEach(i=>i.res(undefined));}catch{batch.forEach(i=>i.res(undefined));}}); };
const idbGet = key => new Promise(res=>{ _readQ.push({key,res}); if(!_readScheduled){_readScheduled=true;Promise.resolve().then(_flushReads);} });

const THUMB_MAX=480;
const _makeThumbBlob = async blob => {
  if(typeof createImageBitmap==='function'){try{const bmp=await createImageBitmap(blob);if(Math.max(bmp.width,bmp.height)<=THUMB_MAX){bmp.close();return blob;}const r=THUMB_MAX/Math.max(bmp.width,bmp.height),w=Math.round(bmp.width*r),h=Math.round(bmp.height*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close();return await new Promise(res=>c.toBlob(b=>res(b||blob),'image/webp',0.72));}catch{}}
  return await new Promise(res=>{const img=new Image(),u=URL.createObjectURL(blob);img.onload=()=>{URL.revokeObjectURL(u);const r=THUMB_MAX/Math.max(img.width,img.height);const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||blob),'image/webp',0.72);};img.onerror=()=>{URL.revokeObjectURL(u);res(blob);};img.src=u;});
};
const _compressImage = async file => {
  if(file.type==='image/gif'||file.size<60*1024)return file;
  return new Promise(res=>{const img=new Image(),objUrl=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(objUrl);const MAX=1400;let w=img.width,h=img.height;if(w>MAX||h>MAX){const r=MAX/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>res(b&&b.size<file.size?b:file),'image/webp',0.82);};img.onerror=()=>{URL.revokeObjectURL(objUrl);res(file);};img.src=objUrl;});
};
const uploadImage = async file => {
  const c=await _compressImage(file); const k='img_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  await idbPut(k,c); try{const tb=await _makeThumbBlob(c);await idbPut('thumb_'+k,tb);_thumbCache[k]=URL.createObjectURL(tb);}catch{} return 'idb://'+k;
};
const uploadImages = async (files,onP) => { const r=[]; for(let i=0;i<files.length;i++){r.push(await uploadImage(files[i]));if(onP)onP(i+1,files.length);} return r; };
const _thumbCache = {};
const getThumbUrl = async k => { if(_thumbCache[k])return _thumbCache[k]; try{const tb=await idbGet('thumb_'+k);if(tb){_thumbCache[k]=URL.createObjectURL(tb);return _thumbCache[k];}const full=await idbGet(k);if(!full)return'';const nb=await _makeThumbBlob(full);await idbPut('thumb_'+k,nb).catch(()=>{});_thumbCache[k]=URL.createObjectURL(nb);return _thumbCache[k];}catch{return'';} };

const useInView = (enabled) => {
  const hasIO = typeof IntersectionObserver !== 'undefined';
  const [inView, setInView] = useState(!enabled || !hasIO);
  const obsRef = useRef(null);
  const setRef = useCallback(node => {
    if(obsRef.current){obsRef.current.disconnect();obsRef.current=null;}
    if(inView || !enabled || !hasIO || !node) return;
    obsRef.current = new IntersectionObserver(entries=>{ if(entries.some(e=>e.isIntersecting)){setInView(true);obsRef.current?.disconnect();obsRef.current=null;} }, {rootMargin:'600px'});
    obsRef.current.observe(node);
  }, [inView, enabled, hasIO]);
  useEffect(()=>()=>{obsRef.current?.disconnect();},[]);
  return [setRef, inView];
};
const useDisplayUrl = (src, thumb=true) => {
  const [url,setUrl]=useState(''); const gate = typeof src==='string'&&src.startsWith('idb://');
  const [ref, inView] = useInView(gate);
  useEffect(()=>{
    if(!src||typeof src!=='string'){setUrl('');return;}
    if(!src.startsWith('idb://')){setUrl(src);return;}
    if(!inView) return;
    let cancelled=false;
    const key=src.slice(6);
    getThumbUrl(key).then(u=>{if(!cancelled)setUrl(u||'');});
    return()=>{cancelled=true;};
  },[src,thumb,inView]);
  return [url||src, ref];
};
const Img = ({src, ...props}) => { const [url,ref]=useDisplayUrl(src,true); return url ? <img ref={ref} src={url} {...props}/> : <div ref={ref} style={{background:'var(--glass-border)',...props.style}}/>; };
const BgImg = ({src, style, children, ...props}) => { const [url,ref]=useDisplayUrl(src,true); return <div ref={ref} style={{backgroundImage:url?`url(${url})`:'none',backgroundSize:'cover',backgroundPosition:'center',...style}} {...props}>{children}</div>; };
const isVideoSrc = src => /\.(mp4|webm|mov|avi|mkv|m4v|ogv)(\?|$|#)/i.test(src);
const Vid = ({src, ...props}) => { const [url]=useDisplayUrl(src,false); return url?<video src={url} {...props}/>:null; };
const imgKey = (src,i,list) => String(src)+(list.indexOf(src)===i?'':'#'+i);

// HTML Sanitizer
const _BAD_PROTO = /^\s*(?:javascript:|vbscript:|data:text\/html)/i;
const sanitizeHTML = html => {
  if(!html||typeof html!=='string')return html||'';
  try{const t=document.createElement('template');t.innerHTML=html;t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base').forEach(el=>el.remove());t.content.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase();if(n.startsWith('on')||n==='srcdoc'||n==='formaction')el.removeAttribute(a.name);else if((n==='href'||n==='src'||n==='xlink:href'||n==='action')&&_BAD_PROTO.test(a.value))el.removeAttribute(a.name);});});return t.innerHTML;}catch{return html;}
};

let _sharedAudioCtx = null;
const _getAudioCtx = () => { try{ if(!_sharedAudioCtx||_sharedAudioCtx.state==='closed') _sharedAudioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(_sharedAudioCtx.state==='suspended')_sharedAudioCtx.resume(); return _sharedAudioCtx; }catch{return null;} };
const _playNote = (ctx, freq, startT, vol, decay, type='triangle', detune=0) => { const osc=ctx.createOscillator(), gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type=type; osc.frequency.setValueAtTime(freq,startT); if(detune)osc.detune.setValueAtTime(detune,startT); gain.gain.setValueAtTime(0,startT); gain.gain.linearRampToValueAtTime(vol,startT+0.018); gain.gain.exponentialRampToValueAtTime(0.001,startT+decay); osc.start(startT); osc.stop(startT+decay+0.05); };
const playPomoSound = type => { const ctx=_getAudioCtx(); if(!ctx)return; const T=ctx.currentTime; if(type==='work_end'){[493.88,392.00,329.63,261.63,196.00].forEach((f,i)=>{_playNote(ctx,f,T+i*0.3,0.24,2.8,'triangle');_playNote(ctx,f,T+i*0.3,0.04,2.0,'sine',3);});} else if(type==='break_end'){_playNote(ctx,880,T,0.22,3.0,'triangle');_playNote(ctx,880,T,0.09,2.2,'sine',2.5);} else if(type==='pause'){_playNote(ctx,392,T,0.16,1.4,'triangle');_playNote(ctx,293.66,T+0.22,0.14,1.3,'triangle');} else if(type==='start'){_playNote(ctx,523.25,T,0.18,1.5,'triangle');_playNote(ctx,659.25,T+0.2,0.18,1.5,'triangle');_playNote(ctx,783.99,T+0.4,0.2,1.7,'triangle');} };

const PomodoroTimer = () => {
  const { pomoData, setPomoData } = useContext(AppContext);
  const [fm, setFm] = useState(() => { try { return JSON.parse(localStorage.getItem('boardhub_pomo_timer_v1'))?.focusMins||25; } catch { return 25; } });
  const [tl, setTl] = useState(fm*60); const [on, setOn] = useState(false); const [mode, setMode] = useState('focus');
  const [showStats, setShowStats] = useState(false); const [tick, setTick] = useState(true);
  const [dragging, setDragging] = useState(false); const [monthView, setMonthView] = useState(false);
  const circleRef = useRef(null); const endRef = useRef(null); const unsavedRef = useRef(0);
  const MAX=60, BRK=300;
  useEffect(() => { const d = { isActive:on, mode, timeLeft:tl, focusMins:fm, endTimestamp:endRef.current }; try { localStorage.setItem('boardhub_pomo_timer_v1', JSON.stringify(d)); } catch {} }, [on,mode,tl,fm]);
  useEffect(() => {
    if(!on) { endRef.current = null; return; }
    if(!endRef.current) endRef.current = Date.now() + tl*1000;
    const id = setInterval(() => {
      const remaining = Math.max(0, Math.round((endRef.current - Date.now())/1000));
      setTl(remaining);
      if(mode==='focus'){
        const delta = Math.max(0, tl-remaining);
        unsavedRef.current += delta;
        if(unsavedRef.current >= 30) flushFocus();
      }
      if(remaining <= 0){
        clearInterval(id);
        if(mode==='focus'){
          flushFocus(true);
          playPomoSound('work_end');
          setMode('break'); setTl(BRK); endRef.current = Date.now() + BRK*1000;
        } else {
          playPomoSound('break_end');
          setMode('focus'); setTl(fm*60); setOn(false); endRef.current = null;
        }
      }
    }, 200);
    return () => clearInterval(id);
  }, [on, mode]);
  const flushFocus = (force) => {
    if(unsavedRef.current > 0 || force){
      setPomoData(p => ({ days: { ...p.days, [localDateISO()]: (p.days[localDateISO()]||0) + unsavedRef.current } }));
      unsavedRef.current = 0;
    }
  };
  const getAngleMins = e => {
    if(!circleRef.current) return null;
    const r = circleRef.current.getBoundingClientRect();
    let angle = Math.atan2(e.clientX - r.left - 38, -(e.clientY - r.top - 38));
    if(angle<0) angle += 2*Math.PI;
    return Math.max(1, Math.min(MAX, Math.round((angle/(2*Math.PI))*MAX)));
  };
  const handlePointerDown = e => { if(on||mode!=='focus')return; e.preventDefault(); circleRef.current?.setPointerCapture(e.pointerId); setDragging(true); const mins = getAngleMins(e); if(mins){ setFm(mins); setTl(mins*60); } };
  const handlePointerMove = e => { if(!dragging)return; const mins = getAngleMins(e); if(mins){ setFm(mins); setTl(mins*60); } };
  const handlePointerUp = e => { if(!dragging)return; setDragging(false); const mins = getAngleMins(e); if(mins){ setFm(mins); setTl(mins*60); } };

  const todaySecs = (pomoData.days||{})[localDateISO()]||0;
  const DAY_TIERS = [{level:'none',icon:'⭐',name:'Iniciante',floor:0},{level:'bronze',icon:'🥉',name:'Bronze',floor:7200},{level:'silver',icon:'🥈',name:'Prata',floor:14400},{level:'golden',icon:'🏆',name:'Ouro',floor:21600},{level:'diamond',icon:'💎',name:'Diamante',floor:28800}];
  const star = (s) => { for(let i=DAY_TIERS.length-1;i>=0;i--) if(s>=DAY_TIERS[i].floor) return DAY_TIERS[i]; return DAY_TIERS[0]; };
  const currentStar = star(todaySecs); const next = DAY_TIERS.find(t=>t.floor>currentStar.floor)||null;
  const progress = next ? Math.min(100,((todaySecs-currentStar.floor)/(next.floor-currentStar.floor))*100) : 100;
  const dayEntries = useMemo(()=>Object.entries(pomoData.days||{}).filter(([k])=>k.length===10).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,60),[pomoData]);
  const monthEntries = useMemo(()=>{ const m={}; dayEntries.forEach(([d,s])=>{ const mk=d.slice(0,7); m[mk]=(m[mk]||0)+s; }); return Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0])); },[dayEntries]);
  const totalAll = dayEntries.reduce((s,[,sec])=>s+sec,0);
  const m=Math.floor(tl/60), s=tl%60;
  const pct = mode==='focus' ? (on?tl/(fm*60):fm/MAX) : tl/BRK;
  const knobAngle = on ? (1-(tl/(mode==='focus'?fm*60:BRK)))*2*Math.PI : (fm/MAX)*2*Math.PI;
  const R=34, CX=38, CY=38;
  const kx = CX + R*Math.sin(knobAngle), ky = CY - R*Math.cos(knobAngle);

  return <div style={{marginBottom:20}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
      <span className="label">Pomodoro</span>
      <div style={{display:'flex',gap:8}}>
        <span className={`tag ${mode==='focus'?'tag-yellow':'tag-green'}`}>{mode==='focus'?'🧠 Foco':'☕ Pausa'}</span>
        <button className="btn btn-ghost" onClick={()=>setShowStats(s=>!s)}>📊</button>
      </div>
    </div>
    {!showStats ? (
      <div className="card" style={{padding:12,display:'flex',alignItems:'center',gap:14}}>
        <div ref={circleRef} style={{position:'relative',width:76,height:76,flexShrink:0,cursor:(!on&&mode==='focus')?'pointer':'default',touchAction:'none'}}
          onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}>
          <svg width="76" height="76" style={{transform:'rotate(-90deg)'}}>
            <circle cx="38" cy="38" r={R} fill="none" stroke="var(--glass-border)" strokeWidth="4"/>
            <circle cx="38" cy="38" r={R} fill="none" stroke={mode==='focus'?'var(--accent)':'#48BB78'} strokeWidth="4" strokeDasharray={2*Math.PI*R} strokeDashoffset={2*Math.PI*R*(1-pct)} strokeLinecap="round" style={{transition:dragging?'none':'stroke-dashoffset .5s'}}/>
          </svg>
          {!on && mode==='focus' && <svg width="76" height="76" style={{position:'absolute',top:0,left:0,pointerEvents:'none'}}><circle cx={kx} cy={ky} r={dragging?6:4} fill="var(--accent)" stroke="var(--surface)" strokeWidth="2" style={{transition:dragging?'none':'r .15s'}}/></svg>}
          <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
            {dragging ? <span style={{fontFamily:'var(--font-heading)',fontSize:'1.1rem'}}>{fm}<span style={{fontSize:'.6rem',color:'var(--text-secondary)'}}>min</span></span> : <span style={{fontFamily:'var(--font-heading)',fontSize:'1.2rem',fontWeight:700}}>{String(m).padStart(2,'0')}:{String(s).padStart(2,'0')}</span>}
          </div>
        </div>
        <div style={{flex:1}}>
          <div style={{display:'flex',gap:6,marginBottom:6}}>
            <button className="btn btn-dark" onClick={()=>{if(!on){playPomoSound('start');setOn(true);}else{playPomoSound('pause');flushFocus();setOn(false);}}}>{on?'⏸ Pausar':'▶ Iniciar'}</button>
            <button className="btn btn-outline" onClick={()=>{setOn(false);setMode('focus');setTl(fm*60);endRef.current=null;}}>↺</button>
          </div>
          <div style={{fontSize:'.7rem',color:'var(--text-secondary)',display:'flex',alignItems:'center',gap:8}}>
            <span>🍅 {Math.floor(todaySecs/60)}min</span>
            <span style={{padding:'2px 8px',borderRadius:12,background:currentStar.level==='none'?'var(--bg)':`${currentStar.floor===7200?'#CD7F32':currentStar.floor===14400?'#94A3B8':currentStar.floor===21600?'#FBBF24':'#60A5FA'}20`,border:`1px solid ${currentStar.level==='none'?'var(--glass-border)':'currentColor'}`}}>{currentStar.icon} {currentStar.name}</span>
            {next && <div style={{flex:1,height:3,background:'var(--bg)',borderRadius:2,overflow:'hidden'}}><div style={{height:'100%',width:`${progress}%`,background:currentStar.floor===7200?'#CD7F32':currentStar.floor===14400?'#94A3B8':currentStar.floor===21600?'#FBBF24':'#60A5FA',borderRadius:2}}/></div>}
          </div>
          <label style={{display:'flex',alignItems:'center',gap:4,fontSize:'.7rem',marginTop:6,color:'var(--text-secondary)',cursor:'pointer'}}><input type="checkbox" checked={tick} onChange={()=>setTick(!tick)}/> Tick</label>
        </div>
      </div>
    ) : (
      <div className="card" style={{padding:16}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}><span className="label">Histórico</span><button className="btn btn-ghost" onClick={()=>setShowStats(false)}>✕</button></div>
        <div style={{display:'flex',gap:16,marginBottom:12}}><div>Hoje: {Math.floor(todaySecs/60)}min</div><div>{currentStar.icon} {currentStar.name}</div><div>Total: {Math.floor(totalAll/3600)}h {Math.floor((totalAll%3600)/60)}m</div></div>
        <div style={{display:'flex',gap:8,marginBottom:12}}><button className={`btn btn-ghost ${!monthView?'active':''}`} onClick={()=>setMonthView(false)}>Dias</button><button className={`btn btn-ghost ${monthView?'active':''}`} onClick={()=>setMonthView(true)}>Meses</button></div>
        {!monthView ? dayEntries.map(([day,secs])=> <div key={day} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',borderBottom:'1px solid var(--glass-border)'}}><span>{new Date(day+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'})}</span><span>{Math.floor(secs/60)}min</span></div>)
        : monthEntries.map(([mk,secs])=> <div key={mk} style={{display:'flex',justifyContent:'space-between',padding:'4px 0'}}><span>{new Date(mk+'-01').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</span><span>{Math.floor(secs/3600)}h {Math.floor((secs%3600)/60)}m</span></div>)}
      </div>
    )}
  </div>;
};

const GANTT_COLORS = {'Pendente':{bar:'#EDE8E1',text:'#6B6460',border:'#C8BEB4',dot:'#B5ABA0'},'Fazendo':{bar:'#FEF3C7',text:'#92700B',border:'#FCD34D',dot:'#F59E0B'},'Concluído':{bar:'#D1FAE5',text:'#065F46',border:'#6EE7B7',dot:'#10B981'},'Atrasado':{bar:'#FEE2E2',text:'#991B1B',border:'#FCA5A5',dot:'#EF4444'}};
const PTASK_STATUSES = ['Pendente','Fazendo','Concluído','Atrasado'];
const PTASK_NEXT = {'Pendente':'Fazendo','Fazendo':'Concluído','Concluído':'Atrasado','Atrasado':'Pendente'};
const applyAutoLate = tasks => { const today=new Date();today.setHours(0,0,0,0); return tasks.map(t=>{if(t.status==='Concluído'||!t.dueDate)return t;const due=new Date(t.dueDate);due.setHours(0,0,0,0);if(due<today&&t.status!=='Atrasado')return{...t,status:'Atrasado'};return t;}); };

const GanttTimeline = ({ tasks, onUpdateTasks, projectStart, projectEnd }) => {
  const today = useMemo(()=>todayISO(),[]);
  const [thisWeek,setThisWeek]=useState(false); const [expanded,setExpanded]=useState(false);
  const [selectedId,setSelectedId]=useState(null); const [editDraft,setEditDraft]=useState(null);
  const [newTaskName,setNewTaskName]=useState(''); const scrollRef=useRef(null); const dragRef=useRef(null);
  let chartStart=projectStart||today,chartEnd=projectEnd||addDays(today,45);
  tasks.forEach(t=>{if(t.startDate&&t.startDate<chartStart)chartStart=t.startDate;if(t.dueDate&&t.dueDate>chartEnd)chartEnd=t.dueDate;});
  if(thisWeek){const d=new Date(today+'T12:00:00');const mon=new Date(d);mon.setDate(d.getDate()-(d.getDay()===0?6:d.getDay()-1));chartStart=localDateISO(mon);chartEnd=localDateISO(new Date(mon.getTime()+6*86400000));}
  else{chartStart=addDays(chartStart,-5);chartEnd=addDays(chartEnd,12);}
  const totalDays=Math.max(1,daysBetween(chartStart,chartEnd)); const DAY_W=36,ROW_H=38,HEADER_H=44,LEFT_W=200;
  const todayOffset=daysBetween(chartStart,today)*DAY_W; const gridW=Math.max(totalDays*DAY_W,100);
  const months=useMemo(()=>{const m=[];let cur=new Date(chartStart+'T12:00:00');const end=new Date(chartEnd+'T12:00:00');while(cur<=end){const mStart=localDateISO(cur);const label=cur.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.',' ');const next=new Date(cur.getFullYear(),cur.getMonth()+1,1);const mEnd=next>end?chartEnd:localDateISO(next);m.push({label,days:daysBetween(mStart,mEnd)});cur=next;}return m;},[chartStart,chartEnd]);
  const weekMarkers=useMemo(()=>{const w=[];for(let i=0;i<=totalDays;i+=7){const d=addDays(chartStart,i);const dt=new Date(d+'T12:00:00');w.push({offset:i*DAY_W,label:dt.getDate()+'/'+(dt.getMonth()+1)});}return w;},[chartStart,totalDays,DAY_W]);
  const weekendCols=useMemo(()=>{const w=[];for(let i=0;i<=totalDays;i++){const dt=new Date(chartStart+'T12:00:00');dt.setDate(dt.getDate()+i);if(dt.getDay()===0||dt.getDay()===6)w.push(i);}return w;},[chartStart,totalDays]);
  const barGeom=t=>{const s=t.startDate||(projectStart||today),e=t.dueDate||(projectEnd||addDays(today,7));return{left:Math.max(0,daysBetween(chartStart,s))*DAY_W,width:Math.max(DAY_W,(daysBetween(s<chartStart?chartStart:s,e)+1)*DAY_W)};};
  const startDrag=(e,id,type)=>{e.preventDefault();const t=tasks.find(x=>x.id===id);if(!t)return;const oS=t.startDate||(projectStart||today),oE=t.dueDate||(projectEnd||addDays(today,7));dragRef.current={id,type,sX:e.clientX,oS,oE};const onMove=me=>{if(!dragRef.current)return;const dx=me.clientX-dragRef.current.sX,delta=Math.round(dx/DAY_W);let ns,ne;if(type==='move'){ns=addDays(oS,delta);ne=addDays(oE,delta);}else if(type==='left'){ns=addDays(oS,delta);ne=oE;if(ns>=ne)ns=addDays(ne,-1);}else{ns=oS;ne=addDays(oE,delta);if(ne<=ns)ne=addDays(ns,1);}onUpdateTasks(tasks.map(x=>x.id===id?{...x,startDate:ns,dueDate:ne}:x));};const onUp=()=>{dragRef.current=null;window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);};
  const selectTask=t=>{setSelectedId(t.id);setEditDraft({...t,startDate:t.startDate||(projectStart||today),dueDate:t.dueDate||(projectEnd||addDays(today,7)),notes:t.notes||''});};
  const saveEdit=()=>{if(!editDraft)return;onUpdateTasks(tasks.map(t=>t.id===editDraft.id?{...editDraft}:t));setSelectedId(null);setEditDraft(null);};
  const deleteTask=()=>{if(!editDraft)return;onUpdateTasks(tasks.filter(t=>t.id!==editDraft.id));setSelectedId(null);setEditDraft(null);};
  const cycleStatus=id=>{const upd=tasks.map(t=>t.id===id?{...t,status:PTASK_NEXT[t.status]||'Pendente'}:t);onUpdateTasks(upd);if(editDraft&&editDraft.id===id)setEditDraft(d=>({...d,status:PTASK_NEXT[d.status]||'Pendente'}));};
  const addTask=()=>{if(!newTaskName.trim())return;const id=Date.now();onUpdateTasks([...tasks,{id,text:newTaskName.trim(),status:'Pendente',startDate:thisWeek?today:(projectStart||today),dueDate:thisWeek?addDays(today,7):(projectEnd||addDays(today,7)),notes:''}]);setNewTaskName('');};
  return <div className="card" style={{padding:0,overflow:'hidden',marginBottom:12}}>
    <div style={{display:'flex',justifyContent:'space-between',padding:'10px 16px',borderBottom:'1px solid var(--glass-border)',background:'var(--surface)'}}><div style={{display:'flex',alignItems:'center',gap:10}}><span className="label">Timeline</span><button onClick={()=>setThisWeek(w=>!w)} className="btn btn-outline" style={{padding:'3px 8px',fontSize:'.7rem',background:thisWeek?'var(--accent)':'transparent',color:thisWeek?'white':'var(--text-secondary)'}}>Esta semana</button></div><div style={{display:'flex',gap:8}}><input value={newTaskName} onChange={e=>setNewTaskName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()} placeholder="Nova tarefa..." className="input-box" style={{width:160}}/><button className="btn btn-dark" onClick={addTask} style={{padding:'5px 12px'}}>+</button></div></div>
    <div style={{display:'flex',maxHeight:expanded?2000:180,overflow:'hidden'}}>
      <div style={{width:LEFT_W,flexShrink:0,borderRight:'1px solid var(--glass-border)',background:'var(--surface)'}}><div style={{height:HEADER_H,background:'var(--bg)',display:'flex',alignItems:'flex-end',padding:'0 14px 8px'}}><span className="label">Tarefa</span></div>{tasks.map(t=>{const col=GANTT_COLORS[t.status]||GANTT_COLORS['Pendente'];const sel=selectedId===t.id;return <div key={t.id} onClick={()=>selectTask(t)} style={{height:ROW_H,display:'flex',alignItems:'center',gap:6,padding:'0 8px',borderBottom:'1px solid var(--glass-border)',cursor:'pointer',background:sel?'rgba(28,25,23,.05)':'transparent'}}><button onClick={e=>{e.stopPropagation();cycleStatus(t.id);}} style={{width:12,height:12,borderRadius:'50%',background:col.dot,border:'none',cursor:'pointer'}}/><span style={{fontSize:'.83rem',textDecoration:t.status==='Concluído'?'line-through':'none',color:t.status==='Concluído'?'var(--text-secondary)':'var(--text)'}}>{t.text}</span></div>;})}</div>
      <div ref={scrollRef} style={{flex:1,overflowX:'auto',position:'relative'}}>
        <div style={{width:gridW,position:'relative',minWidth:'100%'}}>
          <div style={{height:HEADER_H/2,display:'flex',borderBottom:'1px solid var(--glass-border)',background:'var(--bg)'}}>{months.map((m,i)=><div key={i} style={{width:m.days*DAY_W,flexShrink:0,borderRight:'1px solid var(--glass-border)',display:'flex',alignItems:'center',padding:'0 10px',fontSize:'.68rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--text-secondary)'}}>{m.label}</div>)}</div>
          <div style={{height:HEADER_H/2,background:'var(--bg)',borderBottom:'2px solid var(--glass-border)',position:'relative'}}>{weekMarkers.map((mk,i)=><div key={i} style={{position:'absolute',left:mk.offset,height:'100%',display:'flex',alignItems:'center',paddingLeft:5,fontSize:'.62rem',color:'var(--text-secondary)',borderLeft:'1px solid var(--glass-border)'}}>{mk.label}</div>)}</div>
          {todayOffset>=0&&<div style={{position:'absolute',left:todayOffset,top:0,bottom:0,width:2,background:'#EF4444',pointerEvents:'none',zIndex:10}}><div style={{position:'absolute',top:HEADER_H-18,left:'50%',transform:'translateX(-50%)',background:'#EF4444',color:'white',fontSize:'.52rem',fontWeight:800,padding:'2px 5px',borderRadius:3}}>HOJE</div></div>}
          {tasks.map(t=>{const{left,width}=barGeom(t);const col=GANTT_COLORS[t.status]||GANTT_COLORS['Pendente'];const sel=selectedId===t.id;return <div key={t.id} style={{height:ROW_H,position:'relative',borderBottom:'1px solid var(--glass-border)'}}><div onMouseDown={e=>startDrag(e,t.id,'move')} className="gantt-bar" style={{position:'absolute',left,width,height:28,top:(ROW_H-28)/2,background:col.bar,border:`1.5px solid ${sel?'var(--text)':col.border}`,borderRadius:7,cursor:'grab',display:'flex',alignItems:'center',boxShadow:sel?'0 0 0 2px var(--text)':'0 1px 4px rgba(0,0,0,.1)'}}><div onMouseDown={e=>startDrag(e,t.id,'left')} style={{width:8,height:'100%',cursor:'ew-resize',flexShrink:0}}/><div style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:'.68rem',fontWeight:600,color:col.text}}>{width>60?t.text:''}</div><div onMouseDown={e=>startDrag(e,t.id,'right')} style={{width:8,height:'100%',cursor:'ew-resize',flexShrink:0}}/></div></div>;})}
        </div>
      </div>
    </div>
    {tasks.length>0&&<div onClick={()=>setExpanded(x=>!x)} style={{display:'flex',justifyContent:'center',padding:'4px 0',cursor:'pointer',borderTop:'1px solid var(--glass-border)',background:'var(--surface)'}}><span style={{transform:expanded?'rotate(180deg)':'',transition:'transform .2s'}}>▼</span></div>}
    {editDraft&&<div style={{borderTop:'2px solid var(--text)',padding:'14px 18px',background:'var(--surface)',display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}><div style={{flex:2,minWidth:160}}><label className="label">Tarefa</label><input value={editDraft.text} onChange={e=>setEditDraft({...editDraft,text:e.target.value})} className="input-box" autoFocus onKeyDown={e=>e.key==='Enter'&&saveEdit()}/></div><div style={{minWidth:130}}><label className="label">Início</label><input type="date" value={editDraft.startDate||''} onChange={e=>setEditDraft({...editDraft,startDate:e.target.value})} className="input-box"/></div><div style={{minWidth:130}}><label className="label">Prazo</label><input type="date" value={editDraft.dueDate||''} onChange={e=>setEditDraft({...editDraft,dueDate:e.target.value})} className="input-box"/></div><div style={{minWidth:130}}><label className="label">Status</label><select value={editDraft.status} onChange={e=>setEditDraft({...editDraft,status:e.target.value})} className="input-box">{PTASK_STATUSES.map(s=><option key={s}>{s}</option>)}</select></div><div style={{display:'flex',gap:8}}><button onClick={deleteTask} className="btn btn-danger">🗑️</button><button onClick={()=>{setSelectedId(null);setEditDraft(null);}} className="btn btn-outline">Cancelar</button><button onClick={saveEdit} className="btn btn-dark">Salvar</button></div></div>}
  </div>;
};

      <div style={{flex:1}}>
        {isMobile ? <div className="card" style={{overflow:'hidden',borderRadius:12}}>{visible.map(p=><div key={p.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',borderBottom:'1px solid var(--glass-border)',cursor:'pointer'}} onClick={()=>{if(!trash){setSelectedProject(p);setView('project-detail');}}}><BgImg src={p.cover} style={{width:44,height:44,borderRadius:8}}/><div style={{flex:1}}><div style={{fontWeight:600}}>{p.title}</div><div style={{fontSize:'.72rem',color:'var(--text-secondary)'}}>{p.client} · <span className={`tag ${statusTag(p.status)}`}>{p.status}</span></div></div></div>)}</div>
        : <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:16}}>{visible.map((p,idx)=> <div key={p.id} className="card" draggable={!trash} style={{overflow:'hidden',cursor:trash?'default':'pointer',opacity:trash?.85:1}} onClick={()=>{if(!trash){setSelectedProject(p);setView('project-detail');}}} onDragStart={e=>{if(trash)return;projDragRef.current=idx;e.dataTransfer.effectAllowed='move';}} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();reorder(projDragRef.current,idx);}}><div style={{height:140,position:'relative',backgroundColor:'#E8E3DC'}}><BgImg src={p.cover} style={{position:'absolute',inset:0}}/><div style={{position:'absolute',top:10,right:10,background:'rgba(252,251,249,.92)',borderRadius:5,padding:'3px 8px'}}><span style={{fontSize:'.65rem',fontWeight:600}}>{p.type==='work'?'Trabalho':'Pessoal'}</span></div></div><div style={{padding:'16px 18px'}}><div style={{fontWeight:600,fontSize:'.92rem',marginBottom:3}}>{p.title}</div><div style={{fontSize:'.75rem',color:'var(--text-secondary)'}}>{p.client}{fmtBRL(p.budget)&&<span> · {fmtBRL(p.budget)}</span>}</div>{!trash?<div style={{display:'flex',justifyContent:'space-between',marginTop:14,paddingTop:12,borderTop:'1px solid var(--glass-border)'}}><span className={`tag ${statusTag(p.status)}`}>{p.status}</span>{deadlineInfo(p.deadline)&&<span style={{fontSize:'.7rem',color:deadlineInfo(p.deadline).color}}>📅 {deadlineInfo(p.deadline).date}</span>}</div>:<div style={{display:'flex',gap:6,marginTop:14}}><button className="btn btn-outline" onClick={e=>{e.stopPropagation();restore(p.id);}}>Restaurar</button><button className="btn btn-danger" onClick={e=>{e.stopPropagation();hardDelete(p.id);}}>Excluir</button></div>}</div></div>)}</div>}
        {visible.length===0&&<div style={{textAlign:'center',padding:40,color:'var(--text-secondary)'}}>Nenhum projeto.</div>}
      </div>
      {!trash && !isMobile && (
        <div style={{width:280,flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}><span className="label">Tarefas Pendentes</span><span style={{fontSize:'.7rem',color:'var(--text-secondary)',background:'var(--bg)',border:'1px solid var(--glass-border)',borderRadius:20,padding:'1px 8px'}}>{activeProjsWithTasks.reduce((s,p)=>s+(p.projectTasks||[]).filter(t=>t.status!=='Concluído').length,0)}</span></div>
          {activeProjsWithTasks.length===0?<div className="card" style={{padding:24,textAlign:'center'}}>Nenhuma tarefa pendente.</div>
          :<div style={{display:'flex',flexDirection:'column',gap:10}}>{activeProjsWithTasks.map(p=>{const pending=(p.projectTasks||[]).filter(t=>t.status!=='Concluído').sort((a,b)=>PTASK_STATUS_ORDER.indexOf(a.status)-PTASK_STATUS_ORDER.indexOf(b.status));return <div key={p.id} className="card" style={{padding:'14px 16px'}}><div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,paddingBottom:10,borderBottom:'1px solid var(--glass-border)'}}><BgImg src={p.cover} style={{width:20,height:20,borderRadius:5}}/><span style={{fontWeight:600,fontSize:'.78rem',flex:1}}>{p.title}</span></div>{pending.map(t=><div key={t.id} style={{display:'flex',alignItems:'center',gap:7,padding:'3px 0'}}><span style={{display:'inline-block',fontSize:'.58rem',fontWeight:700,textTransform:'uppercase',padding:'2px 6px',borderRadius:3,background:statusBg[t.status]||'#F0EDE9',color:statusColor[t.status]||'var(--text-secondary)'}}>{t.status}</span><span style={{fontSize:'.78rem'}}>{t.text}</span></div>)}</div>;})}</div>}
        </div>
      )}
    </div>
  </div>;
};

// ══════════════════════════════════════════════════════════════
// PROJECT DETAIL (Full, with drag-reorder in Tasks tab)
// ══════════════════════════════════════════════════════════════
const ProjectDetail = () => {
  const { selectedProject, setView, projects, setProjects, mentors, setMentors, galleryPosts, galleryFolders } = useContext(AppContext);
  const [local, setLocal] = useState(()=>({...selectedProject,projectTasks:applyAutoLate(selectedProject.projectTasks||[])}));
  const [tab, setTab] = useState('Visão Geral'); const [galleryPopup, setGalleryPopup] = useState(null);
  const [showResearchId, setShowResearchId] = useState(()=>(selectedProject.researchNotes||[])[0]?.id||null);
  const [activeMiniId, setActiveMiniId] = useState(()=>(selectedProject.miniProjects||[])[0]?.id||null);
  const [activeInnerNoteId, setActiveInnerNoteId] = useState(null);
  const coverRef = useRef(null); const researchImgRef = useRef(null); const miniImgRef = useRef(null);
  const dragMiniRef = useRef(null); const dragOverMiniRef = useRef(null);
  const dragNoteRef = useRef(null); const dragOverNoteRef = useRef(null);
  const isMobile = window.innerWidth<768;
  useEffect(()=>{setLocal({...selectedProject,projectTasks:applyAutoLate(selectedProject.projectTasks||[])});},[selectedProject]);
  const upd = (f,v) => { const n={...local,[f]:v}; setLocal(n); setProjects(prev=>prev.map(p=>p.id===n.id?n:p)); };
  const handleCover = async e => { const f=e.target.files[0]; if(!f)return; upd('cover',await uploadImage(f)); };
  const onBack = () => setView('projects');
  const softDel = () => { setProjects(p=>p.map(x=>x.id===selectedProject.id?{...x,deleted:true,deletedAt:new Date().toISOString()}:x)); setView('projects'); };
  const autoLate = useMemo(()=>applyAutoLate(local.projectTasks||[]),[local.projectTasks]);
  const folders = (galleryFolders||[]).filter(f=>!f.deleted);
  const folderPosts = local.galleryFolder ? (galleryPosts||[]).filter(p=>!p.deleted&&p.folder===local.galleryFolder).sort((a,b)=>((b.date||'').slice(0,10)).localeCompare((a.date||'').slice(0,10))) : [];
  const toggleMentor = id => { const m=local.mentors||[]; upd('mentors',m.includes(id)?m.filter(x=>x!==id):[...m,id]); };
  const addGlobalMentor = mentor => { setMentors(prev=>[...prev,mentor]); toggleMentor(mentor.id); };
  const linked = mentors.filter(m=>!m.deleted&&(local.mentors||[]).includes(m.id));

  // Research
  const researchNotes = local.researchNotes || [];
  const activeResearch = researchNotes.find(n=>n.id===showResearchId)||null;
  const addResearchNote = () => { const n={id:Date.now(),title:'Nova Pesquisa',content:'',url:'',images:[],date:new Date().toLocaleDateString('pt-BR')}; upd('researchNotes',[...researchNotes,n]); setShowResearchId(n.id); };
  const updateResearch = (field,val) => { upd('researchNotes', researchNotes.map(n=>n.id===showResearchId?{...n,[field]:val}:n)); };
  const deleteResearch = id => { upd('researchNotes', researchNotes.filter(n=>n.id!==id)); setShowResearchId(researchNotes.find(n=>n.id!==id)?.id||null); };
  const handleResearchImgUpload = async (noteId, e) => { const files=Array.from(e.target.files); const urls=await uploadImages(files); upd('researchNotes', researchNotes.map(n=>n.id===noteId?{...n,images:[...(n.images||[]),...urls]}:n)); e.target.value=''; };
  const removeResearchImg = (noteId, idx) => { upd('researchNotes', researchNotes.map(n=>n.id===noteId?{...n,images:(n.images||[]).filter((_,i)=>i!==idx)}:n)); };

  // Mini-projects (tasks) with drag-reorder
  const miniProjects = local.miniProjects || [];
  const activeMini = miniProjects.find(m=>m.id===activeMiniId)||null;
  const miniStatusToPTask = s=>({'Em Andamento':'Fazendo','Concluído':'Concluído','Atrasado':'Atrasado'}[s]||'Pendente');
  const ptaskStatusToMini = s=>({'Fazendo':'Em Andamento','Concluído':'Concluído','Atrasado':'Atrasado'}[s]||'Pendente');
  const addMini = () => { const id=Date.now(); const n={id,title:'Nova Tarefa',status:'Pendente',notes:'',frames:[],innerNotes:[],createdAt:new Date().toLocaleDateString('pt-BR')}; const pt={id,text:'Nova Tarefa',status:'Pendente',startDate:local.startDate||todayISO(),dueDate:local.deadline||addDays(todayISO(),7),notes:''}; setLocal(prev=>{const u={...prev,miniProjects:[...(prev.miniProjects||[]),n],projectTasks:[...(prev.projectTasks||[]),pt]};return u;}); setActiveMiniId(id); };
  const updateMini = (field,val) => {
    const newMinis = miniProjects.map(m=>m.id===activeMiniId?{...m,[field]:val}:m);
    const newPTasks = autoLate.map(t=>{ if(t.id!==activeMiniId)return t; if(field==='title')return{...t,text:val}; if(field==='status')return{...t,status:miniStatusToPTask(val)}; return t; });
    setLocal(prev=>({...prev,miniProjects:newMinis,projectTasks:newPTasks}));
  };
  const deleteMini = id => { const newMinis = miniProjects.filter(m=>m.id!==id); const newPTasks = autoLate.filter(t=>t.id!==id); upd('miniProjects',newMinis); upd('projectTasks',newPTasks); setActiveMiniId(miniProjects.find(m=>m.id!==id)?.id||null); };
  const reorderMinis = (from,to) => { if(from===to)return; const m=[...miniProjects];const[mv]=m.splice(from,1);m.splice(to,0,mv);upd('miniProjects',m); };
  const addInnerNote = () => { const n={id:Date.now(),title:'Nova nota',content:'',createdAt:new Date().toLocaleDateString('pt-BR')}; updateMini('innerNotes',[...(activeMini?.innerNotes||[]),n]); setActiveInnerNoteId(n.id); };
  const updateInnerNote = (field,val) => { const notes = (activeMini?.innerNotes||[]).map(n=>n.id===activeInnerNoteId?{...n,[field]:val}:n); updateMini('innerNotes',notes); };
  const deleteInnerNote = id => { const notes = (activeMini?.innerNotes||[]).filter(n=>n.id!==id); updateMini('innerNotes',notes); if(activeInnerNoteId===id)setActiveInnerNoteId(null); };
  const reorderInnerNotes = (from,to) => { if(from===to)return; const notes=[...(activeMini?.innerNotes||[])];const[n]=notes.splice(from,1);notes.splice(to,0,n);updateMini('innerNotes',notes); };
  const handleMiniImgs = async e => { const files=Array.from(e.target.files); const urls=await uploadImages(files); updateMini('frames',[...(activeMini?.frames||[]),...urls]); e.target.value=''; };

  return <div className="fade-up" style={{height:'calc(100vh - 80px)',overflowY:'auto'}}>
    <input ref={coverRef} type="file" accept="image/*" hidden onChange={handleCover}/>
    <input ref={researchImgRef} type="file" accept="image/*" multiple hidden onChange={e=>handleResearchImgUpload(showResearchId,e)}/>
    <input ref={miniImgRef} type="file" accept="image/*" multiple hidden onChange={handleMiniImgs}/>
    <div className="cover-wrap" style={{height:220,borderRadius:16,overflow:'hidden',marginBottom:24,position:'relative'}}><BgImg src={local.cover} full style={{position:'absolute',inset:0}}/><div style={{position:'absolute',inset:0,background:'linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.2) 60%, transparent 100%)'}}/><div className="cover-edit-overlay" onClick={()=>coverRef.current.click()}><span style={{color:'white'}}>📷 Trocar capa</span></div><div style={{position:'absolute',inset:0,padding:24,display:'flex',flexDirection:'column',justifyContent:'space-between',pointerEvents:'none'}}><div style={{display:'flex',justifyContent:'space-between'}}><button onClick={e=>{e.stopPropagation();onBack();}} style={{background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.2)',color:'white',borderRadius:20,padding:'8px 16px',cursor:'pointer',pointerEvents:'all'}}>← Voltar</button><button onClick={e=>{e.stopPropagation();softDel();}} style={{background:'rgba(180,30,30,.3)',border:'1px solid rgba(255,100,100,.3)',color:'white',borderRadius:20,padding:'8px 16px',cursor:'pointer',pointerEvents:'all'}}>🗑️ Excluir</button></div><div><h1 style={{fontFamily:'var(--font-heading)',fontSize:'2.4rem',fontWeight:400,color:'white'}}>{local.title}</h1><p style={{color:'rgba(255,255,255,.7)'}}>{local.client}</p></div></div></div>
    <GanttTimeline tasks={autoLate} onUpdateTasks={tasks=>upd('projectTasks',tasks)} projectStart={local.startDate} projectEnd={local.deadline}/>
    <div style={{display:'flex',borderBottom:'1px solid var(--glass-border)',marginBottom:20}}>{['Visão Geral','Tarefas','Pesquisa','Mentores'].map(t=><button key={t} onClick={()=>setTab(t)} className="tab-btn" style={{color:tab===t?'var(--accent)':'var(--text-secondary)',borderBottom:tab===t?'2px solid var(--accent)':'2px solid transparent'}}>{t}</button>)}</div>
    {tab==='Visão Geral'&&<div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 220px',gap:20}}><div style={{display:'flex',flexDirection:'column',gap:16}}><div className="card" style={{padding:24}}><span className="label">Notas</span><textarea value={local.notes} onChange={e=>upd('notes',e.target.value)} style={{width:'100%',minHeight:120,background:'transparent',border:'none',fontSize:'.9rem',lineHeight:1.8,color:'var(--text)',resize:'vertical',marginTop:8}}/></div><div className="card" style={{padding:24}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:14}}><span className="label">Galeria</span><select value={local.galleryFolder||''} onChange={e=>upd('galleryFolder',e.target.value)} className="input-box" style={{width:'auto'}}><option value="">Nenhuma</option>{folders.map(f=><option key={f.id} value={f.id}>{f.label}</option>)}</select></div>{local.galleryFolder&&(folderPosts.length===0?<div style={{textAlign:'center',padding:16,color:'var(--text-secondary)'}}>Nenhum post nesta pasta.</div>:<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>{folderPosts.map(post=>{const src=post.bannerImage||post.images?.[0];return <div key={post.id} className="card" style={{overflow:'hidden',cursor:'pointer'}} onClick={()=>setGalleryPopup(post)}><div style={{aspectRatio:'16/9',background:'var(--bg)'}}>{src?<Img src={src} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<span>🖼️</span>}</div><div style={{padding:'7px 9px'}}>{post.title}</div></div>;})}</div>)}</div></div><div style={{display:'flex',flexDirection:'column',gap:12}}><div className="card" style={{padding:24}}><span className="label">Datas</span><div style={{marginTop:12}}><div className="label">Início</div><input type="date" value={local.startDate||''} onChange={e=>upd('startDate',e.target.value)} className="input-box"/></div><div style={{marginTop:12}}><div className="label">Deadline</div><input type="date" value={local.deadline||''} onChange={e=>upd('deadline',e.target.value)} className="input-box"/></div>{deadlineInfo(local.deadline)&&local.status==='Em Andamento'&&<div style={{marginTop:8,fontSize:'.75rem',fontWeight:700,padding:'5px 8px',borderRadius:8,background:deadlineInfo(local.deadline).bg,color:deadlineInfo(local.deadline).color}}>Entrega {deadlineInfo(local.deadline).label}</div>}</div><div className="card" style={{padding:24}}><span className="label">Financeiro</span><input type="number" min="0" value={local.budget||''} onChange={e=>upd('budget',e.target.value)} className="input-box" style={{marginTop:12}}/>{Number(local.budget)>0&&<label style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:8,cursor:'pointer',fontSize:'.85rem'}}>{local.paid?'✓ Recebido':'A receber'}<input type="checkbox" checked={local.paid} onChange={e=>upd('paid',e.target.checked)}/></label>}</div><div className="card" style={{padding:24}}><span className="label">Shots</span><div style={{display:'flex',alignItems:'center',gap:8,marginTop:12}}><button className="btn btn-outline" onClick={()=>upd('shotsDone',Math.max(0,(local.shotsDone||0)-1))}>−</button><span>{local.shotsDone||0} / {local.shotsTotal||0}</span><button className="btn btn-dark" onClick={()=>upd('shotsDone',Math.min(local.shotsTotal||0,(local.shotsDone||0)+1))}>+</button></div><input type="number" min="0" value={local.shotsTotal||''} onChange={e=>upd('shotsTotal',Number(e.target.value))} className="input-box" style={{marginTop:8}}/></div></div></div>}
    {tab==='Tarefas'&&<div style={{display:'flex',gap:16}}>
      <div style={{width:200,flexShrink:0,display:'flex',flexDirection:'column',gap:4}}>
        <button className="btn btn-dark" style={{marginBottom:8}} onClick={addMini}>+ Nova Tarefa</button>
        {miniProjects.map((m,mIdx)=><div key={m.id} draggable onDragStart={e=>{dragMiniRef.current=mIdx;e.dataTransfer.effectAllowed='move';}} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();reorderMinis(dragMiniRef.current,dragOverMiniRef.current);}} onDragEnter={()=>{dragOverMiniRef.current=mIdx;}} onClick={()=>{setActiveMiniId(m.id);setActiveInnerNoteId(null);}} style={{padding:'8px 12px',borderRadius:8,cursor:'pointer',border:activeMiniId===m.id?'1px solid var(--accent)':'1px solid transparent',background:activeMiniId===m.id?'var(--accent-glow)':'transparent',display:'flex',alignItems:'center',gap:6}}><span style={{cursor:'grab',color:'var(--text-secondary)'}}>⠿</span>{m.title}</div>)}
      </div>
      <div className="card" style={{flex:1,padding:28,display:'flex',flexDirection:'column',minHeight:320}}>
        {activeMini?<>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:14}}>
            <input value={activeMini.title} onChange={e=>updateMini('title',e.target.value)} style={{fontFamily:'var(--font-heading)',fontSize:'1.5rem',background:'transparent',border:'none',borderBottom:'1px solid var(--glass-border)',flex:1}}/>
            <select value={activeMini.status} onChange={e=>updateMini('status',e.target.value)} className="input-box" style={{width:'auto'}}>{['Pendente','Em Andamento','Concluído','Atrasado'].map(s=><option key={s}>{s}</option>)}</select>
            <button className="btn btn-ghost" onClick={()=>deleteMini(activeMini.id)}>🗑️</button>
          </div>
          <textarea value={activeMini.notes} onChange={e=>updateMini('notes',e.target.value)} placeholder="Notas..." style={{resize:'vertical',minHeight:80,marginBottom:16,background:'transparent',border:'1px solid var(--glass-border)',borderRadius:8,padding:12}}/>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:8,marginBottom:14}}>{(activeMini.frames||[]).map((img,i,list)=><div key={imgKey(img,i,list)} style={{position:'relative',borderRadius:8,overflow:'hidden',aspectRatio:'16/9',background:'var(--bg)'}}><Img src={img} style={{width:'100%',height:'100%',objectFit:'cover'}}/><button onClick={()=>{const f=[...(activeMini.frames||[])];f.splice(i,1);updateMini('frames',f);}} style={{position:'absolute',top:4,right:4,background:'rgba(0,0,0,.6)',border:'none',borderRadius:'50%',width:20,height:20,color:'white'}}>✕</button></div>)}</div>
          <button className="btn btn-outline" onClick={()=>miniImgRef.current.click()}>+ Adicionar frames</button>
          <div style={{marginTop:20}}>
            <span className="label">Notas Internas</span>
            <div style={{display:'flex',flexDirection:'column',gap:4,marginTop:8}}>{(activeMini.innerNotes||[]).map((n,nIdx)=><div key={n.id} draggable onDragStart={e=>{dragNoteRef.current=nIdx;e.dataTransfer.effectAllowed='move';}} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();reorderInnerNotes(dragNoteRef.current,dragOverNoteRef.current);}} onDragEnter={()=>{dragOverNoteRef.current=nIdx;}} onClick={()=>setActiveInnerNoteId(n.id)} style={{padding:'8px 12px',borderRadius:6,cursor:'pointer',border:activeInnerNoteId===n.id?'1px solid var(--accent)':'1px solid var(--glass-border)',background:activeInnerNoteId===n.id?'var(--accent-glow)':'transparent',display:'flex',alignItems:'center',gap:6}}><span style={{cursor:'grab',color:'var(--text-secondary)'}}>⠿</span>{n.title}</div>)}<button className="btn btn-ghost" onClick={addInnerNote}>+ Nova nota</button></div>
          </div>
          {activeInnerNoteId&&(()=>{const note=(activeMini.innerNotes||[]).find(n=>n.id===activeInnerNoteId);if(!note)return null;return <div className="card" style={{padding:16,marginTop:16}}><input value={note.title} onChange={e=>updateInnerNote('title',e.target.value)} style={{fontWeight:600,background:'transparent',border:'none',borderBottom:'1px solid var(--glass-border)',width:'100%',marginBottom:8}}/><textarea value={note.content||''} onChange={e=>updateInnerNote('content',e.target.value)} placeholder="Conteúdo..." style={{resize:'vertical',minHeight:80,width:'100%',background:'transparent',border:'1px solid var(--glass-border)',borderRadius:8,padding:12}}/><button className="btn btn-ghost text-link-danger" onClick={()=>deleteInnerNote(note.id)}>Excluir nota</button></div>;})()}
        </>:<div style={{margin:'auto',textAlign:'center',color:'var(--text-secondary)'}}>Selecione ou crie uma tarefa</div>}
      </div>
    </div>}
    {tab==='Pesquisa'&&<div style={{display:'flex',gap:16}}><div style={{width:200,flexShrink:0,display:'flex',flexDirection:'column',gap:4}}><button className="btn btn-dark" style={{marginBottom:8}} onClick={addResearchNote}>+ Nova Pesquisa</button>{researchNotes.map(n=><div key={n.id} onClick={()=>setShowResearchId(n.id)} style={{padding:'8px 12px',borderRadius:8,cursor:'pointer',border:showResearchId===n.id?'1px solid var(--accent)':'1px solid transparent',background:showResearchId===n.id?'var(--accent-glow)':'transparent'}}>{n.title||'Sem título'}</div>)}</div><div className="card" style={{flex:1,padding:24}}>{activeResearch?<><div style={{display:'flex',justifyContent:'space-between',marginBottom:14}}><input value={activeResearch.title} onChange={e=>updateResearch('title',e.target.value)} style={{fontFamily:'var(--font-heading)',fontSize:'1.5rem',background:'transparent',border:'none',borderBottom:'1px solid var(--glass-border)',flex:1}}/><button className="btn btn-ghost" onClick={()=>deleteResearch(activeResearch.id)}>🗑️</button></div><div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}><span>🔗</span><input className="input-box" value={activeResearch.url||''} onChange={e=>updateResearch('url',e.target.value)} placeholder="Link"/></div><textarea className="input-box" rows={6} value={activeResearch.content||''} onChange={e=>updateResearch('content',e.target.value)} placeholder="Notas..." style={{resize:'vertical',marginBottom:16}}/><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:14}}>{(activeResearch.images||[]).map((img,i,list)=><div key={imgKey(img,i,list)} style={{position:'relative',borderRadius:8,overflow:'hidden',aspectRatio:'16/9',background:'var(--bg)'}}><Img src={img} style={{width:'100%',height:'100%',objectFit:'cover'}}/><button onClick={()=>removeResearchImg(activeResearch.id,i)} style={{position:'absolute',top:4,right:4,background:'rgba(0,0,0,.6)',border:'none',borderRadius:'50%',width:20,height:20,color:'white'}}>✕</button></div>)}</div><button className="btn btn-outline" onClick={()=>researchImgRef.current.click()}>+ Adicionar imagens</button></>:<div style={{textAlign:'center',color:'var(--text-secondary)',marginTop:'30%'}}>Selecione ou crie uma pesquisa</div>}</div></div>}
    {tab==='Mentores'&&<div><div className="card" style={{padding:24,marginBottom:16}}><span className="label">Vincular Mentores</span><div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:12}}>{mentors.filter(m=>!m.deleted).map(m=>{const on=(local.mentors||[]).includes(m.id);return <button key={m.id} onClick={()=>toggleMentor(m.id)} style={{padding:'6px 12px',borderRadius:20,border:`1.5px solid ${on?'var(--accent)':'var(--glass-border)'}`,background:on?'var(--accent)':'transparent',color:on?'white':'var(--text-secondary)',cursor:'pointer'}}>{m.name} {on?'✓':''}</button>;})}<button onClick={()=>addGlobalMentor({id:Date.now(),name:'Novo Mentor',area:'',medium:'',notes:'',links:'',active:true,main:false,photo:'',photos:[null,null,null,null],deleted:false})} className="btn btn-ghost">+ Adicionar</button></div></div>{linked.map(m=><div key={m.id} className="card" style={{padding:16,display:'flex',gap:14,marginBottom:8}}><div style={{width:40,height:40,borderRadius:'50%',background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-heading)',fontSize:'1.2rem'}}>{m.name.charAt(0)}</div><div><div style={{fontWeight:600}}>{m.name}</div><div style={{fontSize:'.8rem',color:'var(--text-secondary)'}}>{m.area}{m.medium?' — '+m.medium:''}</div></div></div>)}</div>}
