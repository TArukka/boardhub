  ══ P0-2 — SECURITY RULES (CHECK IN THE CONSOLE) ════════════════════════════
  DEFAULT_FB_CFG is hardcoded right below. That is normal in Firebase web and the
  apiKey is not a secret — it identifies the project, it authorizes nothing. What
  effectively protects the data are the SECURITY RULES, which do not live in this
  file and cannot be audited from the code. If they are in test mode
  ("allow read, write: if true"), anyone with the apiKey — which is right here —
  reads and writes EVERYTHING.
  These are the rules that match exactly what the app uses today:
    Firestore : users/{uid}/boardhub/{state|notes|gallery}   (3 documents)
    Storage   : users/{uid}/images/{key}
    Auth      : Google (signInWithPopup) — there is no anonymous login
  ── Firestore Rules ────────────────────────────────────────────────────────
    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {
        match /users/{userId}/boardhub/{docId} {
          allow read, write: if request.auth != null
                             && request.auth.uid == userId;
        }
      }
    }
  Anything that does not match a match block is denied by default — there is no
  need (and no point) in adding a "match /{document=**} { allow read,write: if false; }":
  Firestore grants access if ANY rule allows it, so a deny-all at the end does not
  revoke the allow above. It is harmless, it just protects nothing.
  If you want to tighten it further, you can pin the three documents:
          && docId in ['state','notes','gallery']
  — bearing in mind that this breaks the day a fourth document is created (backlog
  item P2-3 suggested exactly that for pomoData).
  ── Storage Rules ──────────────────────────────────────────────────────────
    rules_version = '2';
    service firebase.storage {
      match /b/{bucket}/o {
        match /users/{userId}/images/{imageId} {
          allow read, write: if request.auth != null
                             && request.auth.uid == userId;
        }
      }
    }
  Optional hardening on write, so that a stolen session does not turn into free
  file hosting (check the limits against what you actually upload before
  applying):
          && request.resource.size < 25 * 1024 * 1024
          && request.resource.contentType.matches('image/.*|video/.*')
  ── How to check ───────────────────────────────────────────────────────────
  1. console.firebase.google.com → the project → Firestore Database → Rules tab.
  2. Repeat under Storage → Rules tab.
  3. If "if true" or a test-mode expiry date shows up, replace it with the block
     above and Publish.
  4. The Rules Playground (same screen) tests before publishing: simulate a read
     of users/OTHER_UID/boardhub/state authenticated as yourself — it has to be
     DENIED.
  ═══════════════════════════════════════════════════════════════════════════

  BoardHub v23.28 — the pendulum always swings; ♪ becomes sound (aug/2026)
  Three things the owner asked for on 2026-08-03, after seeing a still metronome
  in his own screenshot.
  1. THE PENDULUM IS NO LONGER OPTIONAL. It was gated behind the ♪ toggle AND a
     focus session; it now swings whenever the clock is ticking, breaks
     included — the clock is still running, and the beat still comes from the
     day's tempo. `pendulumOn = isActive`.
  2. ♪ NOW GATES THE SESSION SOUNDS (start / pause / work_end / break_end)
     instead of the pendulum. That is what the glyph looked like it did all
     along, which is the discoverability bug recorded in APROVACOES.md §6: the
     note was left over from the audible click removed in v23.11, so the button
     advertised noise while doing something purely visual, and never got
     pressed.
  • DEFAULT ON, and this is the part that mattered. The old key defaulted to
    OFF, because off is right for "swing the pendulum". Reusing that default for
    sound would have SILENCED a pomodoro that has chimed since v23.8 — a
    regression disguised as a feature, met mid-session with no clue why. So the
    sound preference gets its OWN key (boardhub_pomo_sound, default '1') and the
    button reads as mute, not unmute. A test pins the default.
  • THE GUARD IS THE FIRST STATEMENT of playPomoSound, not four checks at the
    four call sites — four places to forget, and two of them are inside an
    interval callback where component state goes stale. That is also why the
    flag lives at module scope rather than in React state.
  • `metronomeOn` was renamed `soundOn`: after the change the old name described
    the opposite of what it does. METRO_LS and its load/save pair are deleted as
    dead code; the stale key is LEFT on disk, because a storage migration to
    tidy ~20 bytes of preference is more risk than the tidiness is worth.
  3. THE TYPE FLOOR RAISED to .62rem. The owner said the type could be "a little
     more readable". The bottom tier was a scatter of .52/.55/.56/.58/.6rem —
     8.3px to 9.6px at a 16px root — under a typeface with a smaller x-height
     than the one it replaced. 24 declarations, five sizes collapsed into one.
     A test guards the FLOOR rather than the sizes: above it is a design choice,
     below it is the problem returning one declaration at a time, which is how
     it reached five sizes in the first place.
  A DELIBERATE NON-SWAP: the prepared fallback for cramped text was Source Sans
  3, and I did not use it. Two reasons. The owner had just approved the current
  typeface in the same breath, so replacing it would have contradicted him; and
  `Source Sans 3` cannot go in unquoted — `3` is not a valid CSS identifier —
  which is the exact class of bug that produced a white screen in v23.18. The
  readability complaint was about SIZE, and size is what changed.
  TWO TESTS WERE UPDATED, NOT SILENCED. The v23.11 guards pinned "pendulum is
  opt-in and starts off" and "pendulumOn requires metronomeOn && focus". Both
  now describe behaviour the owner asked to change, so both were rewritten to
  pin the NEW invariant — the swing must still track the running clock, or a
  stopped timer would show a moving metronome. The CSS comment arguing that
  prefers-reduced-motion must stay out "because it is opt-in" was rewritten too:
  that reason retired, and the suppression stays out on a new one — the swing is
  now the only moving sign that a session is running.
  112 tests, 112 green (was 109).
  HONEST COST: I cannot see any of this. The swing, the new type floor and the
  chimes are all unverified by eye or ear here — the browser pane will not
  composite, so there is no screenshot, and nothing plays audio in this
  environment. What is proven is that the state logic is right and the sizes
  are what they claim. Whether .62rem is actually comfortable, and whether the
  swing reads as musical at Vivace (~2.7 swings/second, unclamped), are still
  the owner's eye. The tier-change cadences are deliberately NOT gated by ♪ —
  they fire ~4×/day and are the reward, not the metronome; if he wants one mute
  for everything, that is a one-line follow-up.

  BoardHub v23.27 — F5.1: the focus trap, and the audit that found nothing
  (aug/2026)
  Two of F5's four fronts (PLANO-V24.md §3). One needed work; the other turned
  out not to, and that is a result, not a gap.
  ── FRONT 2, OBJECT URLs: AUDITED, NOTHING TO FIX ──
  The plan's worry was that LRU eviction might drop an entry without revoking
  its object URL — a slow leak in an image-heavy app. MEASURED instead of
  assumed: all 9 createObjectURL sites accounted for, one at a time.
    6 enter an LRU cache and are registered with _touchThumb/_touchObjUrl, so
      eviction revokes them (THUMB_CAP 600, OBJURL_CAP 12)
    3 are temporaries with an explicit revoke on both the success and the error
      path (thumbnail generation, _compressImage, the export download)
  ZERO leaked. NO CODE CHANGED for this front. Recording it because "we audited
  and it was already right" is a finding a future session should not have to
  redo — and because a first pass at this LOOKED like it had found two leaks:
  two sites add to _thumbCache without a touch ON THE SAME LINE, and call
  _touchThumb on the NEXT one. Reading the grep hit instead of the code would
  have produced a confident bug report about correct code.
  ── FRONT 3, THE FOCUS TRAP: A REAL BUG ──
  DIAGNOSIS: the Tab/Shift+Tab cycling already existed, but it took its first
  and last elements straight from querySelectorAll. A DISABLED button and a
  display:none input both match that selector, and .focus() on either is a
  no-op — so whenever an edge happened to be one of them, the trap "wrapped"
  focus to something that refused it, focus stayed where it was, and the next
  Tab left the dialog entirely. Reachable rather than theoretical: the Sync
  modal's buttons carry disabled={loading}.
  • FIX: bhFocusable(root) filters to what can ACTUALLY take focus — not
    disabled, not inert, not aria-hidden, and either rendered or currently
    focused. Pulled OUT of the Modal so it is testable by behaviour: the trap
    lives in a component behind React state, the filter does not have to.
  • offsetWidth/offsetHeight rather than offsetParent, because offsetParent is
    null for position:fixed elements and the overlay is fixed — the obvious
    check would have hidden every control in every modal.
  ── ALSO FRONT 3: THINGS THAT CHANGE WITHOUT BEING ASKED ──
  There was no aria-live anywhere in the file. The two save indicators and the
  sync status now carry role="status" aria-live="polite". These are exactly the
  two cases a live region is for: the save indicator flips on its own, and sync
  state changes because ANOTHER device did something.
  • POLITE, NOT ASSERTIVE, and the test forbids assertive: the save indicator
    flips every ~2.5s while editing, and assertive would interrupt a screen
    reader mid-word every time. The sync error DETAIL sits inside the same
    region as the label so "erro" and its reason are announced together instead
    of as two separate interruptions.
  MEASURED: 109 tests, 109 green (was 104). Three behaviour tests on the filter
  (disabled, hidden/aria-hidden, order preserved) and two source guards.
  A GUARD I HAD TO REWRITE BEFORE COMMITTING: my first version of the trapTab
  guard used a 200-character window — the exact shape that went red on correct
  code twice in this session already. Replaced with two structural facts: the
  selector literal exists in exactly ONE place, and trapTab's brace-matched body
  calls the filter. Writing the fragile version by reflex, in the same session
  that fixed it twice, is worth recording.
  HONEST COST: inert/aria-hidden on the BACKGROUND is deliberately NOT done.
  The plan lists it, and it is the difference between a focus trap and a real
  modal. But it interacts with the nested-modal stack, and the failure mode of
  getting the cleanup wrong is an app that stops responding to clicks with no
  visible cause — a bad trade in an app whose owner would have to debug it from
  the outside. It needs its own phase with its own tests. The live regions are
  also unverified by ear: no screen reader was run, so what is proven is that
  the markup is correct and polite, not that the announcement reads well.

  BoardHub v23.25 — F4 CLOSED: execCommand stays, and why (aug/2026)
  Decision taken by Claude under delegation on 2026-08-03, NOT by the owner —
  recorded that way in APROVACOES.md so a future session knows it can be
  reopened without arguing with anybody.
  THE NET CHANGED THE ANSWER, which is the entire justification for the owner's
  "write the tests first, then decide" instead of deciding cold.
  Before F4.1 the standing analysis split the 4 uses into "3 easy ones"
  (insertText for Tab, the two insertHTML) and "1 hard one" (the bold/italic/list
  dispatch), and called the easy three low-risk. THAT WAS WRONG, and only the
  undo test made it visible:
  • execCommand('insertText') and execCommand('insertHTML') FEED THE BROWSER'S
    NATIVE UNDO STACK. Manual Selection/Range surgery does not.
  • So replacing the "easy" three would leave formatting correct while Ctrl+Z
    quietly stopped undoing an inserted image or a Tab — inside the notes editor
    of an app that has already lost the user's data twice.
  • That is not a small win with the editor untouched. It is a data-loss-adjacent
    regression, bought to remove a deprecation warning nobody sees.
  The easy/hard split therefore does not survive the evidence: all four uses
  share the same reason to stay, and it is the same reason — the undo stack.
  DECISION: keep all 4. F4 is closed, with the 7 spec tests standing as the
  regression net the plan required. execCommand is deprecated, but no engine has
  shipped or announced removal, and if one ever changes the behaviour the suite
  reports it instead of the user meeting it mid-sentence.
  WHAT WOULD REOPEN IT: an actual removal announcement, or a replacement that
  demonstrably passes the undo test. The net turns that from an argument into a
  measurable bar.
  NO CODE CHANGED — this entry and APROVACOES.md are the whole diff. 102 tests,
  102 green, bundle key untouched.
  HONEST COST: this closes F4 on ONE engine's behaviour (Chromium, via the
  harness) and on the reasoning above, not on a survey of what Selection/Range
  can be made to do. A determined replacement that reimplements the undo stack
  is possible and is not what was measured here. The decision is also mine, not
  the owner's, on a matter of taste about deprecated APIs — which is exactly the
  kind of call he has overridden before.
  ──────
  BoardHub v23.24 — F4.1: the cursor net, before any decision (aug/2026)
  PLANO-V24.md §3 accepts keeping execCommand — but only "provided a
  cursor-behaviour test suite exists", and it did not. APROVACOES.md §2 records
  the choice: write the net FIRST, then decide. This is the net. It changes no
  behaviour and argues for nothing.
  NOTHING IN index.html CHANGED except this entry — the bundle key did not move
  while the tests were added, which is the check that this phase is what it says
  it is.
  MEASURED: 4 uses of execCommand, not the 5 the plan claimed — the generic
  exec(cmd,val) dispatch for bold/italic/lists, insertHTML for images,
  insertText for Tab, and insertHTML for the sanitised drop.
  WHAT THE 7 SPEC TESTS PIN, in the app's real DOM: bold and italic wrap the
  selection AND LEAVE IT SELECTED (lose that and the user re-selects for every
  format); a list keeps the caret inside the item (lose it and typing continues
  outside the list); Tab inserts four spaces AT the caret and advances it by
  four (the failure that matters is the caret jumping to the start or end of the
  block); an inserted image lands BETWEEN the surrounding text with the caret
  after it; the quote-escape in the image src holds; and native undo restores
  the pre-format content.
  THE UNDO TEST IS THE DECISIVE ONE. The contentEditable undo stack is the whole
  reason light editors still use execCommand: a Selection/Range reimplementation
  that does not feed that stack turns Ctrl+Z into a silent data-loss button
  INSIDE the editor. Any replacement has to pass this test, and that is a higher
  bar than making the markup come out right.
  WHAT THESE HONESTLY ARE, because it decides how much they are worth: an
  executable SPEC. They drive a real contentEditable through a single seam, op(),
  which today calls document.execCommand exactly as RichEditor does — they do
  NOT execute RichEditor's own closures, which live inside the component behind
  React state and are BASELINE limitation #3 again. The value is that a
  replacement re-points op() at the new implementation and every assertion must
  still hold. A source guard pins that the editor still uses the same four call
  shapes, so the spec cannot drift from the app in silence.
  VERIFIED THE NET CATCHES: with op() stubbed to a no-op, all 7 go red, each
  with its own accurate message — and the source guard correctly stays GREEN,
  because it reads index.html and not the driver. The undo test also refuses to
  pass vacuously: it asserts the bold changed something before testing that undo
  put it back.
  102 tests, 102 green (was 94).
  DECISION STILL OPEN, and now it can be taken on evidence rather than nerve.
  What the net does NOT tell you: it says nothing about whether Selection/Range
  CAN reproduce these behaviours, only what it would have to reproduce. My
  reading is unchanged from v22 — the generic exec(cmd,val) is the expensive one,
  because replacing it means reimplementing rich-text formatting over Range for
  an API every browser still ships. The two insertHTML uses and insertText are
  replaceable without drama. A partial replacement is available and legitimate.
  HONEST COST: these run in the harness iframe, which is Chromium — the spec is
  pinned on ONE engine, and execCommand's exact markup differs between engines
  (<b> vs <strong>, where the <ul> gets inserted). The assertions are written
  loosely enough to survive that (either tag accepted), but the app has only ever
  been checked in Chromium and this does not change that. The suite also does not
  drive real key events: Tab is tested as the insertText the handler performs,
  not as a keydown through React.

  BoardHub v23.23 — F3.4: no catch swallows in silence any more (aug/2026)
  F3's last unmet acceptance criterion: "count of unclassified catches = 0".
  Every catch in the file now either reports through bhLog or carries a
  /*silent-ok: reason*/ marker naming what is lost by staying quiet.
  MEASURED FIRST, and the number in the plan was stale: the handoff said 49,
  the file has 58 — my own F1.1, F2(A) and F3.3 work added 9. The first count
  said 58 too, but with a FALSE POSITIVE: this changelog quotes `catch{}` in
  prose, and the scanner was reading its own documentation. Comments come out
  before the count, always. That is the third time that trap has been paid for
  in this repo.
  THE SPLIT: 43 marked silent-ok, 15 routed to bhLog.
  • SILENT-OK is not "ignore" — it is a claim, and each one says what makes the
    silence correct: showPicker() and video.play() throw by browser policy;
    focus() on an element that left the DOM; a localStorage READ whose fallback
    default is already the right answer; cleanup that runs only after the thing
    it cleans up has been verified. Logging these would be constant noise, and
    noise is what trains someone to stop reading the console.
  • bhLog GOES WHERE SILENCE COSTS DATA, and the message says the cost, not the
    error: the state not reaching disk, the demo seed not being marked as such,
    a legacy two-slot backup not folded in before its key is deleted, the local
    state discarded for the cloud without a copy, the daily and ~30min snapshots
    not happening, an inline image left un-migrated.
  • THE BOOT LOADER gets markers, not bhLog: it runs before bhLog exists. One of
    them is a genuine accepted risk, written down rather than smoothed over — if
    sessionStorage rejects the recovery flag the loop guard is gone and a
    persistently bad bundle could reload forever. Without sessionStorage there is
    no way to remember across a reload, and never retrying turns a recoverable
    bad cache into a permanently dead app.
  A SOURCE TEST BROKE, AND THE TEST WAS WRONG — the fourth time in this repo,
  and the SECOND time for this same guard. 'the pending-edit branch archives
  before discarding the remote' measured a fixed 600-char window after the
  branch head. Adding a bhLog call with a long message pushed the `return;` out
  of view, and the test then reported "the return happens before the archiving"
  when the return was simply not in the window. The code was correct throughout.
  Its v1 had died the same way (a comment pushed the CALL out); v2 stripped
  comments but kept the window. A window is a PROXY for the invariant, and every
  time the code grows the proxy lies. Fixed properly: the branch body is now
  taken by matching its braces, so nothing can be pushed out of it.
  MEASURED: unclassified catches 58 → 0. 94 tests, 94 green (was 93), including
  a new guard that re-counts on every run and names the offending line numbers.
  HONEST COST: "classified" means someone wrote down a reason, not that the
  reason is right. I judged 58 catches by reading each call site; a wrong
  judgement here is now INVISIBLE, because the marker makes it look considered.
  The ones I was least sure of are pomoTimerSave and metronomeSave, both marked
  silent-ok on the grounds that they are re-derivable preferences rather than
  user data. The bhLog side is also untested by behaviour: the tests prove the
  calls EXIST, not that they fire — simulating a localStorage that rejects
  writes needs API interception the harness does not do yet.
  ──────
  BoardHub v23.22 — F3.3: the failure diary survives the reload (aug/2026)
  Does what PLANO-V24.md §3 asked and F3.1 declined: the ~50KB localStorage
  mirror plus a "Diagnóstico" panel in the Danger Zone. The owner overrode the
  earlier deviation on 2026-08-02 (APROVACOES.md); this follows the plan.
  DIAGNOSIS: F3.1 made failures audible but only to a console nobody has open,
  in a buffer that dies with the tab. The moments the diary exists for — a white
  screen, a crash, "it went weird so I reloaded" — are precisely the moments
  memory is already gone. A diary you cannot read after the fact is a diary that
  does not exist.
  THE OBJECTION F3.1 RAISED WAS REAL, and it is why the mirror looks like this
  rather than being a plain setItem: writing the failure diary to localStorage
  means writing exactly where the failure being recorded happens. Answered
  structurally, in three parts:
  • BOUNDED TWICE — BH_LOG_CAP entries and ~50KB, whichever binds first, trimmed
    from the OLD end because the newest entries are what explain the crash.
  • IT GETS OUT OF THE WAY. If the mirror write EVER fails, the diary deletes
    itself and stops trying for the rest of the session. A failed write means the
    state is already under quota pressure, and between the user's data and the
    diary ABOUT the user's data, the data wins. Retrying inside every subsequent
    catch would be the worst of both worlds.
  • IT NEVER RECURSES. The mirror writer does not call bhLog — it runs inside
    bhLog, and recursing would turn a failed diary write into a stack overflow
    inside a catch, which is the exact failure mode bhLog exists to prevent.
  The in-memory buffer keeps working through all of it: the mirror is a bonus,
  never a dependency.
  • bhLogDump() KEEPS ITS OLD MEANING — this session only — because existing
    callers and tests rely on it. The restored entries live in a separate list
    and surface through the new bhLogAll(), which is what the panel reads.
  • THE PANEL is read-only plus copy and clear, collapsed by default: in a
    healthy session it is empty and would be pure noise. The value is being able
    to hand the log to someone, not to act on it from here.
  MEASURED: 6 behaviour tests — mirrored on write, restored across a reload,
  bounded in entries AND bytes with the newest kept, quota failure deleting the
  key and staying off while the in-memory diary keeps recording, and bhLogClear
  emptying all three places. 93 tests, 93 green (was 87).
  CHECKED BY HAND in the real app, on the localhost origin: seeded three entries,
  reloaded, and the button read "Diagnóstico (3)" with the rows newest-first.
  Every colour in the panel is a token and flips with the theme — verified by
  computed colour in both (bg #F4F1ED→#17140F, border #E8E3DC→#332B22, tag
  #8C3A2E→#CE9284, text #1C1917→#EDE7DE). That check exists because M3.1's bug
  was a literal colour that did not flip, and no test in this suite can see it.
  HONEST COST: I could NOT take a screenshot — the browser pane would not
  composite — so the panel is verified by DOM, computed colour and geometry, not
  by eye. If it is ugly, that is where it will show, and the suite cannot tell
  either way. The mirror is also written synchronously on every bhLog call: in a
  healthy session that is zero writes, and in a failing one at most one per
  autosave, but it is not throttled. And the diary still records only what the
  11 instrumented catches report — F3.4 (classifying the remaining 49) is a
  separate phase and is not in this diff.

  BoardHub v23.21 — F2(A) second half: the LOCAL side of the conflict (aug/2026)
  Closes what PLANO-V24.md §7 left open under "Open": the 10min window via
  LAST_EDIT_KEY, the 'concurrent-superseded' label and the notice on the path
  where the LOCAL state is the one passed over.
  DIAGNOSIS: F2(A) shipped only the branch where the REMOTE loses. When the
  remote WINS, the local state did reach the history — but folded into the
  generic 'pre-sync' snapshot taken on every single apply. So the user who had
  just lost ten minutes of live work to another device got a snapshot that looks
  identical to the hundreds of routine ones, no label to search for, and no word
  that a conflict had happened at all. The data was there; the ability to find it
  was not.
  • FIX: bhLocalSupersededDecision, a pure function beside bhConcurrentDecision,
    chooses which reason the snapshot carries. It says 'concurrent-superseded'
    only when ALL of it holds — local has data; local and remote actually
    DIVERGE; there is a usable local edit stamp; and that stamp is inside 10min.
    Anything else stays 'pre-sync'.
  • WHY EACH CONDITION EARNS ITS PLACE: equal signatures are this device's own
    push echoing back through the listener, not a conflict — without that check
    every ordinary sync would announce one. A missing or unparseable stamp may
    never be read as "edited just now". Outside the window it is a routine pull,
    and crying wolf on those teaches the user to ignore the notice that matters.

  the history that advertises ~19 holds ~4". Measured on this origin, the
  localStorage quota is ~50 MB, not 5 — the entire design ceiling fits 2.6× inside
  it. The original arithmetic was not valid in either direction either, because
  Chrome COMPRESSES localStorage: with repetitive text, 30 snapshots "of 1MB" fit
  where the naive measurement predicted 5. Two of my own measurements, before
  these, stopped at the loop ceiling and not at the quota — they nearly became
  "25 MB" and "37.5 MB" in place of the real wall. I record this because it is the
  fourth time a number from the v24 plan has died on measurement.
  WHAT WAS LEFT OF THE JUSTIFICATION, measured on this origin (state of ~0.95 MB
  per snapshot, history of 12 = 11.4 MB):
    cost per capture ........ 38.1 ms  →  5.3 ms   (stringify 12.0 + setItem 26.1)
    Sync screen list ........ 11.4 MB  →  1.4 KB   (it was the ENTIRE history
                                                    in React memory just to draw
                                                    dates and counters)
    headroom .................. ~50 MB →  ~2.8 GB
  In other words: the real gain was not quota, it was COST PER WRITE and memory.
  Before, every capture re-serialized and rewrote the entire history in order to
  append one entry; now it is one transaction with a put and the retention
  deletions. It is the same kind of error as P1-3 in v23.6 — paying the price of
  the whole collection to touch one item — now on the write side.
  WHY ITS OWN DATABASE, and not one more store in the image database: gcIdb
  sweeps the image database deciding what is an orphan blob. With the snapshots
  in there, the only thing separating "backup" from "garbage to collect" would be
  key-prefix discipline — and that GC has already deleted a user's file once
  (v23.3). Distinct databases make the confusion impossible by construction, not
  by convention. There is a source test requiring the two names to stay different.
  MIGRATION (protocol #4 — write → VERIFY → only then remove):
  it writes all the entries into IDB, re-reads `meta`, checks that every `at` from
  the source arrived at the destination and ONLY THEN deletes
  boardhub_backup_history. If one is missing, the migration throws, the legacy key
  STAYS and the attempt repeats on the next boot. An unreadable history (broken
  JSON) is never deleted: it is the only copy.
  The old two-slot migration keeps writing to the legacy key, on purpose — it is
  synchronous and runs during the parse of the bundle, before there is any IDB
  open; the new one takes it from there into the database afterwards. Two simple
  migrations in series, instead of one asynchronous one reimplementing the
  two-slot format.
  THE CENTRAL TRAP, and the reason bhHistoryLoad CEASED TO EXIST:
  gcIdb collects the idb:// references from the history's states. If I had kept a
  synchronous bhHistoryLoad returning `meta` — which has no state — gcIdb would do
  e.state → undefined, would collect no reference at all and would delete LIVE
  blobs. It is exactly P0-1 of v23.3, through another door. That is why the pair
  is bhHistoryMeta() (synchronous, without state) and bhHistoryFull()
  (asynchronous, with state), and the old name is gone: any forgotten consumer
  becomes an error.
  For the same reason, bhHistoryFull() REJECTS instead of returning [] when it
  cannot read — "I do not know what is referenced" can never become "nothing is
  referenced". gcIdb aborts the sweep in that case, and also when the history has
  not opened yet. It fails CLOSED on every path.
  • bhCapture became asynchronous. None of the 7 call sites uses the return value
    — they are all fire-and-forget inside try/catch — so none of them changed
    shape. The promise never rejects. Captures are SERIALIZED in a queue: two
    concurrent ones would decide retention over the same in-memory mirror and the
    second would resurrect what the first had just dumped.
  • `at` is the store's primary key. Two captures in the same millisecond would
    overwrite each other silently; now it pushes 1ms forward until it is unique.
  • bhCapture's quota fallback still exists, now against the IDB quota, and still
    uses stripInlineImages — which preserves idb://. A backup that lost the
    references along with the payload would be P0-1 all over again.
  • Restoring reads the snapshot by key (bhHistoryGet) and ABORTS if it comes back
    empty: swapping good data for a backup that did not load is worse than not
    restoring.
  HONEST COST: the localStorage quota was measured on http://localhost, and the
  app runs on file:// — Chrome's quota is derived from free disk and varies per
  origin and per machine, so the ~50 MB figure is not a promise about yours.
  The retention ceiling (~19) did not change: IndexedDB has 2.8 GB and, without a
  ceiling, the history would grow forever — the localStorage quota was what held
  that back by accident. There is a test pinning the limit. The rollback is not
  automatic: once migrated and verified, going back to localStorage would require
  new code. And the tests cover migration, dedup, retention and reading — they do
  not cover a full restore clicked through the interface, which remains a manual
  verification.

  • The pulse became VISUAL: truncated pyramid, articulated rod and weight, as on
    the wooden metronome. There is no scheduler — the rod is a CSS animation with
    a var(--beat) duration coming from the BPM, so the timing lives in the
    browser's compositor and there is no JS timer to drift, leak, or compete for
    the thread with the autosave. Half an oscillation = one crotchet: the rod
    crosses the centre once per beat.

    — higher = longer session — which is the same convention as the real

    stroke travelling around a polygon is hard to read at a glance, and
    superimposing the reading on the drawing muddles both. The track stays
    visible at all times: without it, "almost done" and "not started" are the
    same emptiness.

  BoardHub v23.8 — Pomodoro was losing focus time (aug/2026)
  DIAGNOSIS: the timer loop credits to the day's total the DIFFERENCE between one
  tick and the next (delta = previous timeLeft − remaining). The pattern works as
  long as only the loop itself touches the pointer, and it loses time silently
  everywhere that moves the clock forward without crediting the interval. Two
  places did exactly that:
  • The end of the session. timeLeft goes down 1800 → 1799 → … → 2 → 1, adding up
    1799 deltas of 1s; on the next tick "remaining" reaches 0 and the completion
    branch calls flushPomoSecs() directly, without crediting the 1 → 0 stretch.
    The last second of EVERY focus session was discarded, at any duration.
  • onVisible. On returning to the tab it repositioned timeLeft to the real
    remaining time without crediting what had passed. With the tab merely hidden
    that is harmless (the setInterval keeps running ~1×/s and credits normally),
    but when the browser FREEZES the tab — mobile in the background, or Chrome
    after ~5min hidden — the interval stops firing and the entire stretch
    vanished: the next tick compared against the already-advanced pointer and saw
    delta 0.
  MEASURED (loop simulation, tick by tick, with the same arithmetic as the code):
                                        before        after
    30min session, tab active ........ 29m59s   →   30m00s
    hidden 5s out of 30min ........... 29m54s   →   30m00s
    frozen 10min out of 30min ........ 19m59s   →   30m00s
    frozen until after the end .......  9m59s   →   30m00s
    frozen for almost the whole run ..  0m09s   →   30m00s
  FIX: credit the remainder before zeroing the pointer, at both places. The guard
  (timeLeftRef.current > 0) in the completion branch prevents double counting in
  the case where onVisible already credited the residue and left the pointer at 0
  — both close at exactly 1800s, regardless of which fires first.
  • Welcome side effect: the DAY_TIERS tiers now close on round numbers. 8h of
    focus in 30min sessions recorded 7h59m52s — one second less per session — so
    💎 Diamante needed an extra session to light up.
  HONEST COST: verified by simulating the ticks' arithmetic, not by a real timed
  30min session. The simulation reproduces the 29m59s reported before the fix,
  which is a good sign of fidelity, but it does not replace running the timer end
  to end — that goes into F0's regression suite. The sound and the end
  notification still do not fire with the tab frozen: they depend on the tick,
  and a frozen tab has no timer. Only a Service Worker would solve it — out of
  scope.

  BoardHub v23.6 — P1-3 remeasured: the bottleneck was not lsSave (jul/2026)
  The plan said the autosave froze the thread for "tens of ms" serializing the
  whole state, and proposed splitting localStorage into per-domain keys —
  acknowledging that this touches lsLoad/lsSave, bhCapture, import/export and the
  reconcile. Before touching the layer that has already caused data loss twice, I
  measured. Synthetic state of 1 MB (30 projects, 300 gallery posts, 60 notes
  with rich text, ~400 days of pomodoro), in this test container:
    JSON.stringify(whole state) ...................  4.1 ms
    bhSig (stringify + djb2 character by character) 11.3 ms
    bhHistoryLoad (parse of the whole history) ....  24.3 ms   ← ON EVERY autosave
    bhCapture → trySave (stringify of the history)   48.1 ms

  door: the autosave called bhHistoryLoad() every 2.5 s just to read list[0].at
  and decide whether 30 min had gone by since the last snapshot. Parsing several
  MB of JSON to read one timestamp.

    boardhub_backup_last_at (~30 bytes), fed by bhCapture and cached in memory.
    If the key disappears, it rebuilds from the history ONCE per session. The

    the Sync screen and the daily backup — all outside the hot path.

    reference-memoized version (it only re-serializes the domain whose reference

  BoardHub v23.5 — P1-1: compiled bundle cache (jul/2026)
  DIAGNOSIS: the single-file design forced @babel/standalone to transpile 390KB
  of JSX on EVERY open. It was by far the biggest startup cost — bigger than
  everything optimized in the image layer — and it is 100% repeated work: the
  same input text always produces the same output JS.
  MEASURED (in this test container, not on your machine — your desktop is much
  faster, but the order of magnitude holds):
    • babel.min.js = 2.78 MB raw / 592 KB gzipped. The plan estimated ~400KB;
      it is more than double that.
    • transpiling the 390KB of JSX = ~2.4 s of main thread.
  Both disappeared from every load that is not the first one after an edit to the
  file.
  HOW IT WORKS
  • The JSX block became type="text/x-boardhub-jsx" (Babel no longer picks it up
    on its own) and Babel's <script src> left the <head> — it is now injected on
    demand.
  • A loader at the end of the <body> computes FNV-1a of the source and looks for
    bundle_v1_<hash>-<length> in IndexedDB (its own database, boardhub_bundle,
    separate from the image one — the blob GC does not touch it).
    hit → it runs the cache, Babel is not even downloaded. miss → it injects
    Babel, transpiles, runs and writes.
  • The hash is OF THE SOURCE: editing the file invalidates it by itself. There
    is no "old cache of a new file" state. Only the current bundle is kept
    (prune).
  • GOOD SIDE EFFECT: with a warm cache the app opens with no network at all.
    Before, without being able to download Babel, it would not open at all.
  HONEST COST: the first load (and the first one after each edit) is a little
  SLOWER, because the Babel download only starts after the IDB query fails,
  instead of happening in parallel with React.
  SAFETY OF THE BOOT PATH (it is the boot path — the plan's three mitigations are
  all implemented and tested):
  • parse and execution separated: new Function(code) PARSES without executing. A
    corrupted bundle throws right there, before any side effect, and the fallback
    to Babel stays clean.
  • if it parsed but threw in the middle of execution, the app may be half
    initialized — at that point you cannot run Babel on top. It clears the cache
    and reloads ONCE (guarded in sessionStorage against a loop).
  • without IndexedDB (private mode in some engines) the app opens normally, it
    just does not cache.
  • a "Limpar cache do app" button in the Sync Danger Zone, which also shows this
    boot's origin (cache or babel).
  • FIX found by the test: the loader passes an EXPLICIT runtime:'classic' to the
    react preset. In @babel/standalone 7.23.9 that is already the default, but in
    Babel 8 the default became 'automatic' — which emits
    require("react/jsx-runtime"), something that does not exist on a page with
    React as a UMD global. I reproduced the breakage by running the loader
    against standalone 8.0.4: the app does not mount. With the URL pinned at
    7.23.9 this does not happen today, but it was a time bomb for the day the
    version goes up.
  ──────
  BoardHub v23.4 — Audit batch 3: spot fixes (jul/2026)
  Four bugs with no coupling between them. None of them loses data; three produce
  unnecessary work and one widens the attack surface.

    [onClose] in the deps and the 4 call sites pass an inline arrow — a new
    identity on every render of the parent. Any re-render unmounted and remounted
    the effect, which on mount calls boxRef.focus(). In other words, the parent
    re-rendered and the modal stole the focus from the input. onClose now lives in
    a ref and the effect runs with []. Measured in the test: with the old code,

    stays at 1.

    with the quality parameter ignored, and the canvas discards the original's
    indexed palette — a 500KB PNG screenshot came out at 600KB. Now it encodes

    accepts the result if it actually shrank. The same guard rail applies to an
    already well-compressed JPEG, which used to be swapped for the WebP even when
    the WebP came out bigger.

  BoardHub v23.3 — P0-1: the cloud was erasing the local image references (jul/2026)
  DIAGNOSIS: a single function mixed two unrelated responsibilities, and that was
  enough to destroy images irreversibly. stripBase64() treated
  "data:image/...;base64,..." and "idb://<key>" as the same thing — "local content
  that does not go to the cloud" — and replaced both with ''. But they are not the
  same thing: the first is PAYLOAD (megabytes, blows Firestore's 1MB/document
  limit, it really does have to go); the second is a ~40-byte REFERENCE that
  threatens no limit at all. Since pushState() used that function, the cloud wrote
  images:['','','']; since the listener applies WHOLE ARRAYS
  (setGalleryPosts(data.galleryPosts)), those blanks came back into the local
  state on the next sync — and the reference died on the very device that had the
  blob. 24h later gcIdb no longer found the reference and deleted the blob.
  Minimal sequence: save offline → come back online → push writes '' → next boot
  applies the empty array → gcIdb runs → file lost.
  • FIX P0-1 (data loss): stripBase64 → stripInlineImages. It removes only the
    data:image payload and PRESERVES idb://. A device that does not have the blob
    shows a placeholder, which is infinitely better than destroying the reference
    on the device that does. The 4 call sites (pushState, bhCapture,
    buildSyncPayload, size guard) were updated. Note: bhCapture's call site is the
    quota fallback of the BACKUP HISTORY — that is, the backup and gcIdb (which
    reads references from the history) lost the information together. Both closed.
  • FIX P0-1 (gcIdb): "it is not referenced in the state right now" is far too
    weak evidence for deleting a blob — a bad remote application, a state that did
    not load or a half-finished import produce exactly that symptom. The GC now
    requires the key to be unreferenced in TWO sweeps separated by ≥24h (ledger in
    boardhub_gc_pending). If the reference comes back (undo, backup restore,
    reconcile), the key leaves the ledger and the clock resets. Cost: an orphan
    survives ~1 day longer. When in doubt, do not collect.
  • FIX (same family, found along the way): lsLoad() returning null made the GC
    conclude "nothing is referenced" and delete EVERYTHING. It is literally the
    failure class of the original incident — empty state destroying real data. Now
    it aborts the sweep.
  • NEW: <Img>/<BgImg> distinguish "still loading" from "this device does not have
    this file". It needed a new signal: resolving to '' calls setState with the
    same value and React discards the update — no re-render was possible.
    useDisplayUrlState returns [url,missing]; useDisplayUrl became a thin wrapper
    (Vid and direct callers did not change). The placeholder is an icon +
    title/aria-label, not text: the cells range from 16px to full-bleed and text
    would break the small ones.
  • The v23.2 invariant verified with real instrumentation on
    IDBObjectStore.prototype.get: when a thumbnail exists, the original is NEVER
    read.
  • ATTENTION: this fix prevents the destruction from here on; it does not recover
    what has already been deleted. Posts that today have images:['','',''] in the
    cloud have already lost the reference on both sides. What may still have it is
    the Histórico de Backups and orphan blobs that gcIdb has not collected yet.

  BoardHub v23.2 — Image pipeline rewritten (jul/2026)
  DIAGNOSIS: v23 got slower than the previous build because the grid started
  doing TWICE the work per cell. The resolver read the ORIGINAL, painted, and only
  then swapped it for the thumbnail — two IndexedDB reads, two decodes (one of
  them of a 1400px source inside a ~200px cell) and two paints per visible image.
  Add to that the boot warmer, which loaded up to 100 full-res blobs in separate
  transactions and queued up behind them the small reads the grid actually needed.
  • GRID = THUMBNAIL ONLY. One read, one decode, one paint. No grid/cover surface
    touches the original any more; full-res is now exclusive to the lightbox
    (OBJURL_CAP 100→12, because only one image shows at a time).
  • BATCHED READS: each idbGet opened its own transaction — a screen with 40
    images = 40 queued transactions, each with its own commit. Reads in the same
    tick now collapse into ONE transaction with N gets (React commits the effect
    of all visible cells in the same tick, so a whole screen becomes a single
    transaction).
  • THUMBNAIL GENERATED ON UPLOAD, not on first display — the cost lands where the
    user is already waiting. Browsing never pays decode+encode again.
  • THE BOOT WARMER NOW WARMS THUMBNAILS (before: originals, and the function from
    the v23 changelog was not even called — a different one ran, full-res). Since
    the thumbnails stay resident, the resolver returns the URL SYNCHRONOUSLY on
    the first render: no placeholder frame, no fade, no second paint — which was
    exactly the "instant" feel of the old build, only costing ~40KB per image
    instead of ~300KB.
  • A second warmer pass generates thumbnails that do not exist yet (migration of
    an old collection), throttled at 3 concurrent and limited to 150/session.
  • Thumbnail generation with ONE decode (it was two: a dimension probe + a
    resize); a high-quality downscale on the canvas gives the same result.
  • A thumbnail LRU (THUMB_CAP=600, ~15-25MB) replaces the full-res one.
  • loading="lazy" removed from local images (they already have their own viewport
    gate — it was a second delay on a resource already in memory); the 250ms fade
    kept only for network images. Gate widened 400px→600px.
  • FIX: a video in getThumbUrl generated a "thumbnail" that was the entire video
    persisted under thumb_<key>. Now it serves the original.

  BoardHub v23.1 — Correção crítica de perda de dados no 1º login (jul/2026)
  • FIX P0 (data loss): logging into an account for the FIRST TIME on a device
    could push the demo SEED over a real cloud save. Root cause: the "does local
    hold real data?" guard only tested for non-empty arrays, and the SEED ships
    with 3 demo projects + clients + mentors + notes. Any device that had merely
    OPENED the app once before logging in had that demo content persisted with a
    fresh edit timestamp, so last-write-wins compared "seed edited seconds ago"
    against "real data synced yesterday" and the seed won.
  • The deeper fix: last-write-wins is the wrong rule for first contact with an
    account on a device. At that moment the cloud holds accumulated history and
    local holds at most minutes of pre-login work. New rule — if this browser
    profile has never completed a sync with this account (boardhub_synced_uid),
    THE CLOUD ALWAYS WINS and timestamps are not consulted. Local state is
    archived to the backup history first ('Local antes do 1º login') and an
    on-screen notice explains what happened. LWW still applies afterwards, so
    genuine offline editing on a known device is unaffected.
  • Devices are marked as synced with an account after any successful apply or
    push; SEED-initialized profiles are flagged (boardhub_seeded) so demo content
    is never mistaken for real data again.

  BoardHub v23 — Claude audit & rework (jul/2026)
  PERCEIVED PERFORMANCE (fast full-res warming, bounded for 100+ image posts)
  • Reconciled approach: the speed comes from warming full-res blobs into memory
    so the grid shows the original the instant it's cached — no thumbnail
    generation on the critical path. This is the fast behavior of the earlier
    build, now made safe for large posts by an LRU cap on the object-URL cache.
  • Warming happens two ways: a background idle pass pre-loads blobs so browsing
    feels pre-warmed, and opening a card eagerly warms its own images (first ~48)
    right away. Display shows full-res immediately, then swaps to the small
    thumbnail for render efficiency.
  • MEMORY: the full-res cache is capped (OBJURL_CAP=100). Past the cap the
    least-recently-shown blob is revoked; on-screen images were just touched so
    they're never the ones evicted. A 100+ image post no longer pins every blob
    for the session — scrolled-away images are reclaimed and re-read in ms if
    revisited. First paint is still never blocked by image I/O, and idb:// grid
    images remain viewport-gated so a huge post doesn't read all blobs at once.
  • FASTER generation: thumbnails now build via createImageBitmap (off-main-thread
    decode + resize) instead of new Image()+canvas, with a canvas fallback.
  • Full-res is used directly in the lightbox; thumbnails persist across sessions.  IDEAS
  • NEW: reorder entries within a group — drag on the desktop (grip + handle,
    same pattern as the sidebar), ↑↓ arrows on mobile (touch does not do HTML5
    drag). The new order syncs and goes into the backup like the rest of the state.
  SYNC / DATA SAFETY
  • FIX P0: initial reconcile now runs BEFORE the pending-edit gate — a stray
    pre-login edit on a fresh device no longer lets a near-seed push overwrite
    the cloud (the class of the original data-loss incident). Stray pre-login
    edits are archived to backup history ('Edição pré-login').
  • FIX P0: push failures NEVER surrender _hasPendingLocalEdit anymore; retries
    back off 8s→30s→2min, DIRTY stays set, and a stale snapshot can no longer
    silently overwrite unpushed local edits. New explicit escape hatch in Sync:
    "Descartar locais e puxar da nuvem" (archives local first).
  • NEW: real last-write-wins on boot conflicts — local last-edit timestamp
    (boardhub_last_edit_at) vs remote _updated; loser is archived to history.
    Ties within 2min favor local (active work).
  • FIX P0: TDZ crash — idb:// prefetch ran at module eval before openIdb was
    initialized; any persisted local image crashed the app on load. Block moved.
  • NEW: global trash (v3.2) — soft-deleted items now sync across devices and
    are restorable anywhere; 30-day auto-purge (deletedAt stamp) bounds size.
    Previously trash was device-local and silently emptied by remote echoes.
  • FIX: per-document size guard (3× 950KB) replaces the whole-state 900KB check
    that blocked sync in scenarios the 3-doc split was built to survive; the
    offending doc is named in the UI (syncDetail).
  • FIX: fresh account no longer stuck on "Sincronizando..." (empty server
    snapshot now resolves to synced).
  • FIX: "Forçar sync" routed through App so pending/dirty flags clear on success.
  • Removed dead _isApplyingRemote mechanism (written, never read).
  CORRECTNESS
  • FIX: all "today" computations use localDateISO() (local tz) — pomodoro after
    21:00 BRT logged to tomorrow, deadline chips off-by-one at night, daily
    backup in the wrong weekday slot. Replaced: _seedDate, pomoTodayKey,
    pomoLoad migrations, todayISO, addDays, daily-backup slot, bhCapture dedup,
    gallery post date, export filename, Gantt week/month headers, streak.
  • FIX: Dashboard streak read days[key].total but values are numbers — streak
    was permanently 0; dead weekHeat (computed, never rendered) removed.
  • FIX: JSON import validates shapes (Array.isArray) and reports unrecognized
    files instead of corrupting state; new ErrorBoundary replaces the white
    screen with a recoverable error card.
  SECURITY / PRIVACY
  • NEW: allowlist sanitizer on rich-text HTML (import/cloud could carry
    <script>/on* handlers into innerHTML with a live Firebase session);
    insertImage escapes the src attribute.
  • NEW: Imgur fallback asks consent once per session (uploads are public by
    URL); declining stores the image locally instead.
  MAINTENANCE
  • NEW: IndexedDB GC on boot (delayed 8s) — deletes blobs unreferenced by the
    live state AND every backup-history snapshot; 24h age floor so a
    just-uploaded image can never be collected.
  • FIX: Modal — Escape closes only the top of the stack; minimal focus trap +
    focus restore; aria-modal/labels.
  • FIX: duplicated .rich-editor CSS block merged; .overlay recentered over the
    content area (was padded 80/160/160 asymmetrically).
  • navTick now also bumps on select/add project (route consistency);
    bhRetention docs corrected (7 weekly + 12 rotating ≈ 19 cap, by design).
  KNOWN TRADE-OFFS (accepted, documented)
  • Babel standalone transpiles ~360KB of JSX at every load (single-file
    constraint); execCommand remains (deprecated, no light replacement);
    session object-URLs are not revoked (GC covers the underlying blobs).

<!-- Critical render-path scripts only -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel does NOT enter the critical path: it is injected on demand by the
     loader at the end of the <body>, and only when the compiled bundle cache
     misses. -->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<!-- Firebase loaded LAZILY after first paint — see _lazyFirebase() below -->
<!-- M4-typography: Figtree left, Alegreya Sans came in. SAME origin, SAME link,
     same number of requests — it is not a new dependency (protocol #7), it is a
     family swap inside what was already being downloaded. Weights 300/400/500/700:
     the 600 the CSS asked for in 8 places does not exist in Alegreya Sans and the
     browser resolves it to 700, which is the desired behaviour in a humanist with
     a lighter stroke than Figtree. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Alegreya+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<script>
/* M3 — the theme has to be applied BEFORE the first paint. Waiting for React
   would make notturno users see a flash of light paper on EVERY open, and here
   React only mounts after Babel — hundreds of ms on a cold cache. Synchronous,
   tiny, and tolerant of localStorage being unavailable (private mode). */
try{var _bhT=localStorage.getItem('boardhub_theme');if(_bhT==='notturno')document.documentElement.setAttribute('data-theme','notturno');}catch(e){/*silent-ok: no localStorage (private mode) means no stored preference, and the default IS the paper theme*/}
</script>
<style>
:root{--bg:#F4F1ED;--surface:#FDFCFA;--border:#E8E3DC;--border-2:#D5CCBF;--text:#1C1917;--muted:#78716C;--accent:#4A3728;--focus-ring:rgba(var(--ink),.18);
/* M1 — tempo ramp. Replaces the 4 medal colours that were hardcoded in the JSX
   (#CD7F32/#94A3B8/#FBBF24/#60A5FA). It is not a gamification rainbow: it is ink
   warming and thickening until it reaches the app's own --accent, which stays
   reserved for the top (Vivace). Adagio has no colour — it uses --muted, because
   being the base tier is not an achievement. */
--tempo-1:#8A7A5E;--tempo-2:#A9761F;--tempo-3:#9A5B2A;--tempo-4:#4A3728;
/* M3 — SEMANTIC STATUS TRIADS.
   The app painted status with a PAIR hardcoded at the point of use: a light tint
   behind + dark text on top (#E8F5EC/#276b3e, #FEF9E7/#92700b, #FDEDED/#9B1C1C).
   That pair is what dies in a dark theme: the pale tint becomes a milky block on
   a black background and the dark text vanishes inside it. Swapping only the page
   background is not enough — both sides of the triad have to flip together.
   Hence tokens in TRIADS (background/text/line) and not loose colours: the caller
   asks for 'danger', not for 'light red no. 3'. */
/* M3.1 — PIGMENT PALETTE.
   The triads started out generic: green #48BB78, yellow #F59E0B, red #DC2626 —
   the framework palette, which shouts "app notification" and fights with
   Cormorant on warm paper. Replaced by PIGMENTS, which is the vocabulary already
   in use across the rest of the app (tempo, dynamics, engraving):
     verderame  — the blue-green of copper patina, the green of Italian
                  painting before industrial viridian
     ocra       — yellow earth, the oldest pigment there is
     rosso      — the Venetian red of burnt earth, not the red of an alert
     oltremare  — the blue of lapis lazuli, which came "from beyond the sea"
   These are EARTH and MINERAL colours: desaturated, warm, and they live with the
   sepia --accent instead of competing with it. */
--ok-bg:#E6EDE6;--ok-fg:#3F6152;--ok-line:#B4C7BB;
--warn-bg:#F6EEDC;--warn-fg:#8A6A26;--warn-line:#DCC48A;
--danger-bg:#F3E4E0;--danger-fg:#8C3A2E;--danger-line:#D9B3A9;
--info-bg:#E6E9F0;--info-fg:#3A4E73;--info-line:#B3BECF;
--neutral-bg:#F0EDE9;
--danger-strong:#A6462F;--ok-strong:#5C8570;--warn-strong:#B98D3A;
/* M3.1 — THE INK, as an RGB triple. There were 28 rgba(var(--ink),α) scattered
   through the CSS: ink washes over paper, for hover, shadow and groove. They all
   vanish on a dark background, because washing black with black does nothing.
   Storing the CHANNEL and not the colour keeps every alpha where it is and
   inverts the whole set at once. */
--ink:28,25,23;--paper:253,252,250;}

/* ── M3 — NOTTURNO ──────────────────────────────────────────────────────────
   Dark theme as a TOGGLE, not a replacement: the warm paper stays the default
   (the user's decision, not mine). It lives entirely in the token swap — no
   layout rule changes, no selector is duplicated.
   The background is not black: it is the same paper brown pulled downwards,
   otherwise the interface changes identity instead of changing light. The triads
   invert the logic — dark desaturated background, light text — because the same
   pale tint over black turns into noise. */
:root[data-theme="notturno"]{

--tempo-1:#8A7A5E;--tempo-2:#C08F35;--tempo-3:#C27642;--tempo-4:#C9A87C;

--ok-bg:#1B2620;--ok-fg:#9CBFAA;--ok-line:#3A5647;
--warn-bg:#2A2417;--warn-fg:#CFAE72;--warn-line:#584A2C;
--danger-bg:#2B1D19;--danger-fg:#CE9284;--danger-line:#5A3830;
--info-bg:#1B2029;--info-fg:#9AAAC4;--info-line:#3A4557;
--neutral-bg:#241E18;
--danger-strong:#B4614C;--ok-strong:#6F937E;--warn-strong:#AC8A4E;
--ink:237,231,222;--paper:23,20,15;}

/* === REDESIGN v2 === */
/* M2.1 — metronome pendulum. The duration comes from the BPM via --beat
   (inline), and half a swing = one crotchet, so the rod crosses the centre once
   per beat, as on a mechanical metronome. The easing imitates the physics: fast
   in the middle, almost stopped at the extremes — linear would give away at once
   that it is a rectangle rotating. The pivot sits at the bottom
   (transform-origin), which is where the real one sits. */
@keyframes bhPendulum{from{transform:rotate(-26deg);}to{transform:rotate(26deg);}}
/* transform-box:view-box so that the pivot is in SVG COORDINATES (38,70 = the
   base of the dial). Without it, a percentage on a <g> resolves against the
   group's own bounding box and the rod spins around itself. */
/* The pivot comes from --pivot, written by the JSX out of MET_PIVOT_Y. Leaving
   the number fixed here broke once already: the geometry changed, the CSS was
   left behind, and the rod started rotating around a point that no longer
   existed. */
.bh-pendulum{transform-box:view-box;transform-origin:38px var(--pivot,34px);animation:bhPendulum var(--beat,.5s) cubic-bezier(.42,0,.58,1) infinite alternate;}
/* There is NO prefers-reduced-motion suppression here, and that is deliberate —
   but the REASON changed on 2026-08-03 and the old one no longer applies.
   It used to be: the pendulum is opt-in and born switched off, so suppressing it
   would hijack the explicit choice of whoever turned it on. That argument died
   when the owner asked for the swing to be unconditional; there is no opt-in left
   to protect.
   The suppression stays out on a different footing: the swing is now the only
   moving indication that a session is RUNNING. Freezing it would show a stopped
   metronome on a running timer — a wrong reading of state, which is worse than
   the motion it removes. If this ever needs revisiting, the honest fix is a
   non-moving running indicator, not a frozen rod. */

  <!-- Instant loading screen — pure CSS, renders before any JS loads -->
  <div id="splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#F4F1ED;font-family:serif;gap:10px">
    <div style="font-size:2.4rem;font-weight:500;letter-spacing:-0.02em;color:#1C1917">Board<span style="font-style:italic;font-weight:300">Hub</span></div>
    <div style="font-size:.65rem;color:#78716C;letter-spacing:.1em;text-transform:uppercase">Carregando...</div>

      <div style="width:40%;height:100%;background:#1C1917;border-radius:3px;animation:splashBar 1.2s ease infinite"></div>
    </div>
  </div>
  <style>#splash{transition:opacity .4s ease}@keyframes splashBar{0%{transform:translateX(-100%)}50%{transform:translateX(150%)}100%{transform:translateX(250%)}}</style>
  <script>
    window.__splashTimeout=setTimeout(function(){
      var s=document.getElementById('splash');if(!s)return;
      s.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;gap:12px;font-family:sans-serif;padding:24px;text-align:center"><div style="font-size:2.4rem;font-weight:500;font-family:serif;color:#1C1917">BoardHub</div><div style="font-size:.8rem;color:#DC2626">Erro ao carregar. Verifique sua conexao e recarregue.</div><button onclick="location.reload()" style="margin-top:8px;padding:8px 20px;background:#1C1917;color:white;border:none;border-radius:8px;cursor:pointer">Recarregar</button></div>';
    },12000);
    window.addEventListener('error',function(e){
      clearTimeout(window.__splashTimeout);
      var s=document.getElementById('splash');if(!s)return;
      var safeMsg=document.createElement('div');
      safeMsg.textContent=e.message||'Erro desconhecido';
      s.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;gap:12px;font-family:sans-serif;padding:24px;text-align:center"><div style="font-size:2.4rem;font-weight:500;font-family:serif;color:#1C1917">BoardHub</div><div style="font-size:.8rem;color:#DC2626;max-width:400px">Erro: '+safeMsg.innerHTML+'</div><button onclick="location.reload()" style="margin-top:8px;padding:8px 20px;background:#1C1917;color:white;border:none;border-radius:8px;cursor:pointer">Recarregar</button></div>';
    });
  </script>
</div>
