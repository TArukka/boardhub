// - DATE HELPERS (local timezone) -
// The app runs in UTC-3 (Brazil). toISOString() gives the UTC date, which after
// 21:00 local is already *tomorrow* — pomodoro logged to the wrong day, deadline
// chips off-by-one at night, daily backup landing in the wrong weekday slot.
// Every "today" in the app must go through localDateISO().
const localDateISO=(d=new Date())=>{
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
};

// - F3: FAILURE DIARY -
// There were 54 empty `catch{}` in this file. Most are legitimate — showPicker(),
// video.play() under autoplay policy and dataTransfer throw by browser design,
// and logging that would be constant noise. But a subset was swallowing exactly
// the class of failure that has already cost data here: a localStorage that
// stopped accepting writes (private mode, quota exceeded, corrupted profile). In
// those, the app carried on as if it had saved, and the user only found out later.
//
// bhLog does not replace error handling: it makes the failure AUDIBLE.
//
// F3.3 — THE MIRROR. F3.1 kept this buffer in memory only and argued the case
// here: writing the failure diary to localStorage means writing precisely where
// the failure being recorded happens. That objection is REAL and it is why the
// mirror is built the way it is — but it lost, on the owner's decision
// (APROVACOES.md, 2026-08-02), because a diary that dies with the tab is
// unreadable in the one situation that matters. A white screen, a crash, a
// reload after "it went weird": memory is exactly what is gone by then.
//
// The objection is answered structurally, not waved away:
//   • the mirror is capped at BH_LOG_CAP entries AND ~50KB, whichever binds
//     first, so it cannot grow into the space the state needs;
//   • if writing it EVER fails, the diary DELETES ITSELF and stops trying for
//     the rest of the session. A failed write means the state is already under
//     quota pressure, and between the user's data and the diary about the
//     user's data, the data wins. Retrying inside every subsequent catch would
//     be the worst of both.
//   • the mirror writer NEVER calls bhLog — it runs inside bhLog, and recursing
//     would turn a failed diary write into a stack overflow inside a catch.
// The in-memory buffer keeps working either way; the mirror is a bonus, never a
// dependency.
//
// It may NEVER throw: it is called from inside a catch, and a throw here would
// trade a swallowed error for an error that brings down the recovery path. That
// is why the whole body is wrapped, and why nothing here assumes the shape of
// its input.
const BH_LOG_CAP=100;
const BH_LOG_KEY='boardhub_log';
const BH_LOG_MAX_BYTES=50*1024;
const _bhLogBuf=[];
// Restored once, at boot, from the previous session. Kept separate from the live
// buffer so bhLogDump keeps meaning "this session" for its existing callers.
let _bhLogPrev=[];
try{
  const _raw=localStorage.getItem(BH_LOG_KEY);
  const _p=_raw?JSON.parse(_raw):null;
  if(Array.isArray(_p))_bhLogPrev=_p.filter(e=>e&&typeof e==='object').slice(-BH_LOG_CAP);
}catch{_bhLogPrev=[];}
let _bhMirrorOff=false;
const _bhLogMirror=()=>{
  if(_bhMirrorOff)return;
  try{
    let arr=[..._bhLogPrev,..._bhLogBuf].slice(-BH_LOG_CAP);
    let s=JSON.stringify(arr);
    // Trim from the OLD end until it fits: the newest entries are the ones that
    // explain what just happened.
    while(s.length>BH_LOG_MAX_BYTES&&arr.length>1){arr=arr.slice(Math.ceil(arr.length/2));s=JSON.stringify(arr);}
    if(s.length>BH_LOG_MAX_BYTES)return; // a single entry over the cap: keep it in memory only
    localStorage.setItem(BH_LOG_KEY,s);
  }catch{
    // Never bhLog from here — see the header. Drop the diary and stay quiet.
    _bhMirrorOff=true;
    _bhLogPrev=[];
    try{localStorage.removeItem(BH_LOG_KEY);}catch{/*silent-ok: if even the delete fails the mirror stays off in memory, which is the outcome that matters*/}
  }
};
const bhLog=(tag,err,extra)=>{
  try{
    let msg='';
    try{msg=(err&&(err.message||err.name))||(err==null?'':String(err));}catch{msg='(erro ilegível)';}
    _bhLogBuf.push({at:new Date().toISOString(),tag:String(tag==null?'?':tag),msg:String(msg).slice(0,300),
                    extra:extra===undefined?undefined:String(extra).slice(0,200)});
    while(_bhLogBuf.length>BH_LOG_CAP)_bhLogBuf.shift();
    console.warn('[BoardHub]',tag,msg,extra===undefined?'':extra);
    _bhLogMirror();
  }catch{/*silent-ok: the total wrapper. bhLog is called from inside catches, so a throw here would trade a swallowed error for one that kills the recovery path*/}
};
// A copy, not the live buffer: whoever inspects it must not be able to alter the diary.
const bhLogDump=()=>_bhLogBuf.slice();
// The full diary the Diagnóstico panel shows: what survived the last session
// plus this one, oldest first, bounded the same way the mirror is.
const bhLogAll=()=>[..._bhLogPrev,..._bhLogBuf].slice(-BH_LOG_CAP);
const bhLogClear=()=>{
  _bhLogBuf.length=0;
  _bhLogPrev=[];
  _bhMirrorOff=false; // an explicit clear frees the space, so the mirror may try again
  try{localStorage.removeItem(BH_LOG_KEY);}catch{/*silent-ok: the in-memory diary is already emptied; a stale key is overwritten on the next entry*/}
};

// - M3: THEME -
// 'papel' (the default) and 'notturno'. The default is the warm paper by your
// decision, not by system preference: the app has an identity and it is light.
// Whoever wants the dark one switches it on, and the choice persists.
const THEME_KEY='boardhub_theme';
const themeLoad=()=>{try{return localStorage.getItem(THEME_KEY)==='notturno'?'notturno':'papel';}catch{return 'papel';}};
const themeApply=t=>{
  try{
    if(t==='notturno')document.documentElement.setAttribute('data-theme','notturno');
    else document.documentElement.removeAttribute('data-theme');
  }catch(e){bhLog('themeApply',e);}
  try{localStorage.setItem(THEME_KEY,t);}catch(e){bhLog('themeSave',e,'the theme reverts to the default on the next boot');}
};

// - LOCAL STORAGE -
const LS_KEY = 'boardhub_v2';
const DIRTY_KEY = 'boardhub_dirty'; // '1' = localStorage holds edits not yet confirmed pushed to cloud
const LAST_EDIT_KEY = 'boardhub_last_edit_at'; // ISO timestamp of the last USER edit — feeds last-write-wins
const lsLoad = () => { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch { return null; } };
const lsSave = s => {
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); }
  catch(e) {
    // Quota exceeded — strip any accidental base64 that slipped through (single pass)
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(s, (k,v)=>typeof v==='string'&&v.startsWith('data:image')?'':v));
      bhLog('lsSave.quota', e, 'saved without the embedded data:image');
    } catch(e2) {
      // F3: this was the most expensive `catch{}` in the file. If it fires, the
      // user's state did NOT reach the disk — and the app carried on exactly the
      // same, with "Auto-save ativo" lit up in the sidebar. Continuing without
      // throwing is right (bringing down the UI saves nothing), staying silent
      // is not.
      bhLog('lsSave.FALHOU', e2, 'the state was NOT persisted');
    }
  }
};
// - GLOBAL TRASH AUTO-PURGE -
// Soft-deleted items sync across devices (v3.2). To bound document size, items
// deleted more than 30 days ago are purged at boot. Pre-existing trash without
// a deletedAt stamp is grandfathered: stamped now, giving it a fresh 30 days.
const TRASH_TTL_MS=30*24*3600*1000;
const _purgeTrash=s=>{
  if(!s)return s;
  const now=Date.now();
  const prune=arr=>Array.isArray(arr)?arr.map(x=>{
    if(x&&x.deleted&&!x.deletedAt)return{...x,deletedAt:new Date().toISOString()};
    return x;
  }).filter(x=>{
    if(!x||!x.deleted||!x.deletedAt)return true;
    return now-new Date(x.deletedAt).getTime()<TRASH_TTL_MS;
  }):arr;
  ['projects','clients','mentors','notes','socialPosts','galleryPosts','galleryFolders']
    .forEach(k=>{if(s[k])s[k]=prune(s[k]);});
  return s;
};
const persisted = _purgeTrash(lsLoad());
// - DEVICE/ACCOUNT SYNC MARKERS -
// SYNCED_UID_KEY: the account this browser profile has actually completed a sync
// with. Absent/different = this is the FIRST contact with that account here, and
// the cloud must be treated as authoritative (see the reconcile state machine).
// SEEDED_KEY: this profile's state was initialized from SEED and has never been
// synced. Without it, persisted SEED data (3 demo projects, clients, mentors,
// notes) is indistinguishable from real user data — which is exactly how a phone
// that had been opened once before login pushed the demo content over a real
// cloud save.
const SYNCED_UID_KEY='boardhub_synced_uid';
const SEEDED_KEY='boardhub_seeded';
if(!persisted){try{localStorage.setItem(SEEDED_KEY,'1');}catch(e){bhLog('seed.markSeeded',e,'the demo seed is not marked as such, so the first-contact reconcile may treat it as real data');}}

// - BACKUP HISTORY -
// Rotating snapshot history. Replaces the old two-slot system (pre_sync + daily),
// which kept only the 2 most recent snapshots — both would already be poisoned by
// the time a sync disaster was noticed. Design goals:
//   • multiple snapshots with tiered retention (recent kept densely, older thinned)
//   • dedup by content signature (no more "two identical backups 1 minute apart")
//   • NEVER capture an empty/seed state — a backup of nothing is not a backup
//   • quota-safe: drops oldest entries (and strips base64) before giving up
// F1: the history lives in IndexedDB, in ITS OWN DATABASE. The key below is only
// the migration SOURCE — once migrated and verified, it ceases to exist.
const BH_HISTORY_KEY='boardhub_backup_history';
const BH_DB_NAME='boardhub_backups';
const BH_STORE='snapshots';   // the whole entry, with state
const BH_META='meta';         // at/reason/sig/counts, without state
const BH_DB_V=1;
const BH_KEEP_RECENT=6;   // most recent N rotating snapshots always kept
const BH_MAX_TOTAL=12;    // cap on the ROTATING tier only — the weekly tier adds
                          // up to 7 more (one per weekday), so the effective
                          // history ceiling is ~19 entries, by design
const bhStateHasData=s=>{
  if(!s)return false;
  const ne=a=>Array.isArray(a)&&a.length>0;
  return ne(s.projects)||ne(s.clients)||ne(s.mentors)||ne(s.notes)||ne(s.tasks)||ne(s.socialPosts)||ne(s.galleryPosts)||ne(s.noteGroups);
};
const bhSig=s=>{ // cheap content hash (djb2) for dedup — volatile-free copy
  const {pomoData,...rest}=s||{};
  const str=JSON.stringify(rest);
  let h=5381;
  for(let i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;}
  return String(h);
};
// F2(A) — what to do with a remote state that arrived while there is a pending
// local edit. It lives HERE, outside the App, on purpose: the decision inside
// applyMerged is unreachable for the harness (a useEffect inside a component,
// behind Firebase auth), and BASELINE limitation #3 records that as debt.
// Extracting the decision makes it testable by behaviour and turns the call site
// into one line.
//
// 'arquivar' means: store the remote in the history BEFORE discarding it in
// favour of the local edits. Without that, whatever the other device saved
// disappears when this one pushes over it — with no copy anywhere.
const bhConcurrentDecision=({localSig,remoteSig,lastArchivedSig,remoteHasData})=>{
  if(!remoteHasData)return 'ignorar';           // an empty cloud is not data to preserve
  if(remoteSig===localSig)return 'ignorar';     // it is our own state coming back
  if(remoteSig===lastArchivedSig)return 'ignorar'; // the listener redelivers the same doc
  return 'arquivar';
};
// F2(A), SECOND HALF — the mirror of bhConcurrentDecision, for the branch where
// the LOCAL state is the one being passed over.
//
// F2(A) shipped the case where the remote loses and gets archived. When the
// REMOTE wins, the local state did already reach the history — but folded into
// the generic 'pre-sync' snapshot taken on every apply, which says nothing about
// a conflict having happened. The user who just lost ten minutes of work gets no
// label to look for and no notice telling them where it went.
//
// This decides which of the two reasons the snapshot carries. It is a pure
// function outside the App for the same reason bhConcurrentDecision is: the call
// site lives in a useEffect behind Firebase auth, unreachable for the harness
// (BASELINE limitation #3), so the DECISION is what gets tested by behaviour.
//
// It only says 'concurrent-superseded' when all of it holds:
//   • the local state has data — emptiness is never worth announcing;
//   • local and remote actually DIVERGE — equal signatures are this device's own
//     push echoing back, which is not a conflict;
//   • there is a usable local edit stamp — a missing or unparseable one may
//     never be read as "edited just now";
//   • that stamp is inside the window — outside it this is a routine pull, and
//     labelling it a conflict would cry wolf on every ordinary sync.
// A stamp in the FUTURE (clock skew) counts as recent: that errs towards the
// more prominent label and a notice, which is the harmless direction.
const BH_CONCURRENT_WINDOW_MS=10*60*1000;
const bhLocalSupersededDecision=({localSig,remoteSig,localAt,now,localHasData,windowMs=BH_CONCURRENT_WINDOW_MS})=>{
  if(!localHasData)return 'pre-sync';
  if(!localSig||!remoteSig||localSig===remoteSig)return 'pre-sync';
  if(!localAt)return 'pre-sync';
  const t=new Date(localAt).getTime();
  if(!(t>0))return 'pre-sync';
  if((now-t)>windowMs)return 'pre-sync';
  return 'concurrent-superseded';
};
const bhCounts=s=>({
  projects:(s.projects||[]).filter(p=>!p.deleted).length,
  clients:(s.clients||[]).filter(c=>!c.deleted).length,
  notes:(s.notes||[]).filter(n=>!n.deleted).length,
  tasks:(s.tasks||[]).length,
});
// ── F1: history storage ─────────────────────────────────────────────────────
// ITS OWN DATABASE, not one more store in the image database. gcIdb sweeps the
// image database deciding what is an orphan blob; if the snapshots lived there,
// the only thing separating "backup" from "rubbish to collect" would be
// key-prefix discipline — and that GC has already deleted a user file once
// (v23.3). Distinct databases make the confusion impossible by construction, not
// by convention.
//
// Two stores: `snapshots` holds the whole entry (with state), `meta` holds only
// at/reason/sig/counts. The dedup decision, retention and the Sync screen's LIST
// read `meta` — which is tiny — instead of dragging the entire archive into
// memory. The state is only read by whoever genuinely needs it: gcIdb and the
// restore. Both stores are written in the SAME transaction, so there is no meta
// without a snapshot.
let _bhDb=null,_bhDbP=null;
const _bhResetDb=()=>{_bhDb=null;_bhDbP=null;};
const bhIdbOpen=()=>{
  if(_bhDb)return Promise.resolve(_bhDb);
  if(_bhDbP)return _bhDbP;
  _bhDbP=new Promise((res,rej)=>{
    let req;
    try{req=indexedDB.open(BH_DB_NAME,BH_DB_V);}catch(e){_bhResetDb();rej(e);return;}
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(BH_STORE))db.createObjectStore(BH_STORE,{keyPath:'at'});
      if(!db.objectStoreNames.contains(BH_META))db.createObjectStore(BH_META,{keyPath:'at'});
    };
    req.onsuccess=e=>{
      _bhDb=e.target.result;_bhDbP=null;
      _bhDb.onclose=_bhResetDb;
      _bhDb.onversionchange=()=>{try{_bhDb.close();}catch{/*silent-ok: closing a connection the browser is already tearing down*/}_bhResetDb();};
      res(_bhDb);
    };
    req.onerror=e=>{_bhResetDb();rej(e.target.error);};
  });
  return _bhDbP;
};
// Writes entries and removes the evicted ones in a single transaction: the
// history never sits in a state where retention has already deleted but the new
// snapshot has not gone in.
const bhIdbWrite=(puts,dels)=>bhIdbOpen().then(db=>new Promise((res,rej)=>{
  let tx;
  try{tx=db.transaction([BH_STORE,BH_META],'readwrite');}catch(e){_bhResetDb();rej(e);return;}
  const s=tx.objectStore(BH_STORE),m=tx.objectStore(BH_META);
  try{
    puts.forEach(e=>{s.put(e);m.put({at:e.at,reason:e.reason,sig:e.sig,counts:e.counts});});
    (dels||[]).forEach(at=>{s.delete(at);m.delete(at);});
  }catch(e){rej(e);return;}
  tx.oncomplete=()=>res();
  tx.onerror=e=>rej((e.target&&e.target.error)||new Error('transaction failed'));
  tx.onabort=e=>rej((e.target&&e.target.error)||new Error('transaction aborted'));
}));
const bhIdbAllMeta=()=>bhIdbOpen().then(db=>new Promise((res,rej)=>{
  let r;
  try{r=db.transaction(BH_META,'readonly').objectStore(BH_META).getAll();}catch(e){_bhResetDb();rej(e);return;}
  r.onsuccess=e=>res(e.target.result||[]);
  r.onerror=e=>rej(e.target.error);
}));
// DELIBERATELY without a catch returning []: the caller (gcIdb) needs to tell
// "the history references nothing" from "I could not read the history".
// Swallowing the error here would make the GC conclude that no blob is
// referenced and delete them all — exactly the class of the v23.3 incident, now
// from the backup side.
const bhHistoryFull=()=>bhIdbOpen().then(db=>new Promise((res,rej)=>{
  let r;
  try{r=db.transaction(BH_STORE,'readonly').objectStore(BH_STORE).getAll();}catch(e){_bhResetDb();rej(e);return;}
  r.onsuccess=e=>res((e.target.result||[]).sort((a,b)=>a.at<b.at?1:-1));
  r.onerror=e=>rej(e.target.error);
}));
// A single snapshot, by key. The Sync screen lists from `meta` and calls this on
// the restore click — no state enters memory before that.
const bhHistoryGet=at=>bhIdbOpen().then(db=>new Promise((res,rej)=>{
  let r;
  try{r=db.transaction(BH_STORE,'readonly').objectStore(BH_STORE).get(at);}catch(e){_bhResetDb();rej(e);return;}
  r.onsuccess=e=>res(e.target.result||null);
  r.onerror=e=>rej(e.target.error);
}));
// In-memory mirror of `meta`, always newest first. It exists so that the dedup
// decision and the screen's list stay SYNCHRONOUS, as they were on localStorage —
// the 7 bhCapture call sites did not change shape.
let _bhMeta=[];
let _bhReady=false;
const bhHistoryMeta=()=>_bhMeta;
// Migration (protocol #4: write → VERIFY → only then remove the source).
const bhMigrateLegacy=async()=>{
  let raw=null;
  try{raw=localStorage.getItem(BH_HISTORY_KEY);}catch{/*silent-ok: unreadable localStorage means there is no legacy history to migrate*/}
  if(!raw)return;
  let list=null;
  try{list=JSON.parse(raw);}catch{return;} // unreadable: it is the only copy, do NOT delete
  if(!Array.isArray(list)){return;}
  const valid=list.filter(e=>e&&typeof e.at==='string');
  if(!valid.length){try{localStorage.removeItem(BH_HISTORY_KEY);}catch{/*silent-ok: nothing valid to migrate; a key left behind is retried harmlessly next boot*/}return;}
  await bhIdbWrite(valid,[]);
  // Verification: every `at` from the source must be present in the destination.
  // Only after that may the source go. If one is missing it throws — the legacy
  // key STAYS and the migration is tried again on the next boot.
  const gravados=new Set((await bhIdbAllMeta()).map(m=>m.at));
  const faltando=valid.filter(e=>!gravados.has(e.at));
  if(faltando.length)throw new Error('incomplete migration: '+faltando.length+'/'+valid.length+' did not reach the IDB');
  try{localStorage.removeItem(BH_HISTORY_KEY);}catch{/*silent-ok: runs only AFTER the destination was verified, so the data is already safe; the key is re-migrated as a no-op next boot*/}
  console.info('[BoardHub] F1: '+valid.length+' snapshot(s) migrated to IndexedDB.');
};
let _bhInitP=null;
const bhHistoryInit=()=>{
  if(_bhInitP)return _bhInitP;
  _bhInitP=(async()=>{
    try{
      await bhMigrateLegacy();
      _bhMeta=(await bhIdbAllMeta()).sort((a,b)=>a.at<b.at?1:-1);
      _bhReady=true;
    }catch(e){
      // Fail CLOSED: with no readable history, bhCapture does not write (it will
      // not invent a new history on top) and gcIdb aborts the sweep.
      _bhReady=false;
      console.warn('[BoardHub] backup history unavailable:',e);
    }
    return _bhReady;
  })();
  return _bhInitP;
};
// v23.6 P1-3: the autosave called bhHistoryLoad() on EVERY write just to read
// list[0].at and decide whether 30 min had passed since the last snapshot. With a
// large archive that is a JSON.parse of several MB every 2.5 s — measured at
// ~24 ms for 12 snapshots of a 1 MB state, against the ~4 ms of the lsSave that
// the plan pointed to as the bottleneck. The timestamp now lives in its own key
// of ~30 bytes; the whole history is only read by whoever genuinely needs it
// (bhCapture, gcIdb, the Sync screen and the daily backup, all off the hot path).
// If the key disappears, it falls back to the history ONCE per session.
const BH_LAST_AT_KEY='boardhub_backup_last_at';
let _bhLastAt=null;
const bhLastAt=()=>{
  if(_bhLastAt!==null)return _bhLastAt;
  try{const v=localStorage.getItem(BH_LAST_AT_KEY);if(v){_bhLastAt=v;return v;}}catch{/*silent-ok: falls through to rebuilding the stamp from _bhMeta, which is the documented fallback*/}
  _bhLastAt=(_bhMeta[0]&&_bhMeta[0].at)||'';
  try{if(_bhLastAt)localStorage.setItem(BH_LAST_AT_KEY,_bhLastAt);}catch{/*silent-ok: caching the rebuilt stamp; losing it costs one extra rebuild per session, and bhMarkCaptured already logs the write that matters*/}
  return _bhLastAt;
};
// F3: if this key fails to write, the autosave loses its reference for "when the
// last snapshot was" and starts capturing every 2.5s instead of every 30min.
const bhMarkCaptured=at=>{_bhLastAt=at;try{localStorage.setItem(BH_LAST_AT_KEY,at);}catch(e){bhLog('bhMarkCaptured',e);}};
const bhRetention=list=>{
  // Two tiers, one merged list (newest-first):
  //  • WEEKLY tier (reason 'daily'): one slot per weekday, captured on first open
  //    of the day; the newest entry per weekday wins, max 7. Immune to the
  //    rotating tier's thinning — guarantees 7 days of coverage no matter how
  //    fast auto/pre-sync snapshots churn.
  //  • ROTATING tier (everything else): BH_KEEP_RECENT most recent kept
  //    unconditionally, older thinned to one per calendar day, cap BH_MAX_TOTAL.
  const dailies=[];const others=[];
  list.forEach(e=>(e.reason==='daily'?dailies:others).push(e));
  const byWeekday=new Map(); // 0=Sun..6=Sat → newest entry
  dailies.forEach(e=>{
    const wd=new Date(e.at).getDay();
    const cur=byWeekday.get(wd);
    if(!cur||e.at>cur.at)byWeekday.set(wd,e);
  });
  const keptDailies=[...byWeekday.values()];
  const keptOthers=[];const seenDays=new Set();
  others.forEach((e,i)=>{
    if(i<BH_KEEP_RECENT){keptOthers.push(e);seenDays.add(e.at.slice(0,10));return;}
    const day=e.at.slice(0,10);
    if(!seenDays.has(day)){keptOthers.push(e);seenDays.add(day);}
  });
  return [...keptDailies,...keptOthers.slice(0,BH_MAX_TOTAL)].sort((a,b)=>a.at<b.at?1:-1);
};
// ── F1.1: the localStorage safety net ───────────────────────────────────────
// F1 moved the history into IndexedDB and shipped without the two items the
// plan asked for by name (PLANO-V24.md §3, recorded as debt in §7):
//   • ONE emergency snapshot in localStorage, for "the IDB got corrupted along
//     with everything" — otherwise the whole history dies with one database.
//   • a fallback for when IndexedDB is unavailable at all (private mode). The
//     behaviour was to fail CLOSED: _bhReady stayed false and bhCapture wrote
//     nothing. That protects blobs from deletion, but it means "no backup",
//     which is precisely what the plan said never to degrade to.
//
// BOTH stores can hold idb:// references, and that governs the whole design:
// gcIdb decides what is an orphan blob, so it MUST count them (see
// bhLsBackupStates below and its call in gcIdb). A backup whose references the
// GC cannot see is a backup whose images the GC deletes — the v23.3 P0-1
// incident arriving through a third door.
const BH_EMERGENCY_KEY='boardhub_backup_emergency';
const BH_FALLBACK_KEY='boardhub_backup_fallback';
const BH_FALLBACK_MAX=3;  // small on purpose: this key shares the state's quota
// The state goes in stripped of data:image but KEEPING idb:// — the same rule
// as bhCapture's quota fallback. The payload is what does not fit; the
// reference is 40 bytes and is the only thing standing between a blob and the
// GC.
const _bhLean=s=>(typeof stripInlineImages==='function'?stripInlineImages(s):s);
// NEVER throws: called from inside bhCapture, which is fire-and-forget from 7
// call sites. A throw here would turn "the emergency copy did not get written"
// into "the capture path died". A circular state blows stripInlineImages'
// stack — that is a RangeError, and it is caught here like any other.
const bhEmergencySave=entry=>{
  try{
    if(!entry||!entry.state)return false;
    localStorage.setItem(BH_EMERGENCY_KEY,JSON.stringify({
      at:entry.at,reason:entry.reason,sig:entry.sig,counts:entry.counts,state:_bhLean(entry.state)}));
    return true;
  }catch(e){bhLog('bhEmergencySave',e,'this device has no emergency copy outside the IndexedDB');return false;}
};
// The degraded history, used only while the IndexedDB one is unreadable.
// Newest-first, deduped against the newest, capped at BH_FALLBACK_MAX.
const bhFallbackSave=entry=>{
  try{
    if(!entry||!entry.state)return false;
    let list=[];
    // Unreadable existing key: do NOT overwrite it. It may be the only copy
    // left, and the same reasoning already governs bhMigrateLegacy.
    try{const raw=localStorage.getItem(BH_FALLBACK_KEY);const p=raw?JSON.parse(raw):[];if(!Array.isArray(p))return false;list=p;}
    catch{return false;}
    const lean={at:entry.at,reason:entry.reason,sig:entry.sig,counts:entry.counts,state:_bhLean(entry.state)};
    if(list[0]&&list[0].sig===lean.sig)return false;
    localStorage.setItem(BH_FALLBACK_KEY,JSON.stringify([lean,...list].slice(0,BH_FALLBACK_MAX)));
    return true;
  }catch(e){bhLog('bhFallbackSave',e,'this capture was not backed up anywhere');return false;}
};
// Every state that lives in a localStorage backup. gcIdb unions these into its
// `referenced` set before deciding what to collect.
//
// It THROWS when a key EXISTS but cannot be parsed, deliberately: "I cannot
// read this backup" may never collapse into "this backup references nothing".
// Same rule that makes bhHistoryFull reject instead of returning []. The throw
// leaves through gcIdb's catch and aborts the sweep, which is the correct
// failure — an uncollected orphan costs disk, a collected live blob costs the
// user's image.
//
// A localStorage that throws on read is different: if it cannot be read it was
// never written either, so there is nothing referenced there to miss.
const bhLsBackupStates=()=>{
  const out=[];
  [BH_EMERGENCY_KEY,BH_FALLBACK_KEY].forEach(k=>{
    let raw=null;
    try{raw=localStorage.getItem(k);}catch{return;}
    if(!raw)return;
    const parsed=JSON.parse(raw); // unguarded on purpose — see above
    (Array.isArray(parsed)?parsed:[parsed]).forEach(e=>{if(e&&e.state)out.push(e.state);});
  });
  return out;
};
// F1: asynchronous on the outside, same SHAPE on the inside. None of the 7 call
// sites uses the return value — they are all fire-and-forget inside try/catch —
// so returning a Promise does not change their behaviour. The promise never
// rejects.
//
// Captures are SERIALISED in a queue: two concurrent captures would decide
// retention against the same _bhMeta, and the second would resurrect what the
// first had just evicted.
let _bhChain=Promise.resolve();
const bhCapture=(state,reason)=>{
  const run=async()=>{
    try{
      if(!bhStateHasData(state))return false; // never snapshot emptiness
      // Never capture before knowing what already exists: with _bhMeta still
      // empty, retention would run against an empty list and the first autosave
      // after boot would evict the entire history.
      if(!_bhReady)await bhHistoryInit();
      if(!_bhReady){
        // F1.1 — DEGRADE, do not give up. The plan's words: "never degrade to
        // 'no backup'". Until here this returned false and the capture vanished.
        // The localStorage copy is shallower (BH_FALLBACK_MAX entries, no
        // data:image) but it is a backup, and gcIdb reads its references back
        // through bhLsBackupStates so its blobs are not taken for orphans.
        const at0=new Date().toISOString();
        const degraded={at:at0,reason,sig:bhSig(state),counts:bhCounts(state),state};
        const wrote=bhFallbackSave(degraded);
        bhEmergencySave(degraded);
        return wrote;
      }
      const sig=bhSig(state);
      const list=_bhMeta;
      if(reason==='daily'){
        // Weekly-slot dedup: compare against the slot this capture would replace
        // (same weekday). Comparing against list[0] would wrongly skip today's
        // slot whenever nothing changed since the last auto snapshot.
        const wd=new Date().getDay();
        const sameSlot=list.find(e=>e.reason==='daily'&&new Date(e.at).getDay()===wd);
        if(sameSlot&&sameSlot.sig===sig&&sameSlot.at.slice(0,10)===localDateISO())return false;
      }else{
        if(list[0]&&list[0].sig===sig)return false; // identical to latest — skip
      }
      // `at` is the store's primary key. Two captures in the same millisecond
      // would silently overwrite one another; push 1ms until it is unique.
      let at=new Date().toISOString();
      while(list.some(e=>e.at===at))at=new Date(new Date(at).getTime()+1).toISOString();
      const counts=bhCounts(state);
      const entry={at,reason,sig,counts,state};
      const kept=bhRetention([{at,reason,sig,counts},...list]);
      const keptAts=new Set(kept.map(e=>e.at));
      if(!keptAts.has(at))return false; // retention discarded the newborn itself
      const dels=list.filter(e=>!keptAts.has(e.at)).map(e=>e.at);
      try{await bhIdbWrite([entry],dels);}
      catch(e){
        // The IDB quota is ~2.8GB on this origin, but it is derived from free
        // disk and can run out. Last resort: the same entry without the embedded
        // data:image — which preserves idb://, otherwise the backup would lose
        // precisely the references gcIdb uses (v23.3).
        try{
          const lean={...entry,state:(typeof stripInlineImages==='function'?stripInlineImages(state):state)};
          await bhIdbWrite([lean],dels);
        }catch{return false;}
      }
      _bhMeta=kept;
      bhMarkCaptured(at);
      // F1.1 — mirror the newest snapshot into the single localStorage slot.
      // If this database is corrupted or wiped tomorrow, that copy is what is
      // left on the device. It never throws, so it cannot break this path.
      bhEmergencySave(entry);
      return true;
    }catch{return false;}
  };
  const p=_bhChain.then(run,run);
  _bhChain=p.then(()=>{},()=>{});
  return p;
};
// One-time migration: fold the old two-slot backups into the history, oldest first,
// so nothing that exists today is lost by the upgrade.
//
// F1: it still writes to the LEGACY localStorage KEY, on purpose. This block is
// synchronous and runs while the bundle is being parsed, before any IndexedDB is
// open; bhMigrateLegacy carries it from here into the IDB right afterwards, with
// verification. Two migrations in series, each of them simple, instead of one
// asynchronous migration that would have to reimplement reading the two-slot
// format.
(()=>{
  try{
    const oldKeys=['boardhub_daily_backup','boardhub_backup_pre_sync'];
    const olds=[];
    oldKeys.forEach(k=>{
      const r=localStorage.getItem(k);
      if(!r)return;
      try{const p=JSON.parse(r);if(p&&p._snapAt)olds.push({key:k,at:p._snapAt,data:p});}catch{/*silent-ok: an unparseable legacy slot is skipped, and the key is left alone rather than destroyed*/}
    });
    if(!olds.length)return; // nothing legacy: do not touch the key, not even to rewrite it
    const readLegacy=()=>{try{const r=localStorage.getItem(BH_HISTORY_KEY);const a=r?JSON.parse(r):[];return Array.isArray(a)?a:[];}catch{return [];}};
    olds.sort((a,b)=>a.at<b.at?-1:1);
    olds.forEach(o=>{
      const{_snapAt,...data}=o.data;
      if(!bhStateHasData(data))return;
      const sig=bhSig(data);
      let list=readLegacy();
      if(list.some(e=>e.sig===sig))return;
      list=bhRetention([{at:o.at,reason:o.key==='boardhub_daily_backup'?'daily':'pre-sync',sig,counts:bhCounts(data),state:data},...list]
        .sort((a,b)=>a.at<b.at?1:-1));
      try{localStorage.setItem(BH_HISTORY_KEY,JSON.stringify(list));if(list[0]&&list[0].at)bhMarkCaptured(list[0].at);}catch(e){bhLog('migrate.twoSlot',e,'a legacy two-slot backup was not folded into the history and is about to have its key removed');}
    });
    oldKeys.forEach(k=>localStorage.removeItem(k));
    localStorage.removeItem('boardhub_daily_backup_date');
  }catch(e){bhLog('migrate.twoSlot.outer',e,'the legacy two-slot backups may not have been folded into the history');}
})();

// Icon: renders lucide icons as pure React SVGs with one-time caching per icon name.
// Two strategies: (1) read directly from lucide.icons registry (fast, no DOM)
// (2) fallback: temporarily inject into document, let createIcons process, extract SVG.
const _svgCache={};
const _resolveIcon=(name)=>{
  if(_svgCache[name])return;
  // Strategy 1: lucide.icons registry — each entry is [tag, defaultAttrs, children]
  try{
    const pascal=name.replace(/(^|-)([a-z0-9])/g,(_,__,c)=>c.toUpperCase());
    const def=(lucide.icons||{})[pascal];
    if(def&&Array.isArray(def)&&def.length>=3&&Array.isArray(def[2])){
      _svgCache[name]=def[2].map(([tag,attrs])=>{
        const a=Object.entries(attrs||{}).map(([k,v])=>k+'="'+v+'"').join(' ');
        return '<'+tag+' '+a+'/>';
      }).join('');
      return;
    }
  }catch(e){/*silent-ok: reading Lucide's internal shape is opportunistic — it falls through to the DOM probe below*/}
  // Strategy 2: DOM fallback — append to body so createIcons can find it
  try{
    const tmp=document.createElement('div');
    tmp.style.cssText='position:fixed;left:-9999px;top:-9999px;pointer-events:none;opacity:0';
    tmp.innerHTML='<i data-lucide="'+name+'"></i>';
    document.body.appendChild(tmp);
    lucide.createIcons({nodes:[tmp]});
    const svg=tmp.querySelector('svg');
    if(svg)_svgCache[name]=svg.innerHTML;
    tmp.remove();
  }catch(e){/*silent-ok: last resort for resolving an icon; a miss renders no glyph and nothing else breaks*/}
};
// M4-typography: the icon STROKE.
// Lucide draws with strokeWidth 2 on a grid of 24 — a thick proportion, which is
// what makes an icon read as "modern app" even next to a 17th-century serif.
// Engraving has a THIN stroke: the line exists to delimit, not to weigh. 1.25 is
// the point where the stroke still survives at 12px without vanishing and has
// already stopped competing with the text.
// Swapping the icon FAMILY would cost a new CDN dependency (protocol #7);
// changing the stroke costs one line and closes most of the distance.
// The stroke scales with size: a 32px icon with the same stroke as a 12px one
// looks anaemic, so it grows a little along with it.
// - M4: NOTATION MOTIFS -
// Stave and rest, drawn by hand in SVG — no music font and no new library
// (protocol #7). They are two simple geometric shapes; importing a whole score
// font to draw five lines and a rectangle would be expensive and unnecessary.
//
// WHY THE REST IN THE EMPTY STATE: a rest is the notation of SILENCE. "There is
// nothing here" is exactly what it means on a score — it is not an ornament
// applied on top, it is the right word. The semibreve rest is a rectangle
// HANGING from the fourth line; the minim rest SITS on the third. I use the
// minim: sitting reads better in isolation, without the bar around it to give
// context.
const StaveRest=({size=48,style={}})=>{
  const w=size, h=size*0.58, gap=h/6;
  const linhas=[0,1,2,3,4].map(i=>gap+i*gap);
  const meio=linhas[2];
  return React.createElement('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`,fill:'none',style:{display:'block',...style},'aria-hidden':'true'},
    React.createElement('g',{stroke:'currentColor',strokeWidth:0.75,opacity:.45},
      ...linhas.map((y,i)=>React.createElement('line',{key:i,x1:0,y1:y,x2:w,y2:y}))),
    // the rest: a block sitting ON the middle line, one space wide
    React.createElement('rect',{x:w/2-gap*0.9,y:meio-gap*0.62,width:gap*1.8,height:gap*0.62,fill:'currentColor',opacity:.75})
  );
};
const ICON_STROKE=1.25;
const Icon=({name,size=16,style={},strokeWidth}) =>{
  _resolveIcon(name);
  const sw=strokeWidth!=null?strokeWidth:(size>=28?ICON_STROKE*1.2:ICON_STROKE);
  return React.createElement('svg',{xmlns:'http://www.w3.org/2000/svg',width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:sw,strokeLinecap:'round',strokeLinejoin:'round',style:{display:'inline-block',flexShrink:0,...style},dangerouslySetInnerHTML:{__html:_svgCache[name]||''}});

// v23.7 P3: this used to be <div><span class=label>. A <label> wrapping the
// control creates HTML's IMPLICIT association — clicking the label focuses the
// field and screen readers announce the name — without having to invent
// id/htmlFor for 57 inputs. Checked beforehand: none of the 23 <Field> has a
// <button> inside nor more than one control, so there is no double-activation
// risk.
// M4.2 — `.label` carries the shared typography; `label-field` vs `label-section`
// says WHICH KIND of label it is. The two were one class, so the bar-line motif
// M4 still owes would have landed on all 23 form inputs as well as the section
// headings. Neither marker declares anything today: this is a seam, not a
// restyle, and the computed style of every label is unchanged by construction.
const Field=({label,children})=><label style={{display:'flex',flexDirection:'column',gap:6}}><span className="label label-field">{label}</span>{children}</label>;

// v23.7 P3: a <div onClick> is neither reachable by Tab nor activatable by Enter.
// Converting these cards to <button> does not work: they have buttons inside
// (delete, drag handle), and a <button> inside a <button> is invalid HTML — the
// parser unwinds the nesting and the layout breaks. role+tabIndex+onKeyDown gives
// the same keyboard behaviour without touching the tree. Each card's onClick
// stays where it is; this only adds the keyboard path.
const keyActivate=(onActivate,label,enabled=true)=>enabled?{
  role:'button',tabIndex:0,'aria-label':label,
  onKeyDown:e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    // An Enter/Space fired by a control FROM INSIDE the card belongs to that
    // control, not to the card: without this guard, keying the delete button
    // would open the card as well.
    if(e.target!==e.currentTarget&&e.target.closest&&e.target.closest('button,a,input,select,textarea'))return;
    e.preventDefault();onActivate(e);
  }}:null;

// - RESPONSIVE HOOK -
// isMobileUA: true if the browser is on a phone/tablet, regardless of viewport.
// This is the reliable ground-truth when served over HTTPS (e.g. GitHub Pages),
// where some Android browsers report a larger layout viewport on first paint.
const isMobileUA=()=>/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent);

const useIsMobile=(breakpoint=768)=>{
  const detect=()=>{
    // UA check wins: if it's a real mobile device, always use mobile layout.
    if(isMobileUA())return true;
    try{
      const mq=window.matchMedia(`(max-width:${breakpoint}px)`);
      return mq.matches || window.innerWidth<=breakpoint;
    }catch{return window.innerWidth<=breakpoint;}
  };
  const [autoMobile,setAutoMobile]=useState(detect);
  useEffect(()=>{
    // Re-run once DOM is fully painted to catch late viewport settling
    setAutoMobile(detect());
    const mq=window.matchMedia(`(max-width:${breakpoint}px)`);
    // UA won't change at runtime, so only listen for resize (desktop responsive testing)
    const handler=()=>{ if(!isMobileUA()) setAutoMobile(detect()); };
    mq.addEventListener('change',handler);
    return()=>{ mq.removeEventListener('change',handler); };
  },[breakpoint]);
  return autoMobile;
};

// - INDEXEDDB IMAGE STORE (unlimited local storage) -
// Images are stored as Blobs in IndexedDB (no 5 MB quota like localStorage).
// The app state only holds a lightweight reference: "idb://<key>".
// At render time, useIdbUrl() resolves these references to object URLs.
const IDB_NAME='boardhub_images';
const IDB_STORE='images';
let _idb=null;
let _idbPending=null;

// FIX 1: Reset the cached IDB connection whenever it closes unexpectedly.
const _resetIdb=()=>{ _idb=null; _idbPending=null; };

const openIdb=()=>{
  // If we have a valid open connection, reuse it
  if(_idb && _idb.objectStoreNames){
    try{ _idb.transaction(IDB_STORE,'readonly').abort(); return Promise.resolve(_idb); }
    catch{ _idb=null; /* connection was stale - fall through to re-open */ }
  }
  // Coalesce concurrent open requests
  if(_idbPending)return _idbPending;
  _idbPending=new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess=e=>{
      _idb=e.target.result;
      _idbPending=null;
      _idb.onclose=_resetIdb;
      _idb.onerror=()=>_resetIdb();
      _idb.onversionchange=()=>{ _idb.close(); _resetIdb(); };
      res(_idb);
    };
    req.onerror=e=>{ _resetIdb(); rej(e.target.error); };
  });
  return _idbPending;
};

const idbPut=(key,blob)=>openIdb().then(db=>new Promise((res,rej)=>{
  try{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(blob,key);
    tx.oncomplete=()=>res();
    tx.onerror=e=>{ _resetIdb(); rej(e.target.error); };
  }catch(e){ _resetIdb(); rej(e); }
}));

const idbGet=(key)=>openIdb().then(db=>new Promise((res,rej)=>{
  try{
    const req=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>{ _resetIdb(); rej(e.target.error); };
  }catch(e){ _resetIdb(); rej(e); }
}));

// Hook: given an image src (may be idb://key, https://, or data:), returns a displayable URL.
// Checks _objUrlCache synchronously so prefetched images render with zero flash.
const _objUrlCache={};
// In-flight deduplication: if two components request the same key simultaneously,
// they share one IDB transaction instead of each opening their own.
const _inflightFetch={};

// ── BATCHED IDB READS ───────────────────────────────────────────────
// Every idbGet() opened its OWN transaction. Painting a grid of 40 images meant
// 40 transactions, each with its own commit round-trip on the IDB thread — they
// queue behind each other, so the last cell waited for 39 commits. Reads issued
// in the same tick are now coalesced into ONE readonly transaction with N get()s
// (React commits every visible cell's effect in the same tick, so a whole screen
// of images becomes a single transaction).
const _readQ=[];
let _readScheduled=false;
const _flushReads=()=>{
  _readScheduled=false;
  const batch=_readQ.splice(0,_readQ.length);
  if(!batch.length)return;
  const fail=()=>{_resetIdb();batch.forEach(i=>i.res(undefined));};
  openIdb().then(db=>{
    try{
      const tx=db.transaction(IDB_STORE,'readonly');
      const store=tx.objectStore(IDB_STORE);
      batch.forEach(item=>{
        try{
          const r=store.get(item.key);
          r.onsuccess=e=>item.res(e.target.result);
          r.onerror=()=>item.res(undefined);
        }catch{item.res(undefined);}
      });
      tx.onerror=fail;tx.onabort=fail;
    }catch{fail();}
  }).catch(fail);
};
// Same contract as idbGet, but coalesced. Used by every render-path read.
const idbGetBatched=key=>new Promise(res=>{
  _readQ.push({key,res});
  if(!_readScheduled){_readScheduled=true;Promise.resolve().then(_flushReads);}
});

// ── THUMBNAIL CACHE — THE HOT PATH ─────────────────────────────────────
// Grid/cover surfaces NEVER display an original, so thumbnails — not full-res
// blobs — are what stays resident. A 480px WebP is ~20-50KB: hundreds of them
// cost a few MB, versus hundreds of MB for the equivalent in originals, and each
// one decodes ~8× cheaper than the 1400px source it came from.
const THUMB_MAX=480;       // longest side, px — ample for any grid cell under object-fit:cover
const THUMB_CAP=600;       // resident thumbnails (~15-25MB worst case)
const _thumbCache={};      // idb key -> object URL for the thumbnail
const _thumbInflight={};   // idb key -> Promise (dedupes read/generation)
const _thumbOrder=[];      // keys, least-recently-shown first
const _touchThumb=key=>{
  const i=_thumbOrder.indexOf(key);
  if(i>=0)_thumbOrder.splice(i,1);
  _thumbOrder.push(key);
  while(_thumbOrder.length>THUMB_CAP){
    const old=_thumbOrder.shift();
    if(old!==key&&_thumbCache[old]){URL.revokeObjectURL(_thumbCache[old]);delete _thumbCache[old];}
  }
};

// ── FULL-RES OBJECT-URL CACHE ───────────────────────────────────────
// Originals are now LIGHTBOX-ONLY, so this cache holds a handful of entries
// instead of 100. Nothing on a grid pins a full-res blob anymore.
const OBJURL_CAP=12;
const _objUrlOrder=[]; // keys, least-recently-used first
const _touchObjUrl=key=>{
  const i=_objUrlOrder.indexOf(key);
  if(i>=0)_objUrlOrder.splice(i,1);
  _objUrlOrder.push(key);
  while(_objUrlOrder.length>OBJURL_CAP){
    const old=_objUrlOrder.shift();
    if(old!==key&&_objUrlCache[old]){URL.revokeObjectURL(_objUrlCache[old]);delete _objUrlCache[old];}
  }
};
// Read one idb:// blob at full resolution (deduped via _inflightFetch).
const _warmFull=key=>{
  if(_objUrlCache[key]){_touchObjUrl(key);return Promise.resolve(_objUrlCache[key]);}
  if(_inflightFetch[key])return _inflightFetch[key];
  _inflightFetch[key]=idbGetBatched(key).then(blob=>{
    if(blob&&!_objUrlCache[key]){_objUrlCache[key]=URL.createObjectURL(blob);_touchObjUrl(key);}
    delete _inflightFetch[key];return _objUrlCache[key]||'';
  }).catch(()=>{delete _inflightFetch[key];return '';});
  return _inflightFetch[key];
};
const _idleCb=cb=>((typeof window!=='undefined'&&window.requestIdleCallback)||(f=>setTimeout(()=>f({timeRemaining:()=>0}),200)))(cb);

// ── THUMBNAIL GENERATION THROTTLE ────────────────────────────────────
// Reading a thumbnail is cheap; GENERATING one (decode + downscale + encode) is
// not. Uncapped, a screen of 40 cold cells fired 40 concurrent decodes and the
// tab locked up. Generation is capped at 3 in flight — reads stay unthrottled.
const _genQ=[];let _genActive=0;const GEN_MAX=3;
const _genPump=()=>{
  while(_genActive<GEN_MAX&&_genQ.length){
    const job=_genQ.shift();_genActive++;
    job().then(()=>{_genActive--;_genPump();},()=>{_genActive--;_genPump();});
  }
};
const _enqueueGen=job=>new Promise(res=>{_genQ.push(()=>job().then(res,()=>res('')));_genPump();});

// On-open warm: pull an opened card's THUMBNAILS into memory right away, so its
// grid renders from cache instead of hitting IDB cell by cell. All the reads in
// one prefix collapse into a single transaction via idbGetBatched.
const WARM_PREFIX=80;
const warmKeys=(srcs,limit=WARM_PREFIX)=>{
  if(!Array.isArray(srcs))return;
  const keys=[];
  for(const s of srcs){
    if(typeof s==='string'&&s.startsWith('idb://')){
      const k=s.slice(6);
      if(!_thumbCache[k]){keys.push(k);if(keys.length>=limit)break;}
    }
  }
  keys.forEach(k=>{try{getThumbUrl(k);}catch{/*silent-ok: warming is best-effort; a miss just means the cell decodes on first paint*/}});
};

// Boot warm: fill the thumbnail cache during idle so navigating to a post finds
// its images ALREADY in memory — the resolver then returns a URL synchronously
// on the first render (no placeholder frame, no fade). That "already there"
// property is what made the old build feel instant; it now costs thumbnails
// instead of originals. Second pass generates any thumbnail that doesn't exist
// yet (images uploaded before generation moved to upload time), throttled and
// bounded so an old library migrates in the background without janking.
const MIGRATE_CAP=150;
const warmThumbCache=()=>{
  if(!persisted)return;
  const keys=[];const seen=new Set();
  const collect=o=>{
    if(Array.isArray(o))o.forEach(collect);
    else if(o&&typeof o==='object')Object.values(o).forEach(collect);
    else if(typeof o==='string'&&o.startsWith('idb://')){const k=o.slice(6);if(!seen.has(k)){seen.add(k);keys.push(k);}}
  };
  collect(persisted);
  if(!keys.length)return;
  const missing=[];
  let i=0;
  const readStep=()=>{
    if(i>=keys.length||_thumbOrder.length>=THUMB_CAP){_idleCb(()=>genStep(0));return;}
    const slice=keys.slice(i,i+40);i+=40;
    Promise.all(slice.map(k=>{
      if(_thumbCache[k])return null;
      return idbGetBatched('thumb_'+k).then(tb=>{
        if(tb){if(!_thumbCache[k]){_thumbCache[k]=URL.createObjectURL(tb);_touchThumb(k);}}
        else missing.push(k);
      }).catch(()=>{});
    })).then(()=>_idleCb(readStep));
  };
  const genStep=j=>{
    if(j>=missing.length||j>=MIGRATE_CAP)return;
    Promise.all(missing.slice(j,j+3).map(k=>{try{return getThumbUrl(k,true);}catch{return null;}}))
      .then(()=>_idleCb(()=>genStep(j+3)));
  };
  _idleCb(readStep);
};

// --- THUMBNAIL LAYER ---------------------------------------------------------
// Grid/cover surfaces display a downscaled variant instead of the full image:
//   • cloud images (https) use a smaller variant by URL — no fetch of the 1400px original
//   • local idb:// images (offline fallback) get a canvas-generated 480px thumbnail,
//     persisted under "thumb_<key>" so it's generated only once. Local-only render
//     cache — never synced/exported (state only ever references the original idb://<key>).
// Full-resolution is still used wherever <Img full/> or <BgImg full/> is requested.
// Smaller variant of a cloud URL for grid display, with the original kept as onError fallback.
const _httpThumb=url=>{
  // Imgur direct link: i.imgur.com/<id>.<ext> -> <id>l.<ext> (640px thumbnail)
  const im=/^(https?:\/\/i\.imgur\.com\/)([A-Za-z0-9]{5,})(\.[A-Za-z0-9]+)(\?.*)?$/.exec(url);
  if(im)return `${im[1]}${im[2]}l${im[3]}${im[4]||''}`;
  // Unsplash: clamp the requested width (and quality) down for grid display
  if(/^https?:\/\/images\.unsplash\.com\//.test(url)&&/[?&]w=\d+/.test(url))
    return url.replace(/([?&]w=)\d+/,'$1640').replace(/([?&]q=)\d+/,'$170');
  return url;
};
// Preload a URL off-DOM; resolves with the URL once decoded (for progressive swaps).
const _preload=u=>new Promise(res=>{const im=new Image();im.onload=()=>res(u);im.onerror=()=>res('');im.src=u;});
const _makeThumbBlob=async blob=>{
  // Fast path: createImageBitmap decodes AND downscales off the main thread —
  // dramatically cheaper than new Image()+canvas for large source photos, which
  // is what made cold thumbnails feel slow on big posts.
  if(typeof createImageBitmap==='function'){
    try{
      // ONE decode. The previous version decoded twice (a probe for dimensions,
      // then a second resizing decode); a high-quality canvas downscale of the
      // already-decoded bitmap gets the same result for half the work.
      const bmp=await createImageBitmap(blob);
      const pw=bmp.width,ph=bmp.height;
      if(Math.max(pw,ph)<=THUMB_MAX){if(bmp.close)bmp.close();return blob;}
      const r=THUMB_MAX/Math.max(pw,ph),w=Math.round(pw*r),h=Math.round(ph*r);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const cx=c.getContext('2d');
      cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
      cx.drawImage(bmp,0,0,w,h);
      if(bmp.close)bmp.close();
      const out=await new Promise(res=>c.toBlob(b=>res(b||blob),'image/webp',0.72));
      return out;
    }catch{/*silent-ok: fall through to the classic path*/}
  }
  // Fallback: classic Image + canvas (older engines / decode failures).
  return await new Promise(res=>{
    try{
      const img=new Image();const u=URL.createObjectURL(blob);
      img.onload=()=>{
        URL.revokeObjectURL(u);
        let{width:w,height:h}=img;
        if(Math.max(w,h)<=THUMB_MAX){res(blob);return;}
        const r=THUMB_MAX/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(b=>res(b||blob),'image/webp',0.72);
      };
      img.onerror=()=>{URL.revokeObjectURL(u);res(blob);};
      img.src=u;
    }catch{res(blob);}
  });
};
// Resolve a thumbnail object URL for an idb key. Reads the persisted thumbnail
// (batched, cheap); only a genuine miss pays generation, and generation is
// throttled so a screenful of cold cells can't stall the main thread.
const getThumbUrl=(key,knownMissing)=>{
  if(_thumbCache[key]){_touchThumb(key);return Promise.resolve(_thumbCache[key]);}
  if(_thumbInflight[key])return _thumbInflight[key];
  _thumbInflight[key]=(async()=>{
    try{
      const tb=knownMissing?null:await idbGetBatched('thumb_'+key);
      if(tb){
        if(!_thumbCache[key]){_thumbCache[key]=URL.createObjectURL(tb);}
        _touchThumb(key);delete _thumbInflight[key];return _thumbCache[key];
      }
      const u=await _enqueueGen(async()=>{
        if(_thumbCache[key]){_touchThumb(key);return _thumbCache[key];}
        const full=await idbGetBatched(key);
        if(!full)return '';
        // A video has no meaningful thumbnail here; generating one would store
        // the entire video under thumb_<key>. Serve the original instead.
        if(/^video\//i.test(full.type||'')){
          if(!_objUrlCache[key]){_objUrlCache[key]=URL.createObjectURL(full);_touchObjUrl(key);}
          return _objUrlCache[key];
        }
        const nb=await _makeThumbBlob(full);
        try{await idbPut('thumb_'+key,nb);}catch{/*silent-ok: render cache only — a missed thumbnail is regenerated on demand, and quota here must not fail the caller*/}
        if(!_thumbCache[key])_thumbCache[key]=URL.createObjectURL(nb);
        _touchThumb(key);return _thumbCache[key]||'';
      });
      delete _thumbInflight[key];
      return u;
    }catch{delete _thumbInflight[key];return '';}
  })();
  return _thumbInflight[key];
};

// Synchronous cache probe — no IDB, no promises. When it hits, the <img> gets
// its src in the SAME render it mounts: no placeholder frame, no fade-in, no
// second paint. This is the whole trick behind "instant".
const _syncUrl=(src,thumb)=>{
  if(!src||typeof src!=='string')return '';
  if(/^https?:\/\//.test(src))return _httpThumb(src);
  if(!src.startsWith('idb://'))return src;
  const key=src.slice(6);
  return thumb?(_thumbCache[key]||''):(_objUrlCache[key]||_thumbCache[key]||'');
};

// Unified resolver for idb://, https://, or data: sources. With thumb=true it prefers
// the downscaled variant for grid/cover display. Checks caches synchronously so
// prefetched images render with zero flash.
// v23.3: returns [url, missing]. `missing` only becomes true once resolving an
// idb:// has FINISHED and found no blob at all — that is what distinguishes
// "still loading" (a mute grey rectangle) from "this device does not have that
// file" (a placeholder explaining it). Without that signal there is no re-render:
// resolving to '' calls setState with the same value and React drops the update.
const useDisplayUrlState=(src,thumb)=>{
  const sync=_syncUrl(src,thumb);
  const [state,setState]=React.useState(sync);
  const [missing,setMissing]=React.useState(false);
  React.useEffect(()=>{
    setMissing(false);
    if(!src||typeof src!=='string'){setState(src||'');return;}
    let cancelled=false;
    // ── cloud / data ──
    if(!src.startsWith('idb://')){
      if(/^https?:\/\//.test(src)){
        const light=_httpThumb(src);
        setState(light);
        // Full mode: upgrade to the original once decoded, when a lighter
        // variant exists (Imgur/Unsplash). Firebase URLs have no variant.
        if(!thumb&&light!==src)_preload(src).then(u=>{if(!cancelled&&u)setState(u);});
      }else setState(src);
      return()=>{cancelled=true;};
    }
    // ── local idb:// ──
    const key=src.slice(6);
    if(thumb){
      // GRID: thumbnail ONLY. One small read, one small decode, one paint.
      // The previous build read the ORIGINAL here too, painted it, then swapped
      // to the thumbnail — two reads, two decodes (one of them a 1400px source
      // into a ~200px cell) and two paints per visible image. That double work,
      // multiplied by a screenful, is what made this slower than the build
      // before it. Nothing on a grid touches an original anymore.
      if(_thumbCache[key]){_touchThumb(key);setState(_thumbCache[key]);return()=>{cancelled=true;};}
      getThumbUrl(key).then(u=>{if(cancelled)return;if(u)setState(u);else setMissing(true);});
      return()=>{cancelled=true;};
    }
    // FULL (lightbox/hero): show the thumbnail instantly if it's around, then
    // swap in the original. One image at a time, so the read is never contended.
    if(_objUrlCache[key]){_touchObjUrl(key);setState(_objUrlCache[key]);return()=>{cancelled=true;};}
    const hadThumb=!!_thumbCache[key];
    if(hadThumb){_touchThumb(key);setState(_thumbCache[key]);}
    _warmFull(key).then(u=>{if(cancelled)return;if(u)setState(u);else if(!hadThumb)setMissing(true);});
    return()=>{cancelled=true;};
  },[src,thumb]);
  // A synchronous cache hit wins over stale state (e.g. the viewport gate just
  // flipped and the effect hasn't run yet) — that's the frame we're saving.
  const url=state||sync;
  return [url,missing&&!url];
};
const useDisplayUrl=(src,thumb)=>useDisplayUrlState(src,thumb)[0];
// Back-compat full-res resolver (used by Vid and any direct callers).
const useIdbUrl=src=>useDisplayUrl(src,false);

// v23.3 P1-2: a positional key in an image list makes React reuse the wrong
// element when the list is reordered or loses an item — the image "jumps" to
// another cell and is re-decoded for nothing. With the entry reorder added in
// v23 this became triggerable in practice. The src is unique within a post, so
// the src IS the identity. The index only comes in as a tiebreaker when the SAME
// src appears twice; in that case the two elements are visually identical and
// reusing "the wrong one" produces no visible swap.
// The indexOf makes this O(n²) per list. On grids of a few dozen images that is
// noise, and it avoids rewriting every grid to precompute the keys.
const imgKey=(src,i,list)=>{const s=String(src);return list.indexOf(src)===i?s:s+'#'+i;};

// Placeholder for a local reference whose blob does not exist ON THIS DEVICE.
// The reference survives the sync (v23.3 P0-1); the blob does not travel. Saying
// so explicitly stops a grey rectangle from being read as a corrupted image.
const LOCAL_IMG_MISSING='Imagem local: o arquivo está em outro dispositivo. Abra o BoardHub nele para vê-la aqui — a referência foi preservada.';
const MissingLocalImg=()=><Icon name="image-off" size={16} style={{width:'55%',height:'55%',maxWidth:22,maxHeight:22,color:'var(--muted)',opacity:.5}}/>;

// Viewport gate for lazily reading LOCAL (idb://) images. Returns [refCallback,
// inView]. Reading a blob from IDB + generating its thumbnail is the expensive
// part of showing a local image, so we defer it until the element is within
// ~400px of the viewport (≈2-3 rows ahead). The first rows of a freshly opened
// card are on-screen immediately, so they resolve at once; rows further down
// wait until scrolled near (600px ≈ 3-4 rows of lookahead — affordable now that
// a row costs one batched thumbnail read). When gating is disabled (cloud/data images, priority
// images, or no IntersectionObserver) inView is true from the start.
const useInView=(enabled)=>{
  const hasIO=typeof IntersectionObserver!=='undefined';
  const [inView,setInView]=React.useState(!enabled||!hasIO);
  const obsRef=React.useRef(null);
  const setRef=React.useCallback(node=>{
    if(obsRef.current){obsRef.current.disconnect();obsRef.current=null;}
    if(inView||!enabled||!hasIO||!node)return;
    obsRef.current=new IntersectionObserver(entries=>{
      if(entries.some(e=>e.isIntersecting)){setInView(true);if(obsRef.current){obsRef.current.disconnect();obsRef.current=null;}}
    },{rootMargin:'600px'});
    obsRef.current.observe(node);
  },[inView,enabled,hasIO]);
  React.useEffect(()=>()=>{if(obsRef.current)obsRef.current.disconnect();},[]);
  return [setRef,inView];
};

// Img: auto-resolves idb:// refs. Uses the thumbnail variant by default for grid/cover
// surfaces; pass `full` for lightbox/hero views that need the original resolution.
const Img=({src,priority,full,thumb=!full,...props})=>{
  // Gate the expensive reads/downloads behind the viewport: all local (idb://)
  // images, plus full-res cloud originals. Cloud thumbnails stay ungated (cheap +
  // browser loading=lazy). Priority (lightbox) always loads at once.
  const gate=!priority&&typeof src==='string'&&(src.startsWith('idb://')||(!thumb&&/^https?:\/\//.test(src)));
  const [setRef,inView]=useInView(gate);
  const local=typeof src==='string'&&src.startsWith('idb://');
  const [url,missing]=useDisplayUrlState(gate&&!inView?null:src,thumb);
  if(!url)return (
    <div ref={setRef}
      title={missing?LOCAL_IMG_MISSING:undefined}
      role={missing?'img':undefined} aria-label={missing?LOCAL_IMG_MISSING:undefined} aria-hidden={missing?undefined:true}
      style={{background:'var(--border)',borderRadius:'inherit',display:'flex',alignItems:'center',justifyContent:'center',...(props.style||{})}}>
      {missing?<MissingLocalImg/>:null}
    </div>);
  // If a cloud thumbnail variant 404s, fall back to the original URL once.
  const onErr=thumb&&typeof src==='string'&&/^https?:\/\//.test(src)&&src!==url
    ?e=>{if(e.currentTarget.src!==src)e.currentTarget.src=src;}:props.onError;
  // Local blobs are already gated by our own IntersectionObserver — loading="lazy"
  // on top of that is a second, browser-controlled delay on a resource that is
  // already in memory. And the 250ms fade only reads as latency when the image
  // was there all along, so it's kept for network images only.
  return <img {...props} ref={setRef} src={url} loading={priority||local?'eager':'lazy'} decoding="async" onError={onErr}
    style={local?props.style:{...props.style,animation:'imgFadeIn .25s ease'}}/>;
};

// BgImg: a <div> whose background-image auto-resolves idb:// refs (thumbnail by default).
const BgImg=({src,className,style,children,full,thumb=!full,...props})=>{
  const gate=typeof src==='string'&&(src.startsWith('idb://')||(!thumb&&/^https?:\/\//.test(src)));
  const [setRef,inView]=useInView(gate);
  const [url,missing]=useDisplayUrlState(gate&&!inView?null:src,thumb);
  // The badge goes in as a CHILD (no call site passes children) and carries the
  // title with it, so as not to overwrite a title coming from the caller's
  // {...props}.
  const show=missing&&!url;
  return <div ref={setRef} className={className}
    style={{background:url?'none':'var(--border)',backgroundSize:'cover',
      ...(show?{display:'flex',alignItems:'center',justifyContent:'center'}:null),
      ...style,backgroundImage:url?`url(${url})`:'none'}} {...props}>
    {show?<span title={LOCAL_IMG_MISSING} role="img" aria-label={LOCAL_IMG_MISSING}
      style={{display:'flex',alignItems:'center',justifyContent:'center',width:'100%',height:'100%'}}><MissingLocalImg/></span>:null}
    {children}
  </div>;
};

// Video detection helper — checks extension in any URL format (idb://, https://, data:)
const isVideoSrc=src=>{
  if(!src||typeof src!=='string')return false;
  return /\.(mp4|webm|mov|avi|mkv|m4v|ogv)(\?|$|#)/i.test(src);
};

// Vid component: auto-resolves idb:// references for video elements
const Vid=({src,...props})=>{
  const url=useIdbUrl(src);
  if(!url)return null;
  return <video src={url} {...props}/>;
};

// Firebase SDK (~400KB) is loaded AFTER first paint to avoid blocking render.
