                style={{fontWeight:700,fontSize:'.88rem',background:'transparent',border:'none',outline:'none',color:'var(--text)',borderBottom:'1px solid var(--border)',paddingBottom:6,marginBottom:4,width:'100%'}}/>
              <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:2}}>
                {(selectedItem.entries||[]).length===0&&<div style={{fontSize:'.78rem',color:'var(--muted)',padding:'8px 0'}}>Nenhuma entrada.</div>}
                {(selectedItem.entries||[]).map((e,i)=>(
                  <div key={e.id} className="drag-item" draggable
                    onDragStart={ev=>{ev.dataTransfer.effectAllowed='move';entryDragIdxRef.current=i;ev.currentTarget.style.opacity='0.4';}}
                    onDragEnd={ev=>{ev.currentTarget.style.opacity='1';entryDragIdxRef.current=null;document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));}}
                    onDragOver={ev=>{ev.preventDefault();ev.currentTarget.classList.add('drag-over');}}
                    onDragLeave={ev=>{ev.currentTarget.classList.remove('drag-over');}}
                    onDrop={ev=>{ev.preventDefault();ev.currentTarget.classList.remove('drag-over');if(entryDragIdxRef.current!=null&&entryDragIdxRef.current!==i){reorderEntries(entryDragIdxRef.current,i);entryDragIdxRef.current=null;}}}
                    onClick={()=>setActiveEntryId(e.id)}
                    style={{padding:'8px 10px',borderRadius:7,cursor:'pointer',border:`1px solid ${activeEntryId===e.id?'var(--text)':'transparent'}`,background:activeEntryId===e.id?'var(--surface)':'transparent',transition:'all .15s',display:'flex',alignItems:'center',gap:6}}
                    onMouseEnter={el=>{if(activeEntryId!==e.id)el.currentTarget.style.background='var(--surface)';}}
                    onMouseLeave={el=>{if(activeEntryId!==e.id)el.currentTarget.style.background='transparent';}}>
                    <span className="drag-handle" style={{color:'var(--muted)',flexShrink:0,lineHeight:0}}><Icon name="grip-vertical" size={10}/></span>
                    <span style={{fontSize:'.68rem',color:'var(--muted)',flexShrink:0,fontVariantNumeric:'tabular-nums'}}>{String(i+1).padStart(2,'0')}</span>
                    <span style={{fontSize:'.8rem',fontWeight:500,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.title}</span>
                  </div>
                ))}
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:6,paddingTop:8,borderTop:'1px solid var(--border)'}}>
                <button className="btn btn-dark" style={{width:'100%',justifyContent:'center',fontSize:'.78rem',padding:'6px 0'}} onClick={addEntry}><Icon name="plus" size={12}/> Adicionar</button>
                <button className="btn btn-ghost" style={{width:'100%',justifyContent:'center',fontSize:'.73rem',padding:'4px 0',color:'var(--muted)'}} onMouseEnter={e=>e.currentTarget.style.color='var(--danger-strong)'} onMouseLeave={e=>e.currentTarget.style.color='var(--muted)'} onClick={()=>trashItem(selectedItem.id)}><Icon name="trash-2" size={11}/> Excluir grupo</button>
              </div>
            </div>
            <div className="card" style={{flex:1,padding:28,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
              {activeEntry?(
                <>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,borderBottom:'1px solid var(--border)',paddingBottom:12,flexShrink:0}}>
                    <input value={entryTitle} onChange={handleEntryTitleChange} onBlur={handleEntryTitleBlur}
                      style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.8rem',fontWeight:400,background:'transparent',border:'none',outline:'none',color:'var(--text)',flex:1,minWidth:0}}/>
                    <div style={{display:'flex',gap:6,flexShrink:0,alignItems:'center'}}>
                      <span style={{fontSize:'.72rem',color:'var(--muted)'}}>{activeEntry.date}</span>
                      <button onClick={()=>deleteEntry(activeEntry.id)} className="btn btn-ghost" style={{padding:6,color:'var(--muted)'}} onMouseEnter={e=>e.currentTarget.style.color='var(--danger-strong)'} onMouseLeave={e=>e.currentTarget.style.color='var(--muted)'}><Icon name="trash-2" size={15}/></button>
                    </div>
                  </div>
                  <RichEditor key={activeEntry.id} noteId={activeEntry.id} initialHTML={activeEntry.content||''} onSave={handleEntrySave}/>
                </>
              ):(
                <div style={{margin:'auto',textAlign:'center',color:'var(--muted)'}}>
                  <Icon name="book-open" size={28} style={{display:'block',margin:'0 auto 10px',opacity:.3}}/>
                  <p style={{fontSize:'.85rem'}}>Selecione ou adicione uma entrada</p>
                </div>
              )}
            </div>
          </div>
        )}

        {/* Note editor */}
        {!showTrash&&selectedItem&&!selectedItem.deleted&&!isGroup&&(
          <div className="card" style={{flex:1,padding:28,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,borderBottom:'1px solid var(--border)',paddingBottom:12,flexShrink:0}}>
              <input value={localTitle} onChange={handleTitleChange} onBlur={handleTitleBlur}
                style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.8rem',fontWeight:400,background:'transparent',border:'none',outline:'none',color:'var(--text)',flex:1,minWidth:0}}/>
              <div style={{display:'flex',gap:6,flexShrink:0,alignItems:'center'}}>
                <span style={{fontSize:'.72rem',color:'var(--muted)'}}>{selectedItem.date}</span>
                <button onClick={()=>trashItem(selectedItem.id)} className="btn btn-ghost" style={{padding:6,color:'var(--muted)'}} onMouseEnter={e=>e.currentTarget.style.color='var(--danger-strong)'} onMouseLeave={e=>e.currentTarget.style.color='var(--muted)'}><Icon name="trash-2" size={16}/></button>
              </div>
            </div>
            <RichEditor key={selectedItem.id} noteId={selectedItem.id} initialHTML={selectedItem.content||''} onSave={handleContentSave}/>
          </div>
        )}

        {/* Empty state */}
        {!showTrash&&!selectedItem&&(
          <div className="card" style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10,color:'var(--muted)'}}>
            <Icon name="notebook-pen" size={32} style={{opacity:.3}}/>
            <p style={{fontSize:'.85rem'}}>Selecione ou crie uma anotação</p>
          </div>
        )}
      </div>
    </div>
  );

  // ── MOBILE ──
  const [mobileView,setMobileView]=useState('list');
  return(
    <div className="fade-up" style={{maxWidth:'100%',boxSizing:'border-box',paddingBottom:16,display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12,flexShrink:0}}>
        {mobileView!=='list'
          ?<button className="btn btn-ghost" style={{padding:'8px 12px',fontSize:'.88rem'}} onClick={()=>setMobileView('list')}><Icon name="arrow-left" size={16}/> Voltar</button>
          :<h1 className="serif" style={{fontSize:'1.6rem',fontWeight:300}}>Anotações</h1>
        }
        {mobileView==='list'&&!showTrash&&(
          <div style={{display:'flex',gap:6}}>
            <button onClick={()=>setShowTrash(t=>!t)} className={`btn ${showTrash?'btn-danger':'btn-outline'}`} style={{padding:'6px 10px',fontSize:'.8rem'}}><Icon name="trash-2" size={12}/>{trashed.length>0&&` (${trashed.length})`}</button>
            <div style={{position:'relative'}}>
              <button className="btn btn-dark" style={{padding:'6px 14px',fontSize:'.8rem'}} onClick={()=>setShowCreateMenu(m=>!m)}><Icon name="plus" size={13}/> Criar</button>
              {showCreateMenu&&(
                <div style={{position:'absolute',right:0,top:'calc(100% + 6px)',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:6,display:'flex',flexDirection:'column',gap:2,minWidth:130,boxShadow:'0 8px 24px rgba(0,0,0,.15)',zIndex:50}}>
                  <button onClick={()=>{newNote();setMobileView('detail');}} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 12px',borderRadius:7,border:'none',background:'transparent',cursor:'pointer',fontFamily:'Alegreya Sans,sans-serif',fontSize:'.85rem',fontWeight:500,color:'var(--text)'}}><Icon name="file-text" size={13}/> Nota</button>
                  <button onClick={()=>{newGroup();setMobileView('entries');}} style={{display:'flex',alignItems:'center',gap:8,padding:'9px 12px',borderRadius:7,border:'none',background:'transparent',cursor:'pointer',fontFamily:'Alegreya Sans,sans-serif',fontSize:'.85rem',fontWeight:500,color:'var(--text)'}}><Icon name="folder" size={13}/> Grupo</button>
                </div>
              )}
            </div>
          </div>
        )}
        {mobileView==='list'&&showTrash&&<button onClick={()=>setShowTrash(false)} className="btn btn-danger" style={{padding:'6px 14px',fontSize:'.8rem'}}>Sair</button>}
        {mobileView==='entries'&&<button className="btn btn-dark" style={{padding:'6px 14px',fontSize:'.8rem'}} onClick={()=>{addEntry();setMobileView('entry-detail');}}><Icon name="plus" size={13}/> Entrada</button>}
      </div>

      {mobileView==='list'&&!showTrash&&(
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {allItems.length===0&&<div style={{fontSize:'.85rem',color:'var(--muted)',padding:'16px 4px',textAlign:'center'}}>Nenhuma anotação ainda.</div>}
          {allItems.map(n=>(
            <div key={n.id} onClick={()=>{setSelectedId(n.id);if(n.type==='project'){setActiveEntryId((n.entries||[])[0]?.id||null);setMobileView('entries');}else setMobileView('detail');}}
              style={{padding:'14px 16px',borderRadius:10,cursor:'pointer',background:'var(--surface)',border:'1px solid var(--border)'}}>
              <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:3}}>
                <Icon name={n.type==='project'?'folder':'file-text'} size={13} style={{color:'var(--muted)',flexShrink:0}}/>
                <div style={{fontWeight:600,fontSize:'.88rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title}</div>
              </div>
              <div style={{fontSize:'.72rem',color:'var(--muted)',paddingLeft:20}}>{n.type==='project'?`${(n.entries||[]).length} entrada${(n.entries||[]).length!==1?'s':''}`:n.date}</div>
            </div>
          ))}
        </div>
      )}

      {mobileView==='list'&&showTrash&&(
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {trashed.length===0&&<div style={{textAlign:'center',padding:48,color:'var(--muted)',fontSize:'.85rem'}}>Lixeira vazia.</div>}
          {trashed.map(n=>(
            <div key={n.id} style={{padding:'12px 14px',borderRadius:10,background:'var(--surface)',border:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10}}>
              <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:'.85rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title}</div><div style={{fontSize:'.72rem',color:'var(--muted)'}}>{n.date}</div></div>
              <button onClick={()=>restoreItem(n.id)} className="btn btn-outline" style={{padding:'4px 10px',fontSize:'.73rem'}}><Icon name="undo-2" size={10}/></button>
              <button onClick={()=>hardDeleteItem(n.id)} className="btn btn-danger" style={{padding:'4px 8px',fontSize:'.73rem'}}><Icon name="trash-2" size={10}/></button>
            </div>
          ))}
        </div>
      )}

      {mobileView==='detail'&&selectedItem&&(
        <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexShrink:0}}>
            <input value={localTitle} onChange={handleTitleChange} onBlur={handleTitleBlur}
              style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.5rem',fontWeight:400,background:'transparent',border:'none',outline:'none',color:'var(--text)',flex:1,minWidth:0,borderBottom:'1px solid var(--border)',paddingBottom:6}}/>
            <button onClick={()=>{trashItem(selectedItem.id);setMobileView('list');}} className="btn btn-ghost" style={{padding:6,color:'var(--muted)',flexShrink:0}} onMouseEnter={e=>e.currentTarget.style.color='var(--danger-strong)'} onMouseLeave={e=>e.currentTarget.style.color='var(--muted)'}><Icon name="trash-2" size={16}/></button>
          </div>
          <RichEditor key={selectedItem.id} noteId={selectedItem.id} initialHTML={selectedItem.content||''} onSave={handleContentSave}/>
        </div>
      )}

      {mobileView==='entries'&&selectedItem&&isGroup&&(
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          <div style={{fontWeight:700,fontSize:'.9rem',marginBottom:4,paddingBottom:8,borderBottom:'1px solid var(--border)'}}>{selectedItem.title}</div>
          {(selectedItem.entries||[]).length===0&&<div style={{fontSize:'.85rem',color:'var(--muted)',padding:'12px 0'}}>Nenhuma entrada ainda.</div>}
          {(selectedItem.entries||[]).map((e,i)=>(
            <div key={e.id} style={{display:'flex',alignItems:'stretch',gap:6}}>
              <div onClick={()=>{setActiveEntryId(e.id);setMobileView('entry-detail');}}
                style={{flex:1,minWidth:0,padding:'12px 14px',borderRadius:10,cursor:'pointer',background:'var(--surface)',border:'1px solid var(--border)'}}>
                <div style={{fontWeight:600,fontSize:'.88rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.title}</div>
                <div style={{fontSize:'.72rem',color:'var(--muted)',marginTop:2}}>{e.date}</div>
              </div>
              <div style={{display:'flex',flexDirection:'column',flexShrink:0}}>
                <button onClick={()=>moveEntry(i,-1)} disabled={i===0} className="btn btn-ghost" style={{padding:'2px 8px',opacity:i===0?.3:1}} aria-label="Mover para cima"><Icon name="chevron-up" size={14}/></button>
                <button onClick={()=>moveEntry(i,1)} disabled={i===(selectedItem.entries||[]).length-1} className="btn btn-ghost" style={{padding:'2px 8px',opacity:i===(selectedItem.entries||[]).length-1?.3:1}} aria-label="Mover para baixo"><Icon name="chevron-down" size={14}/></button>
              </div>
            </div>
          ))}
        </div>
      )}

      {mobileView==='entry-detail'&&activeEntry&&(
        <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexShrink:0}}>
            <input value={entryTitle} onChange={handleEntryTitleChange} onBlur={handleEntryTitleBlur}
              style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.5rem',fontWeight:400,background:'transparent',border:'none',outline:'none',color:'var(--text)',flex:1,minWidth:0,borderBottom:'1px solid var(--border)',paddingBottom:6}}/>
            <button onClick={()=>{deleteEntry(activeEntry.id);setMobileView('entries');}} className="btn btn-ghost" style={{padding:6,color:'var(--muted)',flexShrink:0}} onMouseEnter={e=>e.currentTarget.style.color='var(--danger-strong)'} onMouseLeave={e=>e.currentTarget.style.color='var(--muted)'}><Icon name="trash-2" size={16}/></button>
          </div>
          <RichEditor key={activeEntry.id} noteId={activeEntry.id} initialHTML={activeEntry.content||''} onSave={handleEntrySave}/>
        </div>
      )}
    </div>
  );
});

// - SOCIAL -
const SOCIAL_PLATFORMS=['Instagram','LinkedIn','Twitter/X','TikTok','YouTube','Behance'];

const Social=React.memo(({posts,setPosts,isMobile})=>{
  const [text,setText]=useState('');
  const [platform,setPlatform]=useState('Instagram');
  const [editId,setEditId]=useState(null);
  const [trash,setTrash]=useState(false);
  const [templates,setTemplates]=useState(()=>{
    try{const s=localStorage.getItem('boardhub_social_templates');return s?JSON.parse(s):socialTemplates;}catch{return socialTemplates;}
  });
  const [editingTpl,setEditingTpl]=useState(null); // {index,label,text} or {index:-1,...} for new
  const saveTemplates=t=>{setTemplates(t);try{localStorage.setItem('boardhub_social_templates',JSON.stringify(t));}catch(e){bhLog('socialTemplates.save',e,'the edited templates stay only in memory for this session');}};

  const activePosts=posts.filter(p=>!p.deleted);
  const trashedPosts=posts.filter(p=>p.deleted);

  const savePost=()=>{
    if(!text.trim())return;
    if(editId){setPosts(p=>p.map(x=>x.id===editId?{...x,text,platform}:x));setEditId(null);}
    else setPosts(p=>[{id:Date.now(),text,date:new Date().toLocaleDateString('pt-BR'),platform,deleted:false},...p]);
    setText('');setPlatform('Instagram');
  };
  const startEdit=p=>{setText(p.text);setPlatform(p.platform||'Instagram');setEditId(p.id);setTrash(false);};
  const cancelEdit=()=>{setText('');setEditId(null);setPlatform('Instagram');};
  const softDelete=id=>setPosts(p=>p.map(x=>x.id===id?{...x,deleted:true,deletedAt:new Date().toISOString()}:x));
  const restore=id=>setPosts(p=>p.map(x=>x.id===id?{...x,deleted:false,deletedAt:null}:x));
  const hardDelete=async id=>{if(await bhConfirm({message:'Excluir permanentemente?',danger:true,confirmLabel:'Excluir'})){setPosts(p=>p.filter(x=>x.id!==id));}};
  const changePostPlatform=(id,pl)=>setPosts(p=>p.map(x=>x.id===id?{...x,platform:pl}:x));
  const displayed=trash?trashedPosts:activePosts;

  // Template modal
  const openNewTpl=()=>setEditingTpl({index:-1,label:'',text:''});
  const openEditTpl=(i)=>setEditingTpl({index:i,...templates[i]});
  const saveTpl=()=>{
    if(!editingTpl.label.trim())return;
    const next=[...templates];
    if(editingTpl.index===-1)next.push({label:editingTpl.label,text:editingTpl.text});
    else next[editingTpl.index]={label:editingTpl.label,text:editingTpl.text};
    saveTemplates(next);setEditingTpl(null);
  };
  const deleteTpl=i=>{const next=templates.filter((_,idx)=>idx!==i);saveTemplates(next);};

  const platformColor=pl=>({Instagram:'#833AB4',LinkedIn:'#0A66C2','Twitter/X':'#000000',TikTok:'#010101',YouTube:'#FF0000',Behance:'#053EFF'}[pl]||'var(--text)');

  return(
    <div className="fade-up" style={{width:'100%',maxWidth:'100%',boxSizing:'border-box',overflowX:'hidden',height:isMobile?'auto':'calc(100vh - clamp(32px,5vh,80px))',overflowY:isMobile?'visible':'auto'}}>
      {/* Template edit modal */}
      {editingTpl&&ReactDOM.createPortal(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setEditingTpl(null)}>
          <div className="modal" style={{maxWidth:480}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
              <h2 className="serif" style={{fontSize:'1.5rem',fontWeight:400,margin:0}}>{editingTpl.index===-1?'Novo Template':'Editar Template'}</h2>
              <button className="btn btn-ghost" onClick={()=>setEditingTpl(null)} style={{padding:6}}><Icon name="x" size={18}/></button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <Field label="Nome do template">
                <input className="input-box" value={editingTpl.label} onChange={e=>setEditingTpl(t=>({...t,label:e.target.value}))} placeholder="Ex: Bastidores"/>
              </Field>
              <Field label="Texto">
                <textarea className="input-box" rows={6} value={editingTpl.text} onChange={e=>setEditingTpl(t=>({...t,text:e.target.value}))} placeholder="Escreva o template..." style={{resize:'vertical',lineHeight:1.7}}/>
              </Field>
              <div style={{display:'flex',justifyContent:'flex-end',gap:8}}>
                <button className="btn btn-outline" onClick={()=>setEditingTpl(null)}>Cancelar</button>
                <button className="btn btn-dark" onClick={saveTpl} disabled={!editingTpl.label.trim()}><Icon name="check" size={14}/> Salvar</button>
              </div>
            </div>
          </div>
        </div>
      , document.body)}

      <div style={{display:'flex',justifyContent:'space-between',alignItems:isMobile?'center':'flex-end',marginBottom:isMobile?10:14,gap:10,flexWrap:'wrap'}}>
        <h1 className="serif" style={{fontSize:isMobile?'1.75rem':'clamp(1.6rem,2.8vh,2.6rem)',fontWeight:300,letterSpacing:'-0.02em'}}>Social Media</h1>
        <button onClick={()=>{setTrash(!trash);cancelEdit();}} className={`btn ${trash?'btn-danger':'btn-outline'}`}>
          <Icon name="trash-2" size={13}/>{trash?'Sair':'Lixeira'}{!trash&&trashedPosts.length>0&&` (${trashedPosts.length})`}
        </button>
      </div>
      {trash&&<TrashBanner label="Social Media" onExit={()=>setTrash(false)}/>}
      {!trash&&(
        <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 260px',gap:isMobile?16:20,marginBottom:isMobile?16:20,width:'100%',minWidth:0}}>
          {/* Composer */}
          <div className="card" style={{padding:isMobile?16:24,display:'flex',flexDirection:'column',boxSizing:'border-box',width:'100%',minWidth:0}}>
            {editId&&<div style={{fontSize:'.75rem',color:'var(--warn-fg)',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
              <Icon name="pencil" size={11}/> Editando post — <button onClick={cancelEdit} style={{background:'none',border:'none',cursor:'pointer',color:'var(--danger-strong)',fontFamily:'Alegreya Sans,sans-serif',fontSize:'.75rem',padding:0}}>cancelar</button>
            </div>}
            <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Escreva seu post..." style={{flex:1,minHeight:180,resize:'none',background:'transparent',border:'none',outline:'none',fontSize:'.95rem',fontFamily:'Alegreya Sans,sans-serif',lineHeight:1.8,color:'var(--text)',width:'100%',boxSizing:'border-box'}}/>
            <div style={{borderTop:'1px solid var(--border)',paddingTop:12,marginTop:8,display:'flex',flexDirection:'column',gap:10}}>
              {/* Platform selector */}
              {isMobile?(
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span className="label label-field" style={{flexShrink:0}}>Plataforma</span>
                  <select value={platform} onChange={e=>setPlatform(e.target.value)}
                    style={{flex:1,background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 10px',fontFamily:'Alegreya Sans,sans-serif',fontSize:'16px',color:'var(--text)',outline:'none',cursor:'pointer',minHeight:44}}>
                    {SOCIAL_PLATFORMS.map(pl=><option key={pl}>{pl}</option>)}
                  </select>
                </div>
              ):(
                <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',paddingBottom:0}}>
                  <span className="label label-field" style={{flexShrink:0}}>Plataforma</span>
                  {SOCIAL_PLATFORMS.map(pl=>(
                    <button key={pl} onClick={()=>setPlatform(pl)}
                      style={{padding:'5px 12px',borderRadius:20,border:`1px solid ${platform===pl?platformColor(pl):'var(--border)'}`,background:platform===pl?platformColor(pl):'transparent',color:platform===pl?'white':'var(--muted)',fontSize:'.74rem',fontWeight:600,cursor:'pointer',fontFamily:'Alegreya Sans,sans-serif',transition:'all .15s',flexShrink:0,whiteSpace:'nowrap'}}>
                      {pl}
                    </button>
                  ))}
                </div>
              )}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:isMobile?'wrap':'nowrap',gap:isMobile?8:0}}>
                <span style={{fontSize:'.75rem',color:'var(--muted)'}}>{text.length} caracteres</span>
                <button className="btn btn-dark" onClick={savePost} disabled={!text.trim()} style={{opacity:text.trim()?1:.5,width:isMobile?'100%':'auto',justifyContent:isMobile?'center':'flex-start'}}><Icon name={editId?'check':'save'} size={13}/> {editId?'Atualizar':'Salvar Post'}</button>
              </div>
            </div>
          </div>

// - SYNC HUB -
const SyncHub=React.memo(({appState,onImport,onClearSave,fbUser,syncStatus,syncDetail,syncNotice,onDismissNotice,onManualPush,onDiscardLocal,isMobile,onResetIdentity})=>{
  // Where the running JS came from: 'cache' (a compiled bundle reused) or 'babel'
  // (transpiled just now). Free diagnostics for P1-1.
  const bundleSource=(typeof window!=='undefined'&&window.__bhBundleCache&&window.__bhBundleCache.source)||'?';
  const [status,setStatus]=useState(null);
  const [loading,setLoading]=useState(false);
  const [reuploadProgress,setReuploadProgress]=useState(null);
  const importRef=useRef();
  // F3.3 — Diagnóstico. The count is read once on mount so the button can show
  // it without keeping the diary in React state; the list is only pulled when
  // the panel is actually opened.
  const [diagOpen,setDiagOpen]=useState(false);
  const [diagLog,setDiagLog]=useState([]);
  const [diagCount,setDiagCount]=useState(()=>{try{return bhLogAll().length;}catch{return 0;}});

  // Backup history
  // F1: the list comes from `meta` (with no state). Before, opening the Sync
  // screen pulled the ENTIRE history into React's memory just to draw dates and
  // counters; now a snapshot's state is only read on the restore click.
  const [backupHistory,setBackupHistory]=useState([]);
  const refreshHistory=()=>{bhHistoryInit().then(()=>setBackupHistory(bhHistoryMeta().slice()));};
  useEffect(()=>{refreshHistory();},[]);

  const BH_REASON_LABEL={'pre-sync':'Antes do sync','daily':'Diário','auto':'Automático','pre-restore':'Antes de restaurar','pre-login-edit':'Edição pré-login','cloud-superseded':'Nuvem substituída','descartado':'Local descartado','local-prelogin':'Local antes do 1º login','remoto-concorrente':'Nuvem (edição simultânea)','concurrent-superseded':'Local (edição simultânea)'};
  const handleRestoreFromHistory=async(entry)=>{
    const dt=new Date(entry.at).toLocaleString('pt-BR');
    const c=entry.counts||{};
    if(!await bhConfirm({title:'Restaurar backup',confirmLabel:'Restaurar',
      message:`Restaurar o backup de ${dt}?\n(${c.projects??'?'} projetos · ${c.notes??'?'} notas · ${c.clients??'?'} clientes)\n\nSeus dados atuais serão salvos no histórico antes — dá pra desfazer.`}))return;
    // F1: the state comes from the IDB now. If the read fails, ABORT before
    // touching the current state — restoring a snapshot that did not load would
    // be trading good data for nothing.
    let full=null;
    try{full=await bhHistoryGet(entry.at);}catch{}
    if(!full||!full.state){showStatus('err','Não foi possível ler esse backup. Nada foi alterado.');return;}
    // Make the restore itself undoable: snapshot current state first
    try{const cur=lsLoad();if(cur)await bhCapture(cur,'pre-restore');}catch{}
    onImport(full.state);
    showStatus('ok','✓ Backup de '+dt+' restaurado!');
    refreshHistory();
  };

  const showStatus=(type,msg)=>{setStatus({type,msg});if(type!=='err')setTimeout(()=>setStatus(null),8000);};
  const localImgCount=collectIdbKeys(appState).size;

  const signIn=async()=>{
    try{
      await initFirebase();
      if(!_fbReady){showStatus('err','Firebase não carregou. Tente de novo em instantes.');return;}
      const provider=new firebase.auth.GoogleAuthProvider();
      await _fbAuth.signInWithPopup(provider);
      showStatus('ok','✓ Conectado! Dados sincronizarão em tempo real entre todos os dispositivos.');
    }catch(e){showStatus('err','Falha no login: '+e.message);}
  };

  const signOut=async()=>{
    if(!await bhConfirm({title:'Sair da conta',message:'Sair? Seus dados continuarão salvos localmente.',confirmLabel:'Sair'}))return;
    await _fbAuth.signOut();
    showStatus('ok','Desconectado.');
  };

  const handleManualPush=async()=>{
    if(!fbUser){showStatus('err','Faça login com Google primeiro.');return;}
    if(!await bhConfirm({title:'Forçar sync',danger:true,confirmLabel:'Enviar mesmo assim',
      message:'Forçar sync vai enviar seus dados locais para a nuvem, sobrescrevendo qualquer versão mais recente no Firestore. Continuar?'}))return;
    setLoading(true);
    try{
      await onManualPush();
      showStatus('ok','✓ Dados enviados!');
    }catch(e){showStatus('err','Falha: '+e.message);}
    finally{setLoading(false);}
  };
  const handleDiscardLocal=async()=>{
    if(!await bhConfirm({title:'Descartar alterações locais',danger:true,confirmLabel:'Descartar e puxar',
      message:'Descartar as alterações locais não enviadas e puxar a versão da nuvem?\n\nSuas alterações atuais serão guardadas no Histórico de Backups antes — dá pra desfazer.'}))return;
    const ok=onDiscardLocal();
    if(ok){showStatus('ok','✓ Dados da nuvem aplicados. As alterações locais estão no histórico.');refreshHistory();}
    else showStatus('err','Ainda não recebi nada da nuvem nesta sessão — nada para puxar.');
  };

  const handleReupload=async()=>{
    const keys=[...collectIdbKeys(appState)];
    if(keys.length===0){showStatus('ok','✓ Nenhuma imagem local — tudo já está na nuvem!');return;}
    if(!fbUser&&!await bhConfirm({title:'Enviar ao Imgur',confirmLabel:'Enviar',
      message:`${keys.length} imagem(ns) local(is). Sem login ativo, serão enviadas ao Imgur. Continuar?`}))return;
    setLoading(true);
    setReuploadProgress({done:0,total:keys.length});
    try{
      const updatedState=await reuploadLocalImages(appState,(done,total)=>setReuploadProgress({done,total}));
      onImport(updatedState);
      setReuploadProgress(null);
      showStatus('ok','✓ Imagens enviadas para a nuvem!');
    }catch(e){setReuploadProgress(null);showStatus('err','Falha: '+e.message);}
    finally{setLoading(false);}
  };

  const exportData=async()=>{
    const data=await buildSyncPayload(appState,true);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`boardhub-backup-${localDateISO()}.json`;a.click();URL.revokeObjectURL(url);
  };
  const handleImportFile=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        Promise.resolve(onImport(data)).then(ok=>{
          if(ok===false)showStatus('err','O arquivo não parece um backup do BoardHub (nenhuma seção reconhecida).');
          else{showStatus('ok','✓ Importado!');refreshHistory();}
        });
      }
      catch{showStatus('err','Arquivo inválido (JSON malformado).');}
    };
    reader.readAsText(file);e.target.value='';
  };

  const counts=[
    {label:'Projetos',value:(appState.projects||[]).filter(p=>!p.deleted).length},
    {label:'Clientes',value:(appState.clients||[]).filter(c=>!c.deleted).length},
    {label:'Mentores',value:(appState.mentors||[]).filter(m=>!m.deleted).length},
    {label:'Notas',value:(appState.notes||[]).filter(n=>!n.deleted).length},
    {label:'Atividades',value:(appState.tasks||[]).length},
    {label:'Posts',value:(appState.socialPosts||[]).filter(p=>!p.deleted).length},
  ];

  const syncColor={'synced':'var(--ok-fg)','syncing':'var(--warn-fg)','error':'var(--danger-fg)','idle':'var(--muted)'}[syncStatus]||'var(--muted)';
  const syncLabel={'synced':'Sincronizado ✓','syncing':'Sincronizando...','error':'Erro de sincronização — alterações locais preservadas','idle':fbUser?'Aguardando alterações':'Faça login para sincronizar'}[syncStatus]||'';
  const syncIcon={'synced':'check-circle','syncing':'loader','error':'alert-circle','idle':'cloud'}[syncStatus]||'cloud';

  return(
    <div className="fade-up" style={{maxWidth:'min(640px,100%)',boxSizing:'border-box',height:isMobile?'auto':'calc(100vh - clamp(32px,5vh,80px))',overflowY:isMobile?'visible':'auto',margin:'0 auto'}}>
      <h1 className="serif" style={{fontSize:isMobile?'1.75rem':'clamp(1.6rem,2.8vh,2.6rem)',fontWeight:300,letterSpacing:'-0.02em',marginBottom:2}}>Sincronizar</h1>
      <p style={{color:'var(--muted)',fontSize:'clamp(.75rem,1.1vh,.85rem)',marginBottom:isMobile?10:12}}>Sync em tempo real entre dispositivos via Google.</p>

      <div style={{display:'flex',gap:6,marginBottom:isMobile?8:10,flexWrap:isMobile?'wrap':'nowrap'}}>
        {counts.map(s=>(
          <div key={s.label} className="card" style={{padding:'8px 12px',display:'flex',alignItems:'center',gap:8,flex:isMobile?'1 1 45%':'1'}}>
            <span style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.2rem',fontWeight:500,flexShrink:0}}>{s.value}</span>
            <span style={{fontSize:'.68rem',color:'var(--muted)',lineHeight:1.2}}>{s.label}</span>
          </div>
        ))}
      </div>

      {localImgCount>0&&(
        <div style={{background:'var(--warn-bg)',border:'1px solid #fde68a',borderRadius:10,padding:'8px 14px',marginBottom:8,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <Icon name="image" size={14} style={{color:'var(--warn-fg)',flexShrink:0}}/>
          <div style={{flex:1,fontSize:'.8rem',color:'#78350F'}}>
            <strong>{localImgCount} imagem(ns)</strong> apenas localmente. Use <strong>"Re-enviar Imagens"</strong> abaixo.
          </div>
        </div>
      )}

      {status&&(
        <div style={{padding:'8px 14px',borderRadius:10,marginBottom:10,background:status.type==='ok'?'var(--ok-bg)':'var(--danger-bg)',border:`1px solid ${status.type==='ok'?'#bbf7d0':'var(--danger-line)'}`,color:status.type==='ok'?'var(--ok-fg)':'var(--danger-fg)',fontSize:'.82rem',display:'flex',alignItems:'center',gap:10}}>
          <Icon name={status.type==='ok'?'check-circle':'alert-circle'} size={15}/>{status.msg}
          <button onClick={()=>setStatus(null)} title="Fechar aviso" aria-label="Fechar aviso" style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'inherit',padding:2}}><Icon name="x" size={13}/></button>
        </div>
      )}
      {syncNotice&&(
        <div style={{padding:'10px 14px',borderRadius:10,marginBottom:10,background:'#EFF6FF',border:'1px solid #BFDBFE',color:'#1E40AF',fontSize:'.82rem',display:'flex',alignItems:'flex-start',gap:10,lineHeight:1.5}}>
          <Icon name="info" size={15} style={{flexShrink:0,marginTop:2}}/><span>{syncNotice}</span>
          <button onClick={onDismissNotice} style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'inherit',padding:2,flexShrink:0}} title="Fechar aviso" aria-label="Fechar aviso"><Icon name="x" size={13}/></button>
        </div>
      )}

      {reuploadProgress&&(
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 18px',marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8,fontSize:'.82rem',fontWeight:600}}>
            <span>Enviando imagens...</span>
            <span style={{color:'var(--muted)'}}>{reuploadProgress.done}/{reuploadProgress.total}</span>
          </div>
          <div style={{height:6,background:'var(--bg)',borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',background:'var(--text)',borderRadius:3,transition:'width .3s',width:`${Math.round(reuploadProgress.done/reuploadProgress.total*100)}%`}}/>
          </div>
        </div>
      )}

      {/* Google Account Card */}
      <div className="card" style={{padding:isMobile?20:18,marginBottom:10,display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
        {fbUser ? (
          <>
            <div style={{display:'flex',alignItems:'center',gap:16,width:'100%'}}>
              <div style={{width:56,height:56,borderRadius:'50%',overflow:'hidden',flexShrink:0,background:'var(--bg)',border:'2px solid var(--border)'}}>
                {fbUser.photoURL
                  ?<img src={fbUser.photoURL} style={{width:'100%',height:'100%',objectFit:'cover'}} alt=""/>
                  :<div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Cormorant Garamond,serif',fontSize:'1.4rem',fontWeight:500,color:'var(--muted)'}}>{(fbUser.displayName||fbUser.email||'?').charAt(0)}</div>
                }
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:'1rem',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{fbUser.displayName||fbUser.email}</div>
                {/* F5: the sync state changes on its own, without the user
                    doing anything — the case a live region exists for. The
                    error DETAIL sits inside the same region on purpose, so
                    "erro" and the reason are announced together rather than as
                    two separate interruptions. */}
                <div role="status" aria-live="polite">
                  <div style={{fontSize:'.78rem',color:syncColor,display:'flex',alignItems:'center',gap:5}}>
                    <Icon name={syncIcon} size={12}/>{syncLabel}
                  </div>
                  {syncStatus==='error'&&syncDetail&&<div style={{fontSize:'.7rem',color:'var(--danger-fg)',marginTop:3,lineHeight:1.4,wordBreak:'break-word'}}>{syncDetail}</div>}
                </div>
              </div>
            </div>
            <div style={{display:'flex',gap:8,width:'100%'}}>
              <button className="btn btn-outline" style={{flex:1,justifyContent:'center'}} onClick={handleManualPush} disabled={loading}>
                <Icon name="upload-cloud" size={14}/> Forçar sync
              </button>
              <button className="btn btn-ghost" style={{fontSize:'.8rem',color:'var(--muted)'}} onClick={signOut}>
                <Icon name="log-out" size={13}/> Sair
              </button>
            </div>
            {syncStatus==='error'&&(
              <button className="btn btn-danger" style={{width:'100%',justifyContent:'center'}} onClick={handleDiscardLocal} disabled={loading}>
                <Icon name="cloud-download" size={14}/> Descartar locais e puxar da nuvem
              </button>
            )}
          </>
        ) : (
          <>
            <div style={{textAlign:'center'}}>
              <div style={{width:64,height:64,borderRadius:'50%',background:'var(--bg)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}>
                <Icon name="cloud" size={26} style={{color:'var(--muted)'}}/>
              </div>
              <div style={{fontWeight:600,fontSize:'1rem',marginBottom:6}}>Entre com sua conta Google</div>
              <div style={{fontSize:'.82rem',color:'var(--muted)',maxWidth:340,lineHeight:1.6}}>Seus dados ficam sincronizados automaticamente em todos os seus dispositivos.</div>
            </div>
            <button style={{
              display:'flex',alignItems:'center',justifyContent:'center',gap:10,
              width:'100%',maxWidth:320,padding:'13px 20px',borderRadius:10,
              border:'1px solid var(--border)',background:'white',cursor:'pointer',
              fontFamily:'Alegreya Sans,sans-serif',fontSize:'.95rem',fontWeight:600,color:'#1C1917',
              boxShadow:'0 1px 4px rgba(0,0,0,.08)',transition:'box-shadow .15s',
            }}
            onMouseEnter={e=>e.currentTarget.style.boxShadow='0 2px 10px rgba(0,0,0,.12)'}
            onMouseLeave={e=>e.currentTarget.style.boxShadow='0 1px 4px rgba(0,0,0,.08)'}
            onClick={signIn}>
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Entrar com Google
            </button>
          </>
        )}
      </div>

      {/* Backup history — always visible, works offline/logged-out */}
      {backupHistory.length>0&&(
        <div className="card" style={{padding:isMobile?16:18,marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <span className="label label-section">Histórico de Backups</span>
            <span style={{fontSize:'.68rem',color:'var(--muted)'}}>{backupHistory.length} {backupHistory.length===1?'ponto':'pontos'}</span>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:280,overflowY:'auto'}}>
            {backupHistory.map((entry,i)=>{
              const c=entry.counts||{};
              return (
                <div key={entry.at+i} style={{width:'100%',padding:'9px 12px',borderRadius:8,border:'1px solid var(--border)',background:i===0?'var(--ok-bg)':'var(--bg)',display:'flex',alignItems:'center',gap:10}}>
                  <Icon name={entry.reason==='daily'?'calendar-check':entry.reason==='pre-sync'?'cloud':entry.reason==='pre-restore'?'undo-2':'clock'} size={14} style={{color:'var(--muted)',flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:'.76rem',fontWeight:600,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                      {new Date(entry.at).toLocaleString('pt-BR')}
                      <span style={{fontSize:'.62rem',fontWeight:500,color:entry.reason==='daily'?'var(--ok-fg)':'var(--muted)',border:'1px solid '+(entry.reason==='daily'?'var(--ok-line)':'var(--border)'),borderRadius:4,padding:'1px 5px',background:entry.reason==='daily'?'var(--ok-bg)':'transparent'}}>
                        {entry.reason==='daily'
                          ?'Diário · '+new Date(entry.at).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')
                          :(BH_REASON_LABEL[entry.reason]||entry.reason)}
                      </span>
                    </div>
                    <div style={{fontSize:'.7rem',color:'var(--muted)'}}>
                      {c.projects??0} projetos · {c.notes??0} notas · {c.clients??0} clientes · {c.tasks??0} tarefas
                    </div>
                  </div>
                  <button onClick={()=>handleRestoreFromHistory(entry)} className="btn btn-outline" style={{padding:'4px 10px',fontSize:'.72rem',flexShrink:0}}>
                    <Icon name="undo-2" size={12}/> Restaurar
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Actions */}
      <div className="card" style={{padding:isMobile?16:18,marginBottom:10}}>
        <span className="label label-section" style={{display:'block',marginBottom:10}}>Backup Manual</span>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn btn-outline" style={{flex:1,justifyContent:'center'}} onClick={exportData} disabled={loading}>
              <Icon name="download" size={14}/> Exportar JSON
            </button>
            <button className="btn btn-outline" style={{flex:1,justifyContent:'center'}} onClick={()=>importRef.current.click()} disabled={loading}>
              <Icon name="upload" size={14}/> Importar JSON
            </button>
            <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={handleImportFile}/>
          </div>
          {localImgCount>0&&(
            <button className="btn btn-outline" style={{width:'100%',justifyContent:'center'}} onClick={handleReupload} disabled={loading}>
              <Icon name="cloud-upload" size={14}/> Re-enviar Imagens ({localImgCount})
            </button>
          )}
        </div>
      </div>

      {/* Danger zone */}
      <div style={{borderTop:'1px solid var(--border)',paddingTop:12}}>
        <span className="label label-section" style={{display:'block',marginBottom:8,color:'var(--danger-fg)'}}>Zona Perigosa</span>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-outline" onClick={onResetIdentity} style={{fontSize:'.82rem'}}>
            <Icon name="pencil" size={13}/> Renomear Hub
          </button>
          {/* v23.5 P1-1: emergency hatch for the bundle cache. The source hash
              already invalidates it on its own, but if the app ever opens odd
              this button returns the boot to the pure Babel path. */}
          <button className="btn btn-outline" style={{fontSize:'.82rem'}}
            title={'Recompila o app do zero no próximo carregamento. Origem deste boot: '+bundleSource}
            onClick={async()=>{
              if(!await bhConfirm({title:'Limpar cache do app',confirmLabel:'Limpar',
                message:'Limpar o cache do app compilado? O próximo carregamento vai recompilar do zero (mais lento uma vez). Nenhum dado é afetado.'}))return;
              try{await window.__bhBundleCache?.clear?.();}catch{/*silent-ok: the reload below recompiles from source regardless — clearing is the optimisation, not the fix*/}
              location.reload();
            }}>
            <Icon name="refresh-cw" size={13}/> Limpar cache do app ({bundleSource})
          </button>
          <button className="btn btn-danger" onClick={async()=>{if(await bhConfirm({title:'Resetar tudo',danger:true,confirmLabel:'Resetar',message:'Resetar todos os dados para o estado inicial? Esta ação não pode ser desfeita.'}))onClearSave();}}>
            <Icon name="alert-triangle" size={14}/> Resetar tudo
          </button>
        </div>
        {/* F3.3 — the failure diary, which until now only existed in the console.
            It is READ-ONLY plus copy and clear: the value is being able to hand
            the log to someone, not to act on it from here. Collapsed by default
            because in a healthy session it is empty and would just be noise. */}
        <div style={{marginTop:14}}>
          <button className="btn btn-outline" style={{fontSize:'.82rem'}}
            onClick={()=>{setDiagOpen(o=>!o);setDiagLog(bhLogAll());}}>
            <Icon name="stethoscope" size={13}/> Diagnóstico ({diagCount})
          </button>
          {diagOpen&&(
            <div style={{marginTop:10}}>
              {diagLog.length===0
                ? <p style={{fontSize:'.8rem',color:'var(--muted)',margin:0}}>Nenhuma falha registrada. É o que se espera.</p>
                : (<>
                    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
                      <button className="btn btn-outline" style={{fontSize:'.78rem'}}
                        onClick={async()=>{
                          try{await navigator.clipboard.writeText(diagLog.map(e=>`${e.at} [${e.tag}] ${e.msg}${e.extra?' — '+e.extra:''}`).join('\n'));await bhAlert('Diagnóstico copiado.');}
                          catch(e){bhLog('diag.copy',e,'the diary could not be copied to the clipboard');await bhAlert('Não foi possível copiar.');}
                        }}>
                        <Icon name="copy" size={13}/> Copiar
                      </button>
                      <button className="btn btn-outline" style={{fontSize:'.78rem'}}
                        onClick={async()=>{
                          if(!await bhConfirm({title:'Limpar diagnóstico',confirmLabel:'Limpar',
                            message:'Apagar o registro de falhas? Nenhum dado do app é afetado.'}))return;
                          bhLogClear();setDiagLog([]);setDiagCount(0);
                        }}>
                        <Icon name="trash-2" size={13}/> Limpar
                      </button>
                    </div>
                    <div style={{maxHeight:220,overflowY:'auto',border:'1px solid var(--border)',borderRadius:8,padding:'8px 10px',background:'var(--bg)'}}>
                      {diagLog.slice().reverse().map((e,i)=>(
                        <div key={i} style={{fontSize:'.72rem',lineHeight:1.5,paddingBottom:5,marginBottom:5,borderBottom:i===diagLog.length-1?'none':'1px solid var(--border)'}}>
                          <span style={{color:'var(--muted)'}}>{String(e.at||'').slice(0,19).replace('T',' ')}</span>{' '}
                          <strong style={{color:'var(--danger-fg)'}}>{e.tag}</strong>{' '}
                          <span style={{color:'var(--text)'}}>{e.msg}</span>
                          {e.extra&&<div style={{color:'var(--muted)',paddingLeft:8}}>{e.extra}</div>}
                        </div>
                      ))}
                    </div>
                  </>)}
            </div>
          )}
        </div>
      </div>

    </div>
  );
});

// - MENTORS HUB -
const MentorModal=({mentor,onClose,onSave,onDelete})=>{
  const [form,setForm]=useState({...mentor});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const photoRef=useRef();
  const imgRef0=useRef();const imgRef1=useRef();const imgRef2=useRef();const imgRef3=useRef();
  const imgRefs=[imgRef0,imgRef1,imgRef2,imgRef3];

  const handlePhoto=async e=>{const file=e.target.files[0];if(!file)return;set('photo',await uploadImage(file));};
  const handleRefImg=async(idx,e)=>{
    const file=e.target.files[0];if(!file)return;
    const url=await uploadImage(file);
    const imgs=[...(form.photos||[null,null,null,null])];
    imgs[idx]=url;set('photos',imgs);
  };
  const removeRefImg=idx=>{
    const imgs=[...(form.photos||[null,null,null,null])];
    imgs[idx]=null;set('photos',imgs);
  };
  const photos=form.photos||[null,null,null,null];

  return ReactDOM.createPortal(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:580}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:24}}>
          <h2 className="serif" style={{fontSize:'1.6rem',fontWeight:400,margin:0}}>{form.name||'Mentor'}</h2>
          <button className="btn btn-ghost" onClick={onClose} style={{padding:6}} title="Fechar" aria-label="Fechar"><Icon name="x" size={18}/></button>
        </div>
        <div style={{display:'flex',gap:16,alignItems:'flex-start',marginBottom:14}}>
          <input ref={photoRef} type="file" accept="image/*" style={{display:'none'}} onChange={handlePhoto}/>
          <div onClick={()=>photoRef.current.click()} style={{width:64,height:64,borderRadius:'50%',cursor:'pointer',flexShrink:0,overflow:'hidden',border:'2px dashed var(--border)',display:'flex',alignItems:'center',justifyContent:'center',backgroundColor:'var(--bg)',position:'relative'}}
            onMouseEnter={e=>e.currentTarget.querySelector('.mh').style.opacity=1}
            onMouseLeave={e=>e.currentTarget.querySelector('.mh').style.opacity=0}>
            {form.photo
              ?<Img src={form.photo} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              :<span style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.8rem',fontWeight:500,color:'var(--muted)'}}>{(form.name||'?').charAt(0)}</span>}
            <div className="mh" style={{position:'absolute',inset:0,background:'rgba(0,0,0,.4)',display:'flex',alignItems:'center',justifyContent:'center',opacity:0,transition:'opacity .2s'}}><Icon name="camera" size={16} style={{color:'white'}}/></div>
          </div>
          <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Field label="Nome"><input className="input-box" value={form.name} onChange={e=>set('name',e.target.value)} style={{fontWeight:600}}/></Field>
            <Field label="Area"><input className="input-box" value={form.area||''} onChange={e=>set('area',e.target.value)} placeholder="Ex: Narrativa Visual"/></Field>
            <Field label="Meio"><input className="input-box" value={form.medium||''} onChange={e=>set('medium',e.target.value)} placeholder="Ex: Animacao, HQ..."/></Field>
            <Field label="Ano">
              <input className="input-box" type="number" value={form.year||''} onChange={e=>set('year',e.target.value?Number(e.target.value):'')} placeholder={new Date().getFullYear()} min="1900" max="2099"/>
            </Field>
            <Field label="Status">
              <select className="input-box" value={form.active?'Ativo':'Inativo'} onChange={e=>set('active',e.target.value==='Ativo')} style={{cursor:'pointer'}}>
                <option>Ativo</option><option>Inativo</option>
              </select>
            </Field>
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <button onClick={()=>set('main',!form.main)}
            style={{display:'inline-flex',alignItems:'center',gap:8,padding:'6px 14px',borderRadius:10,border:'1.5px solid '+(form.main?'var(--warn-fg)':'var(--border)'),background:form.main?'var(--warn-bg)':'transparent',color:form.main?'var(--warn-fg)':'var(--muted)',cursor:'pointer',fontFamily:'Alegreya Sans,sans-serif',fontSize:'.82rem',fontWeight:600,transition:'all .15s'}}>
            <Icon name="star" size={14}/>
            {form.main?'Mentor Principal (ativo)':'Marcar como Principal'}
          </button>
          <p style={{fontSize:'.72rem',color:'var(--muted)',margin:'4px 0 0 2px'}}>Ate 3 mentores principais aparecem na pagina inicial.</p>
        </div>
        <Field label="Notas e Estudos">
          <textarea className="input-box" rows={2} value={form.notes||''} onChange={e=>set('notes',e.target.value)}
            placeholder="Insights, tecnicas, o que aprender..." style={{resize:'vertical',lineHeight:1.7,marginBottom:10}}/>
        </Field>
        <Field label="Links de Referencia">
          <input className="input-box" value={form.links||''} onChange={e=>set('links',e.target.value)}
            placeholder="https://... (separe com virgula)" style={{marginBottom:10}}/>
        </Field>
        <div style={{marginBottom:14}}>
          <span className="label label-section" style={{display:'block',marginBottom:8}}>Imagens de Referencia</span>

            {[0,1,2,3].map(idx=>(

const QuickCapture=({type,onClose,onAddTask,onAddNote})=>{
  const [value,setValue]=useState('');
  const inputRef=useRef(null);
  useEffect(()=>{inputRef.current?.focus();},[]);
  const submit=()=>{
    if(!value.trim()){onClose();return;}
    if(type==='task'){onAddTask({id:Date.now(),text:value.trim(),done:false,noteId:null});}
    else{onAddNote({id:Date.now(),title:value.trim(),content:'',date:'Agora',deleted:false});}
    onClose();
  };
  const onKey=e=>{if(e.key==='Enter'){e.preventDefault();submit();}if(e.key==='Escape')onClose();};
  return ReactDOM.createPortal(
    <div className="quick-capture">
      <Icon name={type==='task'?'check-square':'file-text'} size={16} style={{color:'var(--muted)',flexShrink:0}}/>
      <input ref={inputRef} value={value} onChange={e=>setValue(e.target.value)} onKeyDown={onKey}
        placeholder={type==='task'?'Nova atividade...':'Nova nota...'}/>
      <button className="btn btn-dark" style={{padding:'5px 12px',fontSize:'.78rem',flexShrink:0}} onClick={submit} title="Adicionar" aria-label="Adicionar"><Icon name="plus" size={12}/></button>
      <button className="btn btn-ghost" style={{padding:4,flexShrink:0}} onClick={onClose} title="Fechar" aria-label="Fechar"><Icon name="x" size={14}/></button>
    </div>,
    document.body
  );
};

// - ERROR BOUNDARY -
// A single render error used to nuke the whole app to a white screen (the
// window error handler only touched the splash, long removed by then).
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(err,info){console.error('[BoardHub] Render error:',err,info);}
  render(){
    if(this.state.error){
      return React.createElement('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',padding:24}},
        React.createElement('div',{style:{maxWidth:440,textAlign:'center',display:'flex',flexDirection:'column',gap:14}},
          React.createElement('div',{style:{fontFamily:'Cormorant Garamond,serif',fontSize:'2.2rem',fontWeight:500,color:'var(--text)'}},'BoardHub'),
          React.createElement('div',{style:{fontSize:'.9rem',color:'var(--danger-fg)',lineHeight:1.6}},'Algo quebrou na interface: '+(this.state.error&&this.state.error.message||'erro desconhecido')),
          React.createElement('div',{style:{fontSize:'.8rem',color:'var(--muted)',lineHeight:1.6}},'Seus dados locais e o histórico de backups estão preservados. Recarregue para continuar; se o erro persistir após um import, restaure um backup na tela Sincronizar.'),
          React.createElement('button',{onClick:()=>location.reload(),style:{margin:'6px auto 0',padding:'10px 24px',background:'var(--text)',color:'white',border:'none',borderRadius:8,cursor:'pointer',fontFamily:'Alegreya Sans,sans-serif',fontSize:'.9rem'}},'Recarregar')
        )
      );
    }
    return this.props.children;
  }
}

const App=()=>{
  const autoMobile=useIsMobile();
  const [forceMobile,setForceMobileRaw]=useState(null);
  const isMobile=forceMobile!==null?forceMobile:autoMobile;
  useEffect(()=>{ if(autoMobile)setForceMobileRaw(null); },[autoMobile]);
  const setForceMobile=val=>setForceMobileRaw(val);

  // Remove splash screen as soon as App mounts
  useEffect(()=>{
    clearTimeout(window.__splashTimeout);
    const splash=document.getElementById('splash');
    if(splash){splash.style.opacity='0';setTimeout(()=>splash.remove(),350);}
  },[]);

  // IDB garbage collection — delayed so it never competes with startup I/O
  useEffect(()=>{const t=setTimeout(gcIdb,8000);return()=>clearTimeout(t);},[]);

  // Daily backup: once per day on first open (into rotating history)
  // F1: wait for the history to open before deciding. Without that, the check
  // would run against a still-empty _bhMeta and write one 'daily' per boot.
  useEffect(()=>{
    let vivo=true;
    (async()=>{
      try{
        await bhHistoryInit();
        if(!vivo)return;
        const today=localDateISO();
        if(bhHistoryMeta().some(e=>e.reason==='daily'&&e.at.slice(0,10)===today))return;
        const snap=lsLoad();
        if(snap)bhCapture(snap,'daily');
      }catch(e){bhLog('backup.daily',e,'today\'s weekly-tier slot was not captured, so the 7-day coverage has a hole');}
    })();
    return()=>{vivo=false;};
  },[]);

  // Global keyboard shortcuts
  useEffect(()=>{
    const onKD=e=>{
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();setShowCmdPalette(v=>!v);return;}
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;
      if(e.key==='n'&&!e.metaKey&&!e.ctrlKey){setQuickCaptureType('note');setShowQuickCapture(true);}
      if(e.key==='t'&&!e.metaKey&&!e.ctrlKey){setQuickCaptureType('task');setShowQuickCapture(true);}
      if(e.key==='?'){e.preventDefault();setShowShortcuts(v=>!v);}
    };
    window.addEventListener('keydown',onKD);
    return()=>window.removeEventListener('keydown',onKD);
  },[]);

  // Hash-based routing: parse the current URL hash into {view, projectId}
  const parseHash=()=>{
    const h=window.location.hash.slice(1)||'dashboard';
    const [v,id]=h.split('/');
    const parsed=id?Number(id):null;
    return{view:v||'dashboard',projectId:(parsed&&!isNaN(parsed))?parsed:null};
  };

  const [view,setView]=useState(()=>parseHash().view);
  const [navTick,setNavTick]=useState(0); // incremented on every navigate; lets views reset on re-click
  const [selectedProject,setSelectedProject]=useState(()=>{
    const{projectId}=parseHash();
    if(!projectId)return null;
    return(persisted?.projects||[]).find(p=>p.id===projectId)||null;
  });
  const [showNewProject,setShowNewProject]=useState(false);
  const [saveFlash,setSaveFlash]=useState(false);
  const [showCmdPalette,setShowCmdPalette]=useState(false);
  const [showQuickCapture,setShowQuickCapture]=useState(false);
  const [showShortcuts,setShowShortcuts]=useState(false);
  const [quickCaptureType,setQuickCaptureType]=useState('task');
  const [fbUser,setFbUser]=useState(null);
  const [syncStatus,setSyncStatus]=useState('idle'); // 'idle'|'syncing'|'synced'|'error'
  const [identity,setIdentity]=useState(()=>loadIdentity());

  // Initialize from localStorage if available, else seed
  const [projects,setProjects]=useState(()=>persisted?.projects||SEED.projects);
  const [clients,setClients]=useState(()=>persisted?.clients||SEED.clients);
  const [mentors,setMentors]=useState(()=>persisted?.mentors||SEED.mentors);
  const [notes,setNotes]=useState(()=>persisted?.notes||SEED.notes);
  const [tasks,setTasks]=useState(()=>persisted?.tasks||SEED.tasks);
  const [socialPosts,setSocialPosts]=useState(()=>persisted?.socialPosts||SEED.socialPosts);
  const [galleryPosts,setGalleryPosts]=useState(()=>persisted?.galleryPosts||SEED.galleryPosts);
  const [galleryFolders,setGalleryFolders]=useState(()=>persisted?.galleryFolders||DEFAULT_GALLERY_FOLDERS);
  const DEFAULT_NOTE_GROUPS=[{id:'notes',label:'Notas',icon:'file-text'},{id:'projects',label:'Mini Projetos',icon:'folder-open'}];
  const [noteGroups,setNoteGroups]=useState(()=>persisted?.noteGroups||DEFAULT_NOTE_GROUPS);
  const [pomoData,setPomoData]=useState(()=>pomoLoad());

  useEffect(()=>{ pomoSave(pomoData); },[pomoData]);

  // Firebase auth state listener — tracks sign-in across all devices
  useEffect(()=>{
    let unsub=null;
    initFirebase().then(ok=>{
      if(!ok)return;
      unsub=_fbAuth.onAuthStateChanged(user=>setFbUser(user||null));
    });
    return ()=>{if(unsub)unsub();};
  },[]);

  // Firestore real-time listener — fires instantly when any device saves
  // (v23: removed _isApplyingRemote — it was written in three places and read
  //  in zero; the real remote-vs-edit detection is _remoteApplyId below.)
  // False on first render (initial state from localStorage is NOT a user edit).
  // Set to true after the first auto-save effect fires so subsequent renders are tracked.
  const _isMounted=useRef(false);
  const _hasPendingLocalEdit=useRef(false); // true only when the USER made a change not yet pushed
  // Incremented each time remote data is applied — lets the auto-save effect
  // distinguish "render caused by remote apply" from "render caused by user edit"
  const _remoteApplyId=useRef(0);
  const _lastSeenApplyId=useRef(0);
  // Persisted "dirty" flag captured at boot: if the previous session left local edits
  // that were never confirmed pushed, the cloud may be stale — used below to avoid a
  // stale cloud snapshot overwriting (and erasing) newer local data on load.
  const _bootDirty=useRef((()=>{try{return localStorage.getItem(DIRTY_KEY)==='1';}catch{return false;}})());
  // Whether localStorage actually held real user data at boot (vs. this being a
  // fresh browser/profile that fell back to SEED). A dirty flag alone is not
  // trustworthy evidence of unsynced work — if there was never any real local
  // data to begin with, "dirty" is a false positive and must never cause the
  // (empty) local state to be pushed over a real cloud save.
  const _localHadRealDataAtBoot=useRef((()=>{
    if(!persisted)return false;
    // SEED content is NOT real data. It ships with demo projects/clients/mentors/
    // notes, so a plain "arrays are non-empty" test reports true on any device
    // that merely opened the app once before logging in.
    let seeded=false;try{seeded=localStorage.getItem(SEEDED_KEY)==='1';}catch{/*silent-ok: defaults to "not seeded", the conservative answer — it makes the reconcile treat local as real data*/}
    if(seeded)return false;

  })());

      // data-loss incident. v23.1 fixes the second half of the same problem:
      // last-write-wins is the WRONG rule for the first login of an account on a

      //

      //       → CLOUD ALWAYS WINS. Local is archived to history first, never

      //       → last-write-wins by timestamp (±2min skew, ties favor local):

      //           remote newer → apply remote; local goes to the pre-sync snapshot

      // it — the user would read the wrong explanation for where their data went.

            const cur=_latestState.current;

              // favour of the local one WITH NO COPY — the same hole F2(A) closed
              // in the neighbouring branch. We cannot abort the reconcile over
              // it, but we can avoid pretending it happened.
              try{const{_updated,...cloudSnap}=data;bhCapture(cloudSnap,'cloud-superseded');}catch(e){bhLog('reconcile.arquivarNuvem',e,'the cloud was passed over with no copy in the history');}

              try{localStorage.setItem(DIRTY_KEY,'1');}catch(e){bhLog('reconcile.marcarSujo',e,'local won this reconcile but is not flagged dirty, so the next boot may let the cloud overwrite it');}

        // The push retry chain keeps the flag until the data is safely in the

        //
        // F2(A): not overwriting is half the answer. The other half is what
        // happens to the state that arrived. Before, it was simply discarded —
        // and this device's next push went over the cloud, so whatever the OTHER
        // device saved disappeared with no copy anywhere. Now it goes into the
        // history before being passed over. Archive BEFORE the return: afterwards
        // there is no afterwards.

          const{_updated,...cloudSnap}=data;
          const remoteSig=bhSig(cloudSnap);
          let localSig='';try{const c=_latestState.current;if(c)localSig=bhSig(c);}catch{/*silent-ok: an empty signature makes bhConcurrentDecision archive rather than skip — it errs towards keeping a copy*/}
          if(bhConcurrentDecision({localSig,remoteSig,lastArchivedSig:_lastRemoteArchivedSig.current,
                                   remoteHasData:bhStateHasData(cloudSnap)})==='arquivar'){

            bhCapture(cloudSnap,'remoto-concorrente');

      }

        const cur=lsLoad();

          // replaced by the remote. If it diverges from what arrived and was

  // Auto-save localStorage + debounced push to Firestore

            // stale remote snapshot silently overwrite the very edits that failed

            // or when the user explicitly discards them in the Sync screen.

  },[projects,clients,mentors,notes,tasks,socialPosts,galleryPosts,galleryFolders,pomoData,noteGroups,identity,syncTick]);

  const selectedProjectRef=useRef(selectedProject);

  const navigate=useCallback(v=>{

  const manualPush=useCallback(async()=>{
    if(!fbUser)throw new Error('Sem login Google ativo.');

      await pushState(_latestState.current,fbUser.uid);
      _pushAttempt.current=0;
      _hasPendingLocalEdit.current=false;
      try{localStorage.setItem(DIRTY_KEY,'0');localStorage.setItem(SYNCED_UID_KEY,fbUser.uid);localStorage.removeItem(SEEDED_KEY);}catch(e){bhLog('sync.marcarEmDia',e,'the device may repeat the 1st-contact reconcile on the next boot');}

  // Escape hatch when pushes keep failing: archive the local edits to the
  // backup history, drop the pending flag and re-apply the cached cloud state.
  const discardLocalAndPull=useCallback(()=>{
    if(!_hasRemoteData.current||!_applyMergedRef.current)return false;
    try{const cur=_latestState.current;if(cur&&bhStateHasData(cur))bhCapture(cur,'descartado');}catch(e){bhLog('discardLocal.arquivar',e,'the local state is about to be discarded for the cloud WITHOUT a copy in the history');}

    clearTimeout(_retryTimer.current);
    _hasPendingLocalEdit.current=false;
    try{localStorage.setItem(DIRTY_KEY,'0');}catch(e){bhLog('discardLocal.marcarEmDia',e,'the device stays flagged dirty and may re-run this reconcile on the next boot');}
    _applyMergedRef.current();
    return true;
  },[]);

  const clearSave=async()=>{
    if(!await bhConfirm({title:'Apagar tudo',danger:true,confirmLabel:'Apagar tudo',
      message:'⚠️ Isso vai apagar TODOS os seus dados e restaurar o estado inicial. Essa ação é irreversível. Continuar?'}))return;
    setProjects(SEED.projects);setClients(SEED.clients);setMentors(SEED.mentors);
    setNotes(SEED.notes);setTasks(SEED.tasks);setSocialPosts(SEED.socialPosts);setGalleryPosts(SEED.galleryPosts);setGalleryFolders(DEFAULT_GALLERY_FOLDERS);
    setNoteGroups(DEFAULT_NOTE_GROUPS);
    setPomoData({days:{}});
