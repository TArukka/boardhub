const Clients=React.memo(({clients,setClients,isMobile})=>{
  const [selected,setSelected]=useState(null);
  const [trash,setTrash]=useState(false);
  const tagColor=s=>({'Ativo':'tag-green','Lead':'tag-yellow','Inativo':'tag-gray','Arquivado':'tag-gray'}[s]||'tag-gray');
  const save=form=>{setClients(p=>p.map(c=>c.id===form.id?form:c));setSelected(null);};
  const softDelete=()=>{setClients(p=>p.map(c=>c.id===selected.id?{...c,deleted:true,deletedAt:new Date().toISOString()}:c));setSelected(null);};
  const restore=id=>setClients(p=>p.map(c=>c.id===id?{...c,deleted:false,deletedAt:null}:c));
  const hardDelete=id=>{if(window.confirm('Excluir permanentemente?')){setClients(p=>p.filter(c=>c.id!==id));}}
  const add=()=>{const n={id:Date.now(),name:'Novo Cliente',company:'',email:'',role:'',status:'Lead',notes:'',photo:'',deleted:false};setClients(p=>[n,...p]);setSelected(n);};
  const visible=clients.filter(c=>trash?c.deleted:!c.deleted);
  const dragIdxRef=useRef(null);
  const reorderClients=(from,to)=>{
    if(from===to)return;
    setClients(prev=>{
      const live=prev.filter(c=>!c.deleted);
      const dead=prev.filter(c=>c.deleted);
      const next=[...live];const[m]=next.splice(from,1);next.splice(to,0,m);
      return[...next,...dead];
    });
  };
  const dragProps=(idx)=>({
    className:'drag-item',
    draggable:!trash,
    onDragStart:e=>{e.dataTransfer.effectAllowed='move';dragIdxRef.current=idx;e.currentTarget.style.opacity='0.45';},
    onDragEnd:e=>{e.currentTarget.style.opacity='1';dragIdxRef.current=null;document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));},
    onDragOver:e=>{e.preventDefault();e.currentTarget.classList.add('drag-over');},
    onDragLeave:e=>{e.currentTarget.classList.remove('drag-over');},
    onDrop:e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');if(dragIdxRef.current!=null&&dragIdxRef.current!==idx){reorderClients(dragIdxRef.current,idx);dragIdxRef.current=null;}},
  });
  if(selected&&!trash)return <ClientDetail client={selected} onBack={()=>setSelected(null)} onSave={save} onDelete={softDelete} isMobile={isMobile}/>;
  return(
    <div className="fade-up" style={{maxWidth:'100%',boxSizing:'border-box',height:isMobile?'auto':'calc(100vh - clamp(32px,5vh,80px))',overflowY:isMobile?'visible':'auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:isMobile?'center':'flex-end',marginBottom:isMobile?10:14,gap:10,flexWrap:'wrap'}}>
        <h1 className="serif" style={{fontSize:isMobile?'1.75rem':'clamp(1.6rem,2.8vh,2.6rem)',fontWeight:300,letterSpacing:'-0.02em'}}>Clientes</h1>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>setTrash(!trash)} className={`btn ${trash?'btn-danger':'btn-outline'}`}>
            <Icon name="trash-2" size={13}/>{trash?'Sair':'Lixeira'}{!trash&&clients.filter(c=>c.deleted).length>0&&` (${clients.filter(c=>c.deleted).length})`}
          </button>
          {!trash&&!isMobile&&<button className="btn btn-dark" onClick={add}><Icon name="user-plus" size={14}/> Adicionar</button>}
        </div>
      </div>
      {isMobile&&!trash&&<button className="fab" onClick={add} title="Novo cliente" aria-label="Novo cliente"><Icon name="plus" size={24}/></button>}
      {trash&&<TrashBanner label="Clientes" onExit={()=>setTrash(false)}/>}
      {isMobile&&!trash?(
        <div className="card" style={{overflow:'hidden',borderRadius:12}}>
          {visible.map((c,idx)=>(
            <div key={c.id} {...(trash?{}:dragProps(idx))} className={`compact-row${trash?'':' drag-item'}`} onClick={()=>setSelected(c)}>
              {!trash&&<span className="drag-handle" style={{color:'var(--muted)',marginRight:2,lineHeight:0,flexShrink:0}}><Icon name="grip-vertical" size={12}/></span>}
              {c.photo?<Img src={c.photo} style={{width:44,height:44,borderRadius:'50%',objectFit:'cover',flexShrink:0}}/>
                :<div style={{width:44,height:44,borderRadius:'50%',backgroundColor:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Cormorant Garamond,serif',fontSize:'1.1rem',fontWeight:500,flexShrink:0}}>{c.name.charAt(0)}</div>}
              <div className="compact-row-info">
                <div className="compact-row-title">{c.name}</div>
                <div className="compact-row-meta">{c.role}{c.role&&c.company?' · ':''}{c.company} · <span className={`tag ${tagColor(c.status)}`} style={{display:'inline',padding:'1px 6px',fontSize:'.62rem'}}>{c.status}</span></div>
              </div>
              <Icon name="chevron-right" size={16} style={{color:'var(--muted)',flexShrink:0}}/>
            </div>
          ))}
          {visible.length===0&&<div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>Nenhum cliente.</div>}
        </div>
      ):(
        <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'repeat(3,1fr)',gap:14}}>
        {visible.map((c,idx)=>(
          <div key={c.id} {...(trash?{}:dragProps(idx))} className={`card drag-item`} style={{padding:22,cursor:trash?'default':'pointer',position:'relative'}} onClick={()=>!trash&&setSelected(c)}
            {...keyActivate(()=>setSelected(c),'Abrir cliente '+(c.name||''),!trash)}>
            {!trash&&<span className="drag-handle" style={{position:'absolute',top:8,right:8,color:'var(--muted)',lineHeight:0,zIndex:1}}><Icon name="grip-vertical" size={13}/></span>}
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
              {c.photo?<Img src={c.photo} style={{width:40,height:40,borderRadius:'50%',objectFit:'cover',flexShrink:0}}/>
                :<div style={{width:40,height:40,borderRadius:'50%',backgroundColor:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Cormorant Garamond,serif',fontSize:'1.1rem',fontWeight:500,flexShrink:0}}>{c.name.charAt(0)}</div>}
              <div>
                <div style={{fontWeight:600,fontSize:'.88rem'}}>{c.name}</div>
                <div style={{fontSize:'.75rem',color:'var(--muted)'}}>{c.role}{c.role&&c.company?' · ':''}{c.company}</div>
              </div>
            </div>
            {c.notes&&<p style={{fontSize:'.78rem',color:'var(--muted)',lineHeight:1.6,margin:'0 0 12px',paddingBottom:12,borderBottom:'1px solid var(--border)',overflow:'hidden',textOverflow:'ellipsis',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{c.notes}</p>}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderTop:c.notes?'none':'1px solid var(--border)',paddingTop:c.notes?0:12}}>
              {!trash?<span className={`tag ${tagColor(c.status)}`}>{c.status}</span>:(
                <div style={{display:'flex',gap:5}}>
                  <button onClick={e=>{e.stopPropagation();restore(c.id);}} className="btn btn-outline" style={{padding:'4px 8px',fontSize:'.75rem'}}><Icon name="refresh-cw" size={11}/></button>
                  <button onClick={e=>{e.stopPropagation();hardDelete(c.id);}} className="btn btn-danger" style={{padding:'4px 8px',fontSize:'.75rem'}}><Icon name="trash-2" size={11}/></button>
                </div>
              )}
              <div style={{display:'flex',alignItems:'center',gap:5,fontSize:'.75rem',color:'var(--muted)',overflow:'hidden'}}>
                <Icon name="mail" size={11}/><span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.email}</span>
              </div>
            </div>
          </div>
        ))}
        {visible.length===0&&<div style={{gridColumn:'1/-1',textAlign:'center',padding:48,color:'var(--muted)'}}>{trash?'Lixeira vazia.':'Nenhum cliente.'}</div>}
        </div>
      )}
    </div>
  );
});

// - SYNC HUB -
const SyncHub=React.memo(({appState,onImport,onClearSave,fbUser,syncStatus,syncDetail,syncNotice,onDismissNotice,onManualPush,onDiscardLocal,isMobile,onResetIdentity})=>{
  // De onde veio o JS que está rodando: 'cache' (bundle compilado reaproveitado)
  // ou 'babel' (transpilado agora). Diagnóstico de graça para o P1-1.
  const bundleSource=(typeof window!=='undefined'&&window.__bhBundleCache&&window.__bhBundleCache.source)||'?';
  const [status,setStatus]=useState(null);
  const [loading,setLoading]=useState(false);
  const [reuploadProgress,setReuploadProgress]=useState(null);
  const importRef=useRef();

  // Backup history
  // F1: a lista vem do `meta` (sem state). Antes, abrir a tela de Sync trazia o
  // histórico INTEIRO para a memória do React só para desenhar datas e
  // contadores; agora o state de um snapshot só é lido no clique de restaurar.
  const [backupHistory,setBackupHistory]=useState([]);
  const refreshHistory=()=>{bhHistoryInit().then(()=>setBackupHistory(bhHistoryMeta().slice()));};
  useEffect(()=>{refreshHistory();},[]);

  const BH_REASON_LABEL={'pre-sync':'Antes do sync','daily':'Diário','auto':'Automático','pre-restore':'Antes de restaurar','pre-login-edit':'Edição pré-login','cloud-superseded':'Nuvem substituída','descartado':'Local descartado','local-prelogin':'Local antes do 1º login'};
  const handleRestoreFromHistory=async(entry)=>{
    const dt=new Date(entry.at).toLocaleString('pt-BR');
    const c=entry.counts||{};
    if(!window.confirm(`Restaurar o backup de ${dt}?\n(${c.projects??'?'} projetos · ${c.notes??'?'} notas · ${c.clients??'?'} clientes)\n\nSeus dados atuais serão salvos no histórico antes — dá pra desfazer.`))return;
    // F1: o state vem do IDB agora. Se a leitura falhar, ABORTA antes de tocar
    // no estado atual — restaurar um snapshot que não carregou seria trocar
    // dados bons por nada.
    let full=null;
    try{full=await bhHistoryGet(entry.at);}catch{}
    if(!full||!full.state){showStatus('err','Não foi possível ler esse backup. Nada foi alterado.');return;}
    // Make the restore itself undoable: snapshot current state first
    try{const cur=lsLoad();if(cur)await bhCapture(cur,'pre-restore');}catch{}
    onImport(full.state);
    showStatus('ok','✓ Backup de '+dt+' restaurado!');
    refreshHistory();
  };

  const showStatus=(type,msg)=>{setStatus({type,msg});if(type!=='err')setTimeout(()=>setStatus(null),8000);};
  const localImgCount=collectIdbKeys(appState).size;

  const signIn=async()=>{
    try{
      await initFirebase();
      if(!_fbReady){showStatus('err','Firebase não carregou. Tente de novo em instantes.');return;}
      const provider=new firebase.auth.GoogleAuthProvider();
      await _fbAuth.signInWithPopup(provider);
      showStatus('ok','✓ Conectado! Dados sincronizarão em tempo real entre todos os dispositivos.');
    }catch(e){showStatus('err','Falha no login: '+e.message);}
  };

  const signOut=async()=>{
    if(!window.confirm('Sair? Seus dados continuarão salvos localmente.'))return;
    await _fbAuth.signOut();
    showStatus('ok','Desconectado.');
  };

  const handleManualPush=async()=>{
    if(!fbUser){showStatus('err','Faça login com Google primeiro.');return;}
    if(!window.confirm('Forçar sync vai enviar seus dados locais para a nuvem, sobrescrevendo qualquer versão mais recente no Firestore. Continuar?'))return;
    setLoading(true);
    try{
      await onManualPush();
      showStatus('ok','✓ Dados enviados!');
    }catch(e){showStatus('err','Falha: '+e.message);}
    finally{setLoading(false);}
  };
  const handleDiscardLocal=()=>{
    if(!window.confirm('Descartar as alterações locais não enviadas e puxar a versão da nuvem?\n\nSuas alterações atuais serão guardadas no Histórico de Backups antes — dá pra desfazer.'))return;
    const ok=onDiscardLocal();
    if(ok){showStatus('ok','✓ Dados da nuvem aplicados. As alterações locais estão no histórico.');refreshHistory();}
    else showStatus('err','Ainda não recebi nada da nuvem nesta sessão — nada para puxar.');
  };

  const handleReupload=async()=>{
    const keys=[...collectIdbKeys(appState)];
    if(keys.length===0){showStatus('ok','✓ Nenhuma imagem local — tudo já está na nuvem!');return;}
    if(!fbUser&&!window.confirm(`${keys.length} imagem(ns) local(is). Sem login ativo, serão enviadas ao Imgur. Continuar?`))return;
    setLoading(true);
    setReuploadProgress({done:0,total:keys.length});
    try{
      const updatedState=await reuploadLocalImages(appState,(done,total)=>setReuploadProgress({done,total}));
      onImport(updatedState);
      setReuploadProgress(null);
      showStatus('ok','✓ Imagens enviadas para a nuvem!');
    }catch(e){setReuploadProgress(null);showStatus('err','Falha: '+e.message);}
    finally{setLoading(false);}
  };

  const exportData=async()=>{
    const data=await buildSyncPayload(appState,true);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`boardhub-backup-${localDateISO()}.json`;a.click();URL.revokeObjectURL(url);
  };
  const handleImportFile=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        Promise.resolve(onImport(data)).then(ok=>{
          if(ok===false)showStatus('err','O arquivo não parece um backup do BoardHub (nenhuma seção reconhecida).');
          else{showStatus('ok','✓ Importado!');refreshHistory();}
        });
      }
      catch{showStatus('err','Arquivo inválido (JSON malformado).');}
    };
    reader.readAsText(file);e.target.value='';
  };

  const counts=[
    {label:'Projetos',value:(appState.projects||[]).filter(p=>!p.deleted).length},
    {label:'Clientes',value:(appState.clients||[]).filter(c=>!c.deleted).length},
    {label:'Mentores',value:(appState.mentors||[]).filter(m=>!m.deleted).length},
    {label:'Notas',value:(appState.notes||[]).filter(n=>!n.deleted).length},
    {label:'Atividades',value:(appState.tasks||[]).length},
    {label:'Posts',value:(appState.socialPosts||[]).filter(p=>!p.deleted).length},
  ];

  const syncColor={'synced':'#276b3e','syncing':'#92700b','error':'#9B1C1C','idle':'var(--muted)'}[syncStatus]||'var(--muted)';
  const syncLabel={'synced':'Sincronizado ✓','syncing':'Sincronizando...','error':'Erro de sincronização — alterações locais preservadas','idle':fbUser?'Aguardando alterações':'Faça login para sincronizar'}[syncStatus]||'';
  const syncIcon={'synced':'check-circle','syncing':'loader','error':'alert-circle','idle':'cloud'}[syncStatus]||'cloud';

  return(
    <div className="fade-up" style={{maxWidth:'min(640px,100%)',boxSizing:'border-box',height:isMobile?'auto':'calc(100vh - clamp(32px,5vh,80px))',overflowY:isMobile?'visible':'auto',margin:'0 auto'}}>
      <h1 className="serif" style={{fontSize:isMobile?'1.75rem':'clamp(1.6rem,2.8vh,2.6rem)',fontWeight:300,letterSpacing:'-0.02em',marginBottom:2}}>Sincronizar</h1>
      <p style={{color:'var(--muted)',fontSize:'clamp(.75rem,1.1vh,.85rem)',marginBottom:isMobile?10:12}}>Sync em tempo real entre dispositivos via Google.</p>

      <div style={{display:'flex',gap:6,marginBottom:isMobile?8:10,flexWrap:isMobile?'wrap':'nowrap'}}>
        {counts.map(s=>(
          <div key={s.label} className="card" style={{padding:'8px 12px',display:'flex',alignItems:'center',gap:8,flex:isMobile?'1 1 45%':'1'}}>
            <span style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.2rem',fontWeight:500,flexShrink:0}}>{s.value}</span>
            <span style={{fontSize:'.68rem',color:'var(--muted)',lineHeight:1.2}}>{s.label}</span>
          </div>
        ))}
      </div>

      {localImgCount>0&&(
        <div style={{background:'#FEF9E7',border:'1px solid #fde68a',borderRadius:10,padding:'8px 14px',marginBottom:8,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <Icon name="image" size={14} style={{color:'#92700b',flexShrink:0}}/>
          <div style={{flex:1,fontSize:'.8rem',color:'#78350F'}}>
            <strong>{localImgCount} imagem(ns)</strong> apenas localmente. Use <strong>"Re-enviar Imagens"</strong> abaixo.
          </div>
        </div>
      )}

      {status&&(
        <div style={{padding:'8px 14px',borderRadius:10,marginBottom:10,background:status.type==='ok'?'#E8F5EC':'#FDEDED',border:`1px solid ${status.type==='ok'?'#bbf7d0':'#FECACA'}`,color:status.type==='ok'?'#276b3e':'#9B1C1C',fontSize:'.82rem',display:'flex',alignItems:'center',gap:10}}>
          <Icon name={status.type==='ok'?'check-circle':'alert-circle'} size={15}/>{status.msg}
          <button onClick={()=>setStatus(null)} title="Fechar aviso" aria-label="Fechar aviso" style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'inherit',padding:2}}><Icon name="x" size={13}/></button>
        </div>
      )}
      {syncNotice&&(
        <div style={{padding:'10px 14px',borderRadius:10,marginBottom:10,background:'#EFF6FF',border:'1px solid #BFDBFE',color:'#1E40AF',fontSize:'.82rem',display:'flex',alignItems:'flex-start',gap:10,lineHeight:1.5}}>
          <Icon name="info" size={15} style={{flexShrink:0,marginTop:2}}/><span>{syncNotice}</span>
          <button onClick={onDismissNotice} style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',color:'inherit',padding:2,flexShrink:0}} title="Fechar aviso" aria-label="Fechar aviso"><Icon name="x" size={13}/></button>
        </div>
      )}

      {reuploadProgress&&(
        <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 18px',marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:8,fontSize:'.82rem',fontWeight:600}}>
            <span>Enviando imagens...</span>
            <span style={{color:'var(--muted)'}}>{reuploadProgress.done}/{reuploadProgress.total}</span>
          </div>
          <div style={{height:6,background:'var(--bg)',borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',background:'var(--text)',borderRadius:3,transition:'width .3s',width:`${Math.round(reuploadProgress.done/reuploadProgress.total*100)}%`}}/>
          </div>
        </div>
      )}

      {/* Google Account Card */}
      <div className="card" style={{padding:isMobile?20:18,marginBottom:10,display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
        {fbUser ? (
          <>
            <div style={{display:'flex',alignItems:'center',gap:16,width:'100%'}}>
              <div style={{width:56,height:56,borderRadius:'50%',overflow:'hidden',flexShrink:0,background:'var(--bg)',border:'2px solid var(--border)'}}>
                {fbUser.photoURL
                  ?<img src={fbUser.photoURL} style={{width:'100%',height:'100%',objectFit:'cover'}} alt=""/>
                  :<div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Cormorant Garamond,serif',fontSize:'1.4rem',fontWeight:500,color:'var(--muted)'}}>{(fbUser.displayName||fbUser.email||'?').charAt(0)}</div>
                }
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:'1rem',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{fbUser.displayName||fbUser.email}</div>
                <div style={{fontSize:'.78rem',color:syncColor,display:'flex',alignItems:'center',gap:5}}>
                  <Icon name={syncIcon} size={12}/>{syncLabel}
                </div>
                {syncStatus==='error'&&syncDetail&&<div style={{fontSize:'.7rem',color:'#9B1C1C',marginTop:3,lineHeight:1.4,wordBreak:'break-word'}}>{syncDetail}</div>}
              </div>
            </div>
            <div style={{display:'flex',gap:8,width:'100%'}}>
              <button className="btn btn-outline" style={{flex:1,justifyContent:'center'}} onClick={handleManualPush} disabled={loading}>
                <Icon name="upload-cloud" size={14}/> Forçar sync
              </button>
              <button className="btn btn-ghost" style={{fontSize:'.8rem',color:'var(--muted)'}} onClick={signOut}>
                <Icon name="log-out" size={13}/> Sair
              </button>
            </div>
            {syncStatus==='error'&&(
              <button className="btn btn-danger" style={{width:'100%',justifyContent:'center'}} onClick={handleDiscardLocal} disabled={loading}>
                <Icon name="cloud-download" size={14}/> Descartar locais e puxar da nuvem
              </button>
            )}
          </>
        ) : (
          <>
            <div style={{textAlign:'center'}}>
              <div style={{width:64,height:64,borderRadius:'50%',background:'var(--bg)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px'}}>
                <Icon name="cloud" size={26} style={{color:'var(--muted)'}}/>
              </div>
              <div style={{fontWeight:600,fontSize:'1rem',marginBottom:6}}>Entre com sua conta Google</div>
              <div style={{fontSize:'.82rem',color:'var(--muted)',maxWidth:340,lineHeight:1.6}}>Seus dados ficam sincronizados automaticamente em todos os seus dispositivos.</div>
            </div>
            <button style={{
              display:'flex',alignItems:'center',justifyContent:'center',gap:10,
              width:'100%',maxWidth:320,padding:'13px 20px',borderRadius:10,
              border:'1px solid var(--border)',background:'white',cursor:'pointer',
              fontFamily:'Figtree,sans-serif',fontSize:'.95rem',fontWeight:600,color:'#1C1917',
              boxShadow:'0 1px 4px rgba(0,0,0,.08)',transition:'box-shadow .15s',
            }}
            onMouseEnter={e=>e.currentTarget.style.boxShadow='0 2px 10px rgba(0,0,0,.12)'}
            onMouseLeave={e=>e.currentTarget.style.boxShadow='0 1px 4px rgba(0,0,0,.08)'}
            onClick={signIn}>
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Entrar com Google
            </button>
          </>
        )}
      </div>

      {/* Backup history — always visible, works offline/logged-out */}
      {backupHistory.length>0&&(
        <div className="card" style={{padding:isMobile?16:18,marginBottom:10}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <span className="label">Histórico de Backups</span>
            <span style={{fontSize:'.68rem',color:'var(--muted)'}}>{backupHistory.length} {backupHistory.length===1?'ponto':'pontos'}</span>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:280,overflowY:'auto'}}>
            {backupHistory.map((entry,i)=>{
              const c=entry.counts||{};
              return (
                <div key={entry.at+i} style={{width:'100%',padding:'9px 12px',borderRadius:8,border:'1px solid var(--border)',background:i===0?'#F0FBF3':'var(--bg)',display:'flex',alignItems:'center',gap:10}}>
                  <Icon name={entry.reason==='daily'?'calendar-check':entry.reason==='pre-sync'?'cloud':entry.reason==='pre-restore'?'undo-2':'clock'} size={14} style={{color:'var(--muted)',flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:'.76rem',fontWeight:600,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                      {new Date(entry.at).toLocaleString('pt-BR')}
                      <span style={{fontSize:'.62rem',fontWeight:500,color:entry.reason==='daily'?'#276b3e':'var(--muted)',border:'1px solid '+(entry.reason==='daily'?'#A8D5B5':'var(--border)'),borderRadius:4,padding:'1px 5px',background:entry.reason==='daily'?'#F0FBF3':'transparent'}}>
                        {entry.reason==='daily'
                          ?'Diário · '+new Date(entry.at).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')
                          :(BH_REASON_LABEL[entry.reason]||entry.reason)}
                      </span>
                    </div>
                    <div style={{fontSize:'.7rem',color:'var(--muted)'}}>
                      {c.projects??0} projetos · {c.notes??0} notas · {c.clients??0} clientes · {c.tasks??0} tarefas
                    </div>
                  </div>
                  <button onClick={()=>handleRestoreFromHistory(entry)} className="btn btn-outline" style={{padding:'4px 10px',fontSize:'.72rem',flexShrink:0}}>
                    <Icon name="undo-2" size={12}/> Restaurar
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Actions */}
      <div className="card" style={{padding:isMobile?16:18,marginBottom:10}}>
        <span className="label" style={{display:'block',marginBottom:10}}>Backup Manual</span>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn btn-outline" style={{flex:1,justifyContent:'center'}} onClick={exportData} disabled={loading}>
              <Icon name="download" size={14}/> Exportar JSON
            </button>
            <button className="btn btn-outline" style={{flex:1,justifyContent:'center'}} onClick={()=>importRef.current.click()} disabled={loading}>
              <Icon name="upload" size={14}/> Importar JSON
            </button>
            <input ref={importRef} type="file" accept=".json" style={{display:'none'}} onChange={handleImportFile}/>
          </div>
          {localImgCount>0&&(
            <button className="btn btn-outline" style={{width:'100%',justifyContent:'center'}} onClick={handleReupload} disabled={loading}>
              <Icon name="cloud-upload" size={14}/> Re-enviar Imagens ({localImgCount})
            </button>
          )}
        </div>
      </div>

      {/* Danger zone */}
      <div style={{borderTop:'1px solid var(--border)',paddingTop:12}}>
        <span className="label" style={{display:'block',marginBottom:8,color:'#9B1C1C'}}>Zona Perigosa</span>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-outline" onClick={onResetIdentity} style={{fontSize:'.82rem'}}>
            <Icon name="pencil" size={13}/> Renomear Hub
          </button>
          {/* v23.5 P1-1: escotilha de emergência do cache de bundle. O hash do
              fonte já invalida sozinho, mas se algum dia o app abrir estranho
              este botão devolve o boot ao caminho Babel puro. */}
          <button className="btn btn-outline" style={{fontSize:'.82rem'}}
            title={'Recompila o app do zero no próximo carregamento. Origem deste boot: '+bundleSource}
            onClick={async()=>{
              if(!window.confirm('Limpar o cache do app compilado? O próximo carregamento vai recompilar do zero (mais lento uma vez). Nenhum dado é afetado.'))return;
              try{await window.__bhBundleCache?.clear?.();}catch{}
              location.reload();
            }}>
            <Icon name="refresh-cw" size={13}/> Limpar cache do app ({bundleSource})
          </button>
          <button className="btn btn-danger" onClick={()=>{if(window.confirm('Resetar todos os dados para o estado inicial? Esta ação não pode ser desfeita.'))onClearSave();}}>
            <Icon name="alert-triangle" size={14}/> Resetar tudo
          </button>
        </div>
      </div>

    </div>
  );
});

// - MENTORS HUB -

  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  return ReactDOM.createPortal(

      <div className="modal" style={{maxWidth:580}}>

          <div onClick={()=>photoRef.current.click()} style={{width:64,height:64,borderRadius:'50%',cursor:'pointer',flexShrink:0,overflow:'hidden',border:'2px dashed var(--border)',display:'flex',alignItems:'center',justifyContent:'center',backgroundColor:'var(--bg)',position:'relative'}}
            onMouseEnter={e=>e.currentTarget.querySelector('.mh').style.opacity=1}
            onMouseLeave={e=>e.currentTarget.querySelector('.mh').style.opacity=0}>
            {form.photo
              ?<Img src={form.photo} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              :<span style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.8rem',fontWeight:500,color:'var(--muted)'}}>{(form.name||'?').charAt(0)}</span>}
            <div className="mh" style={{position:'absolute',inset:0,background:'rgba(0,0,0,.4)',display:'flex',alignItems:'center',justifyContent:'center',opacity:0,transition:'opacity .2s'}}><Icon name="camera" size={16} style={{color:'white'}}/></div>

          <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>

            <Field label="Meio"><input className="input-box" value={form.medium||''} onChange={e=>set('medium',e.target.value)} placeholder="Ex: Animacao, HQ..."/></Field>
            <Field label="Ano">
              <input className="input-box" type="number" value={form.year||''} onChange={e=>set('year',e.target.value?Number(e.target.value):'')} placeholder={new Date().getFullYear()} min="1900" max="2099"/>
            </Field>
            <Field label="Status">
              <select className="input-box" value={form.active?'Ativo':'Inativo'} onChange={e=>set('active',e.target.value==='Ativo')} style={{cursor:'pointer'}}>
                <option>Ativo</option><option>Inativo</option>
              </select>
            </Field>
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <button onClick={()=>set('main',!form.main)}

            <Icon name="star" size={14}/>
            {form.main?'Mentor Principal (ativo)':'Marcar como Principal'}

          <p style={{fontSize:'.72rem',color:'var(--muted)',margin:'4px 0 0 2px'}}>Ate 3 mentores principais aparecem na pagina inicial.</p>

        <Field label="Notas e Estudos">

const QuickCapture=({type,onClose,onAddTask,onAddNote})=>{
  const [value,setValue]=useState('');
  const inputRef=useRef(null);
  useEffect(()=>{inputRef.current?.focus();},[]);
  const submit=()=>{
    if(!value.trim()){onClose();return;}
    if(type==='task'){onAddTask({id:Date.now(),text:value.trim(),done:false,noteId:null});}
    else{onAddNote({id:Date.now(),title:value.trim(),content:'',date:'Agora',deleted:false});}
    onClose();
  };
  const onKey=e=>{if(e.key==='Enter'){e.preventDefault();submit();}if(e.key==='Escape')onClose();};
  return ReactDOM.createPortal(
    <div className="quick-capture">
      <Icon name={type==='task'?'check-square':'file-text'} size={16} style={{color:'var(--muted)',flexShrink:0}}/>
      <input ref={inputRef} value={value} onChange={e=>setValue(e.target.value)} onKeyDown={onKey}
        placeholder={type==='task'?'Nova atividade...':'Nova nota...'}/>
      <button className="btn btn-dark" style={{padding:'5px 12px',fontSize:'.78rem',flexShrink:0}} onClick={submit} title="Adicionar" aria-label="Adicionar"><Icon name="plus" size={12}/></button>
      <button className="btn btn-ghost" style={{padding:4,flexShrink:0}} onClick={onClose} title="Fechar" aria-label="Fechar"><Icon name="x" size={14}/></button>
    </div>,
    document.body
  );
};

// - ERROR BOUNDARY -
// A single render error used to nuke the whole app to a white screen (the
// window error handler only touched the splash, long removed by then).
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(err,info){console.error('[BoardHub] Render error:',err,info);}
  render(){
    if(this.state.error){
      return React.createElement('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)',padding:24}},
        React.createElement('div',{style:{maxWidth:440,textAlign:'center',display:'flex',flexDirection:'column',gap:14}},
          React.createElement('div',{style:{fontFamily:'Cormorant Garamond,serif',fontSize:'2.2rem',fontWeight:500,color:'var(--text)'}},'BoardHub'),
          React.createElement('div',{style:{fontSize:'.9rem',color:'#9B1C1C',lineHeight:1.6}},'Algo quebrou na interface: '+(this.state.error&&this.state.error.message||'erro desconhecido')),
          React.createElement('div',{style:{fontSize:'.8rem',color:'var(--muted)',lineHeight:1.6}},'Seus dados locais e o histórico de backups estão preservados. Recarregue para continuar; se o erro persistir após um import, restaure um backup na tela Sincronizar.'),
          React.createElement('button',{onClick:()=>location.reload(),style:{margin:'6px auto 0',padding:'10px 24px',background:'var(--text)',color:'white',border:'none',borderRadius:8,cursor:'pointer',fontFamily:'Figtree,sans-serif',fontSize:'.9rem'}},'Recarregar')
        )
      );
    }
    return this.props.children;
  }
}

const App=()=>{
  const autoMobile=useIsMobile();
  const [forceMobile,setForceMobileRaw]=useState(null);
  const isMobile=forceMobile!==null?forceMobile:autoMobile;
  useEffect(()=>{ if(autoMobile)setForceMobileRaw(null); },[autoMobile]);
  const setForceMobile=val=>setForceMobileRaw(val);

  // Remove splash screen as soon as App mounts
  useEffect(()=>{
    clearTimeout(window.__splashTimeout);
    const splash=document.getElementById('splash');
    if(splash){splash.style.opacity='0';setTimeout(()=>splash.remove(),350);}
  },[]);

  // IDB garbage collection — delayed so it never competes with startup I/O
  useEffect(()=>{const t=setTimeout(gcIdb,8000);return()=>clearTimeout(t);},[]);

  // Daily backup: once per day on first open (into rotating history)
  // F1: espera o histórico abrir antes de decidir. Sem isso, a checagem rodaria
  // contra _bhMeta ainda vazio e gravaria um 'daily' por boot.
  useEffect(()=>{
    let vivo=true;
    (async()=>{
      try{
        await bhHistoryInit();
        if(!vivo)return;
        const today=localDateISO();
        if(bhHistoryMeta().some(e=>e.reason==='daily'&&e.at.slice(0,10)===today))return;
        const snap=lsLoad();
        if(snap)bhCapture(snap,'daily');
      }catch{}
    })();
    return()=>{vivo=false;};
  },[]);

  // Global keyboard shortcuts
  useEffect(()=>{
    const onKD=e=>{
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();setShowCmdPalette(v=>!v);return;}
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;
      if(e.key==='n'&&!e.metaKey&&!e.ctrlKey){setQuickCaptureType('note');setShowQuickCapture(true);}
      if(e.key==='t'&&!e.metaKey&&!e.ctrlKey){setQuickCaptureType('task');setShowQuickCapture(true);}
      if(e.key==='?'){e.preventDefault();setShowShortcuts(v=>!v);}
    };
    window.addEventListener('keydown',onKD);
    return()=>window.removeEventListener('keydown',onKD);
  },[]);

  // Hash-based routing: parse the current URL hash into {view, projectId}
  const parseHash=()=>{
    const h=window.location.hash.slice(1)||'dashboard';
    const [v,id]=h.split('/');
    const parsed=id?Number(id):null;
    return{view:v||'dashboard',projectId:(parsed&&!isNaN(parsed))?parsed:null};
  };

  const [view,setView]=useState(()=>parseHash().view);
  const [navTick,setNavTick]=useState(0); // incremented on every navigate; lets views reset on re-click
  const [selectedProject,setSelectedProject]=useState(()=>{
    const{projectId}=parseHash();
    if(!projectId)return null;
    return(persisted?.projects||[]).find(p=>p.id===projectId)||null;
  });
  const [showNewProject,setShowNewProject]=useState(false);
  const [saveFlash,setSaveFlash]=useState(false);
  const [showCmdPalette,setShowCmdPalette]=useState(false);
  const [showQuickCapture,setShowQuickCapture]=useState(false);
  const [showShortcuts,setShowShortcuts]=useState(false);
  const [quickCaptureType,setQuickCaptureType]=useState('task');
  const [fbUser,setFbUser]=useState(null);
  const [syncStatus,setSyncStatus]=useState('idle'); // 'idle'|'syncing'|'synced'|'error'
  const [identity,setIdentity]=useState(()=>loadIdentity());

  // Initialize from localStorage if available, else seed
  const [projects,setProjects]=useState(()=>persisted?.projects||SEED.projects);
  const [clients,setClients]=useState(()=>persisted?.clients||SEED.clients);
  const [mentors,setMentors]=useState(()=>persisted?.mentors||SEED.mentors);
  const [notes,setNotes]=useState(()=>persisted?.notes||SEED.notes);
  const [tasks,setTasks]=useState(()=>persisted?.tasks||SEED.tasks);
  const [socialPosts,setSocialPosts]=useState(()=>persisted?.socialPosts||SEED.socialPosts);
  const [galleryPosts,setGalleryPosts]=useState(()=>persisted?.galleryPosts||SEED.galleryPosts);
  const [galleryFolders,setGalleryFolders]=useState(()=>persisted?.galleryFolders||DEFAULT_GALLERY_FOLDERS);
  const DEFAULT_NOTE_GROUPS=[{id:'notes',label:'Notas',icon:'file-text'},{id:'projects',label:'Mini Projetos',icon:'folder-open'}];
  const [noteGroups,setNoteGroups]=useState(()=>persisted?.noteGroups||DEFAULT_NOTE_GROUPS);
  const [pomoData,setPomoData]=useState(()=>pomoLoad());

  useEffect(()=>{ pomoSave(pomoData); },[pomoData]);

  // Firebase auth state listener — tracks sign-in across all devices
  useEffect(()=>{
    let unsub=null;
    initFirebase().then(ok=>{
      if(!ok)return;
      unsub=_fbAuth.onAuthStateChanged(user=>setFbUser(user||null));
    });
    return ()=>{if(unsub)unsub();};
  },[]);

  // Firestore real-time listener — fires instantly when any device saves
  // (v23: removed _isApplyingRemote — it was written in three places and read
  //  in zero; the real remote-vs-edit detection is _remoteApplyId below.)
  // False on first render (initial state from localStorage is NOT a user edit).
  // Set to true after the first auto-save effect fires so subsequent renders are tracked.
  const _isMounted=useRef(false);
  const _hasPendingLocalEdit=useRef(false); // true only when the USER made a change not yet pushed
  // Incremented each time remote data is applied — lets the auto-save effect
  // distinguish "render caused by remote apply" from "render caused by user edit"
  const _remoteApplyId=useRef(0);
  const _lastSeenApplyId=useRef(0);
  // Persisted "dirty" flag captured at boot: if the previous session left local edits
  // that were never confirmed pushed, the cloud may be stale — used below to avoid a
  // stale cloud snapshot overwriting (and erasing) newer local data on load.
  const _bootDirty=useRef((()=>{try{return localStorage.getItem(DIRTY_KEY)==='1';}catch{return false;}})());
  // Whether localStorage actually held real user data at boot (vs. this being a
  // fresh browser/profile that fell back to SEED). A dirty flag alone is not
  // trustworthy evidence of unsynced work — if there was never any real local
  // data to begin with, "dirty" is a false positive and must never cause the
  // (empty) local state to be pushed over a real cloud save.
  const _localHadRealDataAtBoot=useRef((()=>{
    if(!persisted)return false;
    // SEED content is NOT real data. It ships with demo projects/clients/mentors/
    // notes, so a plain "arrays are non-empty" test reports true on any device
    // that merely opened the app once before logging in.
    let seeded=false;try{seeded=localStorage.getItem(SEEDED_KEY)==='1';}catch{}
    if(seeded)return false;
    const nonEmpty=arr=>Array.isArray(arr)&&arr.length>0;
    return nonEmpty(persisted.projects)||nonEmpty(persisted.clients)||nonEmpty(persisted.mentors)||
           nonEmpty(persisted.notes)||nonEmpty(persisted.tasks)||nonEmpty(persisted.socialPosts)||
           nonEmpty(persisted.galleryPosts)||nonEmpty(persisted.noteGroups);
  })());
  // Which account this device has already completed a sync with ('' = none).
  const _deviceSyncedUid=useRef((()=>{try{return localStorage.getItem(SYNCED_UID_KEY)||'';}catch{return '';}})());
  const _didInitialReconcile=useRef(false);
  const _hasRemoteData=useRef(false);      // true once the listener has seen a real 'state' doc
  const _applyMergedRef=useRef(null);      // lets "discard local & pull" re-run the merge on demand
  const [syncTick,setSyncTick]=useState(0); // bumped to force a save+push (e.g. to sync local up after reconcile)
  const [syncDetail,setSyncDetail]=useState(''); // human-readable reason when syncStatus==='error'
  const [syncNotice,setSyncNotice]=useState(''); // informational note (e.g. first login on this device)
  useEffect(()=>{
    if(!fbUser)return;
    if(!_fbDb)return;
    const col=_fbDb.collection('users').doc(fbUser.uid).collection('boardhub');
    setSyncStatus('syncing');
    // Listen to the entire boardhub subcollection — covers the main 'state' doc
    // plus the 'notes' and 'gallery' docs added in v3.1.
    // Backward compat: if a v3.0 install wrote everything into 'state', the
    // listener picks that up too and applies notes/gallery from there.
    const _remoteCache={};
    // Largest _updated across the cached remote docs, as ISO (''=unknown)
    const _remoteUpdatedAt=()=>{
      let max=0;
      Object.values(_remoteCache).forEach(d=>{
        const u=d&&d._updated;
        const t=u&&typeof u.toDate==='function'?u.toDate().getTime():(u?new Date(u).getTime():0);
        if(t>max)max=t;
      });
      return max?new Date(max).toISOString():'';
    };
    const applyMerged=()=>{
      const main=_remoteCache['state'];
      if(!main)return; // nothing yet
      // notes/gallery may live in their own docs (v3.1+) or still inside main (v3.0 legacy)
      const notesDoc=_remoteCache['notes'];
      const galleryDoc=_remoteCache['gallery'];
      const data={
        ...main,
        notes:(notesDoc&&isArr(notesDoc.notes)?notesDoc.notes:null)||main.notes||[],
        galleryPosts:(galleryDoc&&isArr(galleryDoc.galleryPosts)?galleryDoc.galleryPosts:null)||main.galleryPosts||[],
      };
      if(!data||typeof data._v!=='string')return;
      _hasRemoteData.current=true;
      // ── INITIAL RECONCILE — must run BEFORE the pending-edit gate ─────────────
      // v22 checked _hasPendingLocalEdit first, so a stray pre-login edit skipped
      // this block forever and the next push overwrote the cloud — the original
      // data-loss incident. v23.1 fixes the second half of the same problem:
      // last-write-wins is the WRONG rule for the first login of an account on a
      // device. At that moment the cloud holds the accumulated history while the
      // local state holds, at most, minutes of pre-login work — and if the device
      // had merely opened the app once before (persisting SEED: 3 demo projects,
      // clients, mentors, notes) that demo content read as "real data" with a
      // fresh timestamp and won the comparison. That is how a phone login pushed
      // the default save over a real cloud state.
      //
      // State machine on first remote contact:
      //   FIRST CONTACT with this account on this device (no SYNCED_UID match)
      //       → CLOUD ALWAYS WINS. Local is archived to history first, never
      //         pushed. Timestamps are not consulted: a fresh local stamp proves
      //         nothing about whose data is more complete.
      //   device already synced with this account (genuine offline-edit case)
      //       → last-write-wins by timestamp (±2min skew, ties favor local):
      //           local newer → keep local, archive cloud ('cloud-superseded')
      //           remote newer → apply remote; local goes to the pre-sync snapshot
      // In every branch, the losing side lands in the backup history first.
      if(!_didInitialReconcile.current){
        _didInitialReconcile.current=true;
        const firstContact=_deviceSyncedUid.current!==fbUser.uid;
        if(firstContact){
          try{
            const cur=_latestState.current;
            if(cur&&bhStateHasData(cur)){
              const{_updated,...cloudSnap}=data;
              // Skip a pure-noise entry when local already mirrors the cloud.
              if(bhSig(cur)!==bhSig(cloudSnap)){
                bhCapture(cur,'local-prelogin');
                setSyncNotice('Este dispositivo entrou na conta pela primeira vez: a versão da nuvem foi aplicada e os dados que estavam aqui foram guardados no Histórico de Backups.');
              }
            }
          }catch{}
          // fall through to apply the cloud state (flags cleared just below)
        }else{
          const localDirty=_bootDirty.current||_hasPendingLocalEdit.current;
          if(localDirty&&_localHadRealDataAtBoot.current){
            const remoteAt=_remoteUpdatedAt();
            let localAt='';try{localAt=localStorage.getItem(LAST_EDIT_KEY)||'';}catch{}
            const SKEW_MS=2*60*1000;
            const localWins=(!remoteAt||!localAt)
              ? true // can't compare → preserve local real data (previous safe default)
              : new Date(localAt).getTime()+SKEW_MS>=new Date(remoteAt).getTime();
            if(localWins){
              try{const{_updated,...cloudSnap}=data;bhCapture(cloudSnap,'cloud-superseded');}catch{}
              _hasPendingLocalEdit.current=true;
              try{localStorage.setItem(DIRTY_KEY,'1');}catch{}
              setSyncStatus('synced');
              setSyncTick(t=>t+1);
              return;
            }
            // remote is newer → fall through and apply it (pre-sync snapshot below)
          }
        }
      }else if(_hasPendingLocalEdit.current){
        // Live local edits not yet pushed — a snapshot must never overwrite them.
        // The push retry chain keeps the flag until the data is safely in the
        // cloud; the server echo of that push brings us back in sync afterwards.
        return;
      }
      const isArr2=v=>Array.isArray(v);
      try{
        const cur=lsLoad();
        if(cur)bhCapture(cur,'pre-sync');
      }catch(e){}
      _hasPendingLocalEdit.current=false;
      _remoteApplyId.current=_remoteApplyId.current+1;
      if(data.projects&&isArr2(data.projects)){
        setProjects(data.projects);
        setSelectedProject(prev=>prev?(data.projects.find(p=>p.id===prev.id)||prev):prev);
      }
      if(data.clients&&isArr2(data.clients))setClients(data.clients);
      if(data.mentors&&isArr2(data.mentors))setMentors(data.mentors);
      if(data.notes&&isArr2(data.notes))setNotes(data.notes);
      if(data.tasks&&isArr2(data.tasks))setTasks(data.tasks);
      if(data.socialPosts&&isArr2(data.socialPosts))setSocialPosts(data.socialPosts);
      if(data.galleryPosts&&isArr2(data.galleryPosts))setGalleryPosts(data.galleryPosts);
      if(data.galleryFolders&&isArr2(data.galleryFolders))setGalleryFolders(data.galleryFolders);
      if(data.noteGroups&&isArr2(data.noteGroups))setNoteGroups(data.noteGroups);
      if(data.pomoData&&typeof data.pomoData==='object'&&!Array.isArray(data.pomoData))setPomoData(data.pomoData);
      if(data.identity&&typeof data.identity.hubName==='string'){saveIdentity(data.identity);setIdentity(data.identity);}
      // This device now mirrors this account: record it so later boots use
      // last-write-wins instead of the first-contact rule, and drop the seed mark.
      try{localStorage.setItem(DIRTY_KEY,'0');localStorage.setItem(SYNCED_UID_KEY,fbUser.uid);localStorage.removeItem(SEEDED_KEY);}catch{}
      _deviceSyncedUid.current=fbUser.uid;
      setSyncDetail('');
      setSyncStatus('synced');
    };
    _applyMergedRef.current=applyMerged;
    const isArr=v=>Array.isArray(v);
    const unsub=col.onSnapshot(colSnap=>{
      // Brand-new account: the cloud legitimately has nothing. Without this the
      // status stayed stuck on "Sincronizando..." until the first local edit.
      if(colSnap.empty&&!colSnap.metadata.fromCache){setSyncStatus('synced');return;}
      let hasUpdates=false;
      colSnap.docChanges().forEach(change=>{
        const snap=change.doc;
        if(snap.metadata.hasPendingWrites)return; // skip our own echoes
        _remoteCache[snap.id]=snap.data();
        hasUpdates=true;
      });
      if(hasUpdates)applyMerged();
    },err=>{
      console.error('[BoardHub] Firestore listener:',err);
      setSyncDetail(err&&err.message||'');
      setSyncStatus('error');
    });
    return ()=>{_applyMergedRef.current=null;unsub();};
  },[fbUser]);

  // Auto-save localStorage + debounced push to Firestore
  const saveFlashTimer=useRef(null);
  const fbPushTimer=useRef(null);
  const _retryTimer=useRef(null);
  const _pushAttempt=useRef(0);
  useEffect(()=>{
    // Compare against _remoteApplyId to detect whether this render was triggered
    // by remote data being applied (vs. a genuine user edit).
    // This is reliable because React batches all the remote setters into one render,
    // and user edits are always separate renders.
    const isRemoteTrigger=_remoteApplyId.current!==_lastSeenApplyId.current;
    _lastSeenApplyId.current=_remoteApplyId.current;
    if(_isMounted.current&&!isRemoteTrigger){
      // Only mark as a user edit after mount — the very first run is localStorage
      // hydration, not a change the user made, so we must not block Firestore from
      // overwriting it with the authoritative cloud state.
      _hasPendingLocalEdit.current=true;
      try{
        localStorage.setItem(DIRTY_KEY,'1');
        localStorage.setItem(LAST_EDIT_KEY,new Date().toISOString()); // feeds last-write-wins
      }catch{}
    }
    _isMounted.current=true;
    const timer=setTimeout(()=>{
      const state={projects,clients,mentors,notes,tasks,socialPosts,galleryPosts,galleryFolders,pomoData,noteGroups,identity};
      lsSave(state);
      // Session snapshot: while actively editing, keep a history point every ~30 min
      try{
        const last=bhLastAt(); // chave leve, não o histórico inteiro (P1-3)
        if(!last||Date.now()-new Date(last).getTime()>30*60*1000)bhCapture(state,'auto');
      }catch{}
      setSaveFlash(true);
      clearTimeout(saveFlashTimer.current);
      saveFlashTimer.current=setTimeout(()=>setSaveFlash(false),1800);
      // Only push if the user actually made changes (not a remote echo)
      if(!fbUser||!_hasPendingLocalEdit.current)return;
      clearTimeout(fbPushTimer.current);
      fbPushTimer.current=setTimeout(()=>{
        const doPush=async()=>{
          // Firestore's 1MB limit is PER DOCUMENT. v22 measured the whole state
          // against 900KB and gave up — blocking sync in scenarios the 3-doc
          // split was designed to survive. Measure each payload separately and
          // name the offender so the user knows what to trim.
          const clean=stripInlineImages(state);
          const {notes,galleryPosts,...mainClean}=clean;
          const sz=o=>new Blob([JSON.stringify(o)]).size;
          const docs={'estado':sz(mainClean),'notas':sz(notes||[]),'galeria':sz(galleryPosts||[])};
          const over=Object.entries(docs).find(([,b])=>b>950000);
          if(over){
            const msg='Documento "'+over[0]+'" com '+Math.round(over[1]/1024)+'KB excede o limite de 1MB do Firestore. Divida notas/posts muito grandes.';
            console.warn('[BoardHub] '+msg);
            setSyncDetail(msg);setSyncStatus('error');
            return;
          }
          setSyncStatus('syncing');
          await pushState(state,fbUser.uid);
          _pushAttempt.current=0;
          _hasPendingLocalEdit.current=false; // push succeeded — clear flag so snapshot listener works
          // cloud now has the latest local data; this device is in sync with this account
          try{localStorage.setItem(DIRTY_KEY,'0');localStorage.setItem(SYNCED_UID_KEY,fbUser.uid);localStorage.removeItem(SEEDED_KEY);}catch{}
          _deviceSyncedUid.current=fbUser.uid;
          clearTimeout(_retryTimer.current);
          setSyncDetail('');
          setSyncStatus('synced');
        };
        const attemptPush=async()=>{
          try{await doPush();}
          catch(e){
            console.error('[BoardHub] Firestore push (attempt '+(_pushAttempt.current+1)+'):',e);
            setSyncDetail(e&&e.message||'');
            setSyncStatus('error');
            // v23: NEVER clear _hasPendingLocalEdit on failure. v22 cleared it after
            // the 2nd failed attempt "so the listener isn't blocked" — which let a
            // stale remote snapshot silently overwrite the very edits that failed
            // to upload. Local edits are only surrendered when they reach the cloud
            // or when the user explicitly discards them in the Sync screen.
            const delays=[8000,30000,120000];
            const d=delays[_pushAttempt.current];
            if(d!=null){
              _pushAttempt.current++;
              clearTimeout(_retryTimer.current);
              _retryTimer.current=setTimeout(attemptPush,d);
            }
            // Out of retries → stay in 'error'; the next edit, a manual push or
            // "discard local" resolves it. DIRTY stays '1' for the boot reconcile.
          }
        };
        _pushAttempt.current=0;
        attemptPush();
      },2000);
    },2500);
    return ()=>{clearTimeout(timer);clearTimeout(saveFlashTimer.current);clearTimeout(fbPushTimer.current);clearTimeout(_retryTimer.current);};
  },[projects,clients,mentors,notes,tasks,socialPosts,galleryPosts,galleryFolders,pomoData,noteGroups,identity,syncTick]);

  // Flush the current state to localStorage the moment the tab is hidden or closed.
  // Without this, adding content and immediately leaving could lose it to the auto-save
  // debounce window (the save hadn't fired yet).
  const _latestState=useRef(null);
  _latestState.current={projects,clients,mentors,notes,tasks,socialPosts,galleryPosts,galleryFolders,pomoData,noteGroups,identity};
  useEffect(()=>{
    const flush=()=>{try{if(_latestState.current)lsSave(_latestState.current);}catch(e){}};
    const onVis=()=>{if(document.visibilityState==='hidden')flush();};
    window.addEventListener('pagehide',flush);
    document.addEventListener('visibilitychange',onVis);
    return()=>{window.removeEventListener('pagehide',flush);document.removeEventListener('visibilitychange',onVis);};
  },[]);

  const selectedProjectRef=useRef(selectedProject);
  selectedProjectRef.current=selectedProject;

  const navigate=useCallback(v=>{
    const sp=selectedProjectRef.current;
    const hash=v==='project-detail'&&sp?`#project-detail/${sp.id}`:`#${v}`;
    if(window.location.hash!==hash)window.history.pushState(null,'',hash);
    setView(v);
    setNavTick(t=>t+1); // bumps even on same-view clicks so views can reset (e.g. close an open gallery post)
    if(v!=='project-detail')setSelectedProject(null);
  },[]);

  // Listen to browser back/forward
  const projectsRef=useRef(projects);
  projectsRef.current=projects;
  useEffect(()=>{
    const onPop=()=>{
      const{view:v,projectId}=parseHash();
      setView(v);
      if(v==='project-detail'&&projectId){
        setSelectedProject(prev=>{
          const found=projectsRef.current.find(p=>p.id===projectId);
          return found||prev;
        });
      }else{
        setSelectedProject(null);
      }
    };
    window.addEventListener('popstate',onPop);
    // Set initial hash without pushing a new entry
    const sp=selectedProjectRef.current;
    const initHash=view==='project-detail'&&sp?`#project-detail/${sp.id}`:`#${view}`;
    if(!window.location.hash)window.history.replaceState(null,'',initHash);
    return()=>window.removeEventListener('popstate',onPop);
  },[]);//eslint-disable-line react-hooks/exhaustive-deps
  const handleUpdateProject=useCallback(p=>{setProjects(prev=>prev.map(x=>x.id===p.id?p:x));setSelectedProject(p);},[]);
  const addProject=useCallback(p=>{
    setProjects(prev=>[p,...prev]);
    setShowNewProject(false);
    setSelectedProject(p);
    setView('project-detail');
    setNavTick(t=>t+1);
    window.history.pushState(null,'',`#project-detail/${p.id}`);
  },[]);
  const softDeleteProject=useCallback(id=>setProjects(prev=>prev.map(p=>p.id===id?{...p,deleted:true,deletedAt:new Date().toISOString()}:p)),[]);
  // Stable handler (reads current project via ref) so ProjectDetail's React.memo isn't
  // defeated by a fresh inline arrow on every App render (e.g. saveFlash/syncStatus toggles).
  const handleSoftDeleteSelected=useCallback(()=>{const sp=selectedProjectRef.current;if(sp)softDeleteProject(sp.id);},[softDeleteProject]);
  const handleSelectProject=useCallback(p=>{setSelectedProject(p);setView('project-detail');setNavTick(t=>t+1);window.history.pushState(null,'',`#project-detail/${p.id}`);},[]);
  const handleAddProject=useCallback(()=>setShowNewProject(true),[]);
  const handleCloseNewProject=useCallback(()=>setShowNewProject(false),[]);
  const handleBackToProjects=useCallback(()=>navigate('projects'),[navigate]);
  const handleAddGlobalMentor=useCallback(m=>{setMentors(prev=>[...prev,m]);},[]);
  const handleResetIdentity=useCallback(()=>{saveIdentity(null);localStorage.removeItem(ID_KEY);setIdentity(null);},[]);

  // Manual "Forçar sync" — routed through App so the pending/dirty flags are
  // cleared on success (v22's SyncHub pushed directly and left them stale).
  const manualPush=useCallback(async()=>{
    if(!fbUser)throw new Error('Sem login Google ativo.');
    setSyncStatus('syncing');
    try{
      await pushState(_latestState.current,fbUser.uid);
      _pushAttempt.current=0;
      _hasPendingLocalEdit.current=false;
      try{localStorage.setItem(DIRTY_KEY,'0');localStorage.setItem(SYNCED_UID_KEY,fbUser.uid);localStorage.removeItem(SEEDED_KEY);}catch{}
      _deviceSyncedUid.current=fbUser.uid;
      clearTimeout(_retryTimer.current);
      setSyncDetail('');
      setSyncStatus('synced');
    }catch(e){
      setSyncDetail(e&&e.message||'');
      setSyncStatus('error');
      throw e;
    }
  },[fbUser]);

  // Escape hatch when pushes keep failing: archive the local edits to the
  // backup history, drop the pending flag and re-apply the cached cloud state.
  const discardLocalAndPull=useCallback(()=>{
    if(!_hasRemoteData.current||!_applyMergedRef.current)return false;
    try{const cur=_latestState.current;if(cur&&bhStateHasData(cur))bhCapture(cur,'descartado');}catch{}
    _pushAttempt.current=0;
    clearTimeout(_retryTimer.current);
    _hasPendingLocalEdit.current=false;
    try{localStorage.setItem(DIRTY_KEY,'0');}catch{}
    _applyMergedRef.current();
    return true;
  },[]);

  const clearSave=()=>{
    if(!window.confirm('⚠️ Isso vai apagar TODOS os seus dados e restaurar o estado inicial. Essa ação é irreversível. Continuar?'))return;
    setProjects(SEED.projects);setClients(SEED.clients);setMentors(SEED.mentors);
    setNotes(SEED.notes);setTasks(SEED.tasks);setSocialPosts(SEED.socialPosts);setGalleryPosts(SEED.galleryPosts);setGalleryFolders(DEFAULT_GALLERY_FOLDERS);
    setNoteGroups(DEFAULT_NOTE_GROUPS);
    setPomoData({days:{}});
    navigate('dashboard');
  };

  const appState={projects,clients,mentors,notes,tasks,socialPosts,galleryPosts,galleryFolders,pomoData,noteGroups,identity};

  // When importing data: store any base64 images in IDB, replace with idb:// refs
  const ingestImages=async obj=>{
    if(Array.isArray(obj))return Promise.all(obj.map(ingestImages));
    if(obj&&typeof obj==='object'){const out={};for(const k of Object.keys(obj))out[k]=await ingestImages(obj[k]);return out;}
    if(typeof obj==='string'&&obj.startsWith('data:image')){
      try{
        // Use atob pipeline — fetch() on data URLs is unreliable on mobile Safari/Android
        const [header,b64]=obj.split(',');
        const mime=(header.match(/:(.*?);/)||[])[1]||'image/jpeg';
        const bin=atob(b64);
        const arr=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
        const blob=new Blob([arr],{type:mime});
        const key='img_'+Date.now()+'_'+Math.random().toString(36).slice(2);await idbPut(key,blob);return 'idb://'+key;
      }catch{}
    }
    return obj;
  };

  const handleImport=async data=>{
    // Shape validation. v22 checked truthiness only — an object where an array
    // was expected passed the check and crashed every .filter() downstream.
    // Mirrors the isArr guards the remote listener already applied.
    if(!data||typeof data!=='object'||Array.isArray(data))return false;
    const ingested=await ingestImages(data);
    const A=Array.isArray;
    let applied=0;
    if(A(ingested.projects)){setProjects(ingested.projects);applied++;}
    if(A(ingested.clients)){setClients(ingested.clients);applied++;}
    if(A(ingested.mentors)){setMentors(ingested.mentors);applied++;}
    if(A(ingested.notes)){setNotes(ingested.notes);applied++;}
    if(A(ingested.tasks)){setTasks(ingested.tasks);applied++;}
    if(A(ingested.socialPosts)){setSocialPosts(ingested.socialPosts);applied++;}
    if(A(ingested.galleryPosts)){setGalleryPosts(ingested.galleryPosts);applied++;}
    if(A(ingested.galleryFolders)){setGalleryFolders(ingested.galleryFolders);applied++;}
    if(A(ingested.noteGroups)){setNoteGroups(ingested.noteGroups);applied++;}
    if(ingested.pomoData&&typeof ingested.pomoData==='object'&&!A(ingested.pomoData)&&ingested.pomoData.days){setPomoData(ingested.pomoData);applied++;}
    if(ingested.identity&&typeof ingested.identity.hubName==='string'){saveIdentity(ingested.identity);setIdentity(ingested.identity);applied++;}
    return applied>0;
  };

  // Update page title when identity changes
  useEffect(()=>{
    if(identity){document.title=`${identity.hubName} — ${identity.osName}`;}
  },[identity]);

  const handleSetupDone=useCallback(id=>{setIdentity(id);},[]);

  return(
    <div style={{display:'flex',flexDirection:isMobile?'column':'row',minHeight:'100vh',overflowX:'hidden'}}>
      {/* A configuração inicial só aparece DEPOIS de entrar com o Google. Abrir o
          arquivo local não pede mais nada: sem identity a barra lateral já cai
          nos mesmos padrões que o modal produziria (splitHubName e o osName têm
          'BoardHub'/'Storyboard OS' embutidos), então pular a tela não deixa
          nada indefinido na tela.
          O !== 'syncing' evita um flash da tela cheia em quem já tem identity na
          nuvem: no login o listener do Firestore ainda vai aplicar data.identity,
          e sem essa espera o modal apareceria e sumiria sozinho a cada entrada.
          Quem realmente é conta nova chega em 'synced' sem identity e aí sim vê
          a configuração. */}
      {!identity&&fbUser&&syncStatus!=='syncing'&&<SetupModal onDone={handleSetupDone}/>}
      {showCmdPalette&&<CommandPalette projects={projects} notes={notes} mentors={mentors} clients={clients} galleryPosts={galleryPosts} onNavigate={v=>{navigate(v);setShowCmdPalette(false);}} onSelectProject={p=>{handleSelectProject(p);setShowCmdPalette(false);}} onClose={()=>setShowCmdPalette(false)}/>}
      {showQuickCapture&&<QuickCapture type={quickCaptureType} onClose={()=>setShowQuickCapture(false)} onAddTask={t=>setTasks(prev=>[...prev,t])} onAddNote={n=>setNotes(prev=>[n,...prev])}/>}
      {showShortcuts&&<ShortcutsModal onClose={()=>setShowShortcuts(false)}/>}
      {showNewProject&&<NewProjectModal onSave={addProject} onClose={handleCloseNewProject} isMobile={isMobile}/>}
      {isMobile
        ?<SidebarMobile activeView={view} setView={navigate} saveFlash={saveFlash} setForceMobile={setForceMobile} hubName={identity?.hubName} onOpenCmd={()=>setShowCmdPalette(true)}/>
        :<SidebarDesktop activeView={view} setView={navigate} saveFlash={saveFlash} isMobile={isMobile} setForceMobile={setForceMobile} hubName={identity?.hubName} osName={identity?.osName} projects={projects} tasks={tasks} onOpenCmd={()=>setShowCmdPalette(true)} onSelectProject={handleSelectProject}/>
      }
      <main key={view} className={(isMobile?'main-mobile':'')+' view-enter'} style={isMobile?{flex:1,padding:'16px 16px 80px',overflowY:'auto',minHeight:'calc(100vh - 56px)',paddingTop:0}:{marginLeft:220,flex:1,padding:'clamp(16px, 2.5vh, 40px) clamp(20px, 3vw, 48px)',overflowY:view==='dashboard'?'hidden':'auto',height:'100vh',boxSizing:'border-box',display:'flex',flexDirection:'column'}}>
        {view==='dashboard'      &&<Dashboard projects={projects} notes={notes} mentors={mentors} tasks={tasks} setTasks={setTasks} setView={navigate} setNotes={setNotes} pomoData={pomoData} setPomoData={setPomoData} isMobile={isMobile} setSelectedProject={setSelectedProject}/>}
        {view==='projects'       &&<ProjectsList projects={projects} setProjects={setProjects} onSelect={handleSelectProject} onAdd={handleAddProject} isMobile={isMobile}/>}
        {view==='project-detail' &&selectedProject&&<ProjectDetail project={selectedProject} onBack={handleBackToProjects} onUpdate={handleUpdateProject} onSoftDelete={handleSoftDeleteSelected} globalMentors={mentors} onAddGlobalMentor={handleAddGlobalMentor} galleryPosts={galleryPosts} galleryFolders={galleryFolders} isMobile={isMobile}/>}
        {view==='gallery'        &&<Gallery posts={galleryPosts} setPosts={setGalleryPosts} folders={galleryFolders} setFolders={setGalleryFolders} navTick={navTick} isMobile={isMobile}/>}
        {view==='ideas'          &&<IdeasLab notes={notes} setNotes={setNotes} isMobile={isMobile}/>}
        {view==='mentors'        &&<MentorsHub mentors={mentors} setMentors={setMentors} isMobile={isMobile}/>}
        {view==='social'         &&<Social posts={socialPosts} setPosts={setSocialPosts} isMobile={isMobile}/>}
        {view==='clients'        &&<Clients clients={clients} setClients={setClients} isMobile={isMobile}/>}
        {view==='sync'           &&<SyncHub appState={appState} onImport={handleImport} onClearSave={clearSave} fbUser={fbUser} syncStatus={syncStatus} syncDetail={syncDetail} syncNotice={syncNotice} onDismissNotice={()=>setSyncNotice('')} onManualPush={manualPush} onDiscardLocal={discardLocalAndPull} isMobile={isMobile} onResetIdentity={handleResetIdentity}/>}
      </main>
    </div>
  );
};
// Mount immediately — first paint is not blocked by any image I/O. Images resolve
// on demand: grids/covers are viewport-gated (<Img>/<BgImg>), opening a card warms
// a bounded prefix of thumbnails, and full-res is fetched only in the lightbox.
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
// Pre-warm THUMBNAILS (not originals) during idle, once the first view has
// settled — so navigating to a post finds its images already in memory.
setTimeout(()=>_idleCb(warmThumbCache),1200);
</script>
<!-- ── LOADER DE BOOT (P1-1) ──────────────────────────────────────────────
  DIAGNÓSTICO: o design single-file obrigava o @babel/standalone (~400KB de
  download) a transpilar 382KB de JSX em TODA abertura do app. Era de longe o
  maior custo de startup — maior que tudo que foi otimizado na camada de imagens.
  E é trabalho 100% repetido: o mesmo texto de entrada produz o mesmo JS de saída.
  ESTRATÉGIA: hash rápido do fonte → procura o bundle já compilado no IndexedDB.
    • hit  → executa o cache. O Babel nem é baixado.
    • miss → injeta o Babel, transpila, executa e grava para a próxima vez.
  A chave inclui o hash DO FONTE, então editar o arquivo invalida sozinho — não
  existe estado "cache velho de um arquivo novo".
  CUSTO HONESTO: o primeiro carregamento (e o primeiro após cada edição) fica um
  pouco MAIS lento, porque o download do Babel só começa depois que a consulta ao
  IDB falha, em vez de acontecer em paralelo com o React. Todos os demais
  carregamentos economizam ~400KB de rede e o transpile inteiro.
-->
<script>
(function(){
  var BABEL_URL='https://unpkg.com/@babel/standalone@7.23.9/babel.min.js';
  var DB='boardhub_bundle', STORE='bundles', CACHE_V=1;
  var RECOVER='bh_bundle_recover';
  var el=document.getElementById('bh-jsx-source');
  var src=el?el.textContent:'';

  // FNV-1a 32 bits. Colidir exigiria dois fontes DE MESMO COMPRIMENTO com o mesmo
  // hash — por isso o comprimento entra na chave. Errar a invalidação aqui
  // significa rodar código velho, então o par vale o byte extra.
  function hash(str){
    var h=0x811c9dc5;
    for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*0x01000193)>>>0;}
    return h.toString(16)+'-'+str.length;
  }
  var KEY='bundle_v'+CACHE_V+'_'+hash(src);

  function openDb(){return new Promise(function(res,rej){
    if(!window.indexedDB)return rej(new Error('sem IndexedDB'));
    var r=indexedDB.open(DB,1);
    r.onupgradeneeded=function(e){try{e.target.result.createObjectStore(STORE);}catch(_){}};
    r.onsuccess=function(e){res(e.target.result);};
    r.onerror=function(e){rej(e.target.error||new Error('open falhou'));};
  });}
  function get(db,k){return new Promise(function(res){
    try{var r=db.transaction(STORE,'readonly').objectStore(STORE).get(k);
      r.onsuccess=function(e){res(e.target.result);};r.onerror=function(){res(null);};
    }catch(_){res(null);}
  });}
  function put(db,k,v){return new Promise(function(res){
    try{var tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);
      tx.oncomplete=function(){res(true);};tx.onerror=function(){res(false);};tx.onabort=function(){res(false);};
    }catch(_){res(false);}
  });}
  // Só o bundle atual fica: sem isso cada edição do arquivo deixaria mais um
  // bundle de ~500KB para trás.
  function prune(db,keep){try{
    var os=db.transaction(STORE,'readwrite').objectStore(STORE), r=os.getAllKeys();
    r.onsuccess=function(e){(e.target.result||[]).forEach(function(k){if(k!==keep){try{os.delete(k);}catch(_){}}});};
  }catch(_){}}
  function wipe(){return new Promise(function(res){
    try{var r=indexedDB.deleteDatabase(DB);r.onsuccess=r.onerror=r.onblocked=function(){res(true);};}
    catch(_){res(false);}
  });}

  function loadBabel(){return new Promise(function(res,rej){
    if(window.Babel)return res();
    var t=document.createElement('script');
    t.src=BABEL_URL;
    t.onload=function(){window.Babel?res():rej(new Error('Babel carregou vazio'));};
    t.onerror=function(){rej(new Error('não foi possível baixar o Babel'));};
    document.head.appendChild(t);
  });}

  // new Function isola o parse da execução: um bundle corrompido estoura AQUI,
  // antes de qualquer efeito colateral, e o fallback para o Babel fica limpo.
  function compileOnly(code){return new Function(code);}

  function viaBabel(db){
    return loadBabel().then(function(){
      // runtime:'classic' EXPLÍCITO. Em @babel/standalone 7.23.9 o default do
      // preset react já é classic, mas esse default virou 'automatic' no Babel 8
      // — e automatic emite require("react/jsx-runtime"), que não existe numa
      // página que carrega o React como global UMD. O app quebraria inteiro, em
      // silêncio, no dia em que a URL do standalone subisse de major. Fixar aqui
      // custa nada e remove a dependência de um default que já mudou uma vez.
      var out=window.Babel.transform(src,{presets:[['react',{runtime:'classic'}]],sourceType:'script'});
      var code=out.code;
      compileOnly(code)();
      window.__bhBundleCache.source='babel';
      if(db)put(db,KEY,{v:CACHE_V,code:code,at:Date.now()}).then(function(ok){if(ok)prune(db,KEY);});
    });
  }

  window.__bhBundleCache={
    key:KEY,
    source:'pendente',
    clear:function(){return wipe();}
  };

  var db=null;
  openDb().then(function(d){db=d;return get(d,KEY);},function(){return null;})
  .then(function(rec){
    var code=rec&&rec.v===CACHE_V&&typeof rec.code==='string'&&rec.code.length>1000?rec.code:null;
    if(!code)return viaBabel(db);
    var fn;
    try{fn=compileOnly(code);}
    catch(e){
      // Sintaxe inválida: nada foi executado. Descarta e segue pelo Babel.
      console.warn('[BoardHub] cache de bundle inválido, recompilando:',e.message);
      if(db)put(db,KEY,null);
      return viaBabel(db);
    }
    try{fn();window.__bhBundleCache.source='cache';}
    catch(e){
      // Parseou mas estourou no meio da execução: o app pode estar meio
      // inicializado, então NÃO dá para simplesmente rodar o Babel por cima.
      // Limpa o cache e recarrega uma única vez (guarda em sessionStorage).
      var once=false;try{once=sessionStorage.getItem(RECOVER)==='1';}catch(_){}
      if(!once){
        try{sessionStorage.setItem(RECOVER,'1');}catch(_){}
        return wipe().then(function(){location.reload();});
      }
      throw e; // segunda falha: deixa o handler de erro do splash mostrar
    }
    try{sessionStorage.removeItem(RECOVER);}catch(_){}
  })
  .catch(function(e){
    console.error('[BoardHub] boot falhou:',e);
    window.dispatchEvent(new ErrorEvent('error',{message:'Falha ao inicializar: '+(e&&e.message||e)}));
  });
})();
</script>
</body>
</html>
