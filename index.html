// - RESPONSIVE HOOK -
// isMobileUA: true if the browser is on a phone/tablet, regardless of viewport.
// This is the reliable ground-truth when served over HTTPS (e.g. GitHub Pages),
// where some Android browsers report a larger layout viewport on first paint.
const isMobileUA=()=>/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent);

const useIsMobile=(breakpoint=768)=>{
  const detect=()=>{
    // UA check wins: if it's a real mobile device, always use mobile layout.
    if(isMobileUA())return true;
    try{
      const mq=window.matchMedia(`(max-width:${breakpoint}px)`);
      return mq.matches || window.innerWidth<=breakpoint;
    }catch{return window.innerWidth<=breakpoint;}
  };
  const [autoMobile,setAutoMobile]=useState(detect);
  useEffect(()=>{
    // Re-run once DOM is fully painted to catch late viewport settling
    setAutoMobile(detect());
    const mq=window.matchMedia(`(max-width:${breakpoint}px)`);
    // UA won't change at runtime, so only listen for resize (desktop responsive testing)
    const handler=()=>{ if(!isMobileUA()) setAutoMobile(detect()); };
    mq.addEventListener('change',handler);
    return()=>{ mq.removeEventListener('change',handler); };
  },[breakpoint]);
  return autoMobile;
};

// - INDEXEDDB IMAGE STORE (unlimited local storage) -
// Images are stored as Blobs in IndexedDB (no 5 MB quota like localStorage).
// The app state only holds a lightweight reference: "idb://<key>".
// At render time, useIdbUrl() resolves these references to object URLs.
const IDB_NAME='boardhub_images';
const IDB_STORE='images';
let _idb=null;
let _idbPending=null;

// FIX 1: Reset the cached IDB connection whenever it closes unexpectedly.
const _resetIdb=()=>{ _idb=null; _idbPending=null; };

const openIdb=()=>{
  // If we have a valid open connection, reuse it
  if(_idb && _idb.objectStoreNames){
    try{ _idb.transaction(IDB_STORE,'readonly').abort(); return Promise.resolve(_idb); }
    catch{ _idb=null; /* connection was stale - fall through to re-open */ }
  }
  // Coalesce concurrent open requests
  if(_idbPending)return _idbPending;
  _idbPending=new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess=e=>{
      _idb=e.target.result;
      _idbPending=null;
      _idb.onclose=_resetIdb;
      _idb.onerror=()=>_resetIdb();
      _idb.onversionchange=()=>{ _idb.close(); _resetIdb(); };
      res(_idb);
    };
    req.onerror=e=>{ _resetIdb(); rej(e.target.error); };
  });
  return _idbPending;
};

const idbPut=(key,blob)=>openIdb().then(db=>new Promise((res,rej)=>{
  try{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(blob,key);
    tx.oncomplete=()=>res();
    tx.onerror=e=>{ _resetIdb(); rej(e.target.error); };
  }catch(e){ _resetIdb(); rej(e); }
}));

const idbGet=(key)=>openIdb().then(db=>new Promise((res,rej)=>{
  try{
    const req=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>{ _resetIdb(); rej(e.target.error); };
  }catch(e){ _resetIdb(); rej(e); }
}));

// Hook: given an image src (may be idb://key, https://, or data:), returns a displayable URL.
// Checks _objUrlCache synchronously so prefetched images render with zero flash.
const _objUrlCache={};
// In-flight deduplication: if two components request the same key simultaneously,
// they share one IDB transaction instead of each opening their own.
const _inflightFetch={};

// ── BATCHED IDB READS ───────────────────────────────────────────────
// Every idbGet() opened its OWN transaction. Painting a grid of 40 images meant
// 40 transactions, each with its own commit round-trip on the IDB thread — they
// queue behind each other, so the last cell waited for 39 commits. Reads issued
// in the same tick are now coalesced into ONE readonly transaction with N get()s
// (React commits every visible cell's effect in the same tick, so a whole screen
// of images becomes a single transaction).
const _readQ=[];
let _readScheduled=false;
const _flushReads=()=>{
  _readScheduled=false;
  const batch=_readQ.splice(0,_readQ.length);
  if(!batch.length)return;
  const fail=()=>{_resetIdb();batch.forEach(i=>i.res(undefined));};
  openIdb().then(db=>{
    try{
      const tx=db.transaction(IDB_STORE,'readonly');
      const store=tx.objectStore(IDB_STORE);
      batch.forEach(item=>{
        try{
          const r=store.get(item.key);
          r.onsuccess=e=>item.res(e.target.result);
          r.onerror=()=>item.res(undefined);
        }catch{item.res(undefined);}
      });
      tx.onerror=fail;tx.onabort=fail;
    }catch{fail();}
  }).catch(fail);
};
// Same contract as idbGet, but coalesced. Used by every render-path read.
const idbGetBatched=key=>new Promise(res=>{
  _readQ.push({key,res});
  if(!_readScheduled){_readScheduled=true;Promise.resolve().then(_flushReads);}
});

// ── THUMBNAIL CACHE — THE HOT PATH ─────────────────────────────────────
// Grid/cover surfaces NEVER display an original, so thumbnails — not full-res
// blobs — are what stays resident. A 480px WebP is ~20-50KB: hundreds of them
// cost a few MB, versus hundreds of MB for the equivalent in originals, and each
// one decodes ~8× cheaper than the 1400px source it came from.
const THUMB_MAX=480;       // longest side, px — ample for any grid cell under object-fit:cover
const THUMB_CAP=600;       // resident thumbnails (~15-25MB worst case)
const _thumbCache={};      // idb key -> object URL for the thumbnail
const _thumbInflight={};   // idb key -> Promise (dedupes read/generation)
const _thumbOrder=[];      // keys, least-recently-shown first
const _touchThumb=key=>{
  const i=_thumbOrder.indexOf(key);
  if(i>=0)_thumbOrder.splice(i,1);
  _thumbOrder.push(key);
  while(_thumbOrder.length>THUMB_CAP){
    const old=_thumbOrder.shift();
    if(old!==key&&_thumbCache[old]){URL.revokeObjectURL(_thumbCache[old]);delete _thumbCache[old];}
  }
};

// ── FULL-RES OBJECT-URL CACHE ───────────────────────────────────────
// Originals are now LIGHTBOX-ONLY, so this cache holds a handful of entries
// instead of 100. Nothing on a grid pins a full-res blob anymore.
const OBJURL_CAP=12;
const _objUrlOrder=[]; // keys, least-recently-used first
const _touchObjUrl=key=>{
  const i=_objUrlOrder.indexOf(key);
  if(i>=0)_objUrlOrder.splice(i,1);
  _objUrlOrder.push(key);
  while(_objUrlOrder.length>OBJURL_CAP){
    const old=_objUrlOrder.shift();
    if(old!==key&&_objUrlCache[old]){URL.revokeObjectURL(_objUrlCache[old]);delete _objUrlCache[old];}
  }
};
// Read one idb:// blob at full resolution (deduped via _inflightFetch).
const _warmFull=key=>{
  if(_objUrlCache[key]){_touchObjUrl(key);return Promise.resolve(_objUrlCache[key]);}
  if(_inflightFetch[key])return _inflightFetch[key];
  _inflightFetch[key]=idbGetBatched(key).then(blob=>{
    if(blob&&!_objUrlCache[key]){_objUrlCache[key]=URL.createObjectURL(blob);_touchObjUrl(key);}
    delete _inflightFetch[key];return _objUrlCache[key]||'';
  }).catch(()=>{delete _inflightFetch[key];return '';});
  return _inflightFetch[key];
};
const _idleCb=cb=>((typeof window!=='undefined'&&window.requestIdleCallback)||(f=>setTimeout(()=>f({timeRemaining:()=>0}),200)))(cb);

// ── THUMBNAIL GENERATION THROTTLE ────────────────────────────────────
// Reading a thumbnail is cheap; GENERATING one (decode + downscale + encode) is
// not. Uncapped, a screen of 40 cold cells fired 40 concurrent decodes and the
// tab locked up. Generation is capped at 3 in flight — reads stay unthrottled.
const _genQ=[];let _genActive=0;const GEN_MAX=3;
const _genPump=()=>{
  while(_genActive<GEN_MAX&&_genQ.length){
    const job=_genQ.shift();_genActive++;
    job().then(()=>{_genActive--;_genPump();},()=>{_genActive--;_genPump();});
  }
};
const _enqueueGen=job=>new Promise(res=>{_genQ.push(()=>job().then(res,()=>res('')));_genPump();});

// On-open warm: pull an opened card's THUMBNAILS into memory right away, so its
// grid renders from cache instead of hitting IDB cell by cell. All the reads in
// one prefix collapse into a single transaction via idbGetBatched.
const WARM_PREFIX=80;
const warmKeys=(srcs,limit=WARM_PREFIX)=>{
  if(!Array.isArray(srcs))return;
  const keys=[];
  for(const s of srcs){
    if(typeof s==='string'&&s.startsWith('idb://')){
      const k=s.slice(6);
      if(!_thumbCache[k]){keys.push(k);if(keys.length>=limit)break;}
    }
  }
  keys.forEach(k=>{try{getThumbUrl(k);}catch{}});
};

// Boot warm: fill the thumbnail cache during idle so navigating to a post finds
// its images ALREADY in memory — the resolver then returns a URL synchronously
// on the first render (no placeholder frame, no fade). That "already there"
// property is what made the old build feel instant; it now costs thumbnails
// instead of originals. Second pass generates any thumbnail that doesn't exist
// yet (images uploaded before generation moved to upload time), throttled and
// bounded so an old library migrates in the background without janking.
const MIGRATE_CAP=150;
const warmThumbCache=()=>{
  if(!persisted)return;
  const keys=[];const seen=new Set();
  const collect=o=>{
    if(Array.isArray(o))o.forEach(collect);
    else if(o&&typeof o==='object')Object.values(o).forEach(collect);
    else if(typeof o==='string'&&o.startsWith('idb://')){const k=o.slice(6);if(!seen.has(k)){seen.add(k);keys.push(k);}}
  };
  collect(persisted);
  if(!keys.length)return;
  const missing=[];
  let i=0;
  const readStep=()=>{
    if(i>=keys.length||_thumbOrder.length>=THUMB_CAP){_idleCb(()=>genStep(0));return;}
    const slice=keys.slice(i,i+40);i+=40;
    Promise.all(slice.map(k=>{
      if(_thumbCache[k])return null;
      return idbGetBatched('thumb_'+k).then(tb=>{
        if(tb){if(!_thumbCache[k]){_thumbCache[k]=URL.createObjectURL(tb);_touchThumb(k);}}
        else missing.push(k);
      }).catch(()=>{});
    })).then(()=>_idleCb(readStep));
  };
  const genStep=j=>{
    if(j>=missing.length||j>=MIGRATE_CAP)return;
    Promise.all(missing.slice(j,j+3).map(k=>{try{return getThumbUrl(k,true);}catch{return null;}}))
      .then(()=>_idleCb(()=>genStep(j+3)));
  };
  _idleCb(readStep);
};

// --- THUMBNAIL LAYER ---------------------------------------------------------
// Grid/cover surfaces display a downscaled variant instead of the full image:
//   • cloud images (https) use a smaller variant by URL — no fetch of the 1400px original
//   • local idb:// images (offline fallback) get a canvas-generated 480px thumbnail,
//     persisted under "thumb_<key>" so it's generated only once. Local-only render
//     cache — never synced/exported (state only ever references the original idb://<key>).
// Full-resolution is still used wherever <Img full/> or <BgImg full/> is requested.
// Smaller variant of a cloud URL for grid display, with the original kept as onError fallback.
const _httpThumb=url=>{
  // Imgur direct link: i.imgur.com/<id>.<ext> -> <id>l.<ext> (640px thumbnail)
  const im=/^(https?:\/\/i\.imgur\.com\/)([A-Za-z0-9]{5,})(\.[A-Za-z0-9]+)(\?.*)?$/.exec(url);
  if(im)return `${im[1]}${im[2]}l${im[3]}${im[4]||''}`;
  // Unsplash: clamp the requested width (and quality) down for grid display
  if(/^https?:\/\/images\.unsplash\.com\//.test(url)&&/[?&]w=\d+/.test(url))
    return url.replace(/([?&]w=)\d+/,'$1640').replace(/([?&]q=)\d+/,'$170');
  return url;
};
// Preload a URL off-DOM; resolves with the URL once decoded (for progressive swaps).
const _preload=u=>new Promise(res=>{const im=new Image();im.onload=()=>res(u);im.onerror=()=>res('');im.src=u;});
const _makeThumbBlob=async blob=>{
  // Fast path: createImageBitmap decodes AND downscales off the main thread —
  // dramatically cheaper than new Image()+canvas for large source photos, which
  // is what made cold thumbnails feel slow on big posts.
  if(typeof createImageBitmap==='function'){
    try{
      // ONE decode. The previous version decoded twice (a probe for dimensions,
      // then a second resizing decode); a high-quality canvas downscale of the
      // already-decoded bitmap gets the same result for half the work.
      const bmp=await createImageBitmap(blob);
      const pw=bmp.width,ph=bmp.height;
      if(Math.max(pw,ph)<=THUMB_MAX){if(bmp.close)bmp.close();return blob;}
      const r=THUMB_MAX/Math.max(pw,ph),w=Math.round(pw*r),h=Math.round(ph*r);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const cx=c.getContext('2d');
      cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
      cx.drawImage(bmp,0,0,w,h);
      if(bmp.close)bmp.close();
      const out=await new Promise(res=>c.toBlob(b=>res(b||blob),'image/webp',0.72));
      return out;
    }catch{/* fall through to the classic path */}
  }
  // Fallback: classic Image + canvas (older engines / decode failures).
  return await new Promise(res=>{
    try{
      const img=new Image();const u=URL.createObjectURL(blob);
      img.onload=()=>{
        URL.revokeObjectURL(u);
        let{width:w,height:h}=img;
        if(Math.max(w,h)<=THUMB_MAX){res(blob);return;}
        const r=THUMB_MAX/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(b=>res(b||blob),'image/webp',0.72);
      };
      img.onerror=()=>{URL.revokeObjectURL(u);res(blob);};
      img.src=u;
    }catch{res(blob);}
  });
};
// Resolve a thumbnail object URL for an idb key. Reads the persisted thumbnail
// (batched, cheap); only a genuine miss pays generation, and generation is
// throttled so a screenful of cold cells can't stall the main thread.
const getThumbUrl=(key,knownMissing)=>{
  if(_thumbCache[key]){_touchThumb(key);return Promise.resolve(_thumbCache[key]);}
  if(_thumbInflight[key])return _thumbInflight[key];
  _thumbInflight[key]=(async()=>{
    try{
      const tb=knownMissing?null:await idbGetBatched('thumb_'+key);
      if(tb){
        if(!_thumbCache[key]){_thumbCache[key]=URL.createObjectURL(tb);}
        _touchThumb(key);delete _thumbInflight[key];return _thumbCache[key];
      }
      const u=await _enqueueGen(async()=>{
        if(_thumbCache[key]){_touchThumb(key);return _thumbCache[key];}
        const full=await idbGetBatched(key);
        if(!full)return '';
        // A video has no meaningful thumbnail here; generating one would store
        // the entire video under thumb_<key>. Serve the original instead.
        if(/^video\//i.test(full.type||'')){
          if(!_objUrlCache[key]){_objUrlCache[key]=URL.createObjectURL(full);_touchObjUrl(key);}
          return _objUrlCache[key];
        }
        const nb=await _makeThumbBlob(full);
        try{await idbPut('thumb_'+key,nb);}catch{/* render cache only — ignore quota */}
        if(!_thumbCache[key])_thumbCache[key]=URL.createObjectURL(nb);
        _touchThumb(key);return _thumbCache[key]||'';
      });
      delete _thumbInflight[key];
      return u;
    }catch{delete _thumbInflight[key];return '';}
  })();
  return _thumbInflight[key];
};

// Synchronous cache probe — no IDB, no promises. When it hits, the <img> gets
// its src in the SAME render it mounts: no placeholder frame, no fade-in, no
// second paint. This is the whole trick behind "instant".
const _syncUrl=(src,thumb)=>{
  if(!src||typeof src!=='string')return '';
  if(/^https?:\/\//.test(src))return _httpThumb(src);
  if(!src.startsWith('idb://'))return src;
  const key=src.slice(6);
  return thumb?(_thumbCache[key]||''):(_objUrlCache[key]||_thumbCache[key]||'');
};

// Unified resolver for idb://, https://, or data: sources. With thumb=true it prefers
// the downscaled variant for grid/cover display. Checks caches synchronously so
// prefetched images render with zero flash.
// v23.3: devolve [url, missing]. `missing` só fica true quando a resolução de um
// idb:// TERMINOU e não achou blob nenhum — é o que distingue "ainda carregando"
// (retângulo cinza mudo) de "este dispositivo não tem esse arquivo" (placeholder
// explicando). Sem esse sinal não há re-render: resolver para '' chama setState
// com o mesmo valor e o React descarta a atualização.
const useDisplayUrlState=(src,thumb)=>{
  const sync=_syncUrl(src,thumb);
  const [state,setState]=React.useState(sync);
  const [missing,setMissing]=React.useState(false);
  React.useEffect(()=>{
    setMissing(false);
    if(!src||typeof src!=='string'){setState(src||'');return;}
    let cancelled=false;
    // ── cloud / data ──
    if(!src.startsWith('idb://')){
      if(/^https?:\/\//.test(src)){
        const light=_httpThumb(src);
        setState(light);
        // Full mode: upgrade to the original once decoded, when a lighter
        // variant exists (Imgur/Unsplash). Firebase URLs have no variant.
        if(!thumb&&light!==src)_preload(src).then(u=>{if(!cancelled&&u)setState(u);});
      }else setState(src);
      return()=>{cancelled=true;};
    }
    // ── local idb:// ──
    const key=src.slice(6);
    if(thumb){
      // GRID: thumbnail ONLY. One small read, one small decode, one paint.
      // The previous build read the ORIGINAL here too, painted it, then swapped
      // to the thumbnail — two reads, two decodes (one of them a 1400px source
      // into a ~200px cell) and two paints per visible image. That double work,
      // multiplied by a screenful, is what made this slower than the build
      // before it. Nothing on a grid touches an original anymore.
      if(_thumbCache[key]){_touchThumb(key);setState(_thumbCache[key]);return()=>{cancelled=true;};}
      getThumbUrl(key).then(u=>{if(cancelled)return;if(u)setState(u);else setMissing(true);});
      return()=>{cancelled=true;};
    }
    // FULL (lightbox/hero): show the thumbnail instantly if it's around, then
    // swap in the original. One image at a time, so the read is never contended.
    if(_objUrlCache[key]){_touchObjUrl(key);setState(_objUrlCache[key]);return()=>{cancelled=true;};}
    const hadThumb=!!_thumbCache[key];
    if(hadThumb){_touchThumb(key);setState(_thumbCache[key]);}
    _warmFull(key).then(u=>{if(cancelled)return;if(u)setState(u);else if(!hadThumb)setMissing(true);});
    return()=>{cancelled=true;};
  },[src,thumb]);
  // A synchronous cache hit wins over stale state (e.g. the viewport gate just
  // flipped and the effect hasn't run yet) — that's the frame we're saving.
  const url=state||sync;
  return [url,missing&&!url];
};
const useDisplayUrl=(src,thumb)=>useDisplayUrlState(src,thumb)[0];
// Back-compat full-res resolver (used by Vid and any direct callers).
const useIdbUrl=src=>useDisplayUrl(src,false);

// v23.3 P1-2: key posicional em lista de imagem faz o React reusar o elemento
// errado quando a lista é reordenada ou perde um item — a imagem "pula" para
// outra célula e é redecodificada à toa. Com o reorder de entradas adicionado na
// v23 isso virou acionável na prática. A src é única dentro de um post, então
// ela É a identidade. O índice só entra como desempate quando a MESMA src
// aparece duas vezes; nesse caso os dois elementos são visualmente idênticos e
// reusar "o errado" não produz troca visível.
// O indexOf deixa isto O(n²) por lista. Em grades de dezenas de imagens é ruído,
// e evita reescrever cada grade para pré-calcular as keys.
const imgKey=(src,i,list)=>{const s=String(src);return list.indexOf(src)===i?s:s+'#'+i;};

// Placeholder para referência local cujo blob não existe NESTE dispositivo.
// A referência sobrevive ao sync (v23.3 P0-1); o blob não viaja. Mostrar isso
// explicitamente evita que um retângulo cinza seja lido como imagem corrompida.
const LOCAL_IMG_MISSING='Imagem local: o arquivo está em outro dispositivo. Abra o BoardHub nele para vê-la aqui — a referência foi preservada.';
const MissingLocalImg=()=><Icon name="image-off" size={16} style={{width:'55%',height:'55%',maxWidth:22,maxHeight:22,color:'var(--muted)',opacity:.5}}/>;

// Viewport gate for lazily reading LOCAL (idb://) images. Returns [refCallback,
// inView]. Reading a blob from IDB + generating its thumbnail is the expensive
// part of showing a local image, so we defer it until the element is within
// ~400px of the viewport (≈2-3 rows ahead). The first rows of a freshly opened
// card are on-screen immediately, so they resolve at once; rows further down
// wait until scrolled near (600px ≈ 3-4 rows of lookahead — affordable now that
// a row costs one batched thumbnail read). When gating is disabled (cloud/data images, priority
// images, or no IntersectionObserver) inView is true from the start.
const useInView=(enabled)=>{
  const hasIO=typeof IntersectionObserver!=='undefined';
  const [inView,setInView]=React.useState(!enabled||!hasIO);
  const obsRef=React.useRef(null);
  const setRef=React.useCallback(node=>{
    if(obsRef.current){obsRef.current.disconnect();obsRef.current=null;}
    if(inView||!enabled||!hasIO||!node)return;
    obsRef.current=new IntersectionObserver(entries=>{
      if(entries.some(e=>e.isIntersecting)){setInView(true);if(obsRef.current){obsRef.current.disconnect();obsRef.current=null;}}
    },{rootMargin:'600px'});
    obsRef.current.observe(node);
  },[inView,enabled,hasIO]);
  React.useEffect(()=>()=>{if(obsRef.current)obsRef.current.disconnect();},[]);
  return [setRef,inView];
};

// Img: auto-resolves idb:// refs. Uses the thumbnail variant by default for grid/cover
// surfaces; pass `full` for lightbox/hero views that need the original resolution.
const Img=({src,priority,full,thumb=!full,...props})=>{
  // Gate the expensive reads/downloads behind the viewport: all local (idb://)
  // images, plus full-res cloud originals. Cloud thumbnails stay ungated (cheap +
  // browser loading=lazy). Priority (lightbox) always loads at once.
  const gate=!priority&&typeof src==='string'&&(src.startsWith('idb://')||(!thumb&&/^https?:\/\//.test(src)));
  const [setRef,inView]=useInView(gate);
  const local=typeof src==='string'&&src.startsWith('idb://');
  const [url,missing]=useDisplayUrlState(gate&&!inView?null:src,thumb);
  if(!url)return (
    <div ref={setRef}
      title={missing?LOCAL_IMG_MISSING:undefined}
      role={missing?'img':undefined} aria-label={missing?LOCAL_IMG_MISSING:undefined} aria-hidden={missing?undefined:true}
      style={{background:'var(--border)',borderRadius:'inherit',display:'flex',alignItems:'center',justifyContent:'center',...(props.style||{})}}>
      {missing?<MissingLocalImg/>:null}
    </div>);
  // If a cloud thumbnail variant 404s, fall back to the original URL once.
  const onErr=thumb&&typeof src==='string'&&/^https?:\/\//.test(src)&&src!==url
    ?e=>{if(e.currentTarget.src!==src)e.currentTarget.src=src;}:props.onError;
  // Local blobs are already gated by our own IntersectionObserver — loading="lazy"
  // on top of that is a second, browser-controlled delay on a resource that is
  // already in memory. And the 250ms fade only reads as latency when the image
  // was there all along, so it's kept for network images only.
  return <img {...props} ref={setRef} src={url} loading={priority||local?'eager':'lazy'} decoding="async" onError={onErr}
    style={local?props.style:{...props.style,animation:'imgFadeIn .25s ease'}}/>;
};

// BgImg: a <div> whose background-image auto-resolves idb:// refs (thumbnail by default).
const BgImg=({src,className,style,children,full,thumb=!full,...props})=>{
  const gate=typeof src==='string'&&(src.startsWith('idb://')||(!thumb&&/^https?:\/\//.test(src)));
  const [setRef,inView]=useInView(gate);
  const [url,missing]=useDisplayUrlState(gate&&!inView?null:src,thumb);
  // O badge vai como FILHO (nenhum call site passa children) e leva o title
  // consigo, para não sobrescrever um title vindo de {...props} do chamador.
  const show=missing&&!url;
  return <div ref={setRef} className={className}
    style={{background:url?'none':'var(--border)',backgroundSize:'cover',
      ...(show?{display:'flex',alignItems:'center',justifyContent:'center'}:null),
      ...style,backgroundImage:url?`url(${url})`:'none'}} {...props}>
    {show?<span title={LOCAL_IMG_MISSING} role="img" aria-label={LOCAL_IMG_MISSING}
      style={{display:'flex',alignItems:'center',justifyContent:'center',width:'100%',height:'100%'}}><MissingLocalImg/></span>:null}
    {children}
  </div>;
};

// Video detection helper — checks extension in any URL format (idb://, https://, data:)
const isVideoSrc=src=>{
  if(!src||typeof src!=='string')return false;
  return /\.(mp4|webm|mov|avi|mkv|m4v|ogv)(\?|$|#)/i.test(src);
};

// Vid component: auto-resolves idb:// references for video elements
const Vid=({src,...props})=>{
  const url=useIdbUrl(src);
  if(!url)return null;
  return <video src={url} {...props}/>;
};

  const urls=[
    'https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js',

  _fbScriptsPromise=urls.reduce((chain,src)=>
    chain.then(()=>new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src=src;s.onload=res;s.onerror=rej;
      document.head.appendChild(s);
    }))

    console.warn('[BoardHub] Firebase scripts failed to load:',e);

};

// Firestore state doc ref for a user
const getStateRef=uid=>{

// v3.2: soft-deleted items now SYNC (global trash). Previously they were
// stripped before push while the apply side replaced whole arrays — the trash
// was device-local and silently emptied by the next remote echo. Doc size is
// bounded by the 30-day auto-purge (_purgeTrash) instead of by stripping.
// Push splits state across 3 documents to stay under Firestore's 1MB/doc limit:
//   state  → projects, clients, mentors, tasks, socialPosts, pomoData, identity, noteGroups, galleryFolders
//   notes  → notes array (can be 500KB+ with rich text)
//   gallery → galleryPosts array (300KB+ with metadata)
const pushState=async(state,uid)=>{
  const stateRef=getStateRef(uid);
  const notesRef=getNotesRef(uid);
  const galleryRef=getGalleryRef(uid);
  if(!stateRef||!notesRef||!galleryRef)throw new Error('Firebase not initialized');
  const clean=stripInlineImages(state);
  const ts=firebase.firestore.FieldValue.serverTimestamp();
  const {notes,galleryPosts,...main}=clean;
  await Promise.all([
    stateRef.set({...main,_v:'3.2',_updated:ts}),
    notesRef.set({notes:notes||[],_updated:ts}),
    galleryRef.set({galleryPosts:galleryPosts||[],_updated:ts}),
  ]);
};

// Upload a file to Firebase Storage, return permanent CDN URL

  const key='img_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+ext;

// Imgur fallback — anonymous client-ID upload
const IMGUR_CLIENT_ID='546c25a59c58ad7';
const _uploadImgur=async(file)=>{
  const b64=await readFile(file);
  const body=new FormData();
  body.append('image',b64.split(',')[1]);
  body.append('type','base64');
  const ac=new AbortController();const _t=setTimeout(()=>ac.abort(),15000);
  const res=await fetch('https://api.imgur.com/3/image',{method:'POST',headers:{Authorization:`Client-ID ${IMGUR_CLIENT_ID}`},body,signal:ac.signal});
  clearTimeout(_t);
  const json=await res.json();
  if(json.success)return json.data.link;
  throw new Error('Imgur upload failed');
};

// IDB local fallback
const _isVideoFile=f=>/^video\//i.test(f.type||'');
const _storeIdb=async(file)=>{
  const ext=(file.name||'').split('.').pop()||'bin';
  const key='media_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+ext;
  await idbPut(key,file);
  // Build the 480px thumbnail NOW, while the upload is already running, instead
  // of on first view. Browsing then never pays decode+encode: the grid only ever
  // reads a small blob that is already there. Also seeds the in-memory cache, so
  // the image just added renders instantly without touching IDB at all.
  if(!_isVideoFile(file)){
    try{
      const tb=await _makeThumbBlob(file);
      await idbPut('thumb_'+key,tb);
      if(!_thumbCache[key]){_thumbCache[key]=URL.createObjectURL(tb);_touchThumb(key);}
    }catch{/* a thumbnail is an optimisation — never fail an upload over it */}
  }
  return 'idb://'+key;
};

// Core upload: Firebase Storage \u2192 Imgur (images only) \u2192 IDB

// Compress image to max 1400px longest side, 0.82 quality WebP/JPEG before any store/upload.
// Skips videos, GIFs, and files already under 60KB.
const _compressImage=async(file)=>{
  if(_isVideoFile(file)||file.type==='image/gif')return file;
  if(file.size<60*1024)return file;
  return new Promise(res=>{
    const img=new Image();
    const objUrl=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(objUrl);
      const MAX=1400;
      let{width:w,height:h}=img;
      if(w>MAX||h>MAX){const r=MAX/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      // v23.3 P1-4: PNG era re-encodado como PNG, com quality ignorado. O canvas
      // descarta a paleta indexada do original, então um screenshot PNG de 500KB
      // podia SAIR MAIOR do que entrou. WebP suporta alpha, então não há motivo
      // para preservar PNG aqui. E o resultado só é aceito se realmente encolheu
      // — vale também para JPEG já bem comprimido, que antes sempre era trocado
      // pelo WebP mesmo quando o WebP ficava maior.
      // (engine sem suporte a WebP no toBlob cai para PNG; nesse caso o
      //  comparativo de tamanho devolve o original e nada piora)
      canvas.toBlob(blob=>res(blob&&blob.size<file.size?blob:file),'image/webp',0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(objUrl);res(file);};
    img.src=objUrl;
  });
};

// Imgur uploads are PUBLIC (anyone with the URL can view). For client work

  return _imgurAllowed;
};

const _uploadSingle=async(file)=>{
  if(!_isVideoFile(file))file=await _compressImage(file);

    if(onProgress)onProgress(i+1,files.length);
    // Only delay on Imgur path (Firebase has no rate limit)
    if(i<files.length-1&&(!_fbReady||!_fbAuth?.currentUser)){
      await new Promise(r=>setTimeout(r,BULK_UPLOAD_DELAY_MS));
    }
  }
  return results;
};

// Re-upload all local IDB images to the cloud, return updated state
const reuploadLocalImages=async(state,onProgress)=>{
  const keys=[...collectIdbKeys(state)];
  if(keys.length===0)return state;
  const map={};
  for(let i=0;i<keys.length;i++){
    const key=keys[i];
    try{
      const blob=await idbGet(key);
      if(blob){
        const file=new File([blob],key,{type:blob.type||'image/jpeg'});
        let url=null;
        if(_fbReady&&_fbAuth?.currentUser){try{url=await uploadToFirebaseStorage(file,_fbAuth.currentUser.uid);}catch{}}
        if(!url){try{url=await _uploadImgur(file);}catch{}}
        if(url)map['idb://'+key]=url;
      }
    }catch(e){console.warn('[BoardHub] Re-upload failed for',key,e);}
    if(onProgress)onProgress(i+1,keys.length);
    if(!(_fbReady&&_fbAuth?.currentUser)&&i<keys.length-1){
      await new Promise(r=>setTimeout(r,BULK_UPLOAD_DELAY_MS));
    }
  }
  return rehydrateIdbRefs(state,map);
};
// v23.3 P0-1: esta função (antiga stripBase64) misturava DUAS coisas que não têm
// nada a ver uma com a outra:
//   • "data:image/...;base64,..." é PAYLOAD. Pode ter megabytes e estoura o
//     limite de 1MB/documento do Firestore. Tem que sair mesmo.
//   • "idb://<key>" é REFERÊNCIA — ~40 bytes apontando para um blob local.
//     Não ameaça limite nenhum.
// Apagar a referência no push fazia a nuvem gravar '' no lugar dela; como o
// listener aplica ARRAYS INTEIROS (setGalleryPosts(data.galleryPosts)), esse ''
// voltava para o estado local na sincronização seguinte e matava a referência no
// próprio dispositivo que tinha o blob. 24h depois o gcIdb não encontrava mais a
// referência e apagava o blob — perda irreversível.
// Um dispositivo que não tem o blob mostra placeholder (ver <Img>/<BgImg>), o que
// é infinitamente melhor que destruir a referência no dispositivo que tem.
const isInlineImg=v=>typeof v==='string'&&v.startsWith('data:image');
const stripInlineImages=obj=>{
  if(Array.isArray(obj))return obj.map(stripInlineImages);
  if(obj&&typeof obj==='object'){const out={};for(const k of Object.keys(obj))out[k]=stripInlineImages(obj[k]);return out;}
  if(isInlineImg(obj))return '';
  return obj;
};

// Resolve idb:// keys \u2192 base64 data URLs (used for manual JSON export)
const blobToBase64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});
const resolveIdbRefs=async obj=>{
  if(Array.isArray(obj))return Promise.all(obj.map(resolveIdbRefs));
  if(obj&&typeof obj==='object'){const out={};for(const k of Object.keys(obj))out[k]=await resolveIdbRefs(obj[k]);return out;}
  if(typeof obj==='string'&&obj.startsWith('idb://')){
    try{const blob=await idbGet(obj.slice(6));if(blob)return await blobToBase64(blob);}catch{}
    return '';
  }
  return obj;
};

// Build a self-contained JSON export (images embedded as base64)
const buildSyncPayload=async(state,includeImages=true)=>{
  // (o ramo includeImages=false hoje não tem call site; se voltar a ter, um export
  //  "sem imagens" deve derrubar também os idb://, que não resolvem em outra máquina)
  const resolved=includeImages?await resolveIdbRefs(state):stripInlineImages(state);
  return JSON.stringify({...resolved,_v:'3.0',_exported:new Date().toISOString()});
};

// Collect every unique idb:// key referenced in the state tree
const collectIdbKeys=(obj,set=new Set())=>{
  if(Array.isArray(obj)){obj.forEach(x=>collectIdbKeys(x,set));}
  else if(obj&&typeof obj==='object'){Object.values(obj).forEach(x=>collectIdbKeys(x,set));}
  else if(typeof obj==='string'&&obj.startsWith('idb://'))set.add(obj.slice(6));
  return set;
};

// Replace idb:// refs in obj using a { 'idb://key': 'https://...' } map
const rehydrateIdbRefs=(obj,map)=>{
  if(Array.isArray(obj))return obj.map(x=>rehydrateIdbRefs(x,map));
  if(obj&&typeof obj==='object'){const out={};for(const k of Object.keys(obj))out[k]=rehydrateIdbRefs(obj[k],map);return out;}
  if(typeof obj==='string'&&obj.startsWith('idb://')&&map[obj])return map[obj];
  return obj;
};

// - IDB GARBAGE COLLECTOR -
// Blobs were never deleted: re-uploaded images, removed references and their
// thumb_ variants accumulated forever. GC deletes blobs not referenced by the
// live state OR by any snapshot in the backup history (a restore must still
// find its images!). Safety rails: keys embed their creation timestamp —
// only blobs older than 24h are eligible, so an image uploaded moments ago
// (state not yet flushed to localStorage) can never be collected.
const _idbKeyAgeMs=k=>{
  const m=/^(?:thumb_)?(?:media_|img_)(\d+)_/.exec(k);
  return m?Date.now()-Number(m[1]):0; // unknown format → treat as fresh (keep)
};
// v23.3 P0-1 — SEGUNDA CONDIÇÃO ALÉM DE "NÃO REFERENCIADO".
// "não está no estado agora" é evidência fraca demais para apagar um blob: uma
// aplicação remota ruim, um estado que não carregou ou um import pela metade
// produzem exatamente esse sintoma. O GC agora exige que a chave apareça sem
// referência em DUAS varreduras separadas por pelo menos 24h — o ledger abaixo
// guarda a primeira observação. Se a referência voltar (undo, restauração de
// backup, sync que reconcilia), a chave sai do ledger e o relógio zera.
// Custo: um blob órfão sobrevive ~1 dia a mais. Na dúvida, não coletar.
const GC_LEDGER_KEY='boardhub_gc_pending';
const GC_GRACE_MS=24*3600*1000;
const _gcLedgerLoad=()=>{try{const o=JSON.parse(localStorage.getItem(GC_LEDGER_KEY));return o&&typeof o==='object'&&!Array.isArray(o)?o:{};}catch{return{};}};
const _gcLedgerSave=o=>{try{Object.keys(o).length?localStorage.setItem(GC_LEDGER_KEY,JSON.stringify(o)):localStorage.removeItem(GC_LEDGER_KEY);}catch{}};
const gcIdb=async()=>{
  try{
    const live=lsLoad();
    // Estado ausente ou ilegível: não há como saber o que está referenciado, e
    // "nada referenciado" significaria apagar TUDO. É a mesma classe de falha do
    // incidente original (estado vazio sobrescrevendo dados reais) — abortar.
    if(!live)return;
    const referenced=new Set();
    collectIdbKeys(live,referenced);
    // F1: o histórico agora vem do IndexedDB. bhHistoryFull() REJEITA se não
    // conseguir ler — e essa rejeição sai pelo catch lá embaixo, abortando a
    // varredura. É de propósito: um backup que não pôde ser lido não é um backup
    // que não referencia nada. Se isto virar `.catch(()=>[])` algum dia, o GC
    // volta a apagar blobs vivos, que foi o P0-1 da v23.3.
    if(!_bhReady)await bhHistoryInit();
    if(!_bhReady)return; // histórico indisponível → não dá para saber o que é órfão
    (await bhHistoryFull()).forEach(e=>{if(e&&e.state)collectIdbKeys(e.state,referenced);});
    const db=await openIdb();
    const keys=await new Promise((res,rej)=>{
      const r=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).getAllKeys();
      r.onsuccess=e=>res(e.target.result||[]);r.onerror=e=>rej(e.target.error);
    });
    const now=Date.now();
    const ledger=_gcLedgerLoad();
    const nextLedger={};
    const doomed=[];
    for(const k of keys){
      if(typeof k!=='string')continue;
      const base=k.startsWith('thumb_')?k.slice(6):k;
      if(referenced.has(base))continue;            // vivo → nem entra no ledger
      if(_idbKeyAgeMs(k)<GC_GRACE_MS)continue;     // recém-criado, estado pode não ter sido gravado
      const first=ledger[k];
      const firstMs=first?new Date(first).getTime():NaN;
      if(!(firstMs>0)){nextLedger[k]=new Date(now).toISOString();continue;} // 1ª observação: só anota
      if(now-firstMs<GC_GRACE_MS){nextLedger[k]=first;continue;}            // ainda dentro da carência
      doomed.push(k);
    }
    _gcLedgerSave(nextLedger);
    if(!doomed.length)return;
    const tx=db.transaction(IDB_STORE,'readwrite');
    doomed.forEach(k=>tx.objectStore(IDB_STORE).delete(k));
    await new Promise(res=>{tx.oncomplete=res;tx.onerror=res;tx.onabort=res;});
    console.info('[BoardHub] IDB GC: removed',doomed.length,'orphaned blob(s) after grace period.');
  }catch(e){console.warn('[BoardHub] IDB GC skipped:',e);}
};

// - MODAL -
// v23: stacked modals used to all close on one Escape (each added its own
// document-level listener). A shared stack makes Escape close only the top
// one. Also adds a minimal focus trap + focus restore for keyboard use.
const _modalStack=[];
const Modal=({title,onClose,children,width=480})=>{
  const boxRef=useRef(null);
  const tokenRef=useRef(null);
  // v23.3 P2-1: os 4 call sites passam arrow inline, então onClose troca de
  // identidade a cada render do pai. Com [onClose] nas deps, qualquer render do
  // pai desmontava e remontava este effect: o modal saía e voltava para o
  // _modalStack e — o sintoma visível — o box era re-focado, roubando o foco do
  // input que o usuário estava preenchendo dentro do modal. O ref mantém o
  // handler sempre atual sem que a identidade dele participe do ciclo de vida.
  const onCloseRef=useRef(onClose);
  useEffect(()=>{onCloseRef.current=onClose;});
  useEffect(()=>{
    const token={};tokenRef.current=token;_modalStack.push(token);
    const prevFocus=document.activeElement;
    boxRef.current?.focus();
    const h=e=>{
      if(e.key==='Escape'&&_modalStack[_modalStack.length-1]===token)onCloseRef.current();
    };
    document.addEventListener('keydown',h);
    return()=>{
      document.removeEventListener('keydown',h);
      const i=_modalStack.indexOf(token);if(i>-1)_modalStack.splice(i,1);
      if(prevFocus&&prevFocus.focus)try{prevFocus.focus();}catch{}
    };
  },[]);
  const trapTab=e=>{
    if(e.key!=='Tab'||!boxRef.current)return;
    const f=boxRef.current.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  };
  return ReactDOM.createPortal(
  <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal" style={{maxWidth:width}} ref={boxRef} tabIndex={-1} role="dialog" aria-modal="true" aria-label={typeof title==='string'?title:undefined} onKeyDown={trapTab}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
        <h2 className="serif" style={{fontSize:'1.6rem',fontWeight:400,margin:0}}>{title}</h2>
        <button className="btn btn-ghost" onClick={onClose} style={{padding:6}} aria-label="Fechar"><Icon name="x" size={18}/></button>
      </div>
      {children}
    </div>
  </div>
  , document.body);};

const CommandPalette=({projects,notes,mentors,clients,galleryPosts,onNavigate,onSelectProject,onClose})=>{
  const [query,setQuery]=useState('');
  const [activeIdx,setActiveIdx]=useState(0);
  const inputRef=useRef(null);
  useEffect(()=>{inputRef.current?.focus();},[]);
  useEffect(()=>{setActiveIdx(0);},[query]);
  const results=useMemo(()=>{
    const q=query.toLowerCase().trim();
    const items=[];
    const navs=[
      {title:'Vis\u00e3o Geral',icon:'layout-dashboard',action:()=>onNavigate('dashboard'),type:'Navegar'},
      {title:'Projetos',icon:'folder-open',action:()=>onNavigate('projects'),type:'Navegar'},
      {title:'Galeria',icon:'image',action:()=>onNavigate('gallery'),type:'Navegar'},
      {title:'Anotações',icon:'notebook-pen',action:()=>onNavigate('ideas'),type:'Navegar'},
      {title:'Mentores',icon:'graduation-cap',action:()=>onNavigate('mentors'),type:'Navegar'},
      {title:'Social Media',icon:'share-2',action:()=>onNavigate('social'),type:'Navegar'},
      {title:'Clientes',icon:'users',action:()=>onNavigate('clients'),type:'Navegar'},
      {title:'Sincronizar',icon:'refresh-cw',action:()=>onNavigate('sync'),type:'Navegar'},
    ];
    if(!q){
      items.push(...navs.slice(0,4));
      (projects||[]).filter(p=>!p.deleted).slice(0,4).forEach(p=>{
        items.push({title:p.title,icon:'folder-open',meta:p.client||p.status,action:()=>{onSelectProject(p);},type:'Projeto'});
      });
      return items;
    }
    navs.forEach(n=>{if(n.title.toLowerCase().includes(q))items.push(n);});
    (projects||[]).filter(p=>!p.deleted).forEach(p=>{
      if((p.title||'').toLowerCase().includes(q)||(p.client||'').toLowerCase().includes(q)){
        items.push({title:p.title,icon:'folder-open',meta:p.client||p.status,action:()=>{onSelectProject(p);},type:'Projeto'});
      }
    });
    (notes||[]).filter(n=>!n.deleted).forEach(n=>{
      if((n.title||'').toLowerCase().includes(q)||(n.content||'').toLowerCase().includes(q)){
        items.push({title:n.title,icon:'file-text',meta:(n.content||'').slice(0,60),action:()=>onNavigate('ideas'),type:'Nota'});
      }
    });
    (mentors||[]).filter(m=>!m.deleted).forEach(m=>{
      if((m.name||'').toLowerCase().includes(q)||(m.area||'').toLowerCase().includes(q)){
        items.push({title:m.name,icon:'graduation-cap',meta:m.area,action:()=>onNavigate('mentors'),type:'Mentor'});
      }
    });
    (clients||[]).filter(c=>!c.deleted).forEach(c=>{
      if((c.name||'').toLowerCase().includes(q)||(c.company||'').toLowerCase().includes(q)){
        items.push({title:c.name,icon:'users',meta:c.company,action:()=>onNavigate('clients'),type:'Cliente'});
      }
    });
    (galleryPosts||[]).filter(g=>!g.deleted).forEach(g=>{
      if((g.title||'').toLowerCase().includes(q)||(g.content||'').toLowerCase().includes(q)){
        items.push({title:g.title,icon:'image',meta:g.content?.slice(0,50),action:()=>onNavigate('gallery'),type:'Galeria'});
      }
    });
    return items.slice(0,12);
  },[query,projects,notes,mentors,clients,galleryPosts]);
  const run=idx=>{const item=results[idx];if(item){item.action();onClose();}};
  const onKey=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();setActiveIdx(i=>Math.min(i+1,results.length-1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setActiveIdx(i=>Math.max(i-1,0));}
    else if(e.key==='Enter'){e.preventDefault();run(activeIdx);}
    else if(e.key==='Escape'){onClose();}
  };
  return ReactDOM.createPortal(
    <div className="cmd-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="cmd-palette" onKeyDown={onKey}>
        <div className="cmd-input-wrap">
          <Icon name="search" size={18} style={{color:'var(--muted)',flexShrink:0}}/>
          <input ref={inputRef} className="cmd-input" placeholder="Buscar projetos, notas, mentores..." value={query} onChange={e=>setQuery(e.target.value)}/>
          <span className="cmd-kbd">ESC</span>
        </div>
        <div className="cmd-results">
          {results.length===0&&<div className="cmd-empty"><Icon name="search" size={24} style={{opacity:.3,marginBottom:4}}/><div>Nenhum resultado</div></div>}
          {results.map((item,i)=>(
            <div key={i} className={'cmd-item'+(i===activeIdx?' cmd-active':'')} onClick={()=>run(i)} onMouseEnter={()=>setActiveIdx(i)}>
              <div className="cmd-item-icon"><Icon name={item.icon} size={15}/></div>
              <div style={{flex:1,minWidth:0}}>
                <div className="cmd-item-title">{item.title}</div>
                {item.meta&&<div className="cmd-item-meta">{item.meta}</div>}
              </div>
              <span style={{fontSize:'.66rem',color:'var(--border-2)',flexShrink:0,fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>{item.type}</span>
            </div>
          ))}
        </div>
        <div className="cmd-footer">
          <span style={{display:'flex',alignItems:'center',gap:4}}><span className="cmd-kbd" style={{fontSize:'.6rem'}}>{'\u2191\u2193'}</span> navegar</span>
          <span style={{display:'flex',alignItems:'center',gap:4}}><span className="cmd-kbd" style={{fontSize:'.6rem'}}>{'\u21b5'}</span> abrir</span>
          <span style={{display:'flex',alignItems:'center',gap:4}}><span className="cmd-kbd" style={{fontSize:'.6rem'}}>esc</span> fechar</span>
        </div>
      </div>
    </div>,
    document.body
  );
};

// - POMODORO -
const POMO_LS = 'boardhub_pomo_v3';

const pomoLoad = function() {
  try {
    var s = localStorage.getItem(POMO_LS);
    if (s) {
      var parsed = JSON.parse(s);
      // Migrate old format that used dailySeconds/historicalSeconds
      if (typeof parsed.dailySeconds !== 'undefined') {
        var today2 = localDateISO();
        var days2 = {};
        if (parsed.dailySeconds > 0) days2[today2] = parsed.dailySeconds;
        return { days: days2 };
      }
      return parsed;
    }
    // Try older key
    var old = localStorage.getItem('boardhub_pomodoro_stats');
    if (old) {
      var p2 = JSON.parse(old);
      var t2 = localDateISO();
      var d2 = {};
      if (p2.dailySeconds > 0) d2[t2] = p2.dailySeconds;
      return { days: d2 };
    }
  } catch(e) {}
  return { days: {} };
};

const pomoSave = function(d) {
  try { localStorage.setItem(POMO_LS, JSON.stringify(d)); } catch(e) {}
};

const pomoTodayKey = function() {
  return localDateISO();
};

const pomoFmtSecs = function(secs) {
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm';
  return secs + 's';
};

const pomoFmtDay = function(dateStr) {
  try {
    var d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
  } catch(e) { return dateStr; }
};

const pomoFmtMonth = function(mk) {
  try {
    var parts = mk.split('-');
    return new Date(+parts[0], +parts[1]-1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  } catch(e) { return mk; }
};

const POMO_TIMER_LS = 'boardhub_pomo_timer_v1';
const pomoTimerSave = d => { try { localStorage.setItem(POMO_TIMER_LS, JSON.stringify(d)); } catch(e) {} };
