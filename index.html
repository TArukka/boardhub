// Web Audio sounds — elevator music aesthetic
// Shared AudioContext — avoids browser's ~6 concurrent context limit
let _sharedAudioCtx = null;
const _getAudioCtx = () => {
  try {
    if (!_sharedAudioCtx || _sharedAudioCtx.state === 'closed') {
      _sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (_sharedAudioCtx.state === 'suspended') _sharedAudioCtx.resume();
    return _sharedAudioCtx;
  } catch(e) { return null; }
};
// _playNote used by medal sounds (routes to ctx.destination directly)
const _playNote = (ctx, freq, startT, vol, decay, type='triangle', detune=0) => {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startT);
  if(detune) osc.detune.setValueAtTime(detune, startT);
  gain.gain.setValueAtTime(0, startT);
  gain.gain.linearRampToValueAtTime(vol, startT + 0.018);
  gain.gain.exponentialRampToValueAtTime(0.001, startT + decay);
  osc.start(startT); osc.stop(startT + decay + 0.05);
};

// Convolution reverb — creates a warm, roomy ambience
const _makeReverb = (ctx, secs=1.8) => {
  const len = Math.ceil(ctx.sampleRate * secs);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for(let i=0; i<len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2) * 0.5;
  }
  const conv = ctx.createConvolver();
  conv.buffer = buf;
  return conv;
};

const playPomoSound = (type) => {
  try {
    const ctx = _getAudioCtx();
    if (!ctx) return;

    // Reverb wet/dry chain
    const reverb   = _makeReverb(ctx);
    const dryBus   = ctx.createGain();
    const wetBus   = ctx.createGain();
    dryBus.gain.value = 0.62;
    wetBus.gain.value = 0.42;
    reverb.connect(wetBus);
    wetBus.connect(ctx.destination);
    dryBus.connect(ctx.destination);

    // All notes feed into this bus → split to dry + reverb
    const bus = ctx.createGain();
    bus.connect(dryBus);
    bus.connect(reverb);

    const note = (freq, t, vol, decay, type='triangle', detune=0) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(bus);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if(detune) osc.detune.setValueAtTime(detune, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.04);   // soft mallet attack
      gain.gain.exponentialRampToValueAtTime(0.001, t + decay);
      osc.start(t); osc.stop(t + decay + 0.15);
    };

    const T = ctx.currentTime;

    if (type === 'work_end') {
      // Grand lobby chime — lush Cmaj9 descending arpeggio, 5 notes over ~1.5s
      // B4 → G4 → E4 → C4 → G3  (warm, resolved, "you may proceed")
      [
        [493.88, 0.00, 0.24, 2.8],
        [392.00, 0.30, 0.22, 2.6],
        [329.63, 0.60, 0.21, 2.5],
        [261.63, 0.90, 0.20, 2.4],
        [196.00, 1.20, 0.16, 2.2],
      ].forEach(([f,dt,v,d]) => {
        note(f,  T+dt, v,    d,      'triangle');
        note(f,  T+dt, v*0.15, d*0.7, 'sine', 3); // warmth shimmer
      });
    } else if (type === 'break_end') {
      // Single resonant lobby ding — A5, clean and clear with a fading bloom
      note(880.00, T,      0.22, 3.0, 'triangle');
      note(880.00, T,      0.09, 2.2, 'sine', 2.5);
      note(1174.66,T+0.01, 0.06, 1.8, 'sine');        // soft maj3rd overtone
    } else if (type === 'pause') {
      // Two descending notes — a settling "going down" fifth, G4→D4
      note(392.00, T,      0.16, 1.4, 'triangle');
      note(293.66, T+0.22, 0.14, 1.3, 'triangle');
    } else if (type === 'start') {
      // Rising pentatonic triad — C5→E5→G5, optimistic lift
      note(523.25, T,      0.18, 1.5, 'triangle');
      note(659.25, T+0.20, 0.18, 1.5, 'triangle');
      note(783.99, T+0.40, 0.20, 1.7, 'triangle');
    }
  } catch(e) {}
};

// M1 — sons de mudança de andamento (era playMedalSound, por faixa de medalha).
// Aqui só o DESPACHO mudou de nome: as cadências continuam as mesmas de antes,
// porque reescrevê-las é trabalho do M2, onde cada andamento ganha uma cadência
// no seu próprio BPM. Renomear sem tocar no despacho deixaria o som mudo — os
// níveis viraram adagio/andante/moderato/allegro/vivace e nenhum 'bronze'
// casaria mais.
// M2 — os BPM vivem aqui, fora do componente, porque servem a TRÊS consumidores:
// o rótulo em DAY_TIERS, a cadência de mudança de faixa e o metrônomo. DAY_TIERS
// LÊ desta tabela em vez de repetir os números — duas listas iguais divergem
// silenciosamente, e o sintoma seria o app mostrar um andamento e tocar outro.
const TEMPO_BPM = { adagio:66, andante:76, moderato:108, allegro:132, vivace:160 };

const METRO_LS = 'boardhub_metronome';
const metronomeLoad = () => { try { return localStorage.getItem(METRO_LS) === '1'; } catch(e) { return false; } };
const metronomeSave = v => { try { localStorage.setItem(METRO_LS, v ? '1' : '0'); } catch(e) {} };

const playTempoSound = (level) => {
  try {
    const ctx = _getAudioCtx();
    if (!ctx) return;
    const bpm = TEMPO_BPM[level];
    if (!bpm || level === 'adagio') return;  // a faixa base não anuncia nada
    const t0   = ctx.currentTime;
    const beat = 60 / bpm;                  // duração da semínima NESTE andamento
    const ring = beat * 2.4;                // andamento lento deixa a nota soar mais

    // Pentatônica de Dó. O número de graus cresce com a pressa do andamento, e
    // o Vivace corre em colcheias — é a mesma figura, cada vez mais apertada.
    const ESCALA = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
    const passos = { andante:3, moderato:4, allegro:5, vivace:7 }[level];
    const salto  = level === 'vivace' ? 0.5 : 1;

    for (let i = 0; i < passos; i++) {
      const t = t0 + i * beat * salto;
      _playNote(ctx, ESCALA[i], t, 0.26, ring, 'triangle');
      if (level !== 'andante') _playNote(ctx, ESCALA[i], t, 0.09, ring * 0.75, 'sine', 5);
    }
    // Acorde de chegada, uma semínima depois da última nota.
    const fim = t0 + passos * beat * salto;
    [523.25, 659.25, 783.99].forEach((f, i) => {
      _playNote(ctx, f * (level === 'vivace' ? 2 : 1), fim + i * 0.05, 0.15, ring * 1.6, 'triangle');
    });
  } catch(e) {}
};

// M2.1 — o clique audível do metrônomo foi REMOVIDO. Batia ~2×/s durante a
// sessão inteira e atrapalhava mais do que ajudava, que é o oposto do que um
// app de foco deveria fazer. O pulso continua existindo, só que VISUAL: o
// pêndulo do mostrador (ver .bh-pendulum). As cadências de mudança de faixa
// ficam — aquelas tocam 4× por dia, não 3.600.

const PomodoroTimer = ({ pomoData, setPomoData }) => {
  const BREAK_SECS = 5 * 60;
  const MAX_FOCUS_MINS = 60;

  const _init = (() => {
    const saved = pomoTimerLoad();
    const focusMins = saved?.focusMins ?? 30;
    if (saved && saved.isActive && saved.endTimestamp) {
      const remaining = Math.max(0, Math.round((saved.endTimestamp - Date.now()) / 1000));
      return { timeLeft: remaining > 0 ? remaining : focusMins*60, isActive: remaining > 0, mode: saved.mode||'focus', endTimestamp: remaining > 0 ? saved.endTimestamp : null, focusMins };
    }
    return { timeLeft: saved?.timeLeft ?? focusMins*60, isActive: false, mode: saved?.mode||'focus', endTimestamp: null, focusMins };
  })();

  const [focusMins, setFocusMins] = useState(_init.focusMins);
  const [timeLeft, setTimeLeft]   = useState(_init.timeLeft);
  const [isActive, setIsActive]   = useState(_init.isActive);
  const [mode, setMode]           = useState(_init.mode);
  const [showStats, setShowStats] = useState(false);
  const [isDragging, setIsDragging] = useState(false);
  const [metronomeOn, setMetronomeOn] = useState(metronomeLoad);

  const focusMinsRef    = useRef(focusMins);
  const modeRef         = useRef(mode);
  const timeLeftRef     = useRef(_init.timeLeft);
  const isActiveRef     = useRef(_init.isActive);
  const endTimestampRef = useRef(_init.endTimestamp ?? (_init.isActive ? Date.now() + _init.timeLeft*1000 : null));
  const unsavedSecsRef  = useRef(0);
  const pendingSecsRef  = useRef(0);
  const circleRef       = useRef(null);
  const [displayUnsaved, setDisplayUnsaved] = useState(0);

  focusMinsRef.current = focusMins;
  modeRef.current      = mode;
  timeLeftRef.current  = timeLeft;
  isActiveRef.current  = isActive;

  const persist = (active, tLeft, m, fMins) => {
    const fm = fMins ?? focusMinsRef.current;
    if (active && tLeft > 0)
      pomoTimerSave({ isActive: true, mode: m, endTimestamp: Date.now() + tLeft*1000, timeLeft: tLeft, focusMins: fm });
    else
      pomoTimerSave({ isActive: false, mode: m, timeLeft: tLeft, focusMins: fm });
  };

  const flushPomoSecsRef = useRef(null);
  flushPomoSecsRef.current = () => {
    if (unsavedSecsRef.current <= 0) return;
    const secs = unsavedSecsRef.current;
    unsavedSecsRef.current = 0; setDisplayUnsaved(0);
    pendingSecsRef.current += secs;
    setPomoData(prev => {
      const key = pomoTodayKey();
      const newDays = { ...prev.days };
      newDays[key] = (newDays[key] || 0) + secs;
      pendingSecsRef.current = Math.max(0, pendingSecsRef.current - secs);
      return { days: newDays };
    });
  };
  const flushPomoSecs = () => flushPomoSecsRef.current?.();
  useEffect(() => { return () => flushPomoSecsRef.current?.(); }, [isActive]);

  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === 'visible' && isActiveRef.current && endTimestampRef.current) {
        const remaining = Math.max(0, Math.round((endTimestampRef.current - Date.now()) / 1000));
        // Quando o navegador congela a aba (mobile em segundo plano, ou Chrome
        // após ~5min oculta), o setInterval para de rodar e ninguém credita o
        // tempo decorrido. Sem isto, adiantar o relógio aqui apagaria esse
        // trecho: o próximo tick compararia com o valor já adiantado e veria
        // delta 0. Credita a diferença antes de mover o ponteiro.
        const delta = Math.max(0, timeLeftRef.current - remaining);
        if (modeRef.current === 'focus' && delta > 0) {
          unsavedSecsRef.current += delta; setDisplayUnsaved(unsavedSecsRef.current);
          if (unsavedSecsRef.current >= 30) flushPomoSecs();
        }
        setTimeLeft(remaining); timeLeftRef.current = remaining;
      }
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, []);

  useEffect(() => {
    if (!isActive) return;
    if (!endTimestampRef.current)
      endTimestampRef.current = Date.now() + timeLeftRef.current * 1000;
    persist(true, timeLeftRef.current, modeRef.current);
    const id = setInterval(() => {
      const remaining = Math.max(0, Math.round((endTimestampRef.current - Date.now()) / 1000));
      if (remaining <= 0) {
        if (modeRef.current === 'focus') {
          // O laço acima só credita a diferença entre ticks, então o último
          // trecho (de timeLeft até 0) ficaria de fora — é o que fazia uma
          // sessão de 30min registrar 29m59s. Credita o resto antes do flush.
          if (timeLeftRef.current > 0) { unsavedSecsRef.current += timeLeftRef.current; setDisplayUnsaved(unsavedSecsRef.current); }
          flushPomoSecs(); playPomoSound('work_end');
          fireNotification('Pomodoro', 'Sessão de foco encerrada! Hora de pausar. ☕');
          setMode('break'); modeRef.current = 'break';
          setTimeLeft(BREAK_SECS); timeLeftRef.current = BREAK_SECS;
          endTimestampRef.current = Date.now() + BREAK_SECS * 1000;
          persist(true, BREAK_SECS, 'break'); return;
        } else {
          clearInterval(id); playPomoSound('break_end');
          fireNotification('Pomodoro', 'Pausa encerrada! Pronto para focar?');
          const fm = focusMinsRef.current; const fs = fm * 60;
          setMode('focus'); modeRef.current = 'focus';
          setTimeLeft(fs); timeLeftRef.current = fs;
          setIsActive(false); isActiveRef.current = false;
          endTimestampRef.current = null; persist(false, fs, 'focus', fm); return;
        }
      }
      const prev = timeLeftRef.current; const delta = Math.max(0, prev - remaining);
      if (modeRef.current === 'focus' && delta > 0) {
        unsavedSecsRef.current += delta; setDisplayUnsaved(unsavedSecsRef.current);
        if (unsavedSecsRef.current >= 30) flushPomoSecs();
      }
      setTimeLeft(remaining); timeLeftRef.current = remaining;
      if (remaining % 10 === 0) persist(true, remaining, modeRef.current);
    }, 500);
    return () => clearInterval(id);
  }, [isActive]);

  const requestNotifPermission = () => { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); };
  const fireNotification = (title, body) => { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); };

  const toggle = () => {
    requestNotifPermission();
    setIsActive(a => {
      const next = !a;
      if (next) { playPomoSound('start'); endTimestampRef.current = Date.now() + timeLeftRef.current*1000; persist(true, timeLeftRef.current, modeRef.current); }
      else { playPomoSound('pause'); endTimestampRef.current = null; persist(false, timeLeftRef.current, modeRef.current); flushPomoSecs(); }
      return next;
    });
  };
  const reset = () => {
    setIsActive(false); isActiveRef.current = false; endTimestampRef.current = null;
    setMode('focus'); modeRef.current = 'focus';
    const fs = focusMinsRef.current * 60;
    setTimeLeft(fs); timeLeftRef.current = fs;
    persist(false, fs, 'focus'); flushPomoSecs();
  };

  // M2.1 — arrastar na VERTICAL para definir a duração, como se corre o peso na
  // haste de um metrônomo: mais alto = mais lento = sessão mais longa. O gesto
  // angular de antes existia porque o mostrador era um círculo; sobre uma
  // pirâmide ele não quer dizer nada, e o feedback (o peso subindo) precisa ir
  // na mesma direção do dedo, senão o controle briga com o desenho.
  const getDragMins = (e) => {
    if (!circleRef.current) return null;
    const rect = circleRef.current.getBoundingClientRect();
    const t = 1 - Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
    return Math.max(1, Math.min(MAX_FOCUS_MINS, Math.round(t * MAX_FOCUS_MINS)));
  };
  const handlePointerDown = (e) => {
    if (isActive || mode !== 'focus') return;
    e.preventDefault(); circleRef.current?.setPointerCapture(e.pointerId); setIsDragging(true);
    const mins = getDragMins(e);
    if (mins) { setFocusMins(mins); focusMinsRef.current = mins; setTimeLeft(mins*60); timeLeftRef.current = mins*60; }
  };
  const handlePointerMove = (e) => {
    if (!isDragging) return;
    const mins = getDragMins(e);
    if (mins) { setFocusMins(mins); focusMinsRef.current = mins; setTimeLeft(mins*60); timeLeftRef.current = mins*60; }
  };
  const handlePointerUp = (e) => {
    if (!isDragging) return; setIsDragging(false);
    const mins = getDragMins(e);
    if (mins) { setFocusMins(mins); focusMinsRef.current = mins; const fs=mins*60; setTimeLeft(fs); timeLeftRef.current=fs; persist(false,fs,'focus',mins); }
  };

  // Display — geometria do metrônomo abstrato (viewBox 76×76).
  // Pirâmide truncada, pivô da haste logo acima da divisória, e o compartimento
  // da base guardando a leitura de tempo e a barra de progresso.
  // A pirâmide ocupa só o topo (y 4→56) para sobrar faixa livre embaixo: a barra
  // de progresso mora FORA do corpo, e a leitura de tempo mora DENTRO do
  // compartimento da base sem encostar no contorno. Antes as duas coisas
  // disputavam o mesmo espaço e os números cruzavam o desenho.
  const MET_PATH = 'M30,4 L46,4 L70,56 L6,56 Z';
  const MET_PIVOT_Y = 34;      // articulação da haste, acima da divisória
  const MET_ARM_TOP = 10;      // altura máxima do peso
  const MET_DIV_Y = 37;        // divisória do compartimento
  // Base do texto por MEDIÇÃO, não por chute: em Cormorant 12px a caixa tem 15
  // de altura e a ascendente é 11. Compartimento de 37→56 = 19 de altura, então
  // centralizar deixa a caixa em 39→54 — 2 de folga da divisória e 2 do
  // contorno. Chutar aqui foi o que fez os números encostarem na base.
  const MET_TEXT_Y = 50;
  const BAR_X = 7, BAR_W = 62, BAR_Y = 64;

  const pct = mode === 'focus'
    ? (isActive ? timeLeft / (focusMins*60) : focusMins / MAX_FOCUS_MINS)
    : timeLeft / BREAK_SECS;
  const isFocus = mode === 'focus';
  const mins = Math.floor(timeLeft/60); const secs = timeLeft % 60;
  const timeStr = (mins<10?'0':'')+mins+':'+(secs<10?'0':'')+secs;
  // Altura do peso na haste = duração escolhida. Mais alto = sessão mais longa,
  // que é a mesma direção do arrasto e a mesma convenção do instrumento real
  // (peso em cima = mais lento).
  const weightY = MET_PIVOT_Y - (Math.min(MAX_FOCUS_MINS,focusMins)/MAX_FOCUS_MINS) * (MET_PIVOT_Y - MET_ARM_TOP);

  const todaySecs = ((pomoData.days||{})[pomoTodayKey()])||0;
  const todayDisplay = todaySecs + displayUnsaved + pendingSecsRef.current;

  // M1 — as faixas de foco viraram ANDAMENTOS. Medalha de videogame (estrela,
  // bronze, prata, troféu, diamante) não combina com um app em Cormorant
  // Garamond sobre papel quente, e andamento
  // é a unidade certa: mede ritmo de trabalho, que é exatamente o que o contador
  // mede. Os BPM são as faixas convencionais de cada marcação — servem de valor
  // real para o metrônomo opcional (M2), não são enfeite.
  //
  // OS PISOS NÃO MUDARAM (0/2/4/6/8h). Renomear é seguro; mexer em piso
  // reescreveria retroativamente a faixa de todo dia já registrado no histórico.
  const DAY_TIERS = [
    {level:'adagio',   name:'Adagio',   bpm:TEMPO_BPM.adagio,   glyph:'♩', color:'var(--muted)',   floor:0},
    {level:'andante',  name:'Andante',  bpm:TEMPO_BPM.andante,  glyph:'♩', color:'var(--tempo-1)', floor:2*3600},
    {level:'moderato', name:'Moderato', bpm:TEMPO_BPM.moderato, glyph:'♪', color:'var(--tempo-2)', floor:4*3600},
    {level:'allegro',  name:'Allegro',  bpm:TEMPO_BPM.allegro,  glyph:'♪', color:'var(--tempo-3)', floor:6*3600},
    {level:'vivace',   name:'Vivace',   bpm:TEMPO_BPM.vivace,   glyph:'♫', color:'var(--tempo-4)', floor:8*3600},
  ];
  // Adagio é a faixa base, não conquista — a UI o trata como o antigo 'none'.
  const isBaseTempo = t => t.level === 'adagio';
  const getStarLevel = s => { for(let i=DAY_TIERS.length-1;i>=0;i--) if(s>=DAY_TIERS[i].floor) return DAY_TIERS[i]; return DAY_TIERS[0]; };
  const currentStar = getStarLevel(todayDisplay);
  const prevStarLevelRef = React.useRef(currentStar.level);
  React.useEffect(()=>{
    if(prevStarLevelRef.current!==currentStar.level&&!isBaseTempo(currentStar)) playTempoSound(currentStar.level);
    prevStarLevelRef.current=currentStar.level;
  },[currentStar.level]);
  const nextStarTier = DAY_TIERS.find(t=>t.floor>currentStar.floor)||null;
  const progressToNext = nextStarTier ? Math.min(100,((todayDisplay-currentStar.floor)/(nextStarTier.floor-currentStar.floor))*100) : 100;

  // M2.1 — o pulso agora é VISUAL. Não há agendador: a haste é uma animação CSS
  // cuja duração sai do BPM, então o navegador cuida do tempo no compositor e
  // não há timer em JS para derrapar, vazar ou disputar a thread com o autosave.
  // Meia oscilação = uma semínima: a haste cruza o centro uma vez por batida, que
  // é exatamente o que um metrônomo mecânico faz.
  const beatSecs   = 60 / currentStar.bpm;
  const pendulumOn = metronomeOn && isActive && mode === 'focus';

  // M1 — o mês usa DINÂMICA, não andamento. Repetir Adagio…Vivace nas duas
  // escalas confundiria as leituras: o dia mede RITMO (quão rápido você foi
  // hoje), o mês mede VOLUME (quanto acumulou). Dinâmica é a palavra italiana
  // certa para volume, e a convenção de gravura já manda escrevê-la em serifada
  // itálica — que é o que o Cormorant faz bem.
  // Os pisos seguem intocados (0/40/80/120/160h): renomeação pura.
  const MONTH_TIERS = [
    {level:'pianissimo',name:'Pianissimo',mark:'pp', color:'var(--muted)',   floor:0},
    {level:'piano',     name:'Piano',     mark:'p',  color:'var(--tempo-1)', floor:40*3600},
    {level:'mezzoforte',name:'Mezzo-forte',mark:'mf',color:'var(--tempo-2)', floor:80*3600},
    {level:'forte',     name:'Forte',     mark:'f',  color:'var(--tempo-3)', floor:120*3600},
    {level:'fortissimo',name:'Fortissimo',mark:'ff', color:'var(--tempo-4)', floor:160*3600},
  ];
  const isBaseDynamic = t => t.level === 'pianissimo';
  const getMonthMedal = s => { for(let i=MONTH_TIERS.length-1;i>=0;i--) if(s>=MONTH_TIERS[i].floor) return MONTH_TIERS[i]; return MONTH_TIERS[0]; };

  const dayEntries = useMemo(()=>{
    const entries=Object.entries(pomoData.days||{});
    const filtered=entries.filter(e=>e[0]!=='_total'&&e[0].length===10&&e[1]>0);
    filtered.sort((a,b)=>b[0].localeCompare(a[0]));
    return filtered.slice(0,60);
  },[pomoData]);
  const monthEntries = useMemo(()=>{
    const months={};
    for(const[day,s] of Object.entries(pomoData.days||{})){
      if(day==='_total'||day.length!==10)continue;
      const mk=day.slice(0,7); months[mk]=(months[mk]||0)+s;
    }
    const result=Object.entries(months); result.sort((a,b)=>b[0].localeCompare(a[0])); return result;
  },[pomoData]);

  const [statsTab,setStatsTab]=useState('days');
  const maxDay   = dayEntries.reduce((m,e)=>Math.max(m,e[1]),1);
  const maxMonth = monthEntries.reduce((m,e)=>Math.max(m,e[1]),1);
  const totalAll = dayEntries.reduce((sum,e)=>sum+e[1],0);

  return(
    <div style={{marginBottom:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:7}}>
        <span className="label">Pomodoro</span>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{display:'inline-flex',alignItems:'center',gap:6,padding:'3px 10px',borderRadius:20,background:isFocus?'rgba(28,25,23,.06)':'#E8F5EC',color:isFocus?'var(--muted)':'#276b3e',fontSize:'.7rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em'}}>
            <Icon name={isFocus?'brain':'coffee'} size={11}/>
            {isFocus?'Foco':'Pausa'}
          </div>
          <button className="btn btn-ghost" onClick={()=>setShowStats(s=>!s)} title="Histórico de foco"
            style={{padding:'4px 8px',borderRadius:6,background:showStats?'var(--text)':'transparent',color:showStats?'white':'var(--muted)'}}>
            <Icon name="timer" size={14}/>
          </button>
        </div>
      </div>

      {!showStats&&(
        <div className="card" style={{padding:'12px 16px',display:'flex',alignItems:'center',gap:14}}>
          <div ref={circleRef}
            style={{position:'relative',width:76,height:76,flexShrink:0,cursor:(!isActive&&isFocus)?'pointer':'default',touchAction:'none',userSelect:'none'}}
            onPointerDown={handlePointerDown} onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}>
            {/* M2.1 — o mostrador virou um metrônomo abstrato: pirâmide truncada,
                haste com peso, e a leitura na base, como no de madeira. O
                progresso da sessão continua sendo o MESMO mecanismo de antes —
                stroke-dashoffset — só que percorrendo o contorno da pirâmide em
                vez da circunferência. pathLength="100" normaliza o perímetro,
                então a conta de porcentagem não precisa saber a geometria. */}
            <svg width="76" height="76" viewBox="0 0 76 76" style={{position:'absolute',top:0,left:0}}>
              {/* Corpo: contorno fixo. O tempo NÃO é mais desenhado por cima do
                  contorno — vira a barra da base, mais fácil de ler de relance
                  do que um traço percorrendo um polígono. */}
              <path d={MET_PATH} fill="none" stroke="var(--border-2)" strokeWidth="2.5" strokeLinejoin="round"/>
              <line x1="14.8" y1={MET_DIV_Y} x2="61.2" y2={MET_DIV_Y} stroke="var(--border)" strokeWidth="1.5"/>

              {/* Haste e peso. O peso mora DENTRO do grupo que gira, como no
                  instrumento real, e sua altura é a duração escolhida. */}
              <g className={pendulumOn?'bh-pendulum':undefined}
                 style={pendulumOn?{'--beat':beatSecs+'s','--pivot':MET_PIVOT_Y+'px'}:undefined} aria-hidden="true">
                <line x1="38" y1={MET_PIVOT_Y} x2="38" y2="6" stroke="var(--border-2)" strokeWidth="1.5" strokeLinecap="round"/>
                <rect x="32.5" y={weightY-2.5} width="11" height="5" rx="1.5"
                  fill={isBaseTempo(currentStar)?'var(--muted)':currentStar.color}
                  style={{transition:isDragging?'none':'y .18s'}}/>
              </g>
              <circle cx="38" cy={MET_PIVOT_Y} r="1.6" fill="var(--border-2)"/>

              <text x="38" y={MET_TEXT_Y} textAnchor="middle"
                style={{fontFamily:'Cormorant Garamond,serif',fontSize:'12px',fontWeight:500,letterSpacing:'-0.02em',fill:'var(--text)'}}>
                {isDragging?`${focusMins} min`:timeStr}
              </text>

              {/* Barra que ESVAZIA, FORA do corpo — o contorno da pirâmide é
                  desenho, e sobrepor leitura a ele só embola os dois. Trilho
                  sempre visível para a barra ter contra o que encolher: sem ele,
                  "quase acabando" e "não começou" são o mesmo vazio. */}
              <rect x={BAR_X} y={BAR_Y} width={BAR_W} height="3" rx="1.5" fill="var(--border)"/>
              <rect x={BAR_X} y={BAR_Y} width={Math.max(0,BAR_W*pct)} height="3" rx="1.5"
                fill={isFocus?'var(--text)':'#276b3e'}
                style={{transition:isDragging?'none':'width .5s cubic-bezier(.4,0,.2,1),fill .4s'}}/>
            </svg>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:5}}>
              <button className="btn btn-outline" onClick={toggle} style={{flex:1,justifyContent:'center',padding:'5px 10px',fontSize:'.78rem'}}>
                <Icon name={isActive?'pause':'play'} size={12}/>
                {isActive?'Pausar':(isFocus?'Iniciar':'Retomar')}
              </button>
              <button className="btn btn-ghost" onClick={reset} title="Reiniciar" style={{padding:5}}>
                <Icon name="rotate-ccw" size={13}/>
              </button>
              <button className="btn btn-ghost"
                onClick={()=>{const v=!metronomeOn;setMetronomeOn(v);metronomeSave(v);}}
                aria-pressed={metronomeOn}
                title={metronomeOn?`Pêndulo ligado — ${currentStar.bpm} BPM (${currentStar.name})`:'Pêndulo desligado'}
                style={{padding:'5px 7px',opacity:metronomeOn?1:.4}}>
                <span style={{fontSize:'.9rem',lineHeight:1,color:metronomeOn&&!isBaseTempo(currentStar)?currentStar.color:'inherit'}}>♪</span>
              </button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <div style={{fontSize:'.67rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:4}}>
                <Icon name="clock" size={10}/> Hoje: <strong style={{color:'var(--text)'}}>{pomoFmtSecs(todayDisplay)}</strong> em foco
              </div>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                {/* O tint saía de currentStar.color+'20' — concatenar alpha em hex.
                    Com a cor vindo de token isso vira "var(--tempo-2)20", que é CSS
                    inválido; color-mix deriva o mesmo tint a partir da variável e
                    ainda funciona no tema escuro, porque mistura com transparent. */}
                <div style={{display:'flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:12,background:isBaseTempo(currentStar)?'var(--bg)':`color-mix(in srgb, ${currentStar.color} 12%, transparent)`,border:`1px solid ${isBaseTempo(currentStar)?'var(--border)':`color-mix(in srgb, ${currentStar.color} 28%, transparent)`}`}}>
                  <span style={{fontSize:'.8rem',lineHeight:1,color:isBaseTempo(currentStar)?'var(--muted)':currentStar.color}}>{currentStar.glyph}</span>
                  <span className="serif" style={{fontStyle:'italic',fontSize:'.95rem',fontWeight:500,lineHeight:1,letterSpacing:'-.01em',color:isBaseTempo(currentStar)?'var(--muted)':currentStar.color}}>{currentStar.name}</span>
                  <span style={{fontSize:'.55rem',fontWeight:600,letterSpacing:'.04em',color:'var(--muted)',lineHeight:1}} title={`${currentStar.bpm} BPM`}>{currentStar.bpm}</span>
                </div>
                {nextStarTier&&(
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{height:3,background:'var(--bg)',borderRadius:2,overflow:'hidden'}}>
                      <div style={{height:'100%',width:Math.min(100,progressToNext)+'%',background:currentStar.color,borderRadius:2,transition:'width 0.5s ease'}}/>
                    </div>
                    <div style={{fontSize:'.58rem',color:'var(--muted)',marginTop:1,textAlign:'right'}}>{Math.round(progressToNext)}% → <span className="serif" style={{fontStyle:'italic',fontSize:'.74rem'}}>{nextStarTier.name}</span></div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}


      {showStats && ReactDOM.createPortal(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setShowStats(false)}>
          <div style={{background:'var(--surface)',borderRadius:18,border:'1px solid var(--border)',width:'100%',maxWidth:440,maxHeight:'80vh',display:'flex',flexDirection:'column',boxShadow:'0 20px 60px rgba(28,25,23,.15)',overflow:'hidden'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'20px 24px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
              <h2 className="serif" style={{fontSize:'1.5rem',fontWeight:400,margin:0}}>Historico de Foco</h2>
              <button className="btn btn-ghost" onClick={()=>setShowStats(false)} style={{padding:6}}><Icon name="x" size={18}/></button>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',borderBottom:'1px solid var(--border)',flexShrink:0}}>
              <div style={{padding:'14px 20px',textAlign:'center',borderRight:'1px solid var(--border)'}}>
                <div style={{fontSize:'.6rem',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',marginBottom:4}}>Hoje</div>
                <div style={{fontSize:'1.2rem',fontWeight:600,fontFamily:'Cormorant Garamond,serif'}}>{pomoFmtSecs(todayDisplay)}</div>
              </div>
              <div style={{padding:'14px 20px',textAlign:'center',borderRight:'1px solid var(--border)'}}>
                <div style={{fontSize:'.6rem',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',marginBottom:4}}>Andamento</div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>
                  <span style={{fontSize:'1.15rem',lineHeight:1,color:isBaseTempo(currentStar)?'var(--muted)':currentStar.color}}>{currentStar.glyph}</span>
                  <span className="serif" style={{fontStyle:'italic',fontSize:'1.2rem',fontWeight:500,lineHeight:1,color:isBaseTempo(currentStar)?'var(--muted)':currentStar.color}}>{currentStar.name}</span>
                </div>
              </div>
              <div style={{padding:'14px 20px',textAlign:'center'}}>
                <div style={{fontSize:'.6rem',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',marginBottom:4}}>Total</div>
                <div style={{fontSize:'1.2rem',fontWeight:600,fontFamily:'Cormorant Garamond,serif'}}>{pomoFmtSecs(totalAll)}</div>
              </div>
            </div>
            <div style={{display:'flex',borderBottom:'1px solid var(--border)',flexShrink:0}}>
              {['days','months'].map(t=>(
                <button key={t} onClick={()=>setStatsTab(t)} style={{flex:1,padding:'10px 0',border:'none',background:'none',cursor:'pointer',fontFamily:'Figtree,sans-serif',fontSize:'.82rem',fontWeight:500,color:statsTab===t?'var(--text)':'var(--muted)',borderBottom:statsTab===t?'2px solid var(--text)':'2px solid transparent',marginBottom:-1,transition:'all .15s'}}>
                  {t==='days'?'Por Dia':'Por Mes'}
                </button>
              ))}
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'16px 24px'}}>
              {statsTab==='days'&&(dayEntries.length===0
                ?<p style={{fontSize:'.85rem',color:'var(--muted)',textAlign:'center',padding:'32px 0',margin:0}}>Nenhuma sessao registrada.</p>
                :<div style={{display:'flex',flexDirection:'column',gap:12}}>
                  {dayEntries.map(([day,s])=>{
                    const dayStar = getStarLevel(s);
                    return(
                    <div key={day}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,alignItems:'center'}}>
                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <span style={{fontSize:'.82rem',fontWeight:500}}>{pomoFmtDay(day)}</span>
                          {!isBaseTempo(dayStar) && (
                            <span className="serif" style={{fontStyle:'italic',fontSize:'.85rem',lineHeight:1,color:dayStar.color}} title={`${dayStar.name} · ${dayStar.bpm} BPM`}>{dayStar.glyph} {dayStar.name}</span>
                          )}
                        </div>
                        <span style={{fontSize:'.82rem',fontWeight:600}}>{pomoFmtSecs(s)}</span>
                      </div>
                      <div style={{height:5,background:'var(--bg)',borderRadius:3,overflow:'hidden'}}>
                        <div style={{height:'100%',width:Math.round(s/maxDay*100)+'%',background:isBaseTempo(dayStar) ? 'var(--text)' : dayStar.color,borderRadius:3}}/>
                      </div>
                    </div>
                  )})}
                </div>
              )}
              {statsTab==='months'&&(monthEntries.length===0
                ?<p style={{fontSize:'.85rem',color:'var(--muted)',textAlign:'center',padding:'32px 0',margin:0}}>Nenhuma sessao registrada.</p>
                :<div style={{display:'flex',flexDirection:'column',gap:16}}>
                  {monthEntries.map(([mk,s])=>{
                    const daysInMonth=dayEntries.filter(e=>e[0].slice(0,7)===mk);
                    const mMedal=getMonthMedal(s);
                    const mNext=MONTH_TIERS.find(t=>t.floor>mMedal.floor)||null;
                    const mPct=mNext?Math.min(100,((s-mMedal.floor)/(mNext.floor-mMedal.floor))*100):100;
                    return(
                      <div key={mk}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,alignItems:'center'}}>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <span style={{fontSize:'.85rem',fontWeight:600,textTransform:'capitalize'}}>{pomoFmtMonth(mk)}</span>
                            <span title={mMedal.name} className="serif" style={{fontStyle:'italic',fontWeight:600,fontSize:'1.05rem',lineHeight:1,color:isBaseDynamic(mMedal)?'var(--muted)':mMedal.color}}>{mMedal.mark}</span>
                          </div>
                          <span style={{fontSize:'.85rem',fontWeight:700}}>{pomoFmtSecs(s)}</span>
                        </div>
                        <div style={{height:6,background:'var(--bg)',borderRadius:3,overflow:'hidden',marginBottom:2}}>
                          <div style={{height:'100%',width:mPct+'%',background:isBaseDynamic(mMedal)?'var(--muted)':mMedal.color,borderRadius:3,transition:'width .3s'}}/>
                        </div>
                        {mNext&&<div style={{fontSize:'.6rem',color:'var(--muted)',marginBottom:6,textAlign:'right'}}>{Math.round(mPct)}% → <span className="serif" style={{fontStyle:'italic',fontSize:'.76rem'}}>{mNext.name}</span></div>}
                        <div style={{paddingLeft:8}}>
                          {daysInMonth.map(([d,ds])=>(
                            <div key={d} style={{display:'flex',justifyContent:'space-between',padding:'2px 0'}}>
                              <span style={{fontSize:'.74rem',color:'var(--muted)'}}>{pomoFmtDay(d)}</span>
                              <span style={{fontSize:'.74rem',color:'var(--muted)'}}>{pomoFmtSecs(ds)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      , document.body)}
    </div>
  );
};

          <Field label="Início"><input className="input-box" type="date" value={form.startDate} onChange={e=>set('startDate',e.target.value)}/></Field>
          <Field label="Deadline"><input className="input-box" type="date" value={form.deadline} onChange={e=>set('deadline',e.target.value)}/></Field>
        </div>
        <Field label="Notas iniciais"><textarea className="input-box" rows={3} value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Briefing, referências..." style={{resize:'none',lineHeight:1.7}}/></Field>
        <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:4}}>

};

  const softDelete=id=>setProjects(p=>p.map(x=>x.id===id?{...x,deleted:true,deletedAt:new Date().toISOString()}:x));
  const restore=id=>setProjects(p=>p.map(x=>x.id===id?{...x,deleted:false,deletedAt:null}:x));
  const hardDelete=id=>{if(window.confirm('Excluir permanentemente? Esta ação não pode ser desfeita.')){setProjects(p=>p.filter(x=>x.id!==id));}}
  // Drag-to-reorder (desktop grid). Moves the dragged project just before the drop target in
  // the full array; since the visible list preserves array order, the visible order follows.
  const projDrag=useRef(null);
  const projDragEnd=useRef(0); // timestamp of last drag end — suppresses the open-click after a drag
  const reorderProjects=(fromId,toId)=>{
    if(fromId===toId)return;
    setProjects(prev=>{
      const arr=[...prev];
      const fi=arr.findIndex(p=>p.id===fromId);
      if(fi<0)return prev;
      const[item]=arr.splice(fi,1);
      const ti=arr.findIndex(p=>p.id===toId);
      if(ti<0)return prev;
      arr.splice(ti,0,item);
      return arr;

  // Duplicate project as a template: copies structure (tasks, referências, mentores)
  // but resets status, dates and timeline — útil para jobs recorrentes com o mesmo pipeline

// - GANTT TIMELINE -
const PTASK_STATUSES=['Pendente','Fazendo','Concluído','Atrasado'];
const PTASK_NEXT={'Pendente':'Fazendo','Fazendo':'Concluído','Concluído':'Atrasado','Atrasado':'Pendente'};

const GANTT_COLORS={
  'Pendente': {bar:'#EDE8E1',text:'#6B6460',border:'#C8BEB4',dot:'#B5ABA0'},
  'Fazendo':  {bar:'#FEF3C7',text:'#92700B',border:'#FCD34D',dot:'#F59E0B'},
  'Concluído':{bar:'#D1FAE5',text:'#065F46',border:'#6EE7B7',dot:'#10B981'},
  'Atrasado': {bar:'#FEE2E2',text:'#991B1B',border:'#FCA5A5',dot:'#EF4444'},
};

const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const addDays=(dateStr,days)=>{const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+days);return localDateISO(d);};
const todayISO=()=>localDateISO();
// Currency formatting (pt-BR)
const fmtBRL=v=>{const n=Number(v);if(!n||isNaN(n))return null;return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0,maximumFractionDigits:2});};
// Deadline countdown info: returns {label,date,color,bg,urgent} or null
const deadlineInfo=deadline=>{
  if(!deadline)return null;
  const diff=daysBetween(todayISO(),deadline);
  const date=new Date(deadline+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
  if(diff<0)return{label:'atrasado '+Math.abs(diff)+'d',date,color:'#9B1C1C',bg:'#FDEDED',urgent:true};
  if(diff===0)return{label:'hoje!',date,color:'#9B1C1C',bg:'#FDEDED',urgent:true};
  if(diff===1)return{label:'amanhã',date,color:'#92700b',bg:'#FEF9E7',urgent:true};
  if(diff<=7)return{label:'em '+diff+'d',date,color:'#92700b',bg:'#FEF9E7',urgent:false};
  return{label:'em '+diff+'d',date,color:'var(--muted)',bg:'var(--bg)',urgent:false};
};
const fmtShort=d=>{if(!d)return'';const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});};

const GanttTimeline=({tasks,onUpdateTasks,projectStart,projectEnd,onTaskClick,onSyncAdd,onSyncDelete})=>{
  const today=useMemo(()=>todayISO(),[]);
  const [selectedId,setSelectedId]=useState(null);
  const [editDraft,setEditDraft]=useState(null);
  const [newTaskName,setNewTaskName]=useState('');
  const [thisWeek,setThisWeek]=useState(true);
  const [expanded,setExpanded]=useState(false);
  const scrollRef=useRef(null);
  const dragRef=useRef(null);
  const dragRowRef=useRef(null);
  const dragOverRowRef=useRef(null);
  const [, forceUpdate]=useState(0);

  // Compute this week Mon-Sun
  const getWeekBounds=()=>{
    const d=new Date(today+'T12:00:00');
    const day=d.getDay(); // 0=Sun
    const mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return{start:localDateISO(mon),end:localDateISO(sun)};
  };

  // - Compute chart bounds -
  let chartStart=projectStart||today;
  let chartEnd=projectEnd||addDays(today,45);
  tasks.forEach(t=>{
    if(t.startDate&&t.startDate<chartStart)chartStart=t.startDate;
    if(t.dueDate&&t.dueDate>chartEnd)chartEnd=t.dueDate;
  });
  if(thisWeek){const wb=getWeekBounds();chartStart=wb.start;chartEnd=wb.end;}
  else{chartStart=addDays(chartStart,-5);chartEnd=addDays(chartEnd,12);}
  // When showing "this week", only render tasks that overlap the visible window.
  // A task overlaps [chartStart, chartEnd] if its start <= chartEnd AND its end >= chartStart.
  const visibleTasks=thisWeek
    ? tasks.filter(t=>{
        // Always show overdue tasks regardless of date range — they need attention
        if(t.status==='Atrasado')return true;
        const s=t.startDate||(projectStart||today);
        const e=t.dueDate||(projectEnd||addDays(today,7));
        return s<=chartEnd&&e>=chartStart;
      })
    : tasks;
  const totalDays=Math.max(1,daysBetween(chartStart,chartEnd));
  const DAY_W=36;
  const ROW_H=38;
  const HEADER_H=44;
  const LEFT_W=200;

  // - Month + week header data -
  const months=[];
  let cur=new Date(chartStart+'T12:00:00');
  const endDt=new Date(chartEnd+'T12:00:00');
  while(cur<=endDt){
    const mStart=localDateISO(cur);
    const label=cur.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.',' ');
    const next=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    const mEnd=next>endDt?chartEnd:localDateISO(next);
    months.push({label,days:daysBetween(mStart,mEnd)});
    cur=next;
  }

  const weekMarkers=[];
  for(let i=0;i<=totalDays;i+=7){
    const d=addDays(chartStart,i);
    const dt=new Date(d+'T12:00:00');
    weekMarkers.push({offset:i*DAY_W,label:dt.getDate()+'/'+(dt.getMonth()+1)});
  }

  // Weekend columns (Sat=6, Sun=0)
  const weekendCols=[];
  for(let i=0;i<=totalDays;i++){
    const dt=new Date(chartStart+'T12:00:00');dt.setDate(dt.getDate()+i);
    const dow=dt.getDay();
    if(dow===0||dow===6)weekendCols.push(i);
  }

  const todayOffset=daysBetween(chartStart,today)*DAY_W;
  const gridW=totalDays*DAY_W;

  // - Bar geometry -
  const barGeom=t=>{
    const s=t.startDate||(projectStart||today);
    const e=t.dueDate||(projectEnd||addDays(today,7));
    const visStart=s<chartStart?chartStart:s;
    const left=Math.max(0,daysBetween(chartStart,s))*DAY_W;
    const width=Math.max(DAY_W,(daysBetween(visStart,e)+1)*DAY_W);
    return{left,width};
  };

  // - Drag -
  const startDrag=(e,taskId,type)=>{
    e.preventDefault();e.stopPropagation();
    const t=tasks.find(x=>x.id===taskId);if(!t)return;
    const origStart=t.startDate||(projectStart||today);
    const origEnd=t.dueDate||(projectEnd||addDays(today,7));
    dragRef.current={taskId,type,startX:e.clientX,origStart,origEnd};
    const onMove=me=>{
      if(!dragRef.current)return;
      const dx=me.clientX-dragRef.current.startX;
      const delta=Math.round(dx/DAY_W);
      const{taskId,type,origStart,origEnd}=dragRef.current;
      let ns,ne;
      if(type==='move'){ns=addDays(origStart,delta);ne=addDays(origEnd,delta);}
      else if(type==='left'){ns=addDays(origStart,delta);ne=origEnd;if(ns>=ne)ns=addDays(ne,-1);}
      else{ns=origStart;ne=addDays(origEnd,delta);if(ne<=ns)ne=addDays(ns,1);}
      onUpdateTasks(tasks.map(x=>x.id===taskId?{...x,startDate:ns,dueDate:ne}:x));
    };
    const onUp=()=>{dragRef.current=null;window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  };

  // - Edit -
  const selectTask=t=>{setSelectedId(t.id);setEditDraft({...t,startDate:t.startDate||(projectStart||today),dueDate:t.dueDate||(projectEnd||addDays(today,7)),notes:t.notes||''});};
  const saveEdit=()=>{if(!editDraft)return;onUpdateTasks(tasks.map(t=>t.id===editDraft.id?{...editDraft}:t));setSelectedId(null);setEditDraft(null);};
  const deleteTask=()=>{if(!editDraft)return;onUpdateTasks(tasks.filter(t=>t.id!==editDraft.id));if(onSyncDelete)onSyncDelete(editDraft.id);setSelectedId(null);setEditDraft(null);};
  const cycleStatus=id=>{const upd=tasks.map(t=>t.id===id?{...t,status:PTASK_NEXT[t.status]||'Pendente'}:t);onUpdateTasks(upd);if(editDraft&&editDraft.id===id)setEditDraft(d=>({...d,status:PTASK_NEXT[d.status]||'Pendente'}));};
  const addTask=()=>{
    if(!newTaskName.trim())return;
    const id=Date.now();
    // When "this week" view is active, default to today so the task is visible immediately.
    const s=thisWeek ? today : (projectStart||today);
    const e=thisWeek ? addDays(today,7) : (projectEnd||addDays(today,7));
    const newTask={id,text:newTaskName.trim(),status:'Pendente',startDate:s,dueDate:e,notes:''};
    onUpdateTasks([...tasks,newTask]);
    if(onSyncAdd)onSyncAdd(newTask);
    setNewTaskName('');
  };

  // Auto-scroll to center "today" in the visible area
  useEffect(()=>{
    const el=scrollRef.current;
    if(!el)return;
    const targetX=todayOffset-(el.clientWidth/2);
    el.scrollLeft=Math.max(0,targetX);
  },[todayOffset,thisWeek,expanded]);

  return(
    <div className="card" style={{padding:0,overflow:'hidden',marginBottom:12,flexShrink:0}}>
      {/* Top bar */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 16px',borderBottom:'1px solid var(--border)',background:'var(--surface)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span className="label">Timeline do Projeto</span>
          <button onClick={()=>setThisWeek(w=>!w)} className="btn btn-outline" style={{padding:'3px 8px',fontSize:'.7rem',background:thisWeek?'var(--text)':'transparent',color:thisWeek?'white':'var(--muted)',borderColor:thisWeek?'var(--text)':'var(--border)'}}>
            <Icon name="calendar" size={10}/> Esta semana
          </button>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <input value={newTaskName} onChange={e=>setNewTaskName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTask()}
            placeholder="Nome da tarefa..."
            style={{border:'1px solid var(--border)',borderRadius:7,padding:'5px 10px',fontSize:'.78rem',fontFamily:'Figtree,sans-serif',outline:'none',backgroundColor:'var(--bg)',color:'var(--text)',width:160,transition:'border-color .2s'}}
            onFocus={e=>e.target.style.borderColor='var(--text)'} onBlur={e=>e.target.style.borderColor='var(--border)'}/>
          <button onClick={addTask} className="btn btn-dark" style={{padding:'5px 12px',fontSize:'.78rem'}}><Icon name="plus" size={12}/> Adicionar</button>
        </div>
      </div>

      {/* Grid */}
      <div style={{display:'flex',position:'relative',maxHeight:expanded?2000:180,overflow:'hidden',transition:'max-height .3s ease'}}>
        {/* Left panel */}
        <div style={{width:LEFT_W,flexShrink:0,borderRight:'1px solid var(--border)',zIndex:2,background:'var(--surface)',overflowY:'auto'}}>
          <div style={{height:HEADER_H,borderBottom:'1px solid var(--border)',background:'var(--bg)',display:'flex',alignItems:'flex-end',padding:'0 14px 8px',flexShrink:0}}>
            <span style={{fontSize:'.65rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)'}}>Tarefa</span>
          </div>
          {visibleTasks.length===0&&(
            <div style={{padding:'28px 16px',textAlign:'center',color:'var(--muted)',fontSize:'.82rem'}}>
              <Icon name="calendar-plus" size={24} style={{display:'block',margin:'0 auto 10px',opacity:.3}}/>
              Adicione tarefas para começar.
            </div>
          )}
          {visibleTasks.map((t,tIdx)=>{
            const colors=GANTT_COLORS[t.status]||GANTT_COLORS['Pendente'];
            const isSelected=selectedId===t.id;
            const realIdx=tasks.findIndex(x=>x.id===t.id);
            return(
              <div key={t.id}
                draggable
                onDragStart={e=>{dragRowRef.current=realIdx;e.dataTransfer.effectAllowed='move';}}
                onDragOver={e=>{e.preventDefault();dragOverRowRef.current=realIdx;}}
                onDrop={e=>{
                  e.preventDefault();
                  const from=dragRowRef.current;const to=dragOverRowRef.current;
                  if(from===null||from===to){dragRowRef.current=null;dragOverRowRef.current=null;return;}
                  const reordered=[...tasks];const[moved]=reordered.splice(from,1);reordered.splice(to,0,moved);
                  onUpdateTasks(reordered);dragRowRef.current=null;dragOverRowRef.current=null;
                }}
                onDragEnd={()=>{dragRowRef.current=null;dragOverRowRef.current=null;}}
                onClick={()=>isSelected?(setSelectedId(null),setEditDraft(null)):selectTask(t)}
                style={{height:ROW_H,display:'flex',alignItems:'center',gap:6,padding:'0 8px 0 10px',borderBottom:'1px solid var(--border)',cursor:'pointer',
                  background:isSelected?'rgba(28,25,23,.05)':'transparent',transition:'background .15s'}}>
                <span style={{color:'var(--border)',display:'flex',cursor:'grab',flexShrink:0,opacity:.5}} onMouseDown={e=>e.stopPropagation()}><Icon name="grip-vertical" size={10}/></span>
                <button onClick={e=>{e.stopPropagation();cycleStatus(t.id);}} style={{width:12,height:12,borderRadius:'50%',background:colors.dot,border:'none',cursor:'pointer',flexShrink:0,padding:0,transition:'transform .15s'}}
                  title={`Status: ${t.status}`} onMouseEnter={e=>e.currentTarget.style.transform='scale(1.4)'} onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}/>                <span onClick={e=>{if(onTaskClick){e.stopPropagation();onTaskClick(t.id);}}} style={{fontSize:'.83rem',fontWeight:500,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
                  textDecoration:t.status==='Concluído'?'line-through':'none',color:t.status==='Concluído'?'var(--muted)':'var(--text)',
                  cursor:onTaskClick?'pointer':'default'}}>{t.text}</span>
              </div>
            );
          })}
        </div>

        {/* Scrollable chart */}
        <div ref={scrollRef} style={{flex:1,overflowX:'auto',overflowY:'auto',position:'relative'}}>
          <div style={{width:gridW,position:'relative',minWidth:'100%'}}>
            {/* Month row */}
            <div style={{height:HEADER_H/2,display:'flex',borderBottom:'1px solid var(--border)',background:'var(--bg)'}}>
              {months.map((m,i)=>(
                <div key={i} style={{width:m.days*DAY_W,flexShrink:0,borderRight:'1px solid var(--border)',display:'flex',alignItems:'center',padding:'0 10px',
                  fontSize:'.68rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)'}}>
                  {m.label}
                </div>
              ))}
            </div>
            {/* Week sub-header */}
            <div style={{height:HEADER_H/2,background:'var(--bg)',borderBottom:'2px solid var(--border)',position:'relative'}}>
              {weekMarkers.map((mk,i)=>(
                <div key={i} style={{position:'absolute',left:mk.offset,height:'100%',display:'flex',alignItems:'center',paddingLeft:5,
                  fontSize:'.62rem',color:'var(--muted)',borderLeft:'1px solid var(--border)'}}>
                  {mk.label}
                </div>
              ))}
              {weekendCols.map(d=>{
                const dt=new Date(chartStart+'T12:00:00');dt.setDate(dt.getDate()+d);
                const lbl=dt.getDay()===0?'Dom':'Sáb';
                return <div key={'wl'+d} style={{position:'absolute',left:d*DAY_W,width:DAY_W,height:'100%',display:'flex',alignItems:'center',justifyContent:'center',
                  fontSize:'.55rem',fontWeight:700,color:'var(--muted)',opacity:.7,pointerEvents:'none',letterSpacing:'.03em'}}>{lbl}</div>;
              })}
            </div>

            {/* Weekend columns */}
            {weekendCols.map(d=>(
              <div key={'we'+d} style={{position:'absolute',left:d*DAY_W,top:0,bottom:0,width:DAY_W,background:'rgba(28,25,23,.045)',pointerEvents:'none',zIndex:0}}/>
            ))}

            {/* Task rows */}
            {visibleTasks.map((t,i)=>{
              const{left,width}=barGeom(t);
              const colors=GANTT_COLORS[t.status]||GANTT_COLORS['Pendente'];
              const isSelected=selectedId===t.id;
              return(
                <div key={t.id} style={{height:ROW_H,position:'relative',borderBottom:'1px solid var(--border)',background:i%2===0?'transparent':'rgba(28,25,23,.015)'}}>
                  {/* Day-by-day grid lines — subtle for each day, stronger at week boundaries */}
                  {Array.from({length:totalDays+1},(_,d)=>(
                    <div key={'d'+d} style={{position:'absolute',left:d*DAY_W,top:0,bottom:0,borderLeft:d%7===0?'1px dashed var(--border)':'1px solid var(--border)',opacity:d%7===0?.55:.15,pointerEvents:'none'}}/>
                  ))}
                  {/* Bar */}
                  <div
                    onMouseDown={e=>startDrag(e,t.id,'move')}
                    onClick={e=>{e.stopPropagation();isSelected?(setSelectedId(null),setEditDraft(null)):selectTask(t);}}
                    title={`${t.text}\n${fmtShort(t.startDate)} \u2192 ${fmtShort(t.dueDate)}`}
                    style={{
                      position:'absolute',left,width,height:28,top:(ROW_H-28)/2,
                      background:colors.bar,border:`1.5px solid ${isSelected?'var(--text)':colors.border}`,borderRadius:7,
                      cursor:'grab',display:'flex',alignItems:'center',
                      boxShadow:isSelected?'0 0 0 2px var(--text)':'0 1px 4px rgba(28,25,23,.09)',
                      userSelect:'none',transition:'box-shadow .15s,border-color .15s',
                    }}>
                    {/* Left resize */}
                    <div onMouseDown={e=>startDrag(e,t.id,'left')} style={{width:10,height:'100%',cursor:'ew-resize',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:'6px 0 0 6px',zIndex:1}}
                      title="Arrastar início"><span style={{fontSize:9,color:colors.text,opacity:.5,lineHeight:1}}>⠿</span></div>
                    <div style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:'.68rem',fontWeight:600,color:colors.text,userSelect:'none'}}>{width>60?t.text:''}</div>
                    {/* Right resize */}
                    <div onMouseDown={e=>startDrag(e,t.id,'right')} style={{width:10,height:'100%',cursor:'ew-resize',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:'0 6px 6px 0',zIndex:1}}
                      title="Arrastar prazo"><span style={{fontSize:9,color:colors.text,opacity:.5,lineHeight:1}}>⠿</span></div>
                  </div>
                </div>
              );
            })}

            {/* Today line */}
            {todayOffset>=0&&todayOffset<=gridW&&(
              <div style={{position:'absolute',left:todayOffset,top:0,bottom:0,width:2,background:'#EF4444',pointerEvents:'none',zIndex:10}}>
                <div style={{position:'absolute',top:HEADER_H-18,left:'50%',transform:'translateX(-50%)',background:'#EF4444',color:'white',
                  fontSize:'.52rem',fontWeight:800,padding:'2px 5px',borderRadius:3,whiteSpace:'nowrap',letterSpacing:'.06em'}}>HOJE</div>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Expand/Collapse arrow */}
      {visibleTasks.length>0&&(
        <div onClick={()=>setExpanded(x=>!x)}
          style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'4px 0',cursor:'pointer',
            borderTop:'1px solid var(--border)',background:'var(--surface)',transition:'background .15s',userSelect:'none'}}
          onMouseEnter={e=>e.currentTarget.style.background='rgba(28,25,23,.04)'}
          onMouseLeave={e=>e.currentTarget.style.background='var(--surface)'}>
          <Icon name={expanded?'chevron-up':'chevron-down'} size={16} style={{color:'var(--muted)',transition:'transform .2s'}}/>
        </div>
      )}

      {/* Edit drawer */}
      {editDraft&&(
        <div style={{borderTop:'2px solid var(--text)',padding:'14px 18px',background:'var(--surface)',display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end',animation:'fadeUp .2s ease'}}>
          <div style={{flex:2,minWidth:160}}>
            <label style={{fontSize:'.62rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.09em',color:'var(--muted)',display:'block',marginBottom:5}}>Tarefa</label>
            <input value={editDraft.text} onChange={e=>setEditDraft({...editDraft,text:e.target.value})} className="input-box" style={{width:'100%'}} autoFocus
              onKeyDown={e=>e.key==='Enter'&&saveEdit()}/>
          </div>
          <div style={{minWidth:130}}>
            <label style={{fontSize:'.62rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.09em',color:'var(--muted)',display:'block',marginBottom:5}}>Início</label>
            <input type="date" value={editDraft.startDate||''} onChange={e=>setEditDraft({...editDraft,startDate:e.target.value})} className="input-box"/>
          </div>
          <div style={{minWidth:130}}>
            <label style={{fontSize:'.62rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.09em',color:'var(--muted)',display:'block',marginBottom:5}}>Prazo</label>
            <input type="date" value={editDraft.dueDate||''} onChange={e=>setEditDraft({...editDraft,dueDate:e.target.value})} className="input-box"/>
          </div>
          <div style={{minWidth:130}}>
            <label style={{fontSize:'.62rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.09em',color:'var(--muted)',display:'block',marginBottom:5}}>Status</label>
            <select value={editDraft.status} onChange={e=>setEditDraft({...editDraft,status:e.target.value})}
              style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1px solid var(--border)',fontFamily:'Figtree,sans-serif',fontSize:'.85rem',background:'var(--bg)',color:'var(--text)',outline:'none',cursor:'pointer'}}>
              {PTASK_STATUSES.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <div style={{flex:3,minWidth:160}}>
            <label style={{fontSize:'.62rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.09em',color:'var(--muted)',display:'block',marginBottom:5}}>Notas</label>
            <input value={editDraft.notes||''} onChange={e=>setEditDraft({...editDraft,notes:e.target.value})} className="input-box" placeholder="Notas rápidas sobre a tarefa..." style={{width:'100%'}}/>
          </div>
          <div style={{display:'flex',gap:8,flexShrink:0,alignSelf:'flex-end'}}>
            <button onClick={deleteTask} className="btn btn-danger" style={{padding:'8px 12px'}} title="Excluir tarefa"><Icon name="trash-2" size={14}/></button>
            <button onClick={()=>{setSelectedId(null);setEditDraft(null);}} className="btn btn-outline" style={{padding:'8px 14px'}}>Cancelar</button>
            <button onClick={saveEdit} className="btn btn-dark" style={{padding:'8px 16px'}}><Icon name="check" size={14}/> Salvar</button>
          </div>
        </div>
      )}
    </div>
  );
};

// - PROJECT DETAIL -

// Auto-mark tasks as Atrasado if past their dueDate and not Concluído
const applyAutoLate=tasks=>{
  const today=new Date();today.setHours(0,0,0,0);
  return (tasks||[]).map(t=>{
    if(t.status==='Concluído')return t;
    if(!t.dueDate)return t;
    const due=new Date(t.dueDate);due.setHours(0,0,0,0);
    if(due<today&&t.status!=='Atrasado')return{...t,status:'Atrasado'};
    return t;
  });
};

const ProjectDetail=React.memo(({project,onBack,onUpdate,onSoftDelete,globalMentors,onAddGlobalMentor,galleryPosts,galleryFolders,isMobile})=>{
  const [local,setLocal]=useState(()=>{
    const tasks=applyAutoLate(project.projectTasks);
    return{...project,projectTasks:tasks};
  });
  const [tab,setTab]=useState('Visão Geral');
  const [galleryPopup,setGalleryPopup]=useState(null);
  const assignableFolders=useMemo(()=>(galleryFolders||[]).filter(f=>!f.deleted),[galleryFolders]);
  const folderPosts=useMemo(()=>local.galleryFolder?(galleryPosts||[]).filter(p=>!p.deleted&&p.folder===local.galleryFolder).sort((a,b)=>((b.date||'').slice(0,10)).localeCompare((a.date||'').slice(0,10))):[],[galleryPosts,local.galleryFolder]);
  const autoLateTasks=useMemo(()=>applyAutoLate(local.projectTasks||[]),[local.projectTasks]);
  useEffect(()=>{if(!galleryPopup)return;const h=e=>{if(e.key==='Escape')setGalleryPopup(null);};document.addEventListener('keydown',h);return()=>document.removeEventListener('keydown',h);},[galleryPopup]);
  const [showTimelineModal,setShowTimelineModal]=useState(false);
  const coverRef=useRef();
  // Eager-warm every local image in this project when it opens, so shot/frame
  // grids fill fast instead of paying a cold IDB read per image on first view.
  // Keyed on project.id so it runs once per opened project, not on every edit.
  useEffect(()=>{
    const srcs=[];const seen=new Set();
    const walk=o=>{if(Array.isArray(o))o.forEach(walk);else if(o&&typeof o==='object')Object.values(o).forEach(walk);else if(typeof o==='string'&&o.startsWith('idb://')&&!seen.has(o)){seen.add(o);srcs.push(o);}};
    walk(project);
    warmKeys(srcs);
  },[project.id]);

  const projectRef=useRef(project);
  // On mount: persist auto-late status changes back to parent
  useEffect(()=>{
    const original=project.projectTasks||[];
    const updated=applyAutoLate(original);
    const changed=updated.some((t,i)=>t.status!==original[i]?.status);
    if(changed)onUpdate({...project,projectTasks:updated});
  },[]);// runs once on mount
  useEffect(()=>{
    // Only update local if the project changed externally (not from our own upd())
    if(projectRef.current!==project){
      const updated={...project,projectTasks:applyAutoLate(project.projectTasks)};
      setLocal(updated);
      projectRef.current=project;
    }
  },[project]);

  // Safe update — defers onUpdate to avoid calling parent setter inside child setState
  const _pendingUpdate=useRef(null);
  const upd=(field,value)=>{
    setLocal(prev=>{
      const updated={...prev,[field]:value};
      projectRef.current=updated;
      _pendingUpdate.current=updated;
      return updated;
    });
  };
  // Flush pending updates to parent after React commits the state
  useEffect(()=>{
    if(_pendingUpdate.current){
      onUpdate(_pendingUpdate.current);
      _pendingUpdate.current=null;
    }
  });


  // Mentors
  const toggleMentor=id=>{
    const m=local.mentors||[];
    const next=m.includes(id)?m.filter(x=>x!==id):[...m,id];
    upd('mentors',next);
  };

                  <input value={activeResearch.url||''} onChange={e=>updateResearch('url',e.target.value)}
