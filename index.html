const _loadFirebaseScripts=()=>{
  if(_fbScriptsLoaded)return Promise.resolve();
  if(_fbScriptsPromise)return _fbScriptsPromise;
  const urls=[
    'https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js',
    'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js',
  ];
  // Load sequentially — each script depends on the previous
  _fbScriptsPromise=urls.reduce((chain,src)=>
    chain.then(()=>new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src=src;s.onload=res;s.onerror=rej;
      document.head.appendChild(s);
    }))
  ,Promise.resolve()).then(()=>{_fbScriptsLoaded=true;}).catch(e=>{
    console.warn('[BoardHub] Firebase scripts failed to load:',e);
    _fbScriptsPromise=null; // allow retry
  });
  return _fbScriptsPromise;
};

const initFirebase=async()=>{
  if(_fbReady)return true;
  await _loadFirebaseScripts();
  if(typeof firebase==='undefined')return false;
  const saved=loadFbCfg();
  const cfg=saved.apiKey?saved:DEFAULT_FB_CFG;
  if(!cfg.apiKey)return false;
  try{
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    _fbAuth=firebase.auth();
    _fbDb=firebase.firestore();
    _fbStorage=firebase.storage();
    _fbDb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    _fbReady=true;
    return true;
  }catch(e){console.error('[BoardHub] Firebase init:',e);return false;}
};

// Start loading Firebase scripts in background immediately (but don't block)
_loadFirebaseScripts();

// Firestore state doc ref for a user
const getStateRef=uid=>{
  if(!_fbDb)return null;
  return _fbDb.collection('users').doc(uid).collection('boardhub').doc('state');
};
const getNotesRef=uid=>{
  if(!_fbDb)return null;
  return _fbDb.collection('users').doc(uid).collection('boardhub').doc('notes');
};
const getGalleryRef=uid=>{
  if(!_fbDb)return null;
  return _fbDb.collection('users').doc(uid).collection('boardhub').doc('gallery');
};

// v3.2: soft-deleted items now SYNC (global trash). Previously they were
// stripped before push while the apply side replaced whole arrays — the trash
// was device-local and silently emptied by the next remote echo. Doc size is
// bounded by the 30-day auto-purge (_purgeTrash) instead of by stripping.
// Push splits state across 3 documents to stay under Firestore's 1MB/doc limit:
//   state  → projects, clients, mentors, tasks, socialPosts, pomoData, identity, noteGroups, galleryFolders
//   notes  → notes array (can be 500KB+ with rich text)
//   gallery → galleryPosts array (300KB+ with metadata)
const pushState=async(state,uid)=>{
  const stateRef=getStateRef(uid);
  const notesRef=getNotesRef(uid);
  const galleryRef=getGalleryRef(uid);
  if(!stateRef||!notesRef||!galleryRef)throw new Error('Firebase not initialized');
  const clean=stripInlineImages(state);
  const ts=firebase.firestore.FieldValue.serverTimestamp();
  const {notes,galleryPosts,...main}=clean;
  await Promise.all([
    stateRef.set({...main,_v:'3.2',_updated:ts}),
    notesRef.set({notes:notes||[],_updated:ts}),
    galleryRef.set({galleryPosts:galleryPosts||[],_updated:ts}),
  ]);
};

// Upload a file to Firebase Storage, return permanent CDN URL
const uploadToFirebaseStorage=async(file,uid)=>{
  if(!_fbStorage||!uid)throw new Error('Firebase Storage not available');
  const ext=(file.name||'img').split('.').pop()||'jpg';
  const key='img_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+ext;
  const ref=_fbStorage.ref(`users/${uid}/images/${key}`);
  await ref.put(file,{contentType:file.type||'image/jpeg'});
  return await ref.getDownloadURL();
};

// Imgur fallback — anonymous client-ID upload
const IMGUR_CLIENT_ID='546c25a59c58ad7';
const _uploadImgur=async(file)=>{
  const b64=await readFile(file);
  const body=new FormData();
  body.append('image',b64.split(',')[1]);
  body.append('type','base64');
  const ac=new AbortController();const _t=setTimeout(()=>ac.abort(),15000);
  const res=await fetch('https://api.imgur.com/3/image',{method:'POST',headers:{Authorization:`Client-ID ${IMGUR_CLIENT_ID}`},body,signal:ac.signal});
  clearTimeout(_t);
  const json=await res.json();
  if(json.success)return json.data.link;
  throw new Error('Imgur upload failed');
};

// IDB local fallback
const _isVideoFile=f=>/^video\//i.test(f.type||'');
const _storeIdb=async(file)=>{
  const ext=(file.name||'').split('.').pop()||'bin';
  const key='media_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+ext;
  await idbPut(key,file);
  // Build the 480px thumbnail NOW, while the upload is already running, instead
  // of on first view. Browsing then never pays decode+encode: the grid only ever
  // reads a small blob that is already there. Also seeds the in-memory cache, so
  // the image just added renders instantly without touching IDB at all.
  if(!_isVideoFile(file)){
    try{
      const tb=await _makeThumbBlob(file);
      await idbPut('thumb_'+key,tb);
      if(!_thumbCache[key]){_thumbCache[key]=URL.createObjectURL(tb);_touchThumb(key);}
    }catch{/*silent-ok: a thumbnail is an optimisation — never fail an upload over it*/}
  }
  return 'idb://'+key;
};

// Core upload: Firebase Storage \u2192 Imgur (images only) \u2192 IDB

// Compress image to max 1400px longest side, 0.82 quality WebP/JPEG before any store/upload.
// Skips videos, GIFs, and files already under 60KB.
const _compressImage=async(file)=>{
  if(_isVideoFile(file)||file.type==='image/gif')return file;
  if(file.size<60*1024)return file;
  return new Promise(res=>{
    const img=new Image();
    const objUrl=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(objUrl);
      const MAX=1400;
      let{width:w,height:h}=img;
      if(w>MAX||h>MAX){const r=MAX/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      // v23.3 P1-4: a PNG was being re-encoded as PNG, with quality ignored. The
      // canvas discards the original's indexed palette, so a 500KB PNG
      // screenshot could COME OUT BIGGER than it went in. WebP supports alpha, so
      // there is no reason to preserve PNG here. And the result is only accepted
      // if it actually shrank — which also covers an already well-compressed
      // JPEG, which used to be swapped for WebP even when the WebP came out
      // bigger.
      // (an engine with no WebP support in toBlob falls back to PNG; in that case
      //  the size comparison returns the original and nothing gets worse)
      canvas.toBlob(blob=>res(blob&&blob.size<file.size?blob:file),'image/webp',0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(objUrl);res(file);};
    img.src=objUrl;
  });
};

// Imgur uploads are PUBLIC (anyone with the URL can view). For client work
// that matters — ask once per session before the first Imgur fallback and
// remember the answer. Declining stores the image locally (IDB) instead.
let _imgurAllowed=null; // null = not asked yet, true/false = session decision
const _askImgurConsent=async()=>{
  if(_imgurAllowed===null){
    _imgurAllowed=await bhConfirm({
      title:'Enviar ao Imgur?',
      confirmLabel:'Enviar ao Imgur',
      cancelLabel:'Manter só aqui',
      message:'Sem nuvem do Google disponível para esta imagem.\n\n'+
      'Enviar para o Imgur? A imagem ficará acessível publicamente por URL '+
      '(qualquer pessoa com o link pode ver).\n\n'+
      'Cancelar mantém a imagem apenas neste dispositivo (não sincroniza).'});
  }
  return _imgurAllowed;
};

const _uploadSingle=async(file)=>{
  if(!_isVideoFile(file))file=await _compressImage(file);
  if(_fbReady&&_fbAuth?.currentUser){
    try{return await uploadToFirebaseStorage(file,_fbAuth.currentUser.uid);}
    catch(e){console.warn('[BoardHub] Firebase Storage failed:',e.message);}
  }
  if(!_isVideoFile(file)&&await _askImgurConsent()){
    try{return await _uploadImgur(file);}catch(e){console.warn('[BoardHub] Imgur failed:',e.message);}
  }
  console.warn('[BoardHub] Falling back to local IDB. File will NOT sync across devices.');
  return await _storeIdb(file);
};

const uploadImage=file=>_uploadSingle(file);

const BULK_UPLOAD_DELAY_MS=1100;
const uploadImages=async(files,onProgress)=>{
  const results=[];
  for(let i=0;i<files.length;i++){
    results.push(await _uploadSingle(files[i]));
    if(onProgress)onProgress(i+1,files.length);
    // Only delay on Imgur path (Firebase has no rate limit)
    if(i<files.length-1&&(!_fbReady||!_fbAuth?.currentUser)){
      await new Promise(r=>setTimeout(r,BULK_UPLOAD_DELAY_MS));
    }
  }
  return results;
};

// Re-upload all local IDB images to the cloud, return updated state
const reuploadLocalImages=async(state,onProgress)=>{
  const keys=[...collectIdbKeys(state)];
  if(keys.length===0)return state;
  const map={};
  for(let i=0;i<keys.length;i++){
    const key=keys[i];
    try{
      const blob=await idbGet(key);
      if(blob){
        const file=new File([blob],key,{type:blob.type||'image/jpeg'});
        let url=null;
        if(_fbReady&&_fbAuth?.currentUser){try{url=await uploadToFirebaseStorage(file,_fbAuth.currentUser.uid);}catch{/*silent-ok: this is the first rung of a deliberate ladder — Imgur is tried next, then local IDB*/}}
        if(!url){try{url=await _uploadImgur(file);}catch{/*silent-ok: last remote rung; the caller falls back to storing the blob locally*/}}
        if(url)map['idb://'+key]=url;
      }
    }catch(e){console.warn('[BoardHub] Re-upload failed for',key,e);}
    if(onProgress)onProgress(i+1,keys.length);
    if(!(_fbReady&&_fbAuth?.currentUser)&&i<keys.length-1){
      await new Promise(r=>setTimeout(r,BULK_UPLOAD_DELAY_MS));
    }
  }
  return rehydrateIdbRefs(state,map);
};
// v23.3 P0-1: this function (formerly stripBase64) was conflating TWO things that
// have nothing to do with one another:
//   • "data:image/...;base64,..." is PAYLOAD. It can be megabytes and it blows
//     Firestore's 1MB/document limit. It really does have to go.
//   • "idb://<key>" is a REFERENCE — ~40 bytes pointing at a local blob.
//     It threatens no limit at all.
// Deleting the reference on push made the cloud store '' in its place; since the
// listener applies WHOLE ARRAYS (setGalleryPosts(data.galleryPosts)), that ''
// came back into the local state on the next sync and killed the reference on the
// very device that had the blob. 24h later gcIdb no longer found the reference
// and deleted the blob — irreversible loss.
// A device that does not have the blob shows a placeholder (see <Img>/<BgImg>),
// which is infinitely better than destroying the reference on the device that
// does have it.
const isInlineImg=v=>typeof v==='string'&&v.startsWith('data:image');
const stripInlineImages=obj=>{
  if(Array.isArray(obj))return obj.map(stripInlineImages);
  if(obj&&typeof obj==='object'){const out={};for(const k of Object.keys(obj))out[k]=stripInlineImages(obj[k]);return out;}
  if(isInlineImg(obj))return '';
  return obj;
};

// Resolve idb:// keys \u2192 base64 data URLs (used for manual JSON export)
const blobToBase64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});
const resolveIdbRefs=async obj=>{
  if(Array.isArray(obj))return Promise.all(obj.map(resolveIdbRefs));
  if(obj&&typeof obj==='object'){const out={};for(const k of Object.keys(obj))out[k]=await resolveIdbRefs(obj[k]);return out;}
  if(typeof obj==='string'&&obj.startsWith('idb://')){
    try{const blob=await idbGet(obj.slice(6));if(blob)return await blobToBase64(blob);}catch{/*silent-ok: an unreadable blob falls through to '' below, which the export treats as a missing image*/}
    return '';
  }
  return obj;
};

// Build a self-contained JSON export (images embedded as base64)
const buildSyncPayload=async(state,includeImages=true)=>{
  // (the includeImages=false branch has no call site today; if it gets one again,
  //  an export "without images" must also drop the idb://, which do not resolve
  //  on another machine)
  const resolved=includeImages?await resolveIdbRefs(state):stripInlineImages(state);
  return JSON.stringify({...resolved,_v:'3.0',_exported:new Date().toISOString()});
};

// Collect every unique idb:// key referenced in the state tree
const collectIdbKeys=(obj,set=new Set())=>{
  if(Array.isArray(obj)){obj.forEach(x=>collectIdbKeys(x,set));}
  else if(obj&&typeof obj==='object'){Object.values(obj).forEach(x=>collectIdbKeys(x,set));}
  else if(typeof obj==='string'&&obj.startsWith('idb://'))set.add(obj.slice(6));
  return set;
};

// Replace idb:// refs in obj using a { 'idb://key': 'https://...' } map
const rehydrateIdbRefs=(obj,map)=>{
  if(Array.isArray(obj))return obj.map(x=>rehydrateIdbRefs(x,map));
  if(obj&&typeof obj==='object'){const out={};for(const k of Object.keys(obj))out[k]=rehydrateIdbRefs(obj[k],map);return out;}
  if(typeof obj==='string'&&obj.startsWith('idb://')&&map[obj])return map[obj];
  return obj;
};

// - IDB GARBAGE COLLECTOR -
// Blobs were never deleted: re-uploaded images, removed references and their
// thumb_ variants accumulated forever. GC deletes blobs not referenced by the
// live state OR by any snapshot in the backup history (a restore must still
// find its images!). Safety rails: keys embed their creation timestamp —
// only blobs older than 24h are eligible, so an image uploaded moments ago
// (state not yet flushed to localStorage) can never be collected.
const _idbKeyAgeMs=k=>{
  const m=/^(?:thumb_)?(?:media_|img_)(\d+)_/.exec(k);
  return m?Date.now()-Number(m[1]):0; // unknown format → treat as fresh (keep)
};
// v23.3 P0-1 — A SECOND CONDITION BEYOND "NOT REFERENCED".
// "it is not in the state right now" is far too weak as evidence for deleting a
// blob: a bad remote apply, a state that failed to load or a half-finished import
// all produce exactly that symptom. The GC now requires the key to show up
// unreferenced in TWO sweeps at least 24h apart — the ledger below holds the
// first observation. If the reference comes back (undo, backup restore, a sync
// that reconciles), the key leaves the ledger and the clock resets.
// Cost: an orphan blob survives ~1 day longer. When in doubt, do not collect.
const GC_LEDGER_KEY='boardhub_gc_pending';
const GC_GRACE_MS=24*3600*1000;
const _gcLedgerLoad=()=>{try{const o=JSON.parse(localStorage.getItem(GC_LEDGER_KEY));return o&&typeof o==='object'&&!Array.isArray(o)?o:{};}catch{return{};}};
// F3: the ledger is what gives the GC its 24h grace period. If it fails to write,
// every sweep becomes a "first observation" and no orphan is ever collected — a
// safe failure, but a silent one, and the database grows with no explanation.
const _gcLedgerSave=o=>{try{Object.keys(o).length?localStorage.setItem(GC_LEDGER_KEY,JSON.stringify(o)):localStorage.removeItem(GC_LEDGER_KEY);}catch(e){bhLog('gc.ledger',e,'the 24h grace period restarts on every sweep');}};
const gcIdb=async()=>{
  try{
    const live=lsLoad();
    // State missing or unreadable: there is no way to know what is referenced,
    // and "nothing referenced" would mean deleting EVERYTHING. It is the same
    // class of failure as the original incident (an empty state overwriting real
    // data) — abort.
    if(!live)return;
    const referenced=new Set();
    collectIdbKeys(live,referenced);
    // F1: the history now comes from IndexedDB. bhHistoryFull() REJECTS if it
    // cannot read — and that rejection leaves through the catch further down,
    // aborting the sweep. That is on purpose: a backup that could not be read is
    // not a backup that references nothing. If this ever becomes `.catch(()=>[])`,
    // the GC goes back to deleting live blobs, which was the v23.3 P0-1.
    if(!_bhReady)await bhHistoryInit();
    if(!_bhReady)return; // history unavailable → no way to know what is an orphan
    (await bhHistoryFull()).forEach(e=>{if(e&&e.state)collectIdbKeys(e.state,referenced);});
    // F1.1: the localStorage safety net holds idb:// references too — the
    // emergency slot, plus anything captured while this database was
    // unreadable. Skipping them here would collect blobs that a real backup
    // still points at, which is the v23.3 P0-1 through a third door.
    // bhLsBackupStates THROWS if a key exists and cannot be parsed; that leaves
    // through the catch below and aborts the sweep, which is the right failure.
    bhLsBackupStates().forEach(s=>collectIdbKeys(s,referenced));
    const db=await openIdb();
    const keys=await new Promise((res,rej)=>{
      const r=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).getAllKeys();
      r.onsuccess=e=>res(e.target.result||[]);r.onerror=e=>rej(e.target.error);
    });
    const now=Date.now();
    const ledger=_gcLedgerLoad();
    const nextLedger={};
    const doomed=[];
    for(const k of keys){
      if(typeof k!=='string')continue;
      const base=k.startsWith('thumb_')?k.slice(6):k;
      if(referenced.has(base))continue;            // live → it does not even enter the ledger
      if(_idbKeyAgeMs(k)<GC_GRACE_MS)continue;     // just created, the state may not have been written yet
      const first=ledger[k];
      const firstMs=first?new Date(first).getTime():NaN;
      if(!(firstMs>0)){nextLedger[k]=new Date(now).toISOString();continue;} // 1st observation: only note it
      if(now-firstMs<GC_GRACE_MS){nextLedger[k]=first;continue;}            // still inside the grace period
      doomed.push(k);
    }
    _gcLedgerSave(nextLedger);
    if(!doomed.length)return;
    const tx=db.transaction(IDB_STORE,'readwrite');
    doomed.forEach(k=>tx.objectStore(IDB_STORE).delete(k));
    await new Promise(res=>{tx.oncomplete=res;tx.onerror=res;tx.onabort=res;});
    console.info('[BoardHub] IDB GC: removed',doomed.length,'orphaned blob(s) after grace period.');
  }catch(e){console.warn('[BoardHub] IDB GC skipped:',e);}
};

// - MODAL -
// v23: stacked modals used to all close on one Escape (each added its own
// document-level listener). A shared stack makes Escape close only the top
// one. Also adds a minimal focus trap + focus restore for keyboard use.
const _modalStack=[];
// - F3.2: ASYNCHRONOUS CONFIRMATION -
// Replaces window.confirm/alert, which freeze the whole thread: during a native
// confirm the autosave does not run, the Firestore listener applies nothing and
// the pomodoro pendulum stops. Beyond that, the browser dialog does not have the
// app's typography and there is no way to mark an action as destructive.
//
// The bridge is module-level because bhConfirm is called from functions that are
// not components. The host registers itself on mount and unregisters on unmount.
let _bhConfirmOpen=null;
const bhConfirm=opts=>{
  const o=typeof opts==='string'?{message:opts}:(opts||{});
  // With no host mounted (boot, render error, harness), fall back to the native
  // dialog. Returning false on its own would be DECIDING FOR THE USER that they
  // gave up; returning true would be worse still. Degrading to the old behaviour
  // is the only path that does not invent an answer.
  if(typeof _bhConfirmOpen!=='function'){
    try{return Promise.resolve(window.confirm(o.message||''));}catch{return Promise.resolve(false);}
  }
  return new Promise(res=>{_bhConfirmOpen(o,res);});
};
const bhAlert=message=>bhConfirm({message,alertOnly:true}).then(()=>undefined);
const ConfirmHost=()=>{
  const [st,setSt]=useState(null); // {opts,resolve}
  const stRef=useRef(null);
  useEffect(()=>{stRef.current=st;});
  useEffect(()=>{
    _bhConfirmOpen=(opts,resolve)=>setSt({opts,resolve});
    return()=>{
      _bhConfirmOpen=null;
      // If the host unmounts with a dialog open, the promise would stay pending
      // forever and the caller's `await` would never continue — the action would
      // stall half-done, with no error. Resolving as "cancelled" is the only safe
      // outcome: it executes nothing destructive.
      const cur=stRef.current;
      if(cur&&cur.resolve){try{cur.resolve(false);}catch{/*silent-ok: resolving an already-settled promise is a no-op*/}}
    };
  },[]);
  if(!st)return null;
  const o=st.opts||{};
  const done=v=>{const r=st.resolve;setSt(null);try{r(v);}catch(e){bhLog('bhConfirm.resolve',e);}};
  return (
    <Modal title={o.title||(o.alertOnly?'Aviso':'Confirmar')} onClose={()=>done(false)} width={o.width||420}>
      <div style={{fontSize:'.85rem',lineHeight:1.6,whiteSpace:'pre-wrap',color:'var(--text)'}}>{o.message||''}</div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:20}}>
        {!o.alertOnly&&(
          <button onClick={()=>done(false)} className="btn btn-ghost" style={{padding:'6px 14px',fontSize:'.8rem'}}>
            {o.cancelLabel||'Cancelar'}
          </button>
        )}
        <button onClick={()=>done(true)} autoFocus
                className={o.danger?'btn btn-danger':'btn btn-primary'}
                style={{padding:'6px 14px',fontSize:'.8rem'}}>
          {o.confirmLabel||(o.alertOnly?'Entendi':'Confirmar')}
        </button>
      </div>
    </Modal>
  );
};

// F5 — which descendants can ACTUALLY take focus.
//
// The selector alone is not enough: a DISABLED button and a display:none input
// both match it, but .focus() on either is a no-op. So whenever the first or
// last match happened to be one of those, the Tab trap "wrapped" focus to an
// element that refused it — and focus stayed put, then escaped the dialog on the
// next Tab. This app has disabled controls inside modals (the Sync buttons carry
// disabled={loading}), so it was reachable, not theoretical.
//
// Pulled out of the Modal so it is testable by behaviour: the trap itself lives
// in a component behind React state, the FILTER does not have to.
// offsetWidth/offsetHeight rather than offsetParent, because offsetParent is
// null for position:fixed elements and the overlay is fixed.
const BH_FOCUSABLE_SEL='button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])';
const bhFocusable=root=>{
  if(!root||!root.querySelectorAll)return [];
  const active=(root.ownerDocument||document).activeElement;
  return [...root.querySelectorAll(BH_FOCUSABLE_SEL)].filter(el=>
    !el.disabled
    &&!el.hasAttribute('inert')
    &&el.getAttribute('aria-hidden')!=='true'
    &&(el.offsetWidth>0||el.offsetHeight>0||el===active));
};
const Modal=({title,onClose,children,width=480})=>{
  const boxRef=useRef(null);
  const tokenRef=useRef(null);
  // v23.3 P2-1: the 4 call sites pass an inline arrow, so onClose changes
  // identity on every render of the parent. With [onClose] in the deps, any
  // parent render unmounted and remounted this effect: the modal left and
  // re-entered _modalStack and — the visible symptom — the box was re-focused,
  // stealing focus from the input the user was filling in inside the modal. The
  // ref keeps the handler always current without its identity taking part in the
  // lifecycle.
  const onCloseRef=useRef(onClose);
  useEffect(()=>{onCloseRef.current=onClose;});
  useEffect(()=>{
    const token={};tokenRef.current=token;_modalStack.push(token);
    const prevFocus=document.activeElement;
    boxRef.current?.focus();
    const h=e=>{
      if(e.key==='Escape'&&_modalStack[_modalStack.length-1]===token)onCloseRef.current();
    };
    document.addEventListener('keydown',h);
    return()=>{
      document.removeEventListener('keydown',h);
      const i=_modalStack.indexOf(token);if(i>-1)_modalStack.splice(i,1);
      if(prevFocus&&prevFocus.focus)try{prevFocus.focus();}catch{/*silent-ok: the element that had focus may have left the DOM while the modal was open*/}
    };
  },[]);
  const trapTab=e=>{
    if(e.key!=='Tab'||!boxRef.current)return;
    const f=bhFocusable(boxRef.current);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  };
  return ReactDOM.createPortal(
  <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal" style={{maxWidth:width}} ref={boxRef} tabIndex={-1} role="dialog" aria-modal="true" aria-label={typeof title==='string'?title:undefined} onKeyDown={trapTab}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
        <h2 className="serif" style={{fontSize:'1.6rem',fontWeight:400,margin:0}}>{title}</h2>
        <button className="btn btn-ghost" onClick={onClose} style={{padding:6}} aria-label="Fechar"><Icon name="x" size={18}/></button>
      </div>
      {children}
    </div>
  </div>
  , document.body);};

const CommandPalette=({projects,notes,mentors,clients,galleryPosts,onNavigate,onSelectProject,onClose})=>{
  const [query,setQuery]=useState('');
  const [activeIdx,setActiveIdx]=useState(0);
  const inputRef=useRef(null);
  useEffect(()=>{inputRef.current?.focus();},[]);
  useEffect(()=>{setActiveIdx(0);},[query]);
  const results=useMemo(()=>{
    const q=query.toLowerCase().trim();
    const items=[];
    const navs=[
      {title:'Vis\u00e3o Geral',icon:'layout-dashboard',action:()=>onNavigate('dashboard'),type:'Navegar'},
      {title:'Projetos',icon:'folder-open',action:()=>onNavigate('projects'),type:'Navegar'},
      {title:'Galeria',icon:'image',action:()=>onNavigate('gallery'),type:'Navegar'},
      {title:'Anotações',icon:'notebook-pen',action:()=>onNavigate('ideas'),type:'Navegar'},
      {title:'Mentores',icon:'graduation-cap',action:()=>onNavigate('mentors'),type:'Navegar'},
      {title:'Social Media',icon:'share-2',action:()=>onNavigate('social'),type:'Navegar'},
      {title:'Clientes',icon:'users',action:()=>onNavigate('clients'),type:'Navegar'},
      {title:'Sincronizar',icon:'refresh-cw',action:()=>onNavigate('sync'),type:'Navegar'},
    ];
    if(!q){
      items.push(...navs.slice(0,4));
      (projects||[]).filter(p=>!p.deleted).slice(0,4).forEach(p=>{
        items.push({title:p.title,icon:'folder-open',meta:p.client||p.status,action:()=>{onSelectProject(p);},type:'Projeto'});
      });
      return items;
    }
    navs.forEach(n=>{if(n.title.toLowerCase().includes(q))items.push(n);});
    (projects||[]).filter(p=>!p.deleted).forEach(p=>{
      if((p.title||'').toLowerCase().includes(q)||(p.client||'').toLowerCase().includes(q)){
        items.push({title:p.title,icon:'folder-open',meta:p.client||p.status,action:()=>{onSelectProject(p);},type:'Projeto'});
      }
    });
    (notes||[]).filter(n=>!n.deleted).forEach(n=>{
      if((n.title||'').toLowerCase().includes(q)||(n.content||'').toLowerCase().includes(q)){
        items.push({title:n.title,icon:'file-text',meta:(n.content||'').slice(0,60),action:()=>onNavigate('ideas'),type:'Nota'});
      }
    });
    (mentors||[]).filter(m=>!m.deleted).forEach(m=>{
      if((m.name||'').toLowerCase().includes(q)||(m.area||'').toLowerCase().includes(q)){
        items.push({title:m.name,icon:'graduation-cap',meta:m.area,action:()=>onNavigate('mentors'),type:'Mentor'});
      }
    });
    (clients||[]).filter(c=>!c.deleted).forEach(c=>{
      if((c.name||'').toLowerCase().includes(q)||(c.company||'').toLowerCase().includes(q)){
        items.push({title:c.name,icon:'users',meta:c.company,action:()=>onNavigate('clients'),type:'Cliente'});
      }
    });
    (galleryPosts||[]).filter(g=>!g.deleted).forEach(g=>{
      if((g.title||'').toLowerCase().includes(q)||(g.content||'').toLowerCase().includes(q)){
        items.push({title:g.title,icon:'image',meta:g.content?.slice(0,50),action:()=>onNavigate('gallery'),type:'Galeria'});
      }
    });
    return items.slice(0,12);
  },[query,projects,notes,mentors,clients,galleryPosts]);
  const run=idx=>{const item=results[idx];if(item){item.action();onClose();}};
  const onKey=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();setActiveIdx(i=>Math.min(i+1,results.length-1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setActiveIdx(i=>Math.max(i-1,0));}
    else if(e.key==='Enter'){e.preventDefault();run(activeIdx);}
    else if(e.key==='Escape'){onClose();}
  };
  return ReactDOM.createPortal(
    <div className="cmd-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="cmd-palette" onKeyDown={onKey}>
        <div className="cmd-input-wrap">
          <Icon name="search" size={18} style={{color:'var(--muted)',flexShrink:0}}/>
          <input ref={inputRef} className="cmd-input" placeholder="Buscar projetos, notas, mentores..." value={query} onChange={e=>setQuery(e.target.value)}/>
          <span className="cmd-kbd">ESC</span>
        </div>
        <div className="cmd-results">
          {results.length===0&&<div className="cmd-empty"><Icon name="search" size={24} style={{opacity:.3,marginBottom:4}}/><div>Nenhum resultado</div></div>}
          {results.map((item,i)=>(
            <div key={i} className={'cmd-item'+(i===activeIdx?' cmd-active':'')} onClick={()=>run(i)} onMouseEnter={()=>setActiveIdx(i)}>
              <div className="cmd-item-icon"><Icon name={item.icon} size={15}/></div>
              <div style={{flex:1,minWidth:0}}>
                <div className="cmd-item-title">{item.title}</div>
                {item.meta&&<div className="cmd-item-meta">{item.meta}</div>}
              </div>
              <span style={{fontSize:'.66rem',color:'var(--border-2)',flexShrink:0,fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>{item.type}</span>
            </div>
          ))}

          <span style={{display:'flex',alignItems:'center',gap:4}}><span className="cmd-kbd" style={{fontSize:'.62rem'}}>{'\u2191\u2193'}</span> navegar</span>
          <span style={{display:'flex',alignItems:'center',gap:4}}><span className="cmd-kbd" style={{fontSize:'.62rem'}}>{'\u21b5'}</span> abrir</span>
          <span style={{display:'flex',alignItems:'center',gap:4}}><span className="cmd-kbd" style={{fontSize:'.62rem'}}>esc</span> fechar</span>
        </div>
      </div>
    </div>,
    document.body
  );
};

// - POMODORO -
const POMO_LS = 'boardhub_pomo_v3';

const pomoLoad = function() {
  try {
    var s = localStorage.getItem(POMO_LS);
    if (s) {
      var parsed = JSON.parse(s);
      // Migrate old format that used dailySeconds/historicalSeconds
      if (typeof parsed.dailySeconds !== 'undefined') {
        var today2 = localDateISO();
        var days2 = {};
        if (parsed.dailySeconds > 0) days2[today2] = parsed.dailySeconds;
        return { days: days2 };
      }
      return parsed;
    }
    // Try older key
    var old = localStorage.getItem('boardhub_pomodoro_stats');
    if (old) {
      var p2 = JSON.parse(old);
      var t2 = localDateISO();
      var d2 = {};
      if (p2.dailySeconds > 0) d2[t2] = p2.dailySeconds;
      return { days: d2 };
    }
  } catch(e) { bhLog('pomoLoad.migrate', e, 'the legacy pomodoro key could not be read, so its accumulated focus time is not carried over'); }
  return { days: {} };
};

const pomoSave = function(d) {
  try { localStorage.setItem(POMO_LS, JSON.stringify(d)); } catch(e) { bhLog('pomoSave', e, 'today\'s focus time was not persisted and is lost on reload'); }
};

const pomoTodayKey = function() {
  return localDateISO();
};

const pomoFmtSecs = function(secs) {
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm';
  return secs + 's';
};

const pomoFmtDay = function(dateStr) {
  try {
    var d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
  } catch(e) { return dateStr; }
};

const pomoFmtMonth = function(mk) {
  try {
    var parts = mk.split('-');
    return new Date(+parts[0], +parts[1]-1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  } catch(e) { return mk; }
};

// - POMODORO TIMER (with built-in stats panel) -
// - DRAGGABLE POMO WIDGET -


const POMO_TIMER_LS = 'boardhub_pomo_timer_v1';
const pomoTimerSave = d => { try { localStorage.setItem(POMO_TIMER_LS, JSON.stringify(d)); } catch(e) {/*silent-ok: the running timer's position, rewritten every tick — losing it costs at most the current session's resume point, and pomoSave already reports the accrued time*/} };
const pomoTimerLoad = () => { try { const s = localStorage.getItem(POMO_TIMER_LS); return s ? JSON.parse(s) : null; } catch(e) { return null; } };

// Web Audio sounds — elevator music aesthetic
// Shared AudioContext — avoids browser's ~6 concurrent context limit
let _sharedAudioCtx = null;
const _getAudioCtx = () => {
  try {
    if (!_sharedAudioCtx || _sharedAudioCtx.state === 'closed') {
      _sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (_sharedAudioCtx.state === 'suspended') _sharedAudioCtx.resume();
    return _sharedAudioCtx;
  } catch(e) { return null; }
};
// _playNote used by medal sounds (routes to ctx.destination directly)
const _playNote = (ctx, freq, startT, vol, decay, type='triangle', detune=0) => {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startT);
  if(detune) osc.detune.setValueAtTime(detune, startT);
  gain.gain.setValueAtTime(0, startT);
  gain.gain.linearRampToValueAtTime(vol, startT + 0.018);
  gain.gain.exponentialRampToValueAtTime(0.001, startT + decay);
  osc.start(startT); osc.stop(startT + decay + 0.05);
};

// Convolution reverb — creates a warm, roomy ambience
const _makeReverb = (ctx, secs=1.8) => {
  const len = Math.ceil(ctx.sampleRate * secs);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for(let i=0; i<len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2) * 0.5;
  }
  const conv = ctx.createConvolver();
  conv.buffer = buf;
  return conv;
};

// The ♪ button now gates the SESSION SOUNDS (start / pause / work_end /
// break_end) rather than the pendulum — the pendulum swings unconditionally, on
// the owner's instruction (2026-08-03).
//
// Module scope, not component state, because playPomoSound is called from inside
// the timer's interval callback: a state value captured there goes stale the
// moment the toggle changes, and the user would hear the OLD setting until the
// next re-render.
//
// DEFAULT ON, deliberately. The stored key defaulted to off when it meant "swing
// the pendulum"; reusing that default for sound would have SILENCED a pomodoro
// that has chimed unconditionally since v23.8 — a regression disguised as a
// feature, and exactly the kind the owner would meet mid-session with no idea
// why. So this is its own key, and the button reads as mute rather than unmute.
const POMO_SOUND_LS = 'boardhub_pomo_sound';
const pomoSoundLoad = () => { try { return localStorage.getItem(POMO_SOUND_LS) !== '0'; } catch { return true; } };
const pomoSoundSave = v => { try { localStorage.setItem(POMO_SOUND_LS, v ? '1' : '0'); } catch(e) {/*silent-ok: a preference that defaults ON; losing it costs one click next session*/} };
let _pomoSoundOn = pomoSoundLoad();
const setPomoSoundOn = v => { _pomoSoundOn = v; pomoSoundSave(v); };
const pomoSoundOn = () => _pomoSoundOn;

const playPomoSound = (type) => {
  if (!_pomoSoundOn) return;
  try {
    const ctx = _getAudioCtx();
    if (!ctx) return;

    // Reverb wet/dry chain
    const reverb   = _makeReverb(ctx);
    const dryBus   = ctx.createGain();
    const wetBus   = ctx.createGain();
    dryBus.gain.value = 0.62;
    wetBus.gain.value = 0.42;
    reverb.connect(wetBus);
    wetBus.connect(ctx.destination);
    dryBus.connect(ctx.destination);

    // All notes feed into this bus → split to dry + reverb
    const bus = ctx.createGain();
    bus.connect(dryBus);
    bus.connect(reverb);

    const note = (freq, t, vol, decay, type='triangle', detune=0) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(bus);
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if(detune) osc.detune.setValueAtTime(detune, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.04);   // soft mallet attack
      gain.gain.exponentialRampToValueAtTime(0.001, t + decay);
      osc.start(t); osc.stop(t + decay + 0.15);
    };

    // ── WHAT MAKES THESE READ AS JAZZ (the study, 2026-08-03) ──────────────
    // The old cues were built from TRIADS — C-E-G rising, a plain descending
    // arpeggio, a bare fifth. A triad is the sound of a notification: it is
    // what every app ships, precisely because it is unambiguous and neutral.
    // Four things move it towards a jazz vocabulary, and all four are cheap
    // here because the engine already does the hard part:
    //
    //  1. EXTENDED HARMONY, NOT TRIADS. 7ths, 9ths, 13ths. A major 6/9 is the
    //     canonical "warm, arrived, nothing more to say" chord; a plain major
    //     triad in its place sounds like a doorbell.
    //  2. ROOTLESS VOICINGS. Jazz pianists drop the root (the bass has it) and
    //     stack the 3rd, 7th and extensions in the middle register. It removes
    //     the blunt "here is the key" quality that makes a triad sound literal.
    //  3. ii–V–I. The defining cadence of the idiom. Dm9 → G13 → Cmaj9 is
    //     recognisable as jazz to anyone, even people who cannot name it.
    //  4. SWING AND ROLL. Even spacing is mechanical. Chords arrive long–short
    //     (roughly a triplet feel) and each voicing is ROLLED a few tens of ms
    //     per note, like a hand on keys rather than a block triggered at once.
    //
    // Timbre matters as much as the notes: a single triangle wave is a buzzer.
    // `voice` stacks a sine fundamental (body), a slightly detuned triangle
    // (the tine bite of an electric piano) and a quiet octave partial (bell).
    // That is a Rhodes impression in three cheap oscillators — no samples, no
    // new dependency (protocol #7).
    //
    // Everything stays in C, as before, so the tier cadences still agree with
    // the session cues.
    bus.gain.value = 0.5;   // headroom: 3 oscillators per voice, up to 5 voices

    const voice = (freq, t, vol, decay) => {
      note(freq,     t, vol,        decay,        'sine');
      note(freq,     t, vol * 0.45, decay * 0.75, 'triangle', 6);
      note(freq * 2, t, vol * 0.07, decay * 0.45, 'sine');
    };
    const roll = (freqs, t, vol, decay, spread = 0.045) =>
      freqs.forEach((f, i) => voice(f, t + i * spread, vol, decay));

    const T = ctx.currentTime;

    if (type === 'work_end') {
      // The arrival. G13 (rootless: 7th, 3rd, 13th) leaning into C6/9 — the
      // 6th and 9th instead of a plain triad are what make it sound settled
      // rather than merely finished.
      roll([349.23, 493.88, 659.25], T, 0.16, 1.5);
      roll([261.63, 329.63, 392.00, 440.00, 587.33], T + 0.34, 0.19, 3.0, 0.055);
    } else if (type === 'break_end') {
      // Short 6/9 stab, upper-mid, no root: bright enough to notice from
      // another room, but it does not announce a full cadence for a 5-minute
      // break.
      roll([440.00, 587.33, 659.25, 783.99], T, 0.15, 1.4, 0.03);
    } else if (type === 'pause') {
      // A ii chord (Dm9) falling, and DELIBERATELY unresolved — the ear waits
      // for the V that never comes. That is the sound of "suspended", which is
      // what a pause is. The old bare fifth said "stopped".
      roll([659.25, 523.25, 440.00, 349.23], T, 0.14, 1.6, 0.07);
    } else if (type === 'start') {
      // ii–V–I, swung: Dm9 → G13 → Cmaj9. The 0.26 / 0.17 split is the long–
      // short triplet feel; spacing them evenly is what would make it sound
      // like a scale exercise instead of a phrase.
      roll([349.23, 440.00, 523.25, 659.25], T,        0.13, 1.1, 0.035);
      roll([349.23, 493.88, 659.25],         T + 0.26, 0.13, 1.1, 0.035);
      roll([329.63, 392.00, 493.88, 587.33], T + 0.43, 0.17, 2.2, 0.045);
    }
  } catch(e) {/*silent-ok: AudioContext is blocked until a user gesture and may be unavailable entirely; sound is ornament, never state*/}
};

// M1 — tempo-change sounds (formerly playMedalSound, per medal tier).
// Here only the DISPATCH was renamed: the cadences are still the same as before,
// because rewriting them is M2's job, where each tempo gets a cadence at its own
// BPM. Renaming without touching the dispatch would leave the sound mute — the
// levels became adagio/andante/moderato/allegro/vivace and no 'bronze' would
// match any more.
// M2 — the BPMs live here, outside the component, because they serve THREE
// consumers: the label in DAY_TIERS, the tier-change cadence and the metronome.
// DAY_TIERS READS from this table instead of repeating the numbers — two
// identical lists diverge silently, and the symptom would be the app showing one
// tempo and playing another.
const TEMPO_BPM = { adagio:66, andante:76, moderato:108, allegro:132, vivace:160 };

// The old 'boardhub_metronome' key and its load/save pair are GONE. They meant
// "swing the pendulum", and the pendulum is no longer optional. The stale key is
// left on disk rather than deleted: it costs ~20 bytes, and a migration that
// touches storage to tidy a preference is more risk than the tidiness is worth.
// The sound preference lives in its own key — see POMO_SOUND_LS above.

const playTempoSound = (level) => {
  try {
    const ctx = _getAudioCtx();
    if (!ctx) return;
    const bpm = TEMPO_BPM[level];
    if (!bpm || level === 'adagio') return;  // the base tier announces nothing
    const t0   = ctx.currentTime;
    const beat = 60 / bpm;                  // crotchet duration AT THIS tempo
    const ring = beat * 2.4;                // a slow tempo lets the note ring longer

    // C pentatonic. The number of degrees grows with the tempo's hurry, and
    // Vivace runs in quavers — it is the same figure, ever tighter.
    const ESCALA = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51];
    const passos = { andante:3, moderato:4, allegro:5, vivace:7 }[level];
    const salto  = level === 'vivace' ? 0.5 : 1;

    for (let i = 0; i < passos; i++) {
      const t = t0 + i * beat * salto;
      _playNote(ctx, ESCALA[i], t, 0.26, ring, 'triangle');
      if (level !== 'andante') _playNote(ctx, ESCALA[i], t, 0.09, ring * 0.75, 'sine', 5);
    }
    // Arrival chord, one crotchet after the last note.
    const fim = t0 + passos * beat * salto;
    [523.25, 659.25, 783.99].forEach((f, i) => {
      _playNote(ctx, f * (level === 'vivace' ? 2 : 1), fim + i * 0.05, 0.15, ring * 1.6, 'triangle');
    });
  } catch(e) {/*silent-ok: same as the tier cadence — a silent tier change is a cosmetic loss, not a data one*/}
};

// M2.1 — the metronome's audible click was REMOVED. It beat ~2×/s for the whole
// session and got in the way more than it helped, which is the opposite of what a
// focus app should do. The pulse still exists, only VISUAL now: the pendulum on
// the dial (see .bh-pendulum). The tier-change cadences stay — those play 4× a
// day, not 3,600.

const PomodoroTimer = ({ pomoData, setPomoData }) => {
  const BREAK_SECS = 5 * 60;
  const MAX_FOCUS_MINS = 60;

  const _init = (() => {
    const saved = pomoTimerLoad();
    const focusMins = saved?.focusMins ?? 30;
    if (saved && saved.isActive && saved.endTimestamp) {
      const remaining = Math.max(0, Math.round((saved.endTimestamp - Date.now()) / 1000));
      return { timeLeft: remaining > 0 ? remaining : focusMins*60, isActive: remaining > 0, mode: saved.mode||'focus', endTimestamp: remaining > 0 ? saved.endTimestamp : null, focusMins };
    }
    return { timeLeft: saved?.timeLeft ?? focusMins*60, isActive: false, mode: saved?.mode||'focus', endTimestamp: null, focusMins };
  })();

  const [focusMins, setFocusMins] = useState(_init.focusMins);
  const [timeLeft, setTimeLeft]   = useState(_init.timeLeft);
  const [isActive, setIsActive]   = useState(_init.isActive);
  const [mode, setMode]           = useState(_init.mode);
  const [showStats, setShowStats] = useState(false);
  const [isDragging, setIsDragging] = useState(false);
  const [soundOn, setSoundOn] = useState(pomoSoundLoad);

  const focusMinsRef    = useRef(focusMins);
  const modeRef         = useRef(mode);
  const timeLeftRef     = useRef(_init.timeLeft);
  const isActiveRef     = useRef(_init.isActive);
  const endTimestampRef = useRef(_init.endTimestamp ?? (_init.isActive ? Date.now() + _init.timeLeft*1000 : null));
  const unsavedSecsRef  = useRef(0);
  const pendingSecsRef  = useRef(0);
  const circleRef       = useRef(null);
  const [displayUnsaved, setDisplayUnsaved] = useState(0);

  focusMinsRef.current = focusMins;
  modeRef.current      = mode;
  timeLeftRef.current  = timeLeft;
  isActiveRef.current  = isActive;

  const persist = (active, tLeft, m, fMins) => {
    const fm = fMins ?? focusMinsRef.current;
    if (active && tLeft > 0)
      pomoTimerSave({ isActive: true, mode: m, endTimestamp: Date.now() + tLeft*1000, timeLeft: tLeft, focusMins: fm });
    else
      pomoTimerSave({ isActive: false, mode: m, timeLeft: tLeft, focusMins: fm });
  };

  const flushPomoSecsRef = useRef(null);
  flushPomoSecsRef.current = () => {
    if (unsavedSecsRef.current <= 0) return;
    const secs = unsavedSecsRef.current;
    unsavedSecsRef.current = 0; setDisplayUnsaved(0);
    pendingSecsRef.current += secs;
    setPomoData(prev => {
      const key = pomoTodayKey();
      const newDays = { ...prev.days };
      newDays[key] = (newDays[key] || 0) + secs;
      pendingSecsRef.current = Math.max(0, pendingSecsRef.current - secs);
      return { days: newDays };
    });
  };
  const flushPomoSecs = () => flushPomoSecsRef.current?.();
  useEffect(() => { return () => flushPomoSecsRef.current?.(); }, [isActive]);

  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === 'visible' && isActiveRef.current && endTimestampRef.current) {
        const remaining = Math.max(0, Math.round((endTimestampRef.current - Date.now()) / 1000));
        // When the browser freezes the tab (mobile in the background, or Chrome
        // after ~5min hidden), the setInterval stops running and nobody credits
        // the elapsed time. Without this, moving the clock forward here would
        // erase that stretch: the next tick would compare against the
        // already-advanced value and see delta 0. Credit the difference before
        // moving the pointer.
        const delta = Math.max(0, timeLeftRef.current - remaining);
        if (modeRef.current === 'focus' && delta > 0) {
          unsavedSecsRef.current += delta; setDisplayUnsaved(unsavedSecsRef.current);
          if (unsavedSecsRef.current >= 30) flushPomoSecs();
        }
        setTimeLeft(remaining); timeLeftRef.current = remaining;
      }
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, []);

  useEffect(() => {
    if (!isActive) return;
    if (!endTimestampRef.current)
      endTimestampRef.current = Date.now() + timeLeftRef.current * 1000;
    persist(true, timeLeftRef.current, modeRef.current);
    const id = setInterval(() => {
      const remaining = Math.max(0, Math.round((endTimestampRef.current - Date.now()) / 1000));
      if (remaining <= 0) {
        if (modeRef.current === 'focus') {
          // The loop above only credits the difference between ticks, so the last
          // stretch (from timeLeft down to 0) would be left out — that is what
          // made a 30min session record 29m59s. Credit the remainder before the
          // flush.
          if (timeLeftRef.current > 0) { unsavedSecsRef.current += timeLeftRef.current; setDisplayUnsaved(unsavedSecsRef.current); }
          flushPomoSecs(); playPomoSound('work_end');
          fireNotification('Pomodoro', 'Sessão de foco encerrada! Hora de pausar. ☕');
          setMode('break'); modeRef.current = 'break';
          setTimeLeft(BREAK_SECS); timeLeftRef.current = BREAK_SECS;
          endTimestampRef.current = Date.now() + BREAK_SECS * 1000;
          persist(true, BREAK_SECS, 'break'); return;
        } else {
          clearInterval(id); playPomoSound('break_end');
          fireNotification('Pomodoro', 'Pausa encerrada! Pronto para focar?');
          const fm = focusMinsRef.current; const fs = fm * 60;
          setMode('focus'); modeRef.current = 'focus';
          setTimeLeft(fs); timeLeftRef.current = fs;
          setIsActive(false); isActiveRef.current = false;
          endTimestampRef.current = null; persist(false, fs, 'focus', fm); return;
        }
      }
      const prev = timeLeftRef.current; const delta = Math.max(0, prev - remaining);
      if (modeRef.current === 'focus' && delta > 0) {
        unsavedSecsRef.current += delta; setDisplayUnsaved(unsavedSecsRef.current);
        if (unsavedSecsRef.current >= 30) flushPomoSecs();
      }
      setTimeLeft(remaining); timeLeftRef.current = remaining;
      if (remaining % 10 === 0) persist(true, remaining, modeRef.current);
    }, 500);
    return () => clearInterval(id);
  }, [isActive]);

  const requestNotifPermission = () => { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); };
  const fireNotification = (title, body) => { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); };

  const toggle = () => {
    requestNotifPermission();
    setIsActive(a => {
      const next = !a;
      if (next) { playPomoSound('start'); endTimestampRef.current = Date.now() + timeLeftRef.current*1000; persist(true, timeLeftRef.current, modeRef.current); }
      else { playPomoSound('pause'); endTimestampRef.current = null; persist(false, timeLeftRef.current, modeRef.current); flushPomoSecs(); }
      return next;
    });
  };
  const reset = () => {
    setIsActive(false); isActiveRef.current = false; endTimestampRef.current = null;
    setMode('focus'); modeRef.current = 'focus';
    const fs = focusMinsRef.current * 60;
    setTimeLeft(fs); timeLeftRef.current = fs;
    persist(false, fs, 'focus'); flushPomoSecs();
  };

  // M2.1 — drag VERTICALLY to set the duration, the way the weight slides on a
  // metronome's rod: higher = slower = longer session. The angular gesture from
  // before existed because the dial was a circle; over a pyramid it means
  // nothing, and the feedback (the weight rising) has to go in the same direction
  // as the finger, or the control fights the drawing.
  const getDragMins = (e) => {
    if (!circleRef.current) return null;
    const rect = circleRef.current.getBoundingClientRect();
    const t = 1 - Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
    return Math.max(1, Math.min(MAX_FOCUS_MINS, Math.round(t * MAX_FOCUS_MINS)));
  };
  const handlePointerDown = (e) => {
    if (isActive || mode !== 'focus') return;
    e.preventDefault(); circleRef.current?.setPointerCapture(e.pointerId); setIsDragging(true);
    const mins = getDragMins(e);
    if (mins) { setFocusMins(mins); focusMinsRef.current = mins; setTimeLeft(mins*60); timeLeftRef.current = mins*60; }
  };
  const handlePointerMove = (e) => {
    if (!isDragging) return;
    const mins = getDragMins(e);
    if (mins) { setFocusMins(mins); focusMinsRef.current = mins; setTimeLeft(mins*60); timeLeftRef.current = mins*60; }
  };
  const handlePointerUp = (e) => {
    if (!isDragging) return; setIsDragging(false);
    const mins = getDragMins(e);
    if (mins) { setFocusMins(mins); focusMinsRef.current = mins; const fs=mins*60; setTimeLeft(fs); timeLeftRef.current=fs; persist(false,fs,'focus',mins); }
  };

  // Display — geometry of the abstract metronome (viewBox 76×76).
  // A truncated pyramid, the rod's pivot just above the divider, and the base
  // compartment holding the time reading and the progress bar.
  // The pyramid takes only the top (y 4→56) so that a free strip is left below:
  // the progress bar lives OUTSIDE the body, and the time reading lives INSIDE
  // the base compartment without touching the outline. Before, the two things
  // competed for the same space and the numbers crossed the drawing.
  const MET_PATH = 'M30,4 L46,4 L70,56 L6,56 Z';
  const MET_PIVOT_Y = 34;      // the rod's joint, above the divider
  const MET_ARM_TOP = 10;      // maximum height of the weight
  const MET_DIV_Y = 37;        // the compartment's divider
  // Text baseline by MEASUREMENT, not by guesswork: in Cormorant 12px the box is
  // 15 tall and the ascender is 11. A compartment from 37→56 = 19 tall, so
  // centring leaves the box at 39→54 — 2 of clearance from the divider and 2 from
  // the outline. Guessing here is what made the numbers touch the base.
  const MET_TEXT_Y = 50;
  const BAR_X = 7, BAR_W = 62, BAR_Y = 64;

  const pct = mode === 'focus'
    ? (isActive ? timeLeft / (focusMins*60) : focusMins / MAX_FOCUS_MINS)
    : timeLeft / BREAK_SECS;
  const isFocus = mode === 'focus';
  const mins = Math.floor(timeLeft/60); const secs = timeLeft % 60;
  const timeStr = (mins<10?'0':'')+mins+':'+(secs<10?'0':'')+secs;
  // Height of the weight on the rod = the chosen duration. Higher = longer
  // session, which is the same direction as the drag and the same convention as
  // the real instrument (weight up = slower).
  const weightY = MET_PIVOT_Y - (Math.min(MAX_FOCUS_MINS,focusMins)/MAX_FOCUS_MINS) * (MET_PIVOT_Y - MET_ARM_TOP);

  const todaySecs = ((pomoData.days||{})[pomoTodayKey()])||0;
  const todayDisplay = todaySecs + displayUnsaved + pendingSecsRef.current;

  // M1 — the focus tiers became TEMPI. A video-game medal (star, bronze, silver,
  // trophy, diamond) does not go with an app set in Cormorant Garamond on warm
  // paper, and tempo is the right unit: it measures the rhythm of work, which is
  // exactly what the counter measures. The BPMs are the conventional ranges of
  // each marking — they serve as a real value for the optional metronome (M2),
  // they are not decoration.
  //
  // THE FLOORS DID NOT CHANGE (0/2/4/6/8h). Renaming is safe; touching a floor
  // would retroactively rewrite the tier of every day already recorded in the
  // history.
  const DAY_TIERS = [
    {level:'adagio',   name:'Adagio',   bpm:TEMPO_BPM.adagio,   glyph:'♩', color:'var(--muted)',   floor:0},
    {level:'andante',  name:'Andante',  bpm:TEMPO_BPM.andante,  glyph:'♩', color:'var(--tempo-1)', floor:2*3600},
    {level:'moderato', name:'Moderato', bpm:TEMPO_BPM.moderato, glyph:'♪', color:'var(--tempo-2)', floor:4*3600},
    {level:'allegro',  name:'Allegro',  bpm:TEMPO_BPM.allegro,  glyph:'♪', color:'var(--tempo-3)', floor:6*3600},
    {level:'vivace',   name:'Vivace',   bpm:TEMPO_BPM.vivace,   glyph:'♫', color:'var(--tempo-4)', floor:8*3600},
  ];
  // Adagio is the base tier, not an achievement — the UI treats it as the old 'none'.
  const isBaseTempo = t => t.level === 'adagio';
  const getStarLevel = s => { for(let i=DAY_TIERS.length-1;i>=0;i--) if(s>=DAY_TIERS[i].floor) return DAY_TIERS[i]; return DAY_TIERS[0]; };
  const currentStar = getStarLevel(todayDisplay);
  const prevStarLevelRef = React.useRef(currentStar.level);
  React.useEffect(()=>{
    if(prevStarLevelRef.current!==currentStar.level&&!isBaseTempo(currentStar)) playTempoSound(currentStar.level);
    prevStarLevelRef.current=currentStar.level;
  },[currentStar.level]);
  const nextStarTier = DAY_TIERS.find(t=>t.floor>currentStar.floor)||null;
  const progressToNext = nextStarTier ? Math.min(100,((todayDisplay-currentStar.floor)/(nextStarTier.floor-currentStar.floor))*100) : 100;

  // M2.1 — the pulse is VISUAL now. There is no scheduler: the rod is a CSS
  // animation whose duration comes from the BPM, so the browser handles the
  // timing in the compositor and there is no JS timer to drift, leak or compete
  // for the thread with the autosave.
  // Half a swing = one crotchet: the rod crosses the centre once per beat, which
  // is exactly what a mechanical metronome does.
  const beatSecs   = 60 / currentStar.bpm;
  // The pendulum is no longer gated by the ♪ toggle (owner, 2026-08-03: "make
  // the metronome swing at all time"). It swings whenever the clock is ticking —
  // in a break too, since that is still the clock running, and the beat still
  // comes from the day's tempo.
  //
  // This retires the v23.11 argument that prefers-reduced-motion must not
  // suppress it "because it is opt-in and born switched off". It is no longer
  // opt-in. The suppression stays out anyway: the swing IS the running-timer
  // indicator now, and hiding it would leave a stopped-looking metronome on a
  // running session — worse for the user than the motion it removes.
  const pendulumOn = isActive;

  // M1 — the month uses DYNAMICS, not tempo. Repeating Adagio…Vivace on both
  // scales would confuse the readings: the day measures RHYTHM (how fast you went
  // today), the month measures VOLUME (how much you accumulated). Dynamics is the
  // right Italian word for volume, and the engraving convention already calls for
  // writing it in italic serif — which is what Cormorant does well.
  // The floors remain untouched (0/40/80/120/160h): a pure rename.
  const MONTH_TIERS = [
    {level:'pianissimo',name:'Pianissimo',mark:'pp', color:'var(--muted)',   floor:0},
    {level:'piano',     name:'Piano',     mark:'p',  color:'var(--tempo-1)', floor:40*3600},
    {level:'mezzoforte',name:'Mezzo-forte',mark:'mf',color:'var(--tempo-2)', floor:80*3600},
    {level:'forte',     name:'Forte',     mark:'f',  color:'var(--tempo-3)', floor:120*3600},
    {level:'fortissimo',name:'Fortissimo',mark:'ff', color:'var(--tempo-4)', floor:160*3600},
  ];
  const isBaseDynamic = t => t.level === 'pianissimo';
  const getMonthMedal = s => { for(let i=MONTH_TIERS.length-1;i>=0;i--) if(s>=MONTH_TIERS[i].floor) return MONTH_TIERS[i]; return MONTH_TIERS[0]; };

  const dayEntries = useMemo(()=>{
    const entries=Object.entries(pomoData.days||{});
    const filtered=entries.filter(e=>e[0]!=='_total'&&e[0].length===10&&e[1]>0);
    filtered.sort((a,b)=>b[0].localeCompare(a[0]));
    return filtered.slice(0,60);
  },[pomoData]);
  const monthEntries = useMemo(()=>{
    const months={};
    for(const[day,s] of Object.entries(pomoData.days||{})){
      if(day==='_total'||day.length!==10)continue;
      const mk=day.slice(0,7); months[mk]=(months[mk]||0)+s;
    }
    const result=Object.entries(months); result.sort((a,b)=>b[0].localeCompare(a[0])); return result;
  },[pomoData]);

  const [statsTab,setStatsTab]=useState('days');
  const maxDay   = dayEntries.reduce((m,e)=>Math.max(m,e[1]),1);
  const maxMonth = monthEntries.reduce((m,e)=>Math.max(m,e[1]),1);
  const totalAll = dayEntries.reduce((sum,e)=>sum+e[1],0);

  return(
    <div style={{marginBottom:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:7}}>
        <span className="label label-section">Pomodoro</span>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{display:'inline-flex',alignItems:'center',gap:6,padding:'3px 10px',borderRadius:20,background:isFocus?'rgba(28,25,23,.06)':'var(--ok-bg)',color:isFocus?'var(--muted)':'var(--ok-fg)',fontSize:'.7rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em'}}>
            <Icon name={isFocus?'brain':'coffee'} size={11}/>
            {isFocus?'Foco':'Pausa'}
          </div>
          <button className="btn btn-ghost" onClick={()=>setShowStats(s=>!s)} title="Histórico de foco"
            style={{padding:'4px 8px',borderRadius:6,background:showStats?'var(--text)':'transparent',color:showStats?'white':'var(--muted)'}}>
            <Icon name="timer" size={14}/>
          </button>
        </div>
      </div>

      {!showStats&&(
        <div className="card" style={{padding:'12px 16px',display:'flex',alignItems:'center',gap:14}}>
          <div ref={circleRef}
            style={{position:'relative',width:76,height:76,flexShrink:0,cursor:(!isActive&&isFocus)?'pointer':'default',touchAction:'none',userSelect:'none'}}
            onPointerDown={handlePointerDown} onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}>
            {/* M2.1 — the dial became an abstract metronome: truncated pyramid,
                rod with a weight, and the reading in the base, as on the wooden
                one. Session progress is still the SAME mechanism as before —
                stroke-dashoffset — only travelling the pyramid's outline instead
                of the circumference. pathLength="100" normalises the perimeter,
                so the percentage arithmetic does not need to know the geometry. */}
            <svg width="76" height="76" viewBox="0 0 76 76" style={{position:'absolute',top:0,left:0}}>
              {/* Body: fixed outline. Time is NO LONGER drawn on top of the
                  outline — it becomes the bar in the base, easier to read at a
                  glance than a stroke travelling around a polygon. */}
              <path d={MET_PATH} fill="none" stroke="var(--border-2)" strokeWidth="2.5" strokeLinejoin="round"/>
              <line x1="14.8" y1={MET_DIV_Y} x2="61.2" y2={MET_DIV_Y} stroke="var(--border)" strokeWidth="1.5"/>

              {/* Rod and weight. The weight lives INSIDE the group that rotates,
                  as on the real instrument, and its height is the chosen
                  duration. */}
              <g className={pendulumOn?'bh-pendulum':undefined}
                 style={pendulumOn?{'--beat':beatSecs+'s','--pivot':MET_PIVOT_Y+'px'}:undefined} aria-hidden="true">
                <line x1="38" y1={MET_PIVOT_Y} x2="38" y2="6" stroke="var(--border-2)" strokeWidth="1.5" strokeLinecap="round"/>
                <rect x="32.5" y={weightY-2.5} width="11" height="5" rx="1.5"
                  fill={isBaseTempo(currentStar)?'var(--muted)':currentStar.color}
                  style={{transition:isDragging?'none':'y .18s'}}/>
              </g>
              <circle cx="38" cy={MET_PIVOT_Y} r="1.6" fill="var(--border-2)"/>

              <text x="38" y={MET_TEXT_Y} textAnchor="middle"
                style={{fontFamily:'Cormorant Garamond,serif',fontSize:'12px',fontWeight:500,letterSpacing:'-0.02em',fill:'var(--text)'}}>
                {isDragging?`${focusMins} min`:timeStr}
              </text>

              {/* A bar that EMPTIES, OUTSIDE the body — the pyramid's outline is
                  drawing, and superimposing a reading on it only muddles both.
                  The track stays visible so the bar has something to shrink
                  against: without it, "almost done" and "not started" are the
                  same emptiness. */}
              <rect x={BAR_X} y={BAR_Y} width={BAR_W} height="3" rx="1.5" fill="var(--border)"/>
              <rect x={BAR_X} y={BAR_Y} width={Math.max(0,BAR_W*pct)} height="3" rx="1.5"
                fill={isFocus?'var(--text)':'var(--ok-fg)'}
                style={{transition:isDragging?'none':'width .5s cubic-bezier(.4,0,.2,1),fill .4s'}}/>
            </svg>
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:5}}>
              <button className="btn btn-outline" onClick={toggle} style={{flex:1,justifyContent:'center',padding:'5px 10px',fontSize:'.78rem'}}>
                <Icon name={isActive?'pause':'play'} size={12}/>
                {isActive?'Pausar':(isFocus?'Iniciar':'Retomar')}
              </button>
              <button className="btn btn-ghost" onClick={reset} title="Reiniciar" style={{padding:5}}>
                <Icon name="rotate-ccw" size={13}/>
              </button>
              <button className="btn btn-ghost"
                onClick={()=>{const v=!soundOn;setSoundOn(v);setPomoSoundOn(v);}}
                aria-pressed={soundOn}
                title={soundOn?'Sons da sessão ligados — início, pausa e fim':'Sons da sessão desligados'}
                aria-label={soundOn?'Desligar os sons da sessão':'Ligar os sons da sessão'}
                style={{padding:'5px 7px',opacity:soundOn?1:.4}}>
                <span style={{fontSize:'.9rem',lineHeight:1,color:soundOn&&!isBaseTempo(currentStar)?currentStar.color:'inherit'}}>♪</span>
              </button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              <div style={{fontSize:'.67rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:4}}>
                <Icon name="clock" size={10}/> Hoje: <strong style={{color:'var(--text)'}}>{pomoFmtSecs(todayDisplay)}</strong> em foco
              </div>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                {/* The tint came out of currentStar.color+'20' — concatenating
                    alpha onto a hex. With the colour coming from a token that
                    becomes "var(--tempo-2)20", which is invalid CSS; color-mix
                    derives the same tint from the variable and works in the dark
                    theme too, because it mixes with transparent. */}
                <div style={{display:'flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:12,background:isBaseTempo(currentStar)?'var(--bg)':`color-mix(in srgb, ${currentStar.color} 12%, transparent)`,border:`1px solid ${isBaseTempo(currentStar)?'var(--border)':`color-mix(in srgb, ${currentStar.color} 28%, transparent)`}`}}>
                  <span style={{fontSize:'.8rem',lineHeight:1,color:isBaseTempo(currentStar)?'var(--muted)':currentStar.color}}>{currentStar.glyph}</span>
                  <span className="serif" style={{fontStyle:'italic',fontSize:'.95rem',fontWeight:500,lineHeight:1,letterSpacing:'-.01em',color:isBaseTempo(currentStar)?'var(--muted)':currentStar.color}}>{currentStar.name}</span>
                  <span style={{fontSize:'.62rem',fontWeight:600,letterSpacing:'.04em',color:'var(--muted)',lineHeight:1}} title={`${currentStar.bpm} BPM`}>{currentStar.bpm}</span>
                </div>
                {nextStarTier&&(
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{height:3,background:'var(--bg)',borderRadius:2,overflow:'hidden'}}>
                      <div style={{height:'100%',width:Math.min(100,progressToNext)+'%',background:currentStar.color,borderRadius:2,transition:'width 0.5s ease'}}/>
                    </div>
                    <div style={{fontSize:'.62rem',color:'var(--muted)',marginTop:1,textAlign:'right'}}>{Math.round(progressToNext)}% → <span className="serif" style={{fontStyle:'italic',fontSize:'.74rem'}}>{nextStarTier.name}</span></div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}


      {showStats && ReactDOM.createPortal(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setShowStats(false)}>
          <div style={{background:'var(--surface)',borderRadius:18,border:'1px solid var(--border)',width:'100%',maxWidth:440,maxHeight:'80vh',display:'flex',flexDirection:'column',boxShadow:'0 20px 60px rgba(28,25,23,.15)',overflow:'hidden'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'20px 24px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
              <h2 className="serif" style={{fontSize:'1.5rem',fontWeight:400,margin:0}}>Historico de Foco</h2>
              <button className="btn btn-ghost" onClick={()=>setShowStats(false)} style={{padding:6}}><Icon name="x" size={18}/></button>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',borderBottom:'1px solid var(--border)',flexShrink:0}}>
              <div style={{padding:'14px 20px',textAlign:'center',borderRight:'1px solid var(--border)'}}>
                <div style={{fontSize:'.62rem',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',marginBottom:4}}>Hoje</div>
                <div style={{fontSize:'1.2rem',fontWeight:600,fontFamily:'Cormorant Garamond,serif'}}>{pomoFmtSecs(todayDisplay)}</div>
              </div>
              <div style={{padding:'14px 20px',textAlign:'center',borderRight:'1px solid var(--border)'}}>
                <div style={{fontSize:'.62rem',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',marginBottom:4}}>Andamento</div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>
                  <span style={{fontSize:'1.15rem',lineHeight:1,color:isBaseTempo(currentStar)?'var(--muted)':currentStar.color}}>{currentStar.glyph}</span>
                  <span className="serif" style={{fontStyle:'italic',fontSize:'1.2rem',fontWeight:500,lineHeight:1,color:isBaseTempo(currentStar)?'var(--muted)':currentStar.color}}>{currentStar.name}</span>
                </div>
              </div>
              <div style={{padding:'14px 20px',textAlign:'center'}}>
                <div style={{fontSize:'.62rem',textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',marginBottom:4}}>Total</div>
                <div style={{fontSize:'1.2rem',fontWeight:600,fontFamily:'Cormorant Garamond,serif'}}>{pomoFmtSecs(totalAll)}</div>
              </div>
            </div>
            <div style={{display:'flex',borderBottom:'1px solid var(--border)',flexShrink:0}}>
              {['days','months'].map(t=>(
                <button key={t} onClick={()=>setStatsTab(t)} style={{flex:1,padding:'10px 0',border:'none',background:'none',cursor:'pointer',fontFamily:'Alegreya Sans,sans-serif',fontSize:'.82rem',fontWeight:500,color:statsTab===t?'var(--text)':'var(--muted)',borderBottom:statsTab===t?'2px solid var(--text)':'2px solid transparent',marginBottom:-1,transition:'all .15s'}}>
                  {t==='days'?'Por Dia':'Por Mes'}
                </button>
              ))}
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'16px 24px'}}>
              {statsTab==='days'&&(dayEntries.length===0
                ?<p style={{fontSize:'.85rem',color:'var(--muted)',textAlign:'center',padding:'32px 0',margin:0}}>Nenhuma sessao registrada.</p>
                :<div style={{display:'flex',flexDirection:'column',gap:12}}>
                  {dayEntries.map(([day,s])=>{
                    const dayStar = getStarLevel(s);
                    return(
                    <div key={day}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,alignItems:'center'}}>
                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <span style={{fontSize:'.82rem',fontWeight:500}}>{pomoFmtDay(day)}</span>
                          {!isBaseTempo(dayStar) && (
                            <span className="serif" style={{fontStyle:'italic',fontSize:'.85rem',lineHeight:1,color:dayStar.color}} title={`${dayStar.name} · ${dayStar.bpm} BPM`}>{dayStar.glyph} {dayStar.name}</span>
                          )}
                        </div>
                        <span style={{fontSize:'.82rem',fontWeight:600}}>{pomoFmtSecs(s)}</span>
                      </div>
                      <div style={{height:5,background:'var(--bg)',borderRadius:3,overflow:'hidden'}}>
                        <div style={{height:'100%',width:Math.round(s/maxDay*100)+'%',background:isBaseTempo(dayStar) ? 'var(--text)' : dayStar.color,borderRadius:3}}/>
                      </div>
                    </div>
                  )})}
                </div>
              )}
              {statsTab==='months'&&(monthEntries.length===0
                ?<p style={{fontSize:'.85rem',color:'var(--muted)',textAlign:'center',padding:'32px 0',margin:0}}>Nenhuma sessao registrada.</p>
                :<div style={{display:'flex',flexDirection:'column',gap:16}}>
                  {monthEntries.map(([mk,s])=>{
                    const daysInMonth=dayEntries.filter(e=>e[0].slice(0,7)===mk);
                    const mMedal=getMonthMedal(s);
                    const mNext=MONTH_TIERS.find(t=>t.floor>mMedal.floor)||null;
                    const mPct=mNext?Math.min(100,((s-mMedal.floor)/(mNext.floor-mMedal.floor))*100):100;
                    return(
                      <div key={mk}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,alignItems:'center'}}>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <span style={{fontSize:'.85rem',fontWeight:600,textTransform:'capitalize'}}>{pomoFmtMonth(mk)}</span>
                            <span title={mMedal.name} className="serif" style={{fontStyle:'italic',fontWeight:600,fontSize:'1.05rem',lineHeight:1,color:isBaseDynamic(mMedal)?'var(--muted)':mMedal.color}}>{mMedal.mark}</span>
                          </div>
                          <span style={{fontSize:'.85rem',fontWeight:700}}>{pomoFmtSecs(s)}</span>
                        </div>
                        <div style={{height:6,background:'var(--bg)',borderRadius:3,overflow:'hidden',marginBottom:2}}>
                          <div style={{height:'100%',width:mPct+'%',background:isBaseDynamic(mMedal)?'var(--muted)':mMedal.color,borderRadius:3,transition:'width .3s'}}/>
                        </div>
                        {mNext&&<div style={{fontSize:'.62rem',color:'var(--muted)',marginBottom:6,textAlign:'right'}}>{Math.round(mPct)}% → <span className="serif" style={{fontStyle:'italic',fontSize:'.76rem'}}>{mNext.name}</span></div>}
                        <div style={{paddingLeft:8}}>
                          {daysInMonth.map(([d,ds])=>(
                            <div key={d} style={{display:'flex',justifyContent:'space-between',padding:'2px 0'}}>
                              <span style={{fontSize:'.74rem',color:'var(--muted)'}}>{pomoFmtDay(d)}</span>
                              <span style={{fontSize:'.74rem',color:'var(--muted)'}}>{pomoFmtSecs(ds)}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      , document.body)}
    </div>
  );
};


// - DASHBOARD -
const Dashboard=React.memo(({projects,notes,mentors,tasks,setTasks,setView,setNotes,pomoData,setPomoData,isMobile,setSelectedProject})=>{
  const active=useMemo(()=>projects.filter(p=>!p.deleted&&p.status==='Em Andamento'),[projects]);
  const recentNotes=useMemo(()=>notes.filter(n=>!n.deleted).slice(0,3),[notes]);
  const allPTasks=useMemo(()=>active.flatMap(p=>(p.projectTasks||[]).filter(t=>t.status!=='Concluído').map(t=>({...t,projectTitle:p.title}))),[active]);
  const h=new Date().getHours();
  const greeting=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const [newTask,setNewTask]=useState('');
  const [showAllTasks,setShowAllTasks]=useState(false);
  const [expandedProjectId,setExpandedProjectId]=useState(null);
  const streakDays=useMemo(()=>{
    // pomoData.days values are plain seconds (numbers), not {total} objects —
    // the old .total read made the streak permanently 0.
    const days=pomoData?.days||{};let streak=0;const d=new Date();
    for(let i=0;i<30;i++){const key=localDateISO(d);if((days[key]||0)>0)streak++;else if(i>0)break;d.setDate(d.getDate()-1);}
    return streak;
  },[pomoData]);
  const stats=[
    {label:'Projetos Ativos',value:active.length,icon:'folder-open',view:'projects',color:'var(--ok-strong)'},
    {label:'Tarefas Abertas',value:active.reduce((s,p)=>(s+(p.projectTasks||[]).filter(t=>t.status!=='Concluído').length),0),icon:'check-square',view:'projects',color:'#ECC94B'},
    {label:'Atividades Pendentes',value:tasks.filter(t=>!t.done).length,icon:'list-checks',view:'dashboard',color:'#F56565'}
  ];
  const addTask=()=>{if(!newTask.trim())return;setTasks(p=>[...p,{id:Date.now(),text:newTask.trim(),done:false,noteId:null}]);setNewTask('');};
  const toggleTask=id=>setTasks(p=>p.map(t=>t.id===id?{...t,done:!t.done}:t));
  const removeTask=id=>setTasks(p=>p.filter(t=>t.id!==id));
  const taskToNote=task=>{const n={id:Date.now(),title:task.text,content:'',date:'Agora',deleted:false};setNotes(p=>[n,...p]);setTasks(p=>p.map(t=>t.id===task.id?{...t,noteId:n.id}:t));};

  const isSmall = !isMobile && typeof window !== 'undefined' && window.innerHeight < 800;
  const content=(
    <div className="fade-up" style={{maxWidth:960,margin:'0 auto',width:'100%',boxSizing:'border-box',height:isMobile?'auto':'calc(100vh - 48px)',display:'flex',flexDirection:'column',overflow:'auto',gap:0}}>
      {/* Header */}
      <div style={{marginBottom:isMobile?10:isSmall?8:12,flexShrink:0}}>
        <h1 className="serif" style={{fontSize:isMobile?'1.9rem':isSmall?'2rem':'2.5rem',fontWeight:300,letterSpacing:'-0.02em',marginBottom:2,lineHeight:1.1}}>{greeting}{streakDays>2?<>, <em style={{color:'var(--muted)'}}>{'dia '+streakDays+' de foco.'}</em></>:<>, <em>Artista.</em></>}</h1>
        <p style={{color:'var(--muted)',fontSize:isSmall?'.76rem':'.82rem'}}>{new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
      </div>
      {/* Stats row */}
      <div style={isMobile?{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:10,flexShrink:0}:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:isSmall?8:10,marginBottom:isSmall?8:12,flexShrink:0}}>
        {stats.map((s,si)=>(
          <div key={s.label} className={'card card-click stat-value stagger-'+(si+1)} onClick={()=>setView(s.view)}
            {...keyActivate(()=>setView(s.view),s.label)} style={isMobile?{padding:'10px 12px',display:'flex',flexDirection:'column',gap:4,minWidth:0,overflow:'hidden'}:{padding:isSmall?'10px 14px':'12px 16px',display:'flex',alignItems:'center',gap:12}}>
            {!isMobile&&<div style={{width:30,height:30,borderRadius:8,background:(s.color||'#999')+'15',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:s.color}}><Icon name={s.icon} size={14}/></div>}
            {isMobile&&<Icon name={s.icon} size={13} style={{color:s.color||'var(--muted)'}}/>}
            <div style={{flex:1,minWidth:0}}>
              <span style={{fontSize:isMobile?'1.6rem':isSmall?'1.5rem':'1.8rem',fontWeight:400,fontFamily:'Cormorant Garamond,serif',lineHeight:1,display:'block',letterSpacing:'-0.02em'}}>{s.value}</span>
              <span style={{fontSize:isMobile?'.62rem':'.72rem',color:'var(--muted)',fontWeight:500,lineHeight:1.3,display:'block',marginTop:2}}>{s.label}</span>
            </div>
          </div>
        ))}

      </div>
      {/* Main grid - fills remaining height */}
      <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:isSmall?10:14,flex:1,minHeight:0,overflow:isMobile?'visible':'hidden'}}>
        {/* LEFT: projects + project tasks */}
        <div style={{display:'flex',flexDirection:'column',gap:isSmall?7:10,minWidth:0,overflow:isMobile?'visible':'auto',paddingRight:isMobile?0:2}}>

          onMouseEnter={e=>e.currentTarget.style.borderColor='var(--text)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
