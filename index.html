<!--
BoardHub v4 – Final polished version.
Auto-save fixed, shape drawing undo history cleaned, all core features robust.
Fabric.js v5, accurate Pomodoro, classy UI, single-file.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BoardHub – Classy Whiteboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
  <style>
    :root {
      --bg: #F5EEDC;
      --surface: rgba(255,248,240,0.94);
      --text: #2C1E16;
      --text-secondary: #5A4A3E;
      --accent: #D4A843;
      --accent-glow: rgba(212,168,67,0.35);
      --accent2: #C17A5E;
      --glass-border: rgba(255,255,255,0.3);
      --shadow: 0 8px 32px rgba(0,0,0,0.1);
      --radius: 14px;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
      --font-heading: 'Playfair Display', serif;
      --font-ui: 'Inter', sans-serif;
    }
    body.dark {
      --bg: #2C1E16;
      --surface: rgba(44,30,22,0.96);
      --text: #F5EEDC;
      --text-secondary: #B8A99A;
      --accent: #D4A843;
      --accent-glow: rgba(212,168,67,0.25);
      --accent2: #C17A5E;
      --glass-border: rgba(255,255,255,0.08);
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }
    #app { display:flex; height:100vh; width:100vw; position:relative; }

    #layers-panel {
      position:absolute; left:-320px; top:0; width:300px; height:100%;
      background:var(--surface); backdrop-filter:blur(24px);
      border-right:1px solid var(--glass-border); box-shadow:var(--shadow);
      z-index:1000; display:flex; flex-direction:column; transition:left var(--transition);
      padding:20px 14px; color:var(--text);
    }
    #layers-panel.open { left:0; }
    .layers-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .layers-header h3 { font-family:var(--font-heading); font-size:1.3rem; color:var(--accent); }
    #layers-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
    .layer-item { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.05); border-radius:8px; padding:6px 8px; cursor:pointer; transition:background 0.2s; }
    body.dark .layer-item { background:rgba(255,255,255,0.08); }
    .layer-item.selected { background:var(--accent-glow); }
    .layer-item input { flex:1; background:transparent; border:none; outline:none; font-size:0.85rem; color:inherit; font-family:var(--font-ui); }
    .layer-item button { background:none; border:none; color:inherit; cursor:pointer; font-size:0.9rem; }
    .layer-item button:hover { color:var(--accent); }

    #canvas-container { flex:1; position:relative; background:transparent; }
    canvas { display:block; }

    #toolbar {
      position:absolute; top:20px; left:50%; transform:translateX(-50%);
      z-index:900; display:flex; flex-wrap:wrap; gap:5px; padding:8px 14px;
      background:var(--surface); backdrop-filter:blur(24px); border-radius:40px;
      border:1px solid var(--glass-border); box-shadow:var(--shadow); transition:all var(--transition);
    }
    #toolbar button, #toolbar .color-input-wrap {
      background:transparent; border:none; color:var(--text); font-size:1rem;
      padding:8px 12px; border-radius:30px; cursor:pointer; transition:all 0.2s;
      display:flex; align-items:center; gap:4px; font-family:var(--font-ui); font-weight:500; white-space:nowrap;
    }
    #toolbar button:hover, #toolbar button.active { background:var(--accent-glow); color:var(--accent); }
    #toolbar button:active { transform:scale(0.96); }
    .color-input-wrap { position:relative; display:flex; align-items:center; }
    #colorPicker { width:28px; height:28px; border:none; border-radius:50%; cursor:pointer; }
    #brushSize { width:70px; accent-color:var(--accent); }

    #pomodoro-widget {
      position:absolute; bottom:30px; right:30px; z-index:950;
      background:var(--surface); backdrop-filter:blur(20px); border-radius:24px;
      border:1px solid var(--glass-border); box-shadow:var(--shadow);
      padding:18px; display:flex; flex-direction:column; align-items:center; gap:10px;
      transition:all var(--transition); min-width:200px; cursor:grab;
    }
    #pomodoro-widget:active { cursor:grabbing; }
    #pomodoro-widget.minimized {
      border-radius:50%; min-width:70px; min-height:70px; padding:10px;
      justify-content:center; bottom:20px; right:20px;
    }
    #pomodoro-widget.minimized .timer-controls,
    #pomodoro-widget.minimized .timer-stats,
    #pomodoro-widget.minimized .tick-toggle { display:none; }
    #pomodoro-widget.minimized #timer-display { font-size:1.2rem; }
    #timer-display { font-family:var(--font-heading); font-size:2rem; font-weight:700; color:var(--accent); }
    .timer-controls { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
    .timer-controls button {
      background:rgba(0,0,0,0.06); border:none; border-radius:20px; padding:6px 14px;
      cursor:pointer; color:var(--text); font-weight:500; font-size:0.85rem; transition:background 0.2s;
    }
    body.dark .timer-controls button { background:rgba(255,255,255,0.1); }
    .timer-controls button:hover { background:var(--accent-glow); }
    #pomodoro-ring { width:100px; height:100px; position:relative; }
    #pomodoro-ring svg { transform:rotate(-90deg); width:100px; height:100px; }
    #pomodoro-ring .bg { fill:none; stroke:rgba(128,128,128,0.2); stroke-width:6; }
    #pomodoro-ring .progress { fill:none; stroke:var(--accent); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset 0.3s linear; }
    .tick-toggle { display:flex; align-items:center; gap:4px; font-size:0.75rem; color:var(--text-secondary); }
    .tick-toggle button { background:transparent; border:1px solid var(--glass-border); border-radius:12px; padding:2px 8px; color:var(--text); cursor:pointer; }

    @media (max-width:768px) {
      #toolbar { top:10px; gap:3px; padding:6px 8px; }
      #toolbar button { font-size:0.8rem; padding:6px 8px; }
      #pomodoro-widget { bottom:10px; right:10px; }
      #layers-panel { width:260px; }
    }
    .hidden { display:none!important; }
    button:focus-visible { outline:2px solid var(--accent); }
  </style>
</head>
<body class="dark">
  <div id="app">
    <div id="layers-panel">
      <div class="layers-header">
        <h3>Layers</h3>
        <button id="closeLayersBtn" style="background:none;border:none;font-size:1.2rem;color:var(--text);cursor:pointer;">✕</button>
      </div>
      <div id="layers-list"></div>
    </div>

    <div id="toolbar">
      <button id="layersToggle" title="Layers">📑</button>
      <button id="selectTool" class="active" title="Select/Move">🖱️</button>
      <button id="penTool" title="Pen">✒️</button>
      <button id="eraserTool" title="Eraser">🧹</button>
      <button id="rectTool" title="Rectangle">⬜</button>
      <button id="circleTool" title="Circle">🔵</button>
      <button id="lineTool" title="Line">📏</button>
      <button id="textTool" title="Text">T</button>
      <button id="stickyTool" title="Sticky Note">📝</button>
      <button id="imageTool" title="Upload Image">🖼️</button>
      <input type="file" id="imageInput" accept="image/*" hidden>
      <button id="panTool" title="Pan">✋</button>
      <span class="color-input-wrap"><input type="color" id="colorPicker" value="#D4A843"></span>
      <input type="range" id="brushSize" min="1" max="50" value="4" title="Brush size">
      <button id="undoBtn" title="Undo">↩️</button>
      <button id="redoBtn" title="Redo">↪️</button>
      <button id="gridToggle" title="Toggle Grid">📐</button>
      <button id="themeToggle" title="Toggle Theme">🌓</button>
      <button id="soundToggleBtn" title="Sound">🔊</button>
      <button id="exportPNGBtn" title="Export PNG">🖼️↓</button>
      <button id="exportSVGBtn" title="Export SVG">📄↓</button>
      <button id="exportJSONBtn" title="Export JSON">💾</button>
      <button id="importJSONBtn" title="Import JSON">📂</button>
      <input type="file" id="importFileInput" accept=".json" hidden>
    </div>

    <div id="canvas-container">
      <canvas id="boardCanvas"></canvas>
    </div>

    <div id="pomodoro-widget">
      <div id="pomodoro-ring">
        <svg viewBox="0 0 36 36">
          <path class="bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
          <path id="progressPath" class="progress" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" stroke-dasharray="100,100" stroke-dashoffset="0"/>
        </svg>
        <div id="timer-display" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">25:00</div>
      </div>
      <div class="timer-stats" style="font-size:0.75rem;color:var(--text-secondary);">🍅 <span id="focusMinutes">0</span> min focus</div>
      <div class="timer-controls">
        <button id="timerStartBtn">▶ Start</button>
        <button id="timerPauseBtn" style="display:none;">⏸ Pause</button>
        <button id="timerResetBtn">↺ Reset</button>
        <button id="timerSkipBtn">⏭ Skip</button>
      </div>
      <div class="tick-toggle">
        <span>⏱️ Tick</span>
        <button id="tickToggleBtn">On</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      // ==================== CONFIG & STATE ====================
      const WORK_MINUTES = 25;
      const WORK_SECONDS = WORK_MINUTES * 60;
      const BREAK_MINUTES = 5;
      const BREAK_SECONDS = BREAK_MINUTES * 60;

      const state = {
        darkMode: true,
        soundEnabled: true,
        tool: 'select',
        color: '#D4A843',
        brushSize: 4,
        gridVisible: true,
      };

      const pomodoro = {
        mode: 'work',
        status: 'idle',
        startTime: null,
        elapsedBeforePause: 0,
        totalDuration: WORK_SECONDS,
        totalFocusMinutes: 0,
        tickEnabled: true,
        lastDisplayedSecond: -1,
      };

      let undoStack = [];
      let redoStack = [];
      const MAX_HISTORY = 50;
      let canvas;
      const GRID_FLAG = 'isGridLine';
      let isDrawingShape = false; // flag to suppress object:added during shape creation

      // ==================== AUDIO ====================
      let audioCtx = null;
      function initAudio() {
        if (audioCtx) return;
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { console.warn('Web Audio not supported'); }
      }
      function resumeAudio() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }
      function playTone(freq, dur, type='sine', vol=0.12) {
        if (!state.soundEnabled || !audioCtx) return;
        resumeAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      }
      function playTick() { playTone(800, 0.05, 'sine', 0.05); }
      function playWorkEnd() {
        playTone(523, 0.15, 'sine', 0.2);
        setTimeout(() => playTone(659, 0.15, 'sine', 0.2), 150);
        setTimeout(() => playTone(784, 0.25, 'sine', 0.2), 300);
      }
      function playBreakEnd() {
        playTone(440, 0.15, 'triangle', 0.2);
        setTimeout(() => playTone(554, 0.2, 'triangle', 0.2), 200);
      }
      function playClick() { playTone(1000, 0.03, 'sine', 0.08); }

      // ==================== CANVAS & GRID ====================
      function isGridObject(obj) { return obj && obj[GRID_FLAG] === true; }

      function removeAllGridLines() {
        const objects = canvas.getObjects();
        for (let i = objects.length - 1; i >= 0; i--) {
          if (isGridObject(objects[i])) canvas.remove(objects[i]);
        }
      }

      function redrawGrid() {
        if (!canvas) return;
        removeAllGridLines();
        if (!state.gridVisible) {
          canvas.requestRenderAll();
          return;
        }
        const gridSize = 30;
        const w = canvas.width, h = canvas.height;
        const stroke = state.darkMode ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.08)';
        for (let i = 0; i < (w / gridSize); i++) {
          canvas.add(new fabric.Line([i * gridSize, 0, i * gridSize, h], {
            stroke, selectable: false, evented: false,
            [GRID_FLAG]: true, excludeFromExport: true
          }));
        }
        for (let j = 0; j < (h / gridSize); j++) {
          canvas.add(new fabric.Line([0, j * gridSize, w, j * gridSize], {
            stroke, selectable: false, evented: false,
            [GRID_FLAG]: true, excludeFromExport: true
          }));
        }
        canvas.requestRenderAll();
      }

      function getSerializableJSON() {
        const objects = canvas.getObjects().filter(obj => !isGridObject(obj));
        const json = canvas.toJSON(['excludeFromExport', GRID_FLAG]);
        json.objects = json.objects.filter(o => !o[GRID_FLAG]);
        return JSON.stringify(json);
      }

      function loadCanvasFromJSON(jsonStr) {
        canvas.loadFromJSON(JSON.parse(jsonStr), () => {
          canvas.renderAll();
          redrawGrid();
          renderLayers();
        });
      }

      function saveState() {
        undoStack.push(getSerializableJSON());
        if (undoStack.length > MAX_HISTORY) undoStack.shift();
        redoStack = [];
        updateUndoRedoButtons();
      }

      function initCanvas() {
        const container = document.getElementById('canvas-container');
        canvas = new fabric.Canvas('boardCanvas', {
          width: container.clientWidth,
          height: container.clientHeight,
          backgroundColor: 'transparent',
          preserveObjectStacking: true,
          selection: true,
        });

        redrawGrid();

        window.addEventListener('resize', () => {
          canvas.setWidth(container.clientWidth);
          canvas.setHeight(container.clientHeight);
          redrawGrid();
        });

        // Attach auto-save and undo listeners after canvas is created
        canvas.on('object:modified', (e) => {
          if (!isGridObject(e.target)) saveState();
          saveToStorage();
        });
        canvas.on('object:added', (e) => {
          if (!isDrawingShape && !isGridObject(e.target)) {
            saveState();
            saveToStorage();
          }
        });
        canvas.on('object:removed', (e) => {
          if (!isGridObject(e.target)) {
            saveState();
            saveToStorage();
          }
        });

        document.addEventListener('keydown', (e) => {
          if ((e.key === 'Delete' || e.key === 'Backspace') && !e.target.closest('input,textarea')) {
            const active = canvas.getActiveObject();
            if (active && !isGridObject(active)) {
              canvas.remove(active);
              canvas.discardActiveObject();
              // saveState called by object:removed listener
            }
          }
        });

        loadFromStorage();
      }

      // ==================== TOOLS ====================
      function setTool(tool) {
        state.tool = tool;
        document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
        const map = {
          select: 'selectTool', pen: 'penTool', eraser: 'eraserTool',
          rect: 'rectTool', circle: 'circleTool', line: 'lineTool',
          text: 'textTool', sticky: 'stickyTool', image: 'imageTool', pan: 'panTool'
        };
        document.getElementById(map[tool])?.classList.add('active');

        canvas.isDrawingMode = false;
        canvas.selection = (tool === 'select');
        canvas.off('mouse:down'); canvas.off('mouse:move'); canvas.off('mouse:up');

        if (tool === 'pen') {
          canvas.isDrawingMode = true;
          canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
          canvas.freeDrawingBrush.color = state.color;
          canvas.freeDrawingBrush.width = state.brushSize;
        } else if (tool === 'eraser') {
          canvas.isDrawingMode = true;
          canvas.freeDrawingBrush = new fabric.EraserBrush(canvas);
          canvas.freeDrawingBrush.width = state.brushSize * 2;
        } else if (['rect','circle','line'].includes(tool)) {
          enableShapeDrawing(tool);
        } else if (tool === 'text') {
          canvas.on('mouse:down', addText);
        } else if (tool === 'sticky') {
          canvas.on('mouse:down', addSticky);
        } else if (tool === 'pan') {
          enablePan();
        }
      }

      function enableShapeDrawing(shape) {
        let isDown = false, origX, origY, shapeObj;
        canvas.on('mouse:down', (opt) => {
          isDown = true;
          isDrawingShape = true; // suppress auto-save for initial zero-sized object
          const p = canvas.getPointer(opt.e);
          origX = p.x; origY = p.y;
          const common = { left: origX, top: origY, fill: 'transparent', stroke: state.color, strokeWidth: state.brushSize };
          if (shape === 'rect') shapeObj = new fabric.Rect({ ...common, width:0, height:0 });
          else if (shape === 'circle') shapeObj = new fabric.Ellipse({ ...common, rx:0, ry:0 });
          else shapeObj = new fabric.Line([origX, origY, origX, origY], { stroke: state.color, strokeWidth: state.brushSize });
          canvas.add(shapeObj);
        });
        canvas.on('mouse:move', (opt) => {
          if (!isDown) return;
          const p = canvas.getPointer(opt.e);
          if (shape === 'rect') {
            shapeObj.set({ width: Math.abs(p.x - origX), height: Math.abs(p.y - origY) });
            shapeObj.set({ left: Math.min(origX, p.x), top: Math.min(origY, p.y) });
          } else if (shape === 'circle') {
            const rx = Math.abs(p.x - origX)/2, ry = Math.abs(p.y - origY)/2;
            shapeObj.set({ rx, ry, left: Math.min(origX, p.x) + rx, top: Math.min(origY, p.y) + ry });
          } else {
            shapeObj.set({ x2: p.x, y2: p.y });
          }
          canvas.renderAll();
        });
        canvas.on('mouse:up', () => {
          if (isDown) {
            isDown = false;
            isDrawingShape = false;
            if (shapeObj && (shapeObj.width === 0 || shapeObj.rx === 0) && shape !== 'line') {
              canvas.remove(shapeObj);
            } else {
              saveState();
              saveToStorage();
            }
            shapeObj = null;
          }
        });
      }

      function addText(opt) {
        const p = canvas.getPointer(opt.e);
        const text = new fabric.IText('Type here', {
          left: p.x, top: p.y, fontFamily: 'Inter', fill: state.color, fontSize: 20, editable: true
        });
        canvas.add(text);
        canvas.setActiveObject(text);
        text.enterEditing();
        // saveState called by object:added listener
        setTool('select');
      }

      function addSticky(opt) {
        const p = canvas.getPointer(opt.e);
        const note = new fabric.Textbox('Sticky note', {
          left: p.x, top: p.y,
          fontFamily: 'Inter', fontSize: 15, fill: '#2C1E16',
          backgroundColor: '#F9E79F', padding: 12, borderRadius: 10,
          width: 150, editable: true, splitByGrapheme: true,
        });
        canvas.add(note);
        canvas.setActiveObject(note);
        canvas.requestRenderAll();
        // saveState called by listener
        setTool('select');
      }

      function enablePan() {
        let panning = false;
        canvas.on('mouse:down', (opt) => { if (opt.e.button === 0) { panning = true; canvas.selection = false; } });
        canvas.on('mouse:move', (opt) => {
          if (panning && opt.e) canvas.relativePan(new fabric.Point(opt.e.movementX, opt.e.movementY));
        });
        canvas.on('mouse:up', () => { panning = false; });
      }

      // ==================== UNDO/REDO ====================
      function undo() {
        if (undoStack.length === 0) return;
        redoStack.push(getSerializableJSON());
        loadCanvasFromJSON(undoStack.pop());
        updateUndoRedoButtons();
      }
      function redo() {
        if (redoStack.length === 0) return;
        undoStack.push(getSerializableJSON());
        loadCanvasFromJSON(redoStack.pop());
        updateUndoRedoButtons();
      }
      function updateUndoRedoButtons() {
        document.getElementById('undoBtn').style.opacity = undoStack.length ? 1 : 0.5;
        document.getElementById('redoBtn').style.opacity = redoStack.length ? 1 : 0.5;
      }

      // ==================== LAYERS ====================
      function renderLayers() {
        const list = document.getElementById('layers-list');
        list.innerHTML = '';
        const objects = canvas.getObjects().filter(obj => !isGridObject(obj)).reverse();
        objects.forEach(obj => {
          const idx = canvas.getObjects().indexOf(obj);
          const item = document.createElement('div');
          item.className = 'layer-item' + (obj === canvas.getActiveObject() ? ' selected' : '');
          const visBtn = document.createElement('button');
          visBtn.textContent = obj.visible ? '👁️' : '👁️‍🗨️';
          visBtn.onclick = (e) => { e.stopPropagation(); obj.visible = !obj.visible; canvas.renderAll(); renderLayers(); };
          const nameInput = document.createElement('input');
          nameInput.value = obj.name || obj.type || 'Object';
          nameInput.onchange = () => { obj.name = nameInput.value; renderLayers(); };
          const upBtn = document.createElement('button'); upBtn.textContent = '↑';
          upBtn.onclick = (e) => { e.stopPropagation(); if (idx < canvas.getObjects().length-1) { canvas.moveTo(obj, idx+1); canvas.renderAll(); renderLayers(); saveState(); } };
          const downBtn = document.createElement('button'); downBtn.textContent = '↓';
          downBtn.onclick = (e) => { e.stopPropagation(); if (idx > 0) { canvas.moveTo(obj, idx-1); canvas.renderAll(); renderLayers(); saveState(); } };
          const delBtn = document.createElement('button'); delBtn.textContent = '🗑️';
          delBtn.onclick = (e) => { e.stopPropagation(); canvas.remove(obj); saveState(); renderLayers(); };
          item.append(visBtn, nameInput, upBtn, downBtn, delBtn);
          item.onclick = () => { canvas.setActiveObject(obj); canvas.renderAll(); renderLayers(); };
          list.appendChild(item);
        });
      }

      // ==================== POMODORO ENGINE ====================
      let timerInterval = null;

      function updatePomodoroDisplay() {
        const total = pomodoro.totalDuration;
        let elapsed;
        if (pomodoro.status === 'running') {
          elapsed = pomodoro.elapsedBeforePause + (Date.now() - pomodoro.startTime) / 1000;
          if (elapsed >= total) { elapsed = total; completeSession(); }
        } else {
          elapsed = pomodoro.elapsedBeforePause;
        }
        const remaining = Math.max(0, total - elapsed);
        const mins = Math.floor(remaining / 60);
        const secs = Math.floor(remaining % 60);
        document.getElementById('timer-display').textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        const progress = document.getElementById('progressPath');
        progress.style.strokeDashoffset = 100 - (elapsed / total) * 100;

        if (pomodoro.tickEnabled && state.soundEnabled && pomodoro.status === 'running') {
          const curSec = Math.floor(remaining);
          if (curSec !== pomodoro.lastDisplayedSecond && remaining > 0) {
            pomodoro.lastDisplayedSecond = curSec;
            playTick();
          }
        }
        document.getElementById('focusMinutes').textContent = Math.round(pomodoro.totalFocusMinutes);
      }

      function completeSession() {
        if (pomodoro.mode === 'work') {
          pomodoro.totalFocusMinutes += WORK_MINUTES;
          playWorkEnd();
          pomodoro.mode = 'break';
          pomodoro.totalDuration = BREAK_SECONDS;
        } else {
          playBreakEnd();
          pomodoro.mode = 'work';
          pomodoro.totalDuration = WORK_SECONDS;
        }
        pomodoro.status = 'idle';
        pomodoro.elapsedBeforePause = 0;
        pomodoro.startTime = null;
        stopTimerInterval();
        updatePomodoroDisplay();
        savePomodoroToStorage();
        updateTimerButtons();
      }

      function startTimer() {
        initAudio();
        if (pomodoro.status === 'idle') {
          pomodoro.status = 'running';
          pomodoro.startTime = Date.now();
          pomodoro.elapsedBeforePause = 0;
        } else if (pomodoro.status === 'paused') {
          pomodoro.status = 'running';
          pomodoro.startTime = Date.now();
        }
        startTimerInterval();
        updateTimerButtons();
        playClick();
      }

      function pauseTimer() {
        if (pomodoro.status === 'running') {
          pomodoro.elapsedBeforePause += (Date.now() - pomodoro.startTime) / 1000;
          pomodoro.status = 'paused';
          stopTimerInterval();
          updatePomodoroDisplay();
          updateTimerButtons();
          playClick();
        }
      }

      function resetTimer() {
        stopTimerInterval();
        pomodoro.status = 'idle';
        pomodoro.elapsedBeforePause = 0;
        pomodoro.totalDuration = pomodoro.mode === 'work' ? WORK_SECONDS : BREAK_SECONDS;
        updatePomodoroDisplay();
        updateTimerButtons();
        playClick();
      }

      function skipTimer() {
        stopTimerInterval();
        pomodoro.mode = pomodoro.mode === 'work' ? 'break' : 'work';
        pomodoro.totalDuration = pomodoro.mode === 'work' ? WORK_SECONDS : BREAK_SECONDS;
        pomodoro.status = 'idle';
        pomodoro.elapsedBeforePause = 0;
        updatePomodoroDisplay();
        updateTimerButtons();
        playClick();
      }

      function startTimerInterval() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updatePomodoroDisplay, 100);
      }
      function stopTimerInterval() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      }
      function updateTimerButtons() {
        document.getElementById('timerStartBtn').style.display = pomodoro.status === 'running' ? 'none' : 'inline-block';
        document.getElementById('timerPauseBtn').style.display = pomodoro.status === 'running' ? 'inline-block' : 'none';
      }
      function savePomodoroToStorage() {
        localStorage.setItem('boardhub_pomodoro', JSON.stringify({
          totalFocusMinutes: pomodoro.totalFocusMinutes,
          mode: pomodoro.mode,
          totalDuration: pomodoro.totalDuration,
          tickEnabled: pomodoro.tickEnabled,
        }));
      }
      function loadPomodoroFromStorage() {
        const saved = localStorage.getItem('boardhub_pomodoro');
        if (saved) {
          const data = JSON.parse(saved);
          pomodoro.totalFocusMinutes = data.totalFocusMinutes || 0;
          pomodoro.mode = data.mode || 'work';
          pomodoro.totalDuration = data.totalDuration || WORK_SECONDS;
          pomodoro.tickEnabled = data.tickEnabled !== undefined ? data.tickEnabled : true;
        }
        updatePomodoroDisplay();
      }

      // ==================== EXPORT/IMPORT ====================
      function exportPNG() {
        const stats = `🍅 ${Math.round(pomodoro.totalFocusMinutes)} min focus`;
        const dataURL = canvas.toDataURL({ format: 'png', multiplier: 2 });
        const img = new Image();
        img.onload = () => {
          const tmp = document.createElement('canvas');
          tmp.width = img.width; tmp.height = img.height;
          const ctx = tmp.getContext('2d');
          ctx.drawImage(img, 0, 0);
          ctx.font = 'bold 28px Inter'; ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.textAlign = 'right';
          ctx.fillText(stats, tmp.width - 30, tmp.height - 20);
          const a = document.createElement('a');
          a.download = `boardhub-${Date.now()}.png`;
          a.href = tmp.toDataURL('image/png');
          a.click();
        };
        img.src = dataURL;
      }

      function exportSVG() {
        const stats = `🍅 ${Math.round(pomodoro.totalFocusMinutes)} min focus`;
        let svg = canvas.toSVG();
        const textEl = `<text x="98%" y="98%" text-anchor="end" font-family="Inter" font-size="20" fill="rgba(0,0,0,0.7)">${stats}</text>`;
        svg = svg.replace(/<\/svg>/i, textEl + '</svg>');
        const blob = new Blob([svg], {type: 'image/svg+xml'});
        const a = document.createElement('a');
        a.download = `boardhub-${Date.now()}.svg`;
        a.href = URL.createObjectURL(blob);
        a.click();
      }

      function exportJSON() {
        const data = {
          canvas: JSON.parse(getSerializableJSON()),
          pomodoro: { totalFocusMinutes: pomodoro.totalFocusMinutes, mode: pomodoro.mode, totalDuration: pomodoro.totalDuration },
          settings: { darkMode: state.darkMode, soundEnabled: state.soundEnabled, color: state.color, brushSize: state.brushSize, gridVisible: state.gridVisible }
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.download = `boardhub-${Date.now()}.json`;
        a.href = URL.createObjectURL(blob);
        a.click();
      }

      function importJSON(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.canvas) {
              canvas.loadFromJSON(data.canvas, () => {
                canvas.renderAll();
                redrawGrid();
                renderLayers();
                undoStack = []; redoStack = [];
                saveState(); // initial state after import
              });
            }
            if (data.pomodoro) {
              pomodoro.totalFocusMinutes = data.pomodoro.totalFocusMinutes || 0;
              pomodoro.mode = data.pomodoro.mode || 'work';
              pomodoro.totalDuration = data.pomodoro.totalDuration || WORK_SECONDS;
              pomodoro.status = 'idle';
              pomodoro.elapsedBeforePause = 0;
              updatePomodoroDisplay();
              savePomodoroToStorage();
            }
            if (data.settings) {
              state.darkMode = data.settings.darkMode;
              state.soundEnabled = data.settings.soundEnabled;
              state.color = data.settings.color || '#D4A843';
              state.brushSize = data.settings.brushSize || 4;
              state.gridVisible = data.settings.gridVisible !== false;
              applySettings();
            }
          } catch(err) { alert('Invalid JSON file.'); }
        };
        reader.readAsText(file);
      }

      // ==================== LOCAL STORAGE ====================
      function saveToStorage() {
        const data = {
          canvas: JSON.parse(getSerializableJSON()),
          pomodoro: { totalFocusMinutes: pomodoro.totalFocusMinutes, mode: pomodoro.mode, totalDuration: pomodoro.totalDuration },
          settings: { darkMode: state.darkMode, soundEnabled: state.soundEnabled, color: state.color, brushSize: state.brushSize, gridVisible: state.gridVisible }
        };
        localStorage.setItem('boardhub_data', JSON.stringify(data));
        savePomodoroToStorage();
      }
      function loadFromStorage() {
        const saved = localStorage.getItem('boardhub_data');
        if (saved) {
          try {
            const data = JSON.parse(saved);
            if (data.canvas) {
              canvas.loadFromJSON(data.canvas, () => {
                canvas.renderAll();
                redrawGrid();
                renderLayers();
              });
            }
            if (data.pomodoro) {
              pomodoro.totalFocusMinutes = data.pomodoro.totalFocusMinutes || 0;
              pomodoro.mode = data.pomodoro.mode || 'work';
              pomodoro.totalDuration = data.pomodoro.totalDuration || WORK_SECONDS;
            }
            if (data.settings) {
              state.darkMode = data.settings.darkMode;
              state.soundEnabled = data.settings.soundEnabled !== false;
              state.color = data.settings.color || '#D4A843';
              state.brushSize = data.settings.brushSize || 4;
              state.gridVisible = data.settings.gridVisible !== false;
              applySettings();
            }
            updatePomodoroDisplay();
          } catch(e) { console.warn('Could not load saved data'); }
        } else {
          applySettings();
        }
      }

      // ==================== THEME & UI ====================
      function applySettings() {
        document.body.classList.toggle('dark', state.darkMode);
        document.getElementById('colorPicker').value = state.color;
        document.getElementById('brushSize').value = state.brushSize;
        document.getElementById('soundToggleBtn').textContent = state.soundEnabled ? '🔊' : '🔇';
        document.getElementById('gridToggle').textContent = state.gridVisible ? '📐' : '📐⁣';
        document.getElementById('tickToggleBtn').textContent = pomodoro.tickEnabled ? 'On' : 'Off';
        updateUndoRedoButtons();
        redrawGrid();
      }
      function toggleTheme() { state.darkMode = !state.darkMode; applySettings(); saveToStorage(); }
      function toggleGrid() { state.gridVisible = !state.gridVisible; applySettings(); saveToStorage(); }
      function toggleSound() { state.soundEnabled = !state.soundEnabled; applySettings(); saveToStorage(); }
      function toggleTick() {
        pomodoro.tickEnabled = !pomodoro.tickEnabled;
        document.getElementById('tickToggleBtn').textContent = pomodoro.tickEnabled ? 'On' : 'Off';
        savePomodoroToStorage();
      }

      // Draggable Pomodoro widget
      function makeDraggable(el) {
        let offX, offY, down = false;
        el.addEventListener('mousedown', (e) => {
          if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
          down = true; offX = e.clientX - el.getBoundingClientRect().left; offY = e.clientY - el.getBoundingClientRect().top;
          el.style.cursor = 'grabbing';
        });
        document.addEventListener('mousemove', (e) => {
          if (!down) return;
          el.style.left = (e.clientX - offX) + 'px';
          el.style.top = (e.clientY - offY) + 'px';
          el.style.right = 'auto'; el.style.bottom = 'auto';
        });
        document.addEventListener('mouseup', () => { down = false; el.style.cursor = 'grab'; });
      }
      makeDraggable(document.getElementById('pomodoro-widget'));
      document.getElementById('pomodoro-widget').addEventListener('dblclick', function(e) {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        this.classList.toggle('minimized');
      });

      // ==================== INIT ====================
      function init() {
        initCanvas();
        loadPomodoroFromStorage();
        updateTimerButtons();

        document.getElementById('selectTool').onclick = () => setTool('select');
        document.getElementById('penTool').onclick = () => setTool('pen');
        document.getElementById('eraserTool').onclick = () => setTool('eraser');
        document.getElementById('rectTool').onclick = () => setTool('rect');
        document.getElementById('circleTool').onclick = () => setTool('circle');
        document.getElementById('lineTool').onclick = () => setTool('line');
        document.getElementById('textTool').onclick = () => setTool('text');
        document.getElementById('stickyTool').onclick = () => setTool('sticky');
        document.getElementById('imageTool').onclick = () => document.getElementById('imageInput').click();
        document.getElementById('imageInput').onchange = (e) => {
          const file = e.target.files[0]; if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            fabric.Image.fromURL(ev.target.result, (img) => {
              img.scaleToWidth(200); canvas.add(img); canvas.renderAll(); saveState();
            });
          };
          reader.readAsDataURL(file); e.target.value = '';
        };
        document.getElementById('panTool').onclick = () => setTool('pan');
        document.getElementById('undoBtn').onclick = undo;
        document.getElementById('redoBtn').onclick = redo;
        document.getElementById('gridToggle').onclick = toggleGrid;
        document.getElementById('themeToggle').onclick = toggleTheme;
        document.getElementById('soundToggleBtn').onclick = toggleSound;
        document.getElementById('colorPicker').oninput = (e) => {
          state.color = e.target.value;
          if (state.tool === 'pen') canvas.freeDrawingBrush.color = state.color;
          saveToStorage();
        };
        document.getElementById('brushSize').oninput = (e) => {
          state.brushSize = parseInt(e.target.value);
          if (state.tool === 'pen') canvas.freeDrawingBrush.width = state.brushSize;
          if (state.tool === 'eraser') canvas.freeDrawingBrush.width = state.brushSize * 2;
          saveToStorage();
        };
        document.getElementById('layersToggle').onclick = () => document.getElementById('layers-panel').classList.toggle('open');
        document.getElementById('closeLayersBtn').onclick = () => document.getElementById('layers-panel').classList.remove('open');

        document.getElementById('timerStartBtn').onclick = startTimer;
        document.getElementById('timerPauseBtn').onclick = pauseTimer;
        document.getElementById('timerResetBtn').onclick = resetTimer;
        document.getElementById('timerSkipBtn').onclick = skipTimer;
        document.getElementById('tickToggleBtn').onclick = toggleTick;

        document.getElementById('exportPNGBtn').onclick = exportPNG;
        document.getElementById('exportSVGBtn').onclick = exportSVG;
        document.getElementById('exportJSONBtn').onclick = exportJSON;
        document.getElementById('importJSONBtn').onclick = () => document.getElementById('importFileInput').click();
        document.getElementById('importFileInput').onchange = (e) => {
          const file = e.target.files[0]; if (file) importJSON(file); e.target.value = '';
        };

        setTool('select');
        window.addEventListener('beforeunload', saveToStorage);
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>
</body>
</html>
