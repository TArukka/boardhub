          {form.cover&&<div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.45)',display:'flex',alignItems:'center',justifyContent:'center',color:'white',gap:6,fontSize:'.82rem'}}><Icon name="camera" size={16}/>Trocar</div>}
          <input ref={coverRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleCover}/>

        </div>
        <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr 1fr',gap:12}}>
          <Field label="Status"><select className="input-box" value={form.status} onChange={e=>set('status',e.target.value)} style={{cursor:'pointer'}}><option>Em Andamento</option><option>Pausado</option><option>Concluído</option><option>Cancelado</option></select></Field>
          <Field label="Início"><input className="input-box" type="date" value={form.startDate} onChange={e=>set('startDate',e.target.value)}/></Field>
          <Field label="Deadline"><input className="input-box" type="date" value={form.deadline} onChange={e=>set('deadline',e.target.value)}/></Field>

          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>

  );

// - PROJECTS LIST -
const ProjectsList=React.memo(({projects,setProjects,onSelect,onAdd,isMobile})=>{
  const [filterType,setFilterType]=useState('all');
  const [onlyActive,setOnlyActive]=useState(false);
  const [trash,setTrash]=useState(false);
  const visible=projects.filter(p=>trash?p.deleted:(!p.deleted&&(filterType==='all'||p.type===filterType)&&(!onlyActive||p.status==='Em Andamento')));
  const softDelete=id=>setProjects(p=>p.map(x=>x.id===id?{...x,deleted:true,deletedAt:new Date().toISOString()}:x));
  const restore=id=>setProjects(p=>p.map(x=>x.id===id?{...x,deleted:false,deletedAt:null}:x));
  const hardDelete=async id=>{if(await bhConfirm({message:'Excluir permanentemente? Esta ação não pode ser desfeita.',danger:true,confirmLabel:'Excluir'})){setProjects(p=>p.filter(x=>x.id!==id));}}
  // Drag-to-reorder (desktop grid). Moves the dragged project just before the drop target in
  // the full array; since the visible list preserves array order, the visible order follows.
  const projDrag=useRef(null);
  const projDragEnd=useRef(0); // timestamp of last drag end — suppresses the open-click after a drag
  const reorderProjects=(fromId,toId)=>{
    if(fromId===toId)return;
    setProjects(prev=>{
      const arr=[...prev];
      const fi=arr.findIndex(p=>p.id===fromId);
      if(fi<0)return prev;
      const[item]=arr.splice(fi,1);
      const ti=arr.findIndex(p=>p.id===toId);
      if(ti<0)return prev;
      arr.splice(ti,0,item);
      return arr;
    });
  };
  // Duplicate project as a template: copies structure (tasks, references, mentors)
  // but resets status, dates and timeline — useful for recurring jobs on the same pipeline
  const duplicateProject=p0=>{
    const base=Date.now();
    const np={...p0,id:base,title:p0.title+' (cópia)',status:'Em Andamento',deleted:false,
      startDate:'',deadline:'',timelineEvents:[],paid:false,shotsDone:0,
      projectTasks:(p0.projectTasks||[]).map((t,i)=>({...t,id:base+i+1,status:'Pendente',startDate:'',dueDate:''}))};
    setProjects(prev=>[np,...prev]);
  };

  // All pending tasks grouped by project
  const activeProjsWithTasks=projects.filter(p=>!p.deleted&&(p.projectTasks||[]).some(t=>t.status!=='Concluído'));
  const PTASK_STATUS_ORDER=['Fazendo','Atrasado','Pendente'];
  const statusColor={'Fazendo':'var(--warn-fg)','Atrasado':'var(--danger-fg)','Pendente':'var(--muted)'};
  const statusBg={'Fazendo':'var(--warn-bg)','Atrasado':'var(--danger-bg)','Pendente':'var(--neutral-bg)'};

  return(
    <div className="fade-up" style={{maxWidth:'100%',boxSizing:'border-box',height:isMobile?'auto':'calc(100vh - clamp(32px,5vh,80px))',overflowY:isMobile?'visible':'auto'}}>
      {/* All-tasks popup */}
      <div style={{display:'flex',gap:28,alignItems:'flex-start',flexDirection:isMobile?'column':'row',flex:1}}>

// - GANTT TIMELINE -
const PTASK_STATUSES=['Pendente','Fazendo','Concluído','Atrasado'];
const PTASK_NEXT={'Pendente':'Fazendo','Fazendo':'Concluído','Concluído':'Atrasado','Atrasado':'Pendente'};

// M3: the Gantt bars had their own palette, more saturated than the tags' for the
// same status — 'Fazendo' was #FEF3C7 here and #FEF9E7 on the tag. Two palettes
// for the same vocabulary diverge quietly and double the work of the dark theme.
// Now both read the same triads.
const GANTT_COLORS={
  'Pendente': {bar:'var(--neutral-bg)',text:'var(--muted)',  border:'var(--border-2)',dot:'var(--border-2)'},
  'Fazendo':  {bar:'var(--warn-bg)',   text:'var(--warn-fg)',border:'var(--warn-line)',dot:'var(--warn-strong)'},
  'Concluído':{bar:'var(--ok-bg)',     text:'var(--ok-fg)',  border:'var(--ok-line)',  dot:'var(--ok-strong)'},
  'Atrasado': {bar:'var(--danger-bg)', text:'var(--danger-fg)',border:'var(--danger-line)',dot:'var(--danger-strong)'},
};

const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const addDays=(dateStr,days)=>{const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+days);return localDateISO(d);};
const todayISO=()=>localDateISO();
// Currency formatting (pt-BR)
const fmtBRL=v=>{const n=Number(v);if(!n||isNaN(n))return null;return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:0,maximumFractionDigits:2});};
// Deadline countdown info: returns {label,date,color,bg,urgent} or null
const deadlineInfo=deadline=>{
  if(!deadline)return null;
  const diff=daysBetween(todayISO(),deadline);
  const date=new Date(deadline+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','');
  if(diff<0)return{label:'atrasado '+Math.abs(diff)+'d',date,color:'var(--danger-fg)',bg:'var(--danger-bg)',urgent:true};
  if(diff===0)return{label:'hoje!',date,color:'var(--danger-fg)',bg:'var(--danger-bg)',urgent:true};
  if(diff===1)return{label:'amanhã',date,color:'var(--warn-fg)',bg:'var(--warn-bg)',urgent:true};
  if(diff<=7)return{label:'em '+diff+'d',date,color:'var(--warn-fg)',bg:'var(--warn-bg)',urgent:false};
  return{label:'em '+diff+'d',date,color:'var(--muted)',bg:'var(--bg)',urgent:false};
};
const fmtShort=d=>{if(!d)return'';const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});};

const GanttTimeline=({tasks,onUpdateTasks,projectStart,projectEnd,onTaskClick,onSyncAdd,onSyncDelete})=>{
  const today=useMemo(()=>todayISO(),[]);
  const [selectedId,setSelectedId]=useState(null);
  const [editDraft,setEditDraft]=useState(null);
  const [newTaskName,setNewTaskName]=useState('');
  const [thisWeek,setThisWeek]=useState(true);
  const [expanded,setExpanded]=useState(false);
  const scrollRef=useRef(null);
  const dragRef=useRef(null);
  const dragRowRef=useRef(null);
  const dragOverRowRef=useRef(null);
  const [, forceUpdate]=useState(0);

  // Compute this week Mon-Sun
  const getWeekBounds=()=>{
    const d=new Date(today+'T12:00:00');
    const day=d.getDay(); // 0=Sun
    const mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return{start:localDateISO(mon),end:localDateISO(sun)};
  };

  // - Compute chart bounds -
  let chartStart=projectStart||today;
  let chartEnd=projectEnd||addDays(today,45);
  tasks.forEach(t=>{
    if(t.startDate&&t.startDate<chartStart)chartStart=t.startDate;
    if(t.dueDate&&t.dueDate>chartEnd)chartEnd=t.dueDate;
  });
  if(thisWeek){const wb=getWeekBounds();chartStart=wb.start;chartEnd=wb.end;}
  else{chartStart=addDays(chartStart,-5);chartEnd=addDays(chartEnd,12);}
  // When showing "this week", only render tasks that overlap the visible window.
  // A task overlaps [chartStart, chartEnd] if its start <= chartEnd AND its end >= chartStart.
  const visibleTasks=thisWeek
    ? tasks.filter(t=>{
        // Always show overdue tasks regardless of date range — they need attention
        if(t.status==='Atrasado')return true;
        const s=t.startDate||(projectStart||today);
        const e=t.dueDate||(projectEnd||addDays(today,7));
        return s<=chartEnd&&e>=chartStart;
      })
    : tasks;
  const totalDays=Math.max(1,daysBetween(chartStart,chartEnd));
  const DAY_W=36;
  const ROW_H=38;
  const HEADER_H=44;
  const LEFT_W=200;

  // - Month + week header data -
  const months=[];
  let cur=new Date(chartStart+'T12:00:00');
  const endDt=new Date(chartEnd+'T12:00:00');
  while(cur<=endDt){
    const mStart=localDateISO(cur);
    const label=cur.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.',' ');
    const next=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    const mEnd=next>endDt?chartEnd:localDateISO(next);
    months.push({label,days:daysBetween(mStart,mEnd)});
    cur=next;
  }

  const weekMarkers=[];
  for(let i=0;i<=totalDays;i+=7){
    const d=addDays(chartStart,i);
    const dt=new Date(d+'T12:00:00');
    weekMarkers.push({offset:i*DAY_W,label:dt.getDate()+'/'+(dt.getMonth()+1)});
  }

  // Weekend columns (Sat=6, Sun=0)
  const weekendCols=[];
  for(let i=0;i<=totalDays;i++){
    const dt=new Date(chartStart+'T12:00:00');dt.setDate(dt.getDate()+i);
    const dow=dt.getDay();
    if(dow===0||dow===6)weekendCols.push(i);
  }

  const todayOffset=daysBetween(chartStart,today)*DAY_W;
  const gridW=totalDays*DAY_W;

  // - Bar geometry -
  const barGeom=t=>{
    const s=t.startDate||(projectStart||today);
    const e=t.dueDate||(projectEnd||addDays(today,7));
    const visStart=s<chartStart?chartStart:s;
    const left=Math.max(0,daysBetween(chartStart,s))*DAY_W;
    const width=Math.max(DAY_W,(daysBetween(visStart,e)+1)*DAY_W);
    return{left,width};
  };

  // - Drag -
  const startDrag=(e,taskId,type)=>{
    e.preventDefault();e.stopPropagation();
    const t=tasks.find(x=>x.id===taskId);if(!t)return;
    const origStart=t.startDate||(projectStart||today);
    const origEnd=t.dueDate||(projectEnd||addDays(today,7));
    dragRef.current={taskId,type,startX:e.clientX,origStart,origEnd};
    const onMove=me=>{
      if(!dragRef.current)return;
      const dx=me.clientX-dragRef.current.startX;
      const delta=Math.round(dx/DAY_W);
      const{taskId,type,origStart,origEnd}=dragRef.current;
      let ns,ne;
      if(type==='move'){ns=addDays(origStart,delta);ne=addDays(origEnd,delta);}
      else if(type==='left'){ns=addDays(origStart,delta);ne=origEnd;if(ns>=ne)ns=addDays(ne,-1);}
      else{ns=origStart;ne=addDays(origEnd,delta);if(ne<=ns)ne=addDays(ns,1);}
      onUpdateTasks(tasks.map(x=>x.id===taskId?{...x,startDate:ns,dueDate:ne}:x));
    };
    const onUp=()=>{dragRef.current=null;window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);};
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  };

  // - Edit -
  const selectTask=t=>{setSelectedId(t.id);setEditDraft({...t,startDate:t.startDate||(projectStart||today),dueDate:t.dueDate||(projectEnd||addDays(today,7)),notes:t.notes||''});};
  const saveEdit=()=>{if(!editDraft)return;onUpdateTasks(tasks.map(t=>t.id===editDraft.id?{...editDraft}:t));setSelectedId(null);setEditDraft(null);};
  const deleteTask=()=>{if(!editDraft)return;onUpdateTasks(tasks.filter(t=>t.id!==editDraft.id));if(onSyncDelete)onSyncDelete(editDraft.id);setSelectedId(null);setEditDraft(null);};
  const cycleStatus=id=>{const upd=tasks.map(t=>t.id===id?{...t,status:PTASK_NEXT[t.status]||'Pendente'}:t);onUpdateTasks(upd);if(editDraft&&editDraft.id===id)setEditDraft(d=>({...d,status:PTASK_NEXT[d.status]||'Pendente'}));};
  const addTask=()=>{

                      cursor:'grab',display:'flex',alignItems:'center',

                    <div style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:'.68rem',fontWeight:600,color:colors.text,userSelect:'none'}}>{width>60?t.text:''}</div>

                  </div>

            })}

            {/* Today line */}
            {todayOffset>=0&&todayOffset<=gridW&&(

      {/* Expand/Collapse arrow */}
      {visibleTasks.length>0&&(

            borderTop:'1px solid var(--border)',background:'var(--surface)',transition:'background .15s',userSelect:'none'}}

      {editDraft&&(

          <div style={{flex:2,minWidth:160}}>

          </div>
          <div style={{minWidth:130}}>
            <label style={{fontSize:'.62rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.09em',color:'var(--muted)',display:'block',marginBottom:5}}>Prazo</label>
            <input type="date" value={editDraft.dueDate||''} onChange={e=>setEditDraft({...editDraft,dueDate:e.target.value})} className="input-box"/>
          </div>
          <div style={{minWidth:130}}>
            <label style={{fontSize:'.62rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.09em',color:'var(--muted)',display:'block',marginBottom:5}}>Status</label>
            <select value={editDraft.status} onChange={e=>setEditDraft({...editDraft,status:e.target.value})}
              style={{width:'100%',padding:'8px 12px',borderRadius:8,border:'1px solid var(--border)',fontFamily:'Alegreya Sans,sans-serif',fontSize:'.85rem',background:'var(--bg)',color:'var(--text)',outline:'none',cursor:'pointer'}}>
              {PTASK_STATUSES.map(s=><option key={s}>{s}</option>)}

          </div>

            <button onClick={saveEdit} className="btn btn-dark" style={{padding:'8px 16px'}}><Icon name="check" size={14}/> Salvar</button>
          </div>

};

// - PROJECT DETAIL -

// Auto-mark tasks as Atrasado if past their dueDate and not Concluído
const applyAutoLate=tasks=>{
  const today=new Date();today.setHours(0,0,0,0);
  return (tasks||[]).map(t=>{
    if(t.status==='Concluído')return t;
    if(!t.dueDate)return t;
    const due=new Date(t.dueDate);due.setHours(0,0,0,0);
    if(due<today&&t.status!=='Atrasado')return{...t,status:'Atrasado'};
    return t;
  });
};

const ProjectDetail=React.memo(({project,onBack,onUpdate,onSoftDelete,globalMentors,onAddGlobalMentor,galleryPosts,galleryFolders,isMobile})=>{
  const [local,setLocal]=useState(()=>{
    const tasks=applyAutoLate(project.projectTasks);
    return{...project,projectTasks:tasks};
  });
  const [tab,setTab]=useState('Visão Geral');
  const [galleryPopup,setGalleryPopup]=useState(null);
  const assignableFolders=useMemo(()=>(galleryFolders||[]).filter(f=>!f.deleted),[galleryFolders]);
  const folderPosts=useMemo(()=>local.galleryFolder?(galleryPosts||[]).filter(p=>!p.deleted&&p.folder===local.galleryFolder).sort((a,b)=>((b.date||'').slice(0,10)).localeCompare((a.date||'').slice(0,10))):[],[galleryPosts,local.galleryFolder]);
  const autoLateTasks=useMemo(()=>applyAutoLate(local.projectTasks||[]),[local.projectTasks]);
  useEffect(()=>{if(!galleryPopup)return;const h=e=>{if(e.key==='Escape')setGalleryPopup(null);};document.addEventListener('keydown',h);return()=>document.removeEventListener('keydown',h);},[galleryPopup]);
  const [showTimelineModal,setShowTimelineModal]=useState(false);
  const coverRef=useRef();
  // Eager-warm every local image in this project when it opens, so shot/frame
  // grids fill fast instead of paying a cold IDB read per image on first view.
  // Keyed on project.id so it runs once per opened project, not on every edit.
  useEffect(()=>{
    const srcs=[];const seen=new Set();
    const walk=o=>{if(Array.isArray(o))o.forEach(walk);else if(o&&typeof o==='object')Object.values(o).forEach(walk);else if(typeof o==='string'&&o.startsWith('idb://')&&!seen.has(o)){seen.add(o);srcs.push(o);}};
    walk(project);
    warmKeys(srcs);
  },[project.id]);

  const projectRef=useRef(project);
  // On mount: persist auto-late status changes back to parent
  useEffect(()=>{
    const original=project.projectTasks||[];
    const updated=applyAutoLate(original);
    const changed=updated.some((t,i)=>t.status!==original[i]?.status);
    if(changed)onUpdate({...project,projectTasks:updated});
  },[]);// runs once on mount
  useEffect(()=>{
    // Only update local if the project changed externally (not from our own upd())
    if(projectRef.current!==project){
      const updated={...project,projectTasks:applyAutoLate(project.projectTasks)};
      setLocal(updated);
      projectRef.current=project;
    }
  },[project]);

  // Safe update — defers onUpdate to avoid calling parent setter inside child setState
  const _pendingUpdate=useRef(null);
  const upd=(field,value)=>{
    setLocal(prev=>{
      const updated={...prev,[field]:value};
      projectRef.current=updated;
      _pendingUpdate.current=updated;
      return updated;
    });
  };
  // Flush pending updates to parent after React commits the state
  useEffect(()=>{
    if(_pendingUpdate.current){
      onUpdate(_pendingUpdate.current);
      _pendingUpdate.current=null;
    }
  });


  // Mentors
  const toggleMentor=id=>{
    const m=local.mentors||[];
    const next=m.includes(id)?m.filter(x=>x!==id):[...m,id];
    upd('mentors',next);
  };

  const handleCoverUpload=async e=>{const file=e.target.files[0];if(!file)return;upd('cover',await uploadImage(file));};
  const handleResearchImgUpload=async(noteId,e)=>{
    const files=Array.from(e.target.files);
    const urls=await uploadImages(files);
    const rn=(local.researchNotes||[]).map(n=>n.id===noteId?{...n,images:[...(n.images||[]),...urls]}:n);
    upd('researchNotes',rn);
    if(urls.length)upd('cover',urls[urls.length-1]);

  const removeResearchImg=(noteId,idx)=>{
    const rn=(local.researchNotes||[]).map(n=>{if(n.id!==noteId)return n;const imgs=[...(n.images||[])];imgs.splice(idx,1);return{...n,images:imgs};});
    upd('researchNotes',rn);
  };
  const [activeResearchId,setActiveResearchId]=useState(()=>(project.researchNotes||[])[0]?.id||null);
  const activeResearch=(local.researchNotes||[]).find(n=>n.id===activeResearchId)||null;
  const addResearchNote=()=>{const n={id:Date.now(),title:'Nova Pesquisa',content:'',url:'',images:[],date:new Date().toLocaleDateString('pt-BR')};upd('researchNotes',[...(local.researchNotes||[]),n]);setActiveResearchId(n.id);};
  const updateResearch=(field,val)=>{const rn=(local.researchNotes||[]).map(n=>n.id===activeResearchId?{...n,[field]:val}:n);upd('researchNotes',rn);};
  const deleteResearch=id=>{upd('researchNotes',(local.researchNotes||[]).filter(n=>n.id!==id));setActiveResearchId((local.researchNotes||[]).find(n=>n.id!==id)?.id||null);};
  const researchImgRef=useRef();
  const researchTextareaRef=useRef();
  useEffect(()=>{
    if(researchTextareaRef.current){
      researchTextareaRef.current.style.height='auto';
      researchTextareaRef.current.style.height=researchTextareaRef.current.scrollHeight+'px';
    }
  },[activeResearchId,activeResearch?.content]);
  const linkedMentors=useMemo(()=>globalMentors.filter(m=>!m.deleted&&(local.mentors||[]).includes(m.id)),[globalMentors,local.mentors]);

  // Tasks (linked with timeline)
  const [activeMiniId,setActiveMiniId]=useState(()=>(project.miniProjects||[])[0]?.id||null);
  const [expandedMiniIds,setExpandedMiniIds]=useState(()=>new Set([(project.miniProjects||[])[0]?.id].filter(Boolean)));
  const activeMini=(local.miniProjects||[]).find(m=>m.id===activeMiniId)||null;
  const miniStatusToPTask=s=>({'Em Andamento':'Fazendo','Concluído':'Concluído','Atrasado':'Atrasado'}[s]||'Pendente');
  const ptaskStatusToMini=s=>({'Fazendo':'Em Andamento','Concluído':'Concluído','Atrasado':'Atrasado'}[s]||'Pendente');
  const addMini=()=>{
    const id=Date.now();
    const n={id,title:'Nova Tarefa',status:'Pendente',notes:'',frames:[],innerNotes:[],createdAt:new Date().toLocaleDateString('pt-BR')};
    const pt={id,text:'Nova Tarefa',status:'Pendente',startDate:local.startDate||todayISO(),dueDate:local.deadline||addDays(todayISO(),7),notes:''};
    setLocal(prev=>{const updated={...prev,miniProjects:[...(prev.miniProjects||[]),n],projectTasks:[...(prev.projectTasks||[]),pt]};projectRef.current=updated;_pendingUpdate.current=updated;return updated;});
    setActiveMiniId(id);
  };
  const updateMini=(field,val)=>{
    const newMinis=(local.miniProjects||[]).map(m=>m.id===activeMiniId?{...m,[field]:val}:m);
    if(field==='title'||field==='status'){
      const newPTasks=(local.projectTasks||[]).map(t=>{
        if(t.id!==activeMiniId)return t;

  const deleteMini=id=>{

    const newPTasks=(local.projectTasks||[]).filter(t=>t.id!==id);
    setLocal(prev=>{const updated={...prev,miniProjects:newMinis,projectTasks:newPTasks};projectRef.current=updated;_pendingUpdate.current=updated;return updated;});
    setActiveMiniId((local.miniProjects||[]).find(m=>m.id!==id)?.id||null);

  const [activeInnerNoteId,setActiveInnerNoteId]=useState(null);
  const addInnerNote=()=>{

  const updateInnerNote=(field,val)=>{
    const updated=(local.miniProjects||[]).map(m=>m.id===activeMiniId?{...m,innerNotes:(m.innerNotes||[]).map(n=>n.id===activeInnerNoteId?{...n,[field]:val}:n)}:m);

  const deleteInnerNote=id=>{
    const updated=(local.miniProjects||[]).map(m=>m.id===activeMiniId?{...m,innerNotes:(m.innerNotes||[]).filter(n=>n.id!==id)}:m);
    upd('miniProjects',updated);
    if(activeInnerNoteId===id)setActiveInnerNoteId(null);
  };

                            <Icon name="file-text" size={11} style={{flexShrink:0,color:'var(--muted)'}}/>

                      <button onClick={e=>{e.stopPropagation();setActiveMiniId(m.id);addInnerNote();if(!expandedMiniIds.has(m.id)){const s=new Set(expandedMiniIds);s.add(m.id);setExpandedMiniIds(s);}}}

                  <div style={{display:'grid',gridTemplateColumns:isMobile?'repeat(2,1fr)':'repeat(auto-fill,minmax(160px,1fr))',gap:isMobile?8:10,marginBottom:14}}>

                        <Img src={img} priority={i<(isMobile?6:9)} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>

                      </div>

                  </div>
                )}

            {activeMini&&activeInnerNoteId&&(()=>{

                      placeholder="Título da nota"/>
                    <button onClick={()=>deleteInnerNote(note.id)} className="btn btn-ghost text-link-danger" style={{padding:6,flexShrink:0}}>
                      <Icon name="trash-2" size={16}/>
                    </button>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,padding:'7px 12px'}}>
                    <Icon name="link" size={13} style={{color:'var(--muted)',flexShrink:0}}/>

                  <textarea value={note.content||''} onChange={e=>updateInnerNote('content',e.target.value)}

                      {(note.images||[]).map((img,i,list)=>(
                        <div key={imgKey(img,i,list)} style={{position:'relative',borderRadius:8,overflow:'hidden',aspectRatio:'16/9',background:'var(--bg)'}}>
                          <Img src={img} priority={i<(isMobile?6:9)} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
                          <button onClick={()=>{const imgs=[...(note.images||[])];imgs.splice(i,1);updateInnerNote('images',imgs);}} style={{position:'absolute',top:5,right:5,background:'rgba(28,25,23,.7)',border:'none',borderRadius:'50%',width:22,height:22,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'white'}}><Icon name="x" size={11}/></button>
                        </div>
                      ))}
                    </div>

                  <label style={{alignSelf:'flex-start'}}>
                    <button className="btn btn-outline" style={{padding:'6px 14px',fontSize:'.8rem'}} onClick={()=>document.getElementById('inner-note-img-'+activeInnerNoteId)?.click()}>

                    </button>
                    <input id={'inner-note-img-'+activeInnerNoteId} type="file" accept="image/*" multiple style={{display:'none'}} onChange={async e=>{
                      const files=Array.from(e.target.files);

                      updateInnerNote('images',[...(note.images||[]),...urls]);
                      if(urls.length)upd('cover',urls[urls.length-1]);
                      e.target.value='';
                    }}/>
                  </label>
                </>
              );
            })()}
            {!activeMini&&!isMobile&&(
              <div style={{margin:'auto',textAlign:'center',color:'var(--muted)'}}>
                <Icon name="folder" size={28} style={{display:'block',margin:'0 auto 10px',opacity:.3}}/>
                <p style={{fontSize:'.85rem'}}>Selecione ou crie uma tarefa</p>
              </div>

          </div>
          )}
        </div>

      {tab==='Pesquisa'&&(
        <div style={{display:'flex',gap:16,flexDirection:isMobile?'column':'row'}}>

            <button className="btn btn-dark" style={{width:'100%',justifyContent:'center',marginBottom:4}} onClick={addResearchNote}><Icon name="plus" size={13}/> Nova Pesquisa</button>
            {(local.researchNotes||[]).length===0&&<div style={{fontSize:'.8rem',color:'var(--muted)',padding:'8px 4px',textAlign:'center'}}>Nenhuma pesquisa.</div>}
            {(local.researchNotes||[]).map(n=>(
              <div key={n.id} onClick={()=>setActiveResearchId(n.id)}

                onMouseEnter={e=>{if(activeResearchId!==n.id)e.currentTarget.style.background='var(--surface)';}}
                onMouseLeave={e=>{if(activeResearchId!==n.id)e.currentTarget.style.background='transparent';}}>
                <div style={{fontWeight:600,fontSize:'.82rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{n.title||'Sem título'}</div>
                <div style={{fontSize:'.7rem',color:'var(--muted)',marginTop:2}}>{n.date}</div>
              </div>
            ))}
          </div>
          )}
          {(!isMobile||activeResearchId)&&(
          <div className="card" style={{flex:1,padding:isMobile?20:28,display:'flex',flexDirection:'column',minWidth:0,minHeight:320}}>

              <button onClick={()=>setActiveResearchId(null)} className="btn btn-ghost" style={{alignSelf:'flex-start',marginBottom:12,padding:'4px 8px',fontSize:'.78rem'}}>
                <Icon name="arrow-left" size={13}/> Voltar às pesquisas
              </button>

                  <input value={activeResearch.title} onChange={e=>updateResearch('title',e.target.value)}
                    style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.6rem',fontWeight:400,background:'transparent',border:'none',outline:'none',color:'var(--text)',flex:1,minWidth:0}}
                    placeholder="Título da pesquisa"/>
                  <button onClick={()=>deleteResearch(activeResearch.id)} className="btn btn-ghost text-link-danger" style={{padding:6,flexShrink:0}}>
                    <Icon name="trash-2" size={16}/>
                  </button>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,padding:'7px 12px'}}>
                  <Icon name="link" size={13} style={{color:'var(--muted)',flexShrink:0}}/>
                  <input value={activeResearch.url||''} onChange={e=>updateResearch('url',e.target.value)}
                    placeholder="Link de referência (https://...)"
                    style={{flex:1,background:'transparent',border:'none',outline:'none',fontFamily:'Alegreya Sans,sans-serif',fontSize:'.83rem',color:'var(--text)'}}/>
                  {activeResearch.url&&<a href={activeResearch.url} target="_blank" rel="noreferrer" style={{flexShrink:0,color:'var(--muted)'}} className="text-link"><Icon name="external-link" size={13}/></a>}
                </div>
                <textarea ref={researchTextareaRef} value={activeResearch.content} onChange={e=>{updateResearch('content',e.target.value);}} onInput={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'}}
                  placeholder="Notas, análises, referências..."
                  style={{resize:'none',background:'transparent',border:'none',outline:'none',fontSize:'.9rem',fontFamily:'Alegreya Sans,sans-serif',lineHeight:1.8,color:'var(--text)',minHeight:120,overflow:'hidden',marginBottom:16,width:'100%'}}/>
                {/* Images - 3 column grid */}
                {(activeResearch.images||[]).length>0&&(
                  <div style={{display:'grid',gridTemplateColumns:isMobile?'repeat(2,1fr)':'repeat(auto-fill,minmax(160px,1fr))',gap:isMobile?8:10,marginBottom:14}}>
                    {(activeResearch.images||[]).map((img,i,list)=>(
                      <div key={imgKey(img,i,list)} style={{position:'relative',borderRadius:8,overflow:'hidden',aspectRatio:'16/9',background:'var(--bg)'}}>
                        <Img src={img} priority={i<(isMobile?6:9)} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
                        <button onClick={()=>removeResearchImg(activeResearch.id,i)} style={{position:'absolute',top:5,right:5,background:'rgba(28,25,23,.7)',border:'none',borderRadius:'50%',width:22,height:22,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'white'}}><Icon name="x" size={11}/></button>
                      </div>
                    ))}
                  </div>
                )}
                <button className="btn btn-outline" style={{alignSelf:'flex-start',padding:'6px 14px',fontSize:'.8rem'}} onClick={()=>researchImgRef.current.click()}>
                  <Icon name="image-plus" size={13}/> Adicionar imagens
                </button>
              </>
            ):(
              !isMobile&&<div style={{margin:'auto',textAlign:'center',color:'var(--muted)'}}>
                <Icon name="book-open" size={28} style={{display:'block',margin:'0 auto 10px',opacity:.3}}/>
                <p style={{fontSize:'.85rem'}}>Selecione ou crie uma pesquisa</p>
              </div>
            )}
          </div>
          )}
        </div>
      )}
      {galleryPopup&&ReactDOM.createPortal(
        <div onClick={()=>setGalleryPopup(null)} style={{position:'fixed',inset:0,zIndex:400,background:'rgba(10,8,6,.6)',backdropFilter:'blur(3px)',WebkitBackdropFilter:'blur(3px)',display:'flex',alignItems:'center',justifyContent:'center',padding:isMobile?12:24}}>
          <div onClick={e=>e.stopPropagation()} style={{background:'var(--surface)',borderRadius:16,maxWidth:680,width:'100%',maxHeight:'90vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,padding:isMobile?'18px 18px 0':'24px 28px 0'}}>
              <div style={{minWidth:0}}>
                <h3 style={{fontFamily:'Cormorant Garamond,serif',fontSize:'1.5rem',fontWeight:500,margin:0,lineHeight:1.2,color:'var(--text)'}}>{galleryPopup.title}</h3>
                <div style={{fontSize:'.74rem',color:'var(--muted)',marginTop:3}}>{(()=>{try{return new Date(galleryPopup.date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});}catch{return galleryPopup.date;}})()}</div>
              </div>
              <button onClick={()=>setGalleryPopup(null)} className="btn btn-ghost" style={{padding:'6px 8px',flexShrink:0}}><Icon name="x" size={18}/></button>
            </div>
            <div style={{padding:isMobile?'14px 18px 20px':'18px 28px 26px'}}>
              {galleryPopup.content&&<p style={{fontSize:'.9rem',lineHeight:1.7,color:'var(--text)',margin:'0 0 16px',whiteSpace:'pre-wrap'}}>{galleryPopup.content}</p>}
              {(galleryPopup.images||[]).length>0&&(
                <div style={{display:'flex',flexDirection:'column',gap:12}}>
                  {(galleryPopup.images||[]).map((img,i,list)=>(
                    isVideoSrc(img)
                      ?<Vid key={imgKey(img,i,list)} src={img} controls playsInline style={{width:'100%',borderRadius:10,display:'block',background:'#000'}}/>
                      :<Img key={imgKey(img,i,list)} full src={img} style={{width:'100%',borderRadius:10,display:'block'}}/>
                  ))}
                </div>
              )}
              {!galleryPopup.content&&(galleryPopup.images||[]).length===0&&<div style={{color:'var(--muted)',fontSize:'.85rem',fontStyle:'italic'}}>Sem conteúdo neste post.</div>}
            </div>
          </div>
        </div>,
        document.body
      )}
    </div>
  );
});

// - GALLERY -
const DEFAULT_GALLERY_FOLDERS=[
  {id:'work',label:'Work',deleted:false},
  {id:'movie-studies',label:'Movie Studies',deleted:false},
  {id:'sketchbooks',label:'Sketchbook',deleted:false},
  {id:'gestures',label:'Gesture',deleted:false},
];
const Gallery=React.memo(({posts,setPosts,folders,setFolders,navTick,isMobile})=>{
  const liveFolders=useMemo(()=>(folders||DEFAULT_GALLERY_FOLDERS).filter(f=>!f.deleted&&!f.archived),[folders]);
  const archivedFolders=useMemo(()=>(folders||DEFAULT_GALLERY_FOLDERS).filter(f=>f.archived&&!f.deleted),[folders]);
  const trashedFolders=useMemo(()=>(folders||DEFAULT_GALLERY_FOLDERS).filter(f=>f.deleted),[folders]);
  const FOLDERS=liveFolders;
  const [activeFolder,setActiveFolder]=useState(()=>(liveFolders[0]||{id:'work'}).id);
  const [folderTrash,setFolderTrash]=useState(false);
  const [folderArchive,setFolderArchive]=useState(false);
  // Auto-close each panel when its list empties (otherwise the toggle button vanishes
  // with items gone, leaving the panel stuck open with no way to hide it).
  useEffect(()=>{if(archivedFolders.length===0&&folderArchive)setFolderArchive(false);},[archivedFolders.length,folderArchive]);
  useEffect(()=>{if(trashedFolders.length===0&&folderTrash)setFolderTrash(false);},[trashedFolders.length,folderTrash]);
  const [editingFolderId,setEditingFolderId]=useState(null);
  const [editingLabel,setEditingLabel]=useState('');
  const folderDragRef=useRef(null);
  const [selected,setSelected]=useState(null);
  const [lightbox,setLightbox]=useState(null);
  // Eager-warm an opened study's images so its grid fills right away.
  useEffect(()=>{if(selected&&Array.isArray(selected.images))warmKeys(selected.images);},[selected?.id]);
  // Re-clicking "Galeria" in the nav (navTick bumps) closes any open post and returns to the grid.
  const _firstNav=useRef(true);
  useEffect(()=>{if(_firstNav.current){_firstNav.current=false;return;}setSelected(null);setLightbox(null);},[navTick]);

  const addFolder=()=>{const n={id:'folder-'+Date.now(),label:'Nova Pasta',deleted:false};setFolders(p=>[...(p||[]),n]);setActiveFolder(n.id);setEditingFolderId(n.id);setEditingLabel(n.label);};
  const renameFolder=(id,label)=>{if(label.trim())setFolders(p=>p.map(f=>f.id===id?{...f,label:label.trim()}:f));};
  const trashFolder=id=>{setFolders(p=>p.map(f=>f.id===id?{...f,deleted:true,deletedAt:new Date().toISOString()}:f));if(activeFolder===id){const next=liveFolders.find(f=>f.id!==id);setActiveFolder(next?.id||'');}};
  const restoreFolder=id=>setFolders(p=>p.map(f=>f.id===id?{...f,deleted:false,deletedAt:null}:f));
  const archiveFolder=id=>{setFolders(p=>p.map(f=>f.id===id?{...f,archived:true}:f));if(activeFolder===id){const next=liveFolders.find(f=>f.id!==id);setActiveFolder(next?.id||'');}};
  const unarchiveFolder=id=>setFolders(p=>p.map(f=>f.id===id?{...f,archived:false}:f));
  const hardDeleteFolder=async id=>{if(await bhConfirm({message:'Excluir pasta permanentemente?',danger:true,confirmLabel:'Excluir'}))setFolders(p=>p.filter(f=>f.id!==id));};
  const reorderFolders=(from,to)=>{if(from===to)return;setFolders(prev=>{const live=prev.filter(f=>!f.deleted&&!f.archived);const rest=prev.filter(f=>f.deleted||f.archived);const next=[...live];const[m]=next.splice(from,1);next.splice(to,0,m);return[...next,...rest];});};

  const [trash,setTrash]=useState(false);
  const [uploading,setUploading]=useState(false);
  const addImgRef=useRef();
  const active=useMemo(()=>posts.filter(p=>trash?p.deleted:(!p.deleted&&p.folder===activeFolder)),[posts,trash,activeFolder]);
  const grouped=useMemo(()=>{
    const sorted=[...active].sort((a,b)=>((b.date||'').slice(0,10)).localeCompare((a.date||'').slice(0,10)));
    return sorted.reduce((acc,p)=>{const key=new Date((p.date||'').slice(0,10)+'T12:00:00').toLocaleString('pt-BR',{month:'long',year:'numeric'});if(!acc[key])acc[key]=[];acc[key].push(p);return acc;},{});
  },[active]);
  const upd=(field,value)=>{
    const updated={...selected,[field]:value};
    setSelected(updated);
    setPosts(prev=>prev.map(p=>p.id===updated.id?updated:p));
  };
  const [uploadProgress,setUploadProgress]=useState(null); // {done,total}|null
  const handleAddImages=async e=>{
    const files=Array.from(e.target.files);
    setUploading(true);
    setUploadProgress({done:0,total:files.length});
    const urls=await uploadImages(files,(done,total)=>setUploadProgress({done,total}));
    setUploadProgress(null);
    setUploading(false);
    const merged=[...(selected.images||[]),...urls];
    upd('images',merged);
    e.target.value='';
  };
  const removeImg=idx=>{const imgs=[...selected.images];imgs.splice(idx,1);upd('images',imgs);};
  const softDelete=id=>setPosts(p=>p.map(x=>x.id===id?{...x,deleted:true,deletedAt:new Date().toISOString()}:x));
  const restore=id=>setPosts(p=>p.map(x=>x.id===id?{...x,deleted:false,deletedAt:null}:x));
  const hardDelete=async id=>{if(await bhConfirm({message:'Excluir permanentemente?',danger:true,confirmLabel:'Excluir'})){setPosts(p=>p.filter(x=>x.id!==id));}};

  // Keyboard escape for lightbox
  useEffect(()=>{
    if(!lightbox)return;
    const handleKeyDown=e=>{if(e.key==='Escape')setLightbox(null);};
    document.addEventListener('keydown',handleKeyDown);
    return()=>document.removeEventListener('keydown',handleKeyDown);
  },[lightbox]);


  if(lightbox)return(
    <div className="lightbox" onClick={()=>setLightbox(null)}>
      <Img src={lightbox} full priority onClick={e=>e.stopPropagation()} alt="" style={{maxWidth:'90vw',maxHeight:'90vh',objectFit:'contain',borderRadius:8}}/>
      <button onClick={()=>setLightbox(null)} style={{position:'fixed',top:20,right:20,background:'rgba(255,255,255,.12)',border:'none',borderRadius:'50%',width:40,height:40,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'white',backdropFilter:'blur(4px)'}}><Icon name="x" size={20}/></button>
    </div>
  );

  if(selected)return(
    <div className="fade-up" style={{maxWidth:'100%',boxSizing:'border-box',height:isMobile?'auto':'calc(100vh - clamp(32px,5vh,80px))',overflowY:isMobile?'visible':'auto'}}>
      <input ref={addImgRef} type="file" accept="image/*,video/*,.gif" multiple style={{display:'none'}} onChange={handleAddImages}/>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:24}}>
        <button className="btn btn-outline" onClick={()=>setSelected(null)}><Icon name="arrow-left" size={13}/> Voltar</button>
        <button className="btn btn-danger" onClick={()=>{softDelete(selected.id);setSelected(null);}}><Icon name="trash-2" size={13}/> Mover para Lixeira</button>
      </div>
      <div className="card" style={{padding:'clamp(16px,2.5vh,32px)'}}>
        <input value={selected.title} onChange={e=>upd('title',e.target.value)}
          style={{fontSize:'2rem',fontWeight:400,background:'transparent',outline:'none',border:'none',borderBottom:'1px solid var(--border)',width:'100%',marginBottom:16,paddingBottom:8,color:'var(--text)',fontFamily:'Cormorant Garamond,serif'}}/>
        {/* Folder selector */}
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20}}>
          <span className="label label-field" style={{flexShrink:0}}>Pasta</span>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {FOLDERS.map(f=>(
              <button key={f.id} onClick={()=>upd('folder',f.id)}
                style={{padding:'3px 12px',borderRadius:20,border:`1px solid ${selected.folder===f.id?'var(--text)':'var(--border)'}`,background:selected.folder===f.id?'var(--text)':'transparent',color:selected.folder===f.id?'white':'var(--muted)',fontSize:'.75rem',fontWeight:600,cursor:'pointer',fontFamily:'Alegreya Sans,sans-serif',transition:'all .15s'}}>
                {f.label}
              </button>
            ))}
          </div>
        </div>
        {/* Date editor */}
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20}}>
          <span className="label label-field" style={{flexShrink:0}}>Data</span>
          <input type="date" value={(selected.date||'').slice(0,10)} onChange={e=>upd('date',e.target.value)}
            style={{border:'1px solid var(--border)',borderRadius:8,padding:'6px 12px',fontSize:'.82rem',outline:'none',color:'var(--text)',backgroundColor:'var(--bg)',cursor:'pointer'}}/>
        </div>
        <textarea value={selected.content} onChange={e=>upd('content',e.target.value)} placeholder="Análise, insights, observações..."
          style={{width:'100%',border:'1px solid var(--border)',borderRadius:10,padding:'16px 20px',fontSize:'.92rem',outline:'none',resize:'vertical',minHeight:160,fontFamily:'Alegreya Sans,sans-serif',lineHeight:1.8,color:'var(--text)',backgroundColor:'var(--bg)',marginBottom:24}}/>
        <div style={{display:'grid',gridTemplateColumns:isMobile?'repeat(2,1fr)':'repeat(3,1fr)',gap:isMobile?10:14}}>
          {selected.images.map((img,i,list)=>(
            <div key={imgKey(img,i,list)} style={{position:'relative',borderRadius:10,overflow:'hidden',aspectRatio:'16/9',background:'var(--bg)',cursor:isVideoSrc(img)?'default':'zoom-in'}} onClick={()=>!isVideoSrc(img)&&setLightbox(img)}>
              {isVideoSrc(img)
                ?<Vid src={img} controls playsInline style={{width:'100%',height:'100%',objectFit:'cover',display:'block',borderRadius:10}}/>
                :<Img src={img} priority={i<(isMobile?6:9)} className="img-zoom-sm" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
              }
              <button onClick={e=>{e.stopPropagation();removeImg(i);}} style={{position:'absolute',top:6,right:6,background:'rgba(28,25,23,.7)',border:'none',borderRadius:'50%',width:24,height:24,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'white',zIndex:2}}><Icon name="x" size={11}/></button>
              {!isVideoSrc(img)&&<button onClick={e=>{e.stopPropagation();upd('bannerImage',img);}} title="Usar como banner"
                style={{position:'absolute',top:6,left:6,background:selected.bannerImage===img?'rgba(251,191,36,.9)':'rgba(28,25,23,.55)',border:'none',borderRadius:'50%',width:24,height:24,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'white',transition:'background .2s',zIndex:2}}>
                <Icon name="star" size={11} style={{fill:selected.bannerImage===img?'white':'none'}}/></button>}
            </div>
          ))}
          <div className="upload-zone" style={{aspectRatio:'16/9',minHeight:0,opacity:uploading?.6:1,pointerEvents:uploading?'none':'auto'}} onClick={()=>addImgRef.current.click()}>
            <Icon name={uploading?'loader':'plus'} size={20} style={{marginBottom:6}}/><span style={{fontSize:'.75rem'}}>{uploadProgress?`${uploadProgress.done}/${uploadProgress.total} enviando...`:uploading?'Enviando...':'Adicionar'}</span>
          </div>
          {uploadProgress&&uploadProgress.total>1&&(
            <div style={{marginTop:8}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:'.72rem',color:'var(--muted)',marginBottom:4}}>
                <span>Enviando para nuvem...</span>
                <span>{Math.round(uploadProgress.done/uploadProgress.total*100)}%</span>
              </div>
              <div style={{height:4,background:'var(--border)',borderRadius:2}}>
                <div style={{height:'100%',background:'var(--text)',borderRadius:2,transition:'width .3s',width:`${Math.round(uploadProgress.done/uploadProgress.total*100)}%`}}/>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );

  return(<>
    <div className="fade-up" style={{maxWidth:'100%',boxSizing:'border-box',height:isMobile?'auto':'calc(100vh - clamp(32px,5vh,80px))',display:'flex',flexDirection:'column',overflowY:isMobile?'visible':'auto',paddingBottom:isMobile?0:24}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:isMobile?'center':'flex-end',marginBottom:isMobile?10:14,gap:10,flexWrap:'wrap',flexShrink:0}}>
        <div><h1 className="serif" style={{fontSize:isMobile?'1.75rem':'clamp(1.6rem,2.8vh,2.6rem)',fontWeight:300,letterSpacing:'-0.02em',marginBottom:2}}>Galeria</h1>
          {!isMobile&&<p style={{color:'var(--muted)',fontSize:'clamp(.75rem,1.1vh,.85rem)'}}>Acervo visual & estudos</p>}</div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={()=>{setTrash(!trash);setSelected(null);}} className={`btn ${trash?'btn-danger':'btn-outline'}`}>
            <Icon name="trash-2" size={13}/>{trash?'Sair':'Lixeira'}{!trash&&posts.filter(p=>p.deleted).length>0&&` (${posts.filter(p=>p.deleted).length})`}
          </button>
          {!trash&&<button className="btn btn-dark" onClick={()=>{const n={id:Date.now(),folder:activeFolder,title:"Novo Estudo",date:localDateISO(),content:"",images:[],deleted:false};setPosts([n,...posts]);setSelected(n);}}><Icon name="plus" size={14}/> Criar</button>}
        </div>
      </div>
      {trash&&<TrashBanner label="Galeria" onExit={()=>setTrash(false)}/>}
      {/* Tab bar with folder trash toggle */}
      {!trash&&(
        <div style={{display:'flex',alignItems:'stretch',borderBottom:'1px solid var(--border)',marginBottom:'clamp(10px,1.5vh,18px)',flexShrink:0,gap:0,overflowX:'auto'}}>
          {liveFolders.map((f,idx)=>(
            <div key={f.id}
              className="drag-item"
              draggable
              onDragStart={e=>{e.dataTransfer.effectAllowed='move';folderDragRef.current=idx;e.currentTarget.style.opacity='0.45';}}
              onDragEnd={e=>{e.currentTarget.style.opacity='1';folderDragRef.current=null;document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));}}
              onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('drag-over');}}
              onDragLeave={e=>{e.currentTarget.classList.remove('drag-over');}}
              onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('drag-over');if(folderDragRef.current!=null&&folderDragRef.current!==idx){reorderFolders(folderDragRef.current,idx);folderDragRef.current=null;}}}
              style={{display:'flex',alignItems:'center',gap:4,paddingRight:2,marginRight:4,borderBottom:activeFolder===f.id?'2px solid var(--text)':'2px solid transparent',marginBottom:-1}}
            >
              <Icon name="grip-vertical" size={11} className="drag-handle" style={{color:'var(--muted)',opacity:0,transition:'opacity .12s'}}
                onMouseEnter={e=>e.currentTarget.style.opacity='1'} onMouseLeave={e=>e.currentTarget.style.opacity='0'}/>
              {editingFolderId===f.id
                ? <>
                    <input autoFocus value={editingLabel} onChange={e=>setEditingLabel(e.target.value)}
                      onBlur={()=>{renameFolder(f.id,editingLabel);setEditingFolderId(null);}}
                      onKeyDown={e=>{if(e.key==='Enter'||e.key==='Escape'){renameFolder(f.id,editingLabel);setEditingFolderId(null);}}}
                      style={{background:'transparent',border:'none',outline:'none',fontFamily:'Alegreya Sans,sans-serif',fontSize:'.85rem',fontWeight:activeFolder===f.id?600:500,color:'var(--text)',width:Math.max(60,editingLabel.length*9)+'px',padding:'10px 0'}}
                    />
                    <button onMouseDown={e=>{e.preventDefault();renameFolder(f.id,editingLabel);archiveFolder(f.id);setEditingFolderId(null);}} title="Arquivar pasta"
                      style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',padding:'4px 5px',borderRadius:5,lineHeight:0,transition:'color .12s'}}
                      onMouseEnter={e=>e.currentTarget.style.color='var(--text)'} onMouseLeave={e=>e.currentTarget.style.color='var(--muted)'}
                    ><Icon name="archive" size={13}/></button>
                    <button onMouseDown={e=>{e.preventDefault();trashFolder(f.id);setEditingFolderId(null);}} title="Mover para lixeira"
                      style={{background:'none',border:'none',cursor:'pointer',color:'var(--danger-fg)',padding:'4px 5px',borderRadius:5,lineHeight:0,transition:'background .12s'}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--danger-bg)'} onMouseLeave={e=>e.currentTarget.style.background='none'}
                    ><Icon name="trash-2" size={13}/></button>
                  </>
                : <button className="tab-btn" onClick={()=>setActiveFolder(f.id)}
                    onDoubleClick={()=>{setEditingFolderId(f.id);setEditingLabel(f.label);}}
                    style={{color:activeFolder===f.id?'var(--text)':'var(--muted)',borderBottom:'none',margin:0,padding:'10px 6px 10px 2px',whiteSpace:'nowrap',userSelect:'none'}}
                  >{f.label}</button>
              }
            </div>
          ))}
          <button onClick={addFolder} className="tab-btn"
            style={{color:'var(--muted)',borderBottom:'2px solid transparent',marginBottom:-1,padding:'10px 10px',whiteSpace:'nowrap',opacity:.6}}
            title="Nova pasta"><Icon name="plus" size={13}/></button>
          {archivedFolders.length>0&&(
            <button onClick={()=>setFolderArchive(t=>!t)} className="tab-btn"
              style={{color:folderArchive?'var(--text)':'var(--muted)',borderBottom:folderArchive?'2px solid var(--text)':'2px solid transparent',marginBottom:-1,marginLeft:'auto',padding:'10px 10px',whiteSpace:'nowrap',fontSize:'.75rem'}}
            ><Icon name="archive" size={12}/> {archivedFolders.length}</button>
          )}
          {trashedFolders.length>0&&(
            <button onClick={()=>setFolderTrash(t=>!t)} className="tab-btn"
              style={{color:folderTrash?'var(--text)':'var(--muted)',borderBottom:folderTrash?'2px solid var(--text)':'2px solid transparent',marginBottom:-1,marginLeft:archivedFolders.length>0?0:'auto',padding:'10px 10px',whiteSpace:'nowrap',fontSize:'.75rem'}}
            ><Icon name="trash-2" size={12}/> {trashedFolders.length}</button>
          )}
        </div>
      )}
      {/* Trashed folders panel */}
      {folderTrash&&trashedFolders.length>0&&!trash&&(
        <div style={{background:'var(--bg)',borderRadius:10,padding:'12px 16px',marginBottom:16,display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
          <span style={{fontSize:'.75rem',color:'var(--muted)',fontWeight:600,marginRight:4}}>Pastas na lixeira</span>
          {trashedFolders.map(f=>(
            <div key={f.id} style={{display:'flex',alignItems:'center',gap:4,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:20,padding:'3px 10px',fontSize:'.78rem'}}>
              <span style={{color:'var(--text)'}}>{f.label}</span>
              <button onClick={()=>restoreFolder(f.id)} title="Restaurar" style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',lineHeight:0,padding:'0 2px'}}><Icon name="refresh-cw" size={11}/></button>
              <button onClick={()=>hardDeleteFolder(f.id)} title="Excluir" style={{background:'none',border:'none',cursor:'pointer',color:'var(--danger-fg)',lineHeight:0,padding:'0 2px'}}><Icon name="trash-2" size={11}/></button>
            </div>
          ))}
        </div>
      )}
      {/* Archived folders panel */}
      {folderArchive&&archivedFolders.length>0&&!trash&&(
        <div style={{background:'var(--bg)',borderRadius:10,padding:'12px 14px',marginBottom:16}}>
          <span style={{fontSize:'.7rem',color:'var(--muted)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',display:'block',marginBottom:8}}>Pastas arquivadas</span>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {archivedFolders.map(f=>(
              <div key={f.id} style={{display:'flex',alignItems:'center',gap:10,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 8px 6px 12px'}}>
                <span style={{color:'var(--text)',fontSize:'.85rem',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.label}</span>
                <button onClick={()=>unarchiveFolder(f.id)}
                  style={{display:'flex',alignItems:'center',gap:5,background:'none',border:'1px solid var(--border)',borderRadius:6,cursor:'pointer',color:'var(--muted)',padding:'5px 10px',fontSize:'.74rem',fontFamily:'Alegreya Sans,sans-serif',whiteSpace:'nowrap',transition:'all .12s'}}
                  onMouseEnter={e=>{e.currentTarget.style.color='var(--text)';e.currentTarget.style.borderColor='var(--text)';}}
                  onMouseLeave={e=>{e.currentTarget.style.color='var(--muted)';e.currentTarget.style.borderColor='var(--border)';}}
                ><Icon name="archive-restore" size={13}/>Desarquivar</button>
                <button onClick={()=>trashFolder(f.id)} title="Mover para lixeira"
                  style={{display:'flex',alignItems:'center',background:'none',border:'1px solid transparent',borderRadius:6,cursor:'pointer',color:'var(--danger-fg)',padding:'5px 9px',transition:'all .12s'}}
                  onMouseEnter={e=>{e.currentTarget.style.background='var(--danger-bg)';e.currentTarget.style.borderColor='rgba(153,24,27,.2)';}}
                  onMouseLeave={e=>{e.currentTarget.style.background='none';e.currentTarget.style.borderColor='transparent';}}
                ><Icon name="trash-2" size={14}/></button>
              </div>
            ))}
          </div>
        </div>
      )}
      {Object.keys(grouped).length===0&&<div style={{textAlign:'center',padding:isMobile?40:60,color:'var(--muted)',fontSize:'.9rem'}}><Icon name="image" size={28} style={{display:'block',margin:'0 auto 12px',opacity:.3}}/>{trash?'Lixeira vazia.':'Pasta vazia.'}</div>}
      {Object.entries(grouped).map(([month,monthPosts])=>(
        <div key={month} style={{marginBottom:isMobile?16:'clamp(16px,3vh,36px)'}}>
          <div style={{borderBottom:'1px solid var(--border)',paddingBottom:8,marginBottom:16}}><span className="label label-section">{month}</span></div>
          <div style={{display:'grid',gridTemplateColumns:isMobile?'repeat(2,1fr)':'repeat(4,1fr)',gap:isMobile?10:14}}>
            {monthPosts.map(post=>(
              <div key={post.id} className="card" style={{overflow:'hidden',cursor:trash?'default':'pointer'}} onClick={()=>!trash&&setSelected(post)}
                {...keyActivate(()=>setSelected(post),'Abrir post '+(post.title||''),!trash)}>
                <div className="cover-wrap" style={{aspectRatio:'16/9',overflow:'hidden',backgroundColor:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
                  {post.images.length>0
                    ?(()=>{const src=post.bannerImage||(post.images[0]||post.images[post.images.length-1]);
                      return isVideoSrc(src)
                        ?<><Vid src={src} muted playsInline loop preload="metadata" style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}
                            onMouseEnter={e=>{try{e.target.play();}catch{/*silent-ok: autoplay policy rejects play() without user gesture — the poster frame stays*/}}} onMouseLeave={e=>{try{e.target.pause();e.target.currentTime=0;}catch{/*silent-ok: pausing a video that never started*/}}}/>
                          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
                            <div style={{width:32,height:32,borderRadius:'50%',background:'rgba(0,0,0,.45)',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(2px)'}}>
                              <Icon name="play" size={14} style={{color:'white',marginLeft:2}}/></div></div></>
                        :<Img src={src} className={trash?'':'img-zoom'} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
                    ;})()
                    :<Icon name="image" size={28} style={{opacity:.2}}/>}
                </div>
                <div style={{padding:'12px 14px'}}>
                  <div style={{fontWeight:600,fontSize:'.82rem',marginBottom:2}}>{post.title}</div>
                  <div style={{fontSize:'.72rem',color:'var(--muted)',marginBottom:trash?8:0}}>{(()=>{try{return new Date(post.date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).replace('.','');}catch{return post.date;}})()}</div>
                  {trash&&(
                    <div style={{display:'flex',gap:5}}>
                      <button onClick={e=>{e.stopPropagation();restore(post.id);}} className="btn btn-outline" style={{flex:1,justifyContent:'center',padding:'4px 0',fontSize:'.72rem'}}><Icon name="undo-2" size={10}/> Restaurar</button>
                      <button onClick={e=>{e.stopPropagation();hardDelete(post.id);}} className="btn btn-danger" style={{flex:1,justifyContent:'center',padding:'4px 0',fontSize:'.72rem'}}><Icon name="trash-2" size={10}/> Excluir</button>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  </>);
});

// - IDEAS -
// Allowlist sanitizer for persisted rich-text HTML. Note content round-trips
// through localStorage, Firestore and manual JSON import — an imported backup
// (or a compromised cloud doc) carrying <script>/<img onerror=...> would run
// with the user's live Firebase session. Strip active content before it ever
// touches innerHTML.
// v23.3 P2-2: the allowlist did not cover three vectors. srcdoc executes
// arbitrary HTML inside an iframe; formaction redirects a form's submit to a
// javascript: URL; and href="data:text/html,..." opens a document with script on
// the same origin. base href also joins the removal list — it rewrites the
// destination of every relative link in the document.
const _BAD_PROTO=/^\s*(?:javascript:|vbscript:|data:text\/html)/i;
const sanitizeHTML=html=>{
  if(!html||typeof html!=='string')return html||'';
  try{
    const t=document.createElement('template');
    t.innerHTML=html;
    t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base').forEach(el=>el.remove());
    t.content.querySelectorAll('*').forEach(el=>{
      [...el.attributes].forEach(a=>{
        const n=a.name.toLowerCase();
        if(n.startsWith('on')||n==='srcdoc'||n==='formaction')el.removeAttribute(a.name);
        else if((n==='href'||n==='src'||n==='xlink:href'||n==='action')&&_BAD_PROTO.test(a.value))el.removeAttribute(a.name);
      });
    });
    return t.innerHTML;
  }catch{return html;}
};

const RichEditor=React.memo(({noteId,initialHTML,onSave})=>{
  const ref=useRef(null);
  const saveTimer=useRef(null);
  const lastId=useRef(null);
  const dragImgRef=useRef(null);
  const imgInputRef=useRef(null);
  const [fmt,setFmt]=useState({});

  useEffect(()=>{
    if(!ref.current)return;
    if(lastId.current!==noteId){
      ref.current.innerHTML=sanitizeHTML(initialHTML||'');
      lastId.current=noteId;
    }
  });

  // v23.3 P2-2: the sanitizer only ran on the WAY IN (when populating the
  // editor). What was SAVED was the contentEditable's raw innerHTML — and a paste
  // brings arbitrary markup from its source, which went straight to
  // localStorage/Firestore and came back as innerHTML on the other device.
  // Sanitizing on the way out closes the cycle.
  // It is the SAVED VALUE that gets sanitized, never the live DOM: touching the
  // contentEditable while typing would kill the cursor.
  const emit=useCallback(()=>{
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>{if(ref.current)onSave(sanitizeHTML(ref.current.innerHTML));},800);
  },[onSave]);

  const flushSave=useCallback(()=>{
    clearTimeout(saveTimer.current);
    if(ref.current)onSave(sanitizeHTML(ref.current.innerHTML));
  },[onSave]);

  const exec=(cmd,val)=>{ref.current?.focus();document.execCommand(cmd,false,val||null);emit();};

  const insertImage=useCallback((src)=>{
    ref.current?.focus();
    const safe=String(src).replace(/"/g,'&quot;'); // never let a raw URL break out of the attribute
    document.execCommand('insertHTML',false,`<img src="${safe}" style="max-width:100%;border-radius:8px;margin:10px 0;display:block;" draggable="true"/>`);
    emit();
  },[emit]);

  // Upload the image instead of embedding it as base64 inline. A single pasted
  // screenshot can be 100-500KB as base64 — embed a couple of those and the
  // note's HTML alone can blow past Firestore's 1MB-per-document hard limit,
  // taking down sync for the whole account (not just this note).
  // NOTE: deliberately does NOT use the shared uploadImage()'s idb:// local
  // fallback — that scheme only resolves inside the app's own <Img>/<BgImg>
  // components, not in raw contentEditable HTML, where it would just render
  // as a broken image. Last-resort here is inline base64, same as before this
  // fix — a working (if heavy) image beats a silently lost paste.
  const insertImageFile=useCallback(async(file)=>{
    const compressed=await _compressImage(file);
    if(_fbReady&&_fbAuth?.currentUser){
      try{insertImage(await uploadToFirebaseStorage(compressed,_fbAuth.currentUser.uid));return;}
      catch(e){console.warn('[BoardHub] Storage upload failed for note image, trying fallback:',e.message);}
    }
    try{insertImage(await _uploadImgur(compressed));return;}
    catch(e){console.warn('[BoardHub] Imgur fallback failed for note image, embedding inline:',e.message);}
    const r=new FileReader();
    r.onload=ev=>insertImage(ev.target.result);
    r.readAsDataURL(compressed);
  },[insertImage]);

  // One-time migration: if this note was already carrying heavy inline base64
  // images (from before this fix), lift them out to Storage and shrink the
  // document, so a note that already tripped the 1MB ceiling once won't do it
  // again the next time it's opened.
  useEffect(()=>{
    if(!initialHTML||!initialHTML.includes('data:image'))return;
    if(!_fbReady||!_fbAuth?.currentUser)return; // only migrate when we can actually offload
    let cancelled=false;
    (async()=>{
      await new Promise(r=>setTimeout(r,50)); // let the DOM populate with initialHTML
      if(cancelled||!ref.current)return;
      const heavy=[...ref.current.querySelectorAll('img[src^="data:image"]')].filter(img=>img.src.length>20000);
      if(!heavy.length)return;
      let changed=false;
      for(const img of heavy){
        if(cancelled)return;
        try{
          const blob=await(await fetch(img.src)).blob();
          const file=new File([blob],'note-img.png',{type:blob.type||'image/png'});
          const compressed=await _compressImage(file);
          img.src=await uploadToFirebaseStorage(compressed,_fbAuth.currentUser.uid);
          changed=true;
        }catch(e){console.warn('[BoardHub] Legacy note-image migration failed for one image:',e.message);}
      }
      if(changed&&!cancelled&&ref.current){
        onSave(sanitizeHTML(ref.current.innerHTML));
        console.info('[BoardHub] Moved inline note images to cloud storage, freeing up document space.');
      }
    })();
    return()=>{cancelled=true;};
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  const handleKeyDown=e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ');}};

  const handleDrop=e=>{
    if(dragImgRef.current){
      e.preventDefault();
      const range=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;
      if(range){const s=window.getSelection();s.removeAllRanges();s.addRange(range);}
      const clone=dragImgRef.current.cloneNode(true);
      dragImgRef.current.remove();
      document.execCommand('insertHTML',false,clone.outerHTML);
      dragImgRef.current=null;emit();return;
    }
    const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));
    if(!files.length)return;
    e.preventDefault();
    const range=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;
    if(range){const s=window.getSelection();s.removeAllRanges();s.addRange(range);}
    files.forEach(f=>insertImageFile(f));
  };
  const handleDragStart=e=>{if(e.target.tagName==='IMG'){dragImgRef.current=e.target;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','img-drag');}};
  const handlePaste=e=>{
    const items=e.clipboardData?.items||[];
    const img=[...items].find(i=>i.type.startsWith('image/'));
    if(img){e.preventDefault();insertImageFile(img.getAsFile());}
  };
  const updateFmt=()=>{try{setFmt({bold:document.queryCommandState('bold'),italic:document.queryCommandState('italic'),underline:document.queryCommandState('underline'),strikeThrough:document.queryCommandState('strikeThrough'),insertUnorderedList:document.queryCommandState('insertUnorderedList'),insertOrderedList:document.queryCommandState('insertOrderedList')});}catch{/*silent-ok: queryCommandState throws when the selection is outside the editor; the toolbar keeps its last state*/}};

  const toolbarBtns=[
    {cmd:'bold',icon:'bold',title:'Negrito'},
    {cmd:'italic',icon:'italic',title:'Itálico'},
    {cmd:'underline',icon:'underline',title:'Sublinhado'},
    {cmd:'strikeThrough',icon:'strikethrough',title:'Tachado'},
    null,
    {cmd:'insertUnorderedList',icon:'list',title:'Lista'},
    {cmd:'insertOrderedList',icon:'list-ordered',title:'Lista numerada'},
    null,
    {cmd:'formatBlock',val:'h1',icon:'heading-1',title:'Título grande'},
    {cmd:'formatBlock',val:'h2',icon:'heading-2',title:'Título médio'},
    {cmd:'formatBlock',val:'blockquote',icon:'quote',title:'Citação'},
    {cmd:'formatBlock',val:'p',icon:'type',title:'Parágrafo'},
    null,
    {cmd:'removeFormat',icon:'eraser',title:'Limpar formato'},
  ];

  return(
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,overflow:'hidden'}}>
      <div style={{display:'flex',gap:1,padding:'4px 0 8px',borderBottom:'1px solid var(--border)',marginBottom:12,flexWrap:'wrap',flexShrink:0,alignItems:'center'}}>
        {toolbarBtns.map((b,i)=>b===null?(
          <div key={i} style={{width:1,height:16,background:'var(--border)',margin:'0 4px'}}/>
        ):(
          <button key={i} title={b.title} className={`rich-toolbar-btn${fmt[b.cmd]&&!b.val?' active':''}`}
            onMouseDown={e=>{e.preventDefault();exec(b.cmd,b.val||null);}}>
            <Icon name={b.icon} size={13}/>
          </button>
        ))}
        <div style={{width:1,height:16,background:'var(--border)',margin:'0 4px'}}/>
        <label className="rich-toolbar-btn" title="Inserir imagem" style={{cursor:'pointer'}}>
          <input ref={imgInputRef} type="file" accept="image/*" style={{display:'none'}} onChange={async e=>{
            const f=e.target.files[0];if(!f)return;
            insertImageFile(f);
            e.target.value='';
          }}/>
          <Icon name="image" size={13}/>
        </label>
      </div>
      <div ref={ref} className="rich-editor" contentEditable suppressContentEditableWarning
        data-placeholder="Comece a escrever..."
        onInput={emit} onKeyDown={handleKeyDown} onKeyUp={updateFmt} onMouseUp={updateFmt} onSelect={updateFmt}
        onDrop={handleDrop} onDragOver={e=>e.preventDefault()} onDragStart={handleDragStart}
        onPaste={handlePaste} onBlur={flushSave}
        style={{flex:1,fontSize:'.95rem',fontFamily:'Alegreya Sans,sans-serif',lineHeight:1.9,color:'var(--text)'}}/>
    </div>
  );
});

const IdeasLab=React.memo(({notes,setNotes,isMobile})=>{

  const flushEntryTitleRef=useRef(null);
  const newNoteCooldownRef=useRef(0);

  const addEntry=()=>{if(!selectedId)return;const e={id:Date.now(),title:'Nova Anotação',content:'',date:new Date().toLocaleDateString('pt-BR')};updProj(selectedId,p=>({...p,entries:[...(p.entries||[]),e]}));setActiveEntryId(e.id);};
