  ══ P0-2 — REGRAS DE SEGURANÇA (VERIFICAR NO CONSOLE) ═══════════════════════
  A DEFAULT_FB_CFG está hardcoded logo abaixo. Isso é normal em Firebase web e a
  apiKey não é segredo — ela identifica o projeto, não autoriza nada. O que
  efetivamente protege os dados são as SECURITY RULES, que não moram neste
  arquivo e não dão para auditar pelo código. Se estiverem em modo de teste
  ("allow read, write: if true"), qualquer pessoa com a apiKey — que está aqui —
  lê e escreve TUDO.
  Estas são as regras que correspondem exatamente ao que o app usa hoje:
    Firestore : users/{uid}/boardhub/{state|notes|gallery}   (3 documentos)
    Storage   : users/{uid}/images/{key}
    Auth      : Google (signInWithPopup) — não há login anônimo
  ── Firestore Rules ────────────────────────────────────────────────────────
    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {
        match /users/{userId}/boardhub/{docId} {
          allow read, write: if request.auth != null
                             && request.auth.uid == userId;
        }
      }
    }
  Tudo que não casa com um match é negado por padrão — não é preciso (nem
  adianta) acrescentar um "match /{document=**} { allow read,write: if false; }":
  o Firestore concede acesso se QUALQUER regra permitir, então um deny-all no fim
  não revoga o allow acima. É inofensivo, só não protege nada.
  Se quiser apertar mais, dá para fixar os três documentos:
          && docId in ['state','notes','gallery']
  — lembrando que isso quebra no dia em que um quarto documento for criado (o
  P2-3 do backlog sugeria exatamente isso para o pomoData).
  ── Storage Rules ──────────────────────────────────────────────────────────
    rules_version = '2';
    service firebase.storage {
      match /b/{bucket}/o {
        match /users/{userId}/images/{imageId} {
          allow read, write: if request.auth != null
                             && request.auth.uid == userId;
        }
      }
    }
  Endurecimento opcional na escrita, para que uma sessão roubada não vire
  hospedagem de arquivo grátis (confira os limites contra o que você sobe de
  verdade antes de aplicar):
          && request.resource.size < 25 * 1024 * 1024
          && request.resource.contentType.matches('image/.*|video/.*')
  ── Como verificar ─────────────────────────────────────────────────────────
  1. console.firebase.google.com → o projeto → Firestore Database → aba Rules.
  2. Repetir em Storage → aba Rules.
  3. Se aparecer "if true" ou uma data de expiração de modo de teste, trocar
     pelo bloco acima e Publicar.
  4. O Rules Playground (na mesma tela) testa antes de publicar: simule uma
     leitura de users/OUTRO_UID/boardhub/state autenticado como você — tem que
     ser NEGADA.

  BoardHub v23.12 — F1: o histórico de backup muda de casa (ago/2026)
  O histórico rotativo sai do localStorage e passa a morar no IndexedDB, em
  BANCO PRÓPRIO (boardhub_backups), com dois stores: `snapshots` (entrada
  inteira, com state) e `meta` (at/reason/sig/counts, sem state).
  DIAGNÓSTICO QUE NÃO SOBREVIVEU À MEDIÇÃO — e isto vem primeiro de propósito:
  o motivo declarado da F1 era "12 snapshots de 1MB contra ~5MB de cota, então o
  histórico que anuncia ~19 guarda ~4". Medido nesta origem, a cota do
  localStorage é ~50 MB, não 5 — o teto de design inteiro cabe 2,6× dentro dela.
  A conta original também não era válida em nenhuma direção, porque o Chrome
  COMPRIME o localStorage: com texto repetitivo, 30 snapshots "de 1MB" cabem
  onde a medição ingênua previa 5. Duas das minhas próprias medições, antes
  destas, pararam no teto do laço e não na cota — quase viraram "25 MB" e
  "37,5 MB" no lugar da parede real. Registro isso porque é a quarta vez que um
  número do plano v24 morre na medição.
  O QUE SOBROU DE JUSTIFICATIVA, medido nesta origem (estado de ~0,95 MB por
  snapshot, histórico de 12 = 11,4 MB):
    custo por captura ....... 38,1 ms  →  5,3 ms   (stringify 12,0 + setItem 26,1)
    lista da tela de Sync ... 11,4 MB  →  1,4 KB   (era o histórico INTEIRO
                                                    em memória do React só para
                                                    desenhar datas e contadores)
    headroom .................. ~50 MB →  ~2,8 GB
  Ou seja: o ganho real não era de cota, era de CUSTO POR ESCRITA e de memória.
  Antes, toda captura re-serializava e regravava o histórico inteiro para
  acrescentar uma entrada; agora é uma transação com um put e as remoções da
  retenção. É o mesmo tipo de erro do P1-3 da v23.6 — pagar o preço da coleção
  toda para mexer num item —, agora no lado da escrita.
  POR QUE BANCO PRÓPRIO, e não um store a mais no banco de imagens: o gcIdb
  varre o banco de imagens decidindo o que é blob órfão. Com os snapshots lá
  dentro, a única coisa separando "backup" de "lixo a coletar" seria disciplina
  de prefixo de chave — e esse GC já apagou arquivo do usuário uma vez (v23.3).
  Bancos distintos tornam a confusão impossível por construção, não por
  convenção. Há teste de fonte exigindo que os dois nomes continuem diferentes.
  MIGRAÇÃO (protocolo #4 — escreve → VERIFICA → só então remove):
  grava todas as entradas no IDB, relê o `meta`, confere que cada `at` da origem
  chegou ao destino e SÓ ENTÃO apaga boardhub_backup_history. Se faltar uma, a
  migração estoura, a chave legada FICA e a tentativa se repete no próximo boot.
  Histórico ilegível (JSON quebrado) não é apagado nunca: é a única cópia.
  A migração antiga de dois slots continua escrevendo na chave legada, de
  propósito — ela é síncrona e roda no parse do bundle, antes de haver IDB
  aberto; a nova leva dali para o banco em seguida. Duas migrações simples em
  série, em vez de uma assíncrona reimplementando o formato de dois slots.
  A ARMADILHA CENTRAL, e o motivo de bhHistoryLoad ter DEIXADO DE EXISTIR:
  o gcIdb coleta as referências idb:// dos states do histórico. Se eu tivesse
  mantido uma bhHistoryLoad síncrona devolvendo o `meta` — que não tem state —,
  o gcIdb faria e.state → undefined, não coletaria referência nenhuma e apagaria
  blobs VIVOS. É exatamente o P0-1 da v23.3, por outra porta. Por isso o par é
  bhHistoryMeta() (síncrona, sem state) e bhHistoryFull() (assíncrona, com
  state), e o nome antigo sumiu: qualquer consumidor esquecido vira erro.
  Pelo mesmo motivo, bhHistoryFull() REJEITA em vez de devolver [] quando não
  consegue ler — "não sei o que está referenciado" nunca pode virar "nada está
  referenciado". O gcIdb aborta a varredura nesse caso, e também quando o
  histórico ainda não abriu. Falha FECHADO em todos os caminhos.
  • bhCapture virou assíncrona. Nenhum dos 7 call sites usa o retorno — todos
    são fire-and-forget dentro de try/catch —, então nenhum deles mudou de
    forma. A promessa nunca rejeita. As capturas são SERIALIZADAS numa fila:
    duas concorrentes decidiriam a retenção sobre o mesmo espelho em memória e a
    segunda ressuscitaria o que a primeira acabou de despejar.
  • `at` é a chave primária do store. Duas capturas no mesmo milissegundo se
    sobrescreveriam em silêncio; agora empurra 1ms até ser única.
  • O fallback de cota do bhCapture continua existindo, agora contra a cota do
    IDB, e continua usando stripInlineImages — que preserva idb://. Um backup
    que perdesse as referências junto com o payload seria o P0-1 de novo.
  • Restaurar lê o snapshot pela chave (bhHistoryGet) e ABORTA se vier vazio:
    trocar dados bons por um backup que não carregou é pior que não restaurar.
  CUSTO HONESTO: a cota do localStorage foi medida em http://localhost, e o app
  roda em file:// — a cota do Chrome é derivada do disco livre e varia por
  origem e por máquina, então o número de ~50 MB não é uma promessa sobre a sua.
  O teto de retenção (~19) não mudou: o IndexedDB tem 2,8 GB e, sem teto, o
  histórico cresceria para sempre — a cota do localStorage era o que segurava
  isso por acidente. Há teste amarrando o limite. O rollback não é automático:
  uma vez migrado e verificado, voltar para o localStorage exigiria código novo.
  E os testes cobrem migração, dedup, retenção e leitura — não cobrem uma
  restauração completa clicada na interface, que continua sendo verificação
  manual.

  BoardHub v23.11 — M2.1: o mostrador VIRA um metrônomo (ago/2026)
  Correção de rota em cima do M2, a pedido: o clique audível saiu e o mostrador
  deixou de ser um relógio redondo.
  • REMOVIDO o clique do metrônomo. Batia ~2×/s a sessão inteira e distraía —
    o oposto do que um app de foco deveria fazer. As cadências de mudança de
    faixa FICAM: aquelas tocam 4× por dia, não 3.600.
  • O pulso virou VISUAL: pirâmide truncada, haste articulada e peso, como no
    metrônomo de madeira. Não há agendador — a haste é animação CSS com duração
    var(--beat) vinda do BPM, então o tempo fica no compositor do navegador e não
    há timer em JS para derrapar, vazar ou disputar a thread com o autosave.
    Meia oscilação = uma semínima: a haste cruza o centro uma vez por batida.
  • O ARRASTO virou vertical. O gesto angular existia porque o mostrador era um
    círculo; sobre uma pirâmide não quer dizer nada. Agora se corre o peso na
    haste — mais alto = sessão mais longa —, que é a mesma convenção do
    instrumento real (peso em cima = mais lento) e a mesma direção do dedo.
  • O progresso saiu do contorno e virou uma BARRA que esvazia, embaixo do corpo.
    Traço percorrendo um polígono é difícil de ler de relance, e sobrepor leitura
    ao desenho embola os dois. O trilho fica sempre visível: sem ele, "quase
    acabando" e "não começou" são o mesmo vazio.
  • Os números foram para dentro do compartimento da base, POSICIONADOS POR
    MEDIÇÃO: em Cormorant 12px a caixa tem 15 de altura e ascendente 11; o
    compartimento tem 19; centralizar deixa 2 de folga de cada lado. As duas
    primeiras tentativas foram por estimativa e os números encostaram no
    contorno — dá para medir getBBox() em vez de chutar.
  SEM supressão por prefers-reduced-motion, e isso é deliberado: o pêndulo não é
  enfeite que aparece sozinho, é opt-in que nasce desligado. Quem liga, ligou de
  propósito; um @media por cima sequestraria a escolha explícita. O que a
  preferência do sistema governa é o PADRÃO, e o padrão já é desligado.
  ARMADILHA: o pivô da haste estava fixo no CSS e a geometria mudou embaixo dele
  — a haste passou a girar em torno de um ponto que não existia mais. Agora o
  CSS lê --pivot escrito pelo JSX a partir de MET_PIVOT_Y, uma fonte só.

  BoardHub v23.10 — M2: o som passa a ser o andamento (ago/2026)
  Segundo movimento. O M1 deu nome musical às faixas; aqui o som passa a
  CUMPRIR o nome.
  • As cadências de mudança de faixa não são mais quatro jingles arbitrários:
    são a MESMA figura pentatônica tocada no BPM daquela faixa. O espaçamento
    sai de 60/bpm, o número de graus cresce com a pressa (3/4/5/7) e o Vivace
    corre em colcheias. Subir de faixa agora SOA como o nome da faixa — Vivace é
    mais rápido que Andante porque é isso que a palavra significa.
  • DAY_TIERS parou de repetir os BPM e passou a LER de TEMPO_BPM. Duas listas
    com os mesmos números divergem calada, e o sintoma seria o app mostrar um
    andamento e tocar outro. Uma fonte só, teste amarrando.
  • NOVO: metrônomo opcional (botão ♪ ao lado do reiniciar, estado persistido em
    boardhub_metronome), pulsando no BPM do andamento ATUAL, com acento na cabeça
    de cada compasso. Cruzar de faixa no meio da sessão reinicia o agendador e o
    pulso acelera junto — no máximo 4× por dia, e é o ponto inteiro de amarrar o
    som ao andamento.
  POR QUE NÃO É setInterval(60000/bpm): o callback de um timer atrasa dezenas de
  ms sob carga e o erro ACUMULA — em poucos compassos o pulso sai do lugar de
  forma audível. O agendador usa lookahead: um setInterval folgado (25ms) não
  toca nada, só decide o que já pode ser AGENDADO na linha do tempo do
  AudioContext, que é a única com precisão de amostra.
  MEDIDO (espião em osc.start, Moderato/108 BPM, semínima esperada 0,5556s):
    7 pulsos em 4s · intervalo médio 0,5556s · desvio máximo 0,04 ms
    após pausar: 0 pulsos em 2,5s (o efeito limpa o próprio intervalo)

    das cadências, porque cauda em pulso constante empapa tudo. Volume baixo e
    sem brilho de propósito: toca centenas de vezes por sessão.
  ARMADILHA QUE O TESTE PEGOU (no próprio teste): a suíte do M1 exigia os

  BoardHub v23.8 — Pomodoro perdia tempo de foco (ago/2026)
  DIAGNÓSTICO: o laço do timer credita no total do dia a DIFERENÇA entre um tick
  e o seguinte (delta = timeLeft anterior − restante). O padrão funciona enquanto
  só o próprio laço mexe no ponteiro, e perde tempo silenciosamente em todo lugar
  que adianta o relógio sem creditar o intervalo. Dois pontos faziam exatamente
  isso:
  • O fim da sessão. timeLeft desce 1800 → 1799 → … → 2 → 1, somando 1799 deltas
    de 1s; no tick seguinte "restante" chega a 0 e o ramo de conclusão chama
    flushPomoSecs() direto, sem creditar o trecho de 1 → 0. O último segundo de
    TODA sessão de foco era descartado, em qualquer duração.
  • onVisible. Ao voltar para a aba ele reposicionava timeLeft para o restante
    real sem creditar o que passou. Com a aba apenas oculta isso é inofensivo (o
    setInterval continua rodando ~1×/s e credita normalmente), mas quando o
    navegador CONGELA a aba — mobile em segundo plano, ou Chrome depois de ~5min
    oculta — o intervalo para de disparar e o trecho inteiro sumia: o tick
    seguinte comparava com o ponteiro já adiantado e via delta 0.
  MEDIDO (simulação do laço, tick a tick, com a mesma aritmética do código):
                                        antes        depois
    sessão de 30min, aba ativa ....... 29m59s   →   30m00s
    oculta 5s de 30min ............... 29m54s   →   30m00s
    congelada 10min de 30min ......... 19m59s   →   30m00s
    congelada até depois do fim ......  9m59s   →   30m00s
    congelada quase a corrida toda ...  0m09s   →   30m00s
  FIX: creditar o resto antes de zerar o ponteiro, nos dois pontos. A guarda
  (timeLeftRef.current > 0) no ramo de conclusão impede contagem dupla no caso em
  que onVisible já creditou o resíduo e deixou o ponteiro em 0 — os dois fecham
  em 1800s exatos, independente de qual dispara primeiro.
  • Efeito colateral bem-vindo: as faixas de DAY_TIERS agora fecham redondas. 8h
    de foco em sessões de 30min registravam 7h59m52s — um segundo a menos por
    sessão —, então 💎 Diamante pedia uma sessão extra para acender.
  CUSTO HONESTO: verificado por simulação da aritmética dos ticks, não por uma
  sessão real de 30min cronometrada. A simulação reproduz o 29m59s relatado antes
  do fix, o que é bom indício de fidelidade, mas não substitui rodar o timer de
  ponta a ponta — entra na suíte de regressão da F0. O som e a notificação de fim
  continuam sem disparar com a aba congelada: dependem do tick, e aba congelada
  não tem timer. Só um Service Worker resolveria — fora de escopo.

  BoardHub v23.7 — P3: ergonomia de teclado (jul/2026)
  Último item do backlog da auditoria. Não é conformidade WCAG — é velocidade de
  uso para quem passa o dia no app e não quer tirar a mão do teclado.
  • Os 57 <input> sem rótulo associado foram resolvidos em UMA linha: o <Field>
    passou de <div><span class=label> para <label><span class=label>. Um <label>
    envolvendo o controle cria a associação IMPLÍCITA do HTML — clicar no rótulo
    foca o campo, leitores de tela anunciam o nome — sem precisar inventar
    id/htmlFor para cada input. Conferi antes de trocar: nenhum dos 23 <Field>
    tem <button> dentro nem mais de um controle, então não há ativação dupla.
  • 7 cards que eram <div onClick> ganharam role="button" + tabIndex + Enter/
    Espaço: cards de projeto, posts da galeria (na aba e dentro da pasta do
    projeto), cards de cliente, os três cards de estatística do dashboard, as
    notas recentes e o expansor de projeto. NÃO viraram <button>: eles têm botões
    dentro (excluir, handle de arrastar) e <button> dentro de <button> é HTML
    inválido — o parser desfaz o aninhamento e o layout quebra.
    A guarda que importa: Enter/Espaço disparado por um controle DE DENTRO do
    card pertence a ele, não ao card. Sem isso, teclar no botão de excluir também
    abriria o projeto. Testado (I12).
    Cards na lixeira não recebem role/tabIndex: lá eles não são clicáveis, e
    fingir que são só atrapalharia a navegação por Tab.
  • 9 botões só-ícone que não anunciavam nada ganharam title + aria-label — o
    title dá tooltip de graça no desktop. Os que já tinham title foram deixados
    como estavam.

  BoardHub v23.6 — P1-3 remedido: o gargalo não era o lsSave (jul/2026)
  O plano dizia que o autosave travava a thread por "dezenas de ms" serializando o
  estado inteiro, e propunha dividir o localStorage em chaves por domínio —
  reconhecendo que isso toca lsLoad/lsSave, bhCapture, import/export e o
  reconcile. Antes de mexer na camada que já causou perda de dados duas vezes,
  medi. Estado sintético de 1 MB (30 projetos, 300 posts de galeria, 60 notas com
  rich text, ~400 dias de pomodoro), neste container de teste:
    JSON.stringify(estado inteiro) ................  4,1 ms
    bhSig (stringify + djb2 caractere a caractere)  11,3 ms
    bhHistoryLoad (parse do histórico inteiro) ....  24,3 ms   ← A CADA autosave
    bhCapture → trySave (stringify do histórico) ..  48,1 ms
  A premissa estava errada por uma ordem de grandeza, e o custo real estava no
  vizinho: o autosave chamava bhHistoryLoad() a cada 2,5 s só para ler list[0].at
  e decidir se já tinham passado 30 min desde o último snapshot. Parsear vários MB
  de JSON para ler um timestamp.
  • FIX P1-3: o timestamp do último snapshot passa a viver em
    boardhub_backup_last_at (~30 bytes), alimentado por bhCapture e cacheado em
    memória. Se a chave sumir, reconstrói do histórico UMA vez por sessão. O
    histórico inteiro só é lido por quem precisa dele de verdade: bhCapture, o
    gcIdb, a tela de Sync e o backup diário — todos fora do caminho quente.
  • NÃO FEITO, de propósito: o split do localStorage por domínio. Medi também a
    versão memoizada por referência (só re-serializa o domínio cuja referência
    mudou): economiza ~2 ms por autosave, a cada 2,5 s. Dois milissegundos não
    justificam reescrever a persistência de um app que já perdeu dados duas vezes.
    Se um dia o acervo crescer a ponto de o lsSave aparecer num profile real, a
    memoização por referência dá 70% sem trocar o formato de armazenamento — é
    por onde começar, não pelo split de chaves.
  • ACHADO QUE NÃO É P1-3 E É MAIOR QUE ELE: com estado de 1 MB, 12 snapshots do
    histórico ocupam ~12,5 MB. A cota do localStorage é ~5 MB. O fallback de cota
    do bhCapture vai derrubando entradas até caber, então o histórico rotativo
    projetado para ~19 snapshots guarda, na prática, 4. Não mexi nisso: mudar
    onde os backups moram (IndexedDB não tem essa cota) é decisão de projeto, não
    correção pontual. Mas o sistema de backup não guarda o que parece guardar.
  ──────
  BoardHub v23.5 — P1-1: cache do bundle compilado (jul/2026)
  DIAGNÓSTICO: o design single-file obrigava o @babel/standalone a transpilar
  390KB de JSX em TODA abertura. Era de longe o maior custo de startup — maior
  que tudo que foi otimizado na camada de imagens — e é trabalho 100% repetido:
  o mesmo texto de entrada produz sempre o mesmo JS de saída.
  MEDIDO (neste container de teste, não na sua máquina — o seu desktop é bem mais
  rápido, mas a ordem de grandeza vale):
    • babel.min.js = 2,78 MB brutos / 592 KB gzipado. O plano estimava ~400KB;
      é mais que o dobro disso.
    • transpilar os 390KB de JSX = ~2,4 s de main thread.
  Os dois desapareceram de todo carregamento que não seja o primeiro após uma
  edição do arquivo.
  COMO FUNCIONA
  • O bloco JSX virou type="text/x-boardhub-jsx" (o Babel não pega mais sozinho)
    e o <script src> do Babel saiu do <head> — agora é injetado sob demanda.
  • Um loader no fim do <body> calcula FNV-1a do fonte e procura
    bundle_v1_<hash>-<comprimento> no IndexedDB (banco próprio, boardhub_bundle,
    separado do de imagens — o GC de blobs não encosta nele).
    hit → executa o cache, o Babel nem é baixado. miss → injeta o Babel,
    transpila, executa e grava.
  • O hash é DO FONTE: editar o arquivo invalida sozinho. Não existe estado
    "cache velho de arquivo novo". Só o bundle atual fica guardado (prune).
  • EFEITO COLATERAL BOM: com o cache quente o app abre sem rede nenhuma. Antes,
    sem conseguir baixar o Babel, não abria de jeito nenhum.
  CUSTO HONESTO: o primeiro carregamento (e o primeiro após cada edição) fica um
  pouco MAIS lento, porque o download do Babel só começa depois que a consulta ao
  IDB falha, em vez de acontecer em paralelo com o React.
  SEGURANÇA DO CAMINHO DE BOOT (é o caminho de boot — as três mitigações do plano
  estão todas implementadas e testadas):
  • parse e execução separados: new Function(code) PARSEIA sem executar. Bundle
    corrompido estoura ali, antes de qualquer efeito colateral, e o fallback para
    o Babel fica limpo.
  • se parseou mas estourou no meio da execução, o app pode estar meio
    inicializado — aí não dá para rodar o Babel por cima. Limpa o cache e
    recarrega UMA vez (guarda em sessionStorage contra loop).
  • sem IndexedDB (modo privado em alguns engines) o app abre normalmente, só não
    cacheia.
  • botão "Limpar cache do app" na Zona Perigosa do Sync, que também mostra a
    origem deste boot (cache ou babel).
  • FIX encontrado pelo teste: o loader passa runtime:'classic' EXPLÍCITO para o
    preset react. Em @babel/standalone 7.23.9 esse já é o default, mas no Babel 8
    o default virou 'automatic' — que emite require("react/jsx-runtime"), coisa
    que não existe numa página com React como global UMD. Reproduzi a quebra
    rodando o loader contra o standalone 8.0.4: o app não monta. Com a URL
    pinada em 7.23.9 isso não acontece hoje, mas era uma bomba-relógio para o dia
    de subir a versão.
  ──────
  BoardHub v23.4 — Lote 3 da auditoria: correções pontuais (jul/2026)
  Quatro bugs sem acoplamento entre si. Nenhum deles perde dados; três produzem
  trabalho desnecessário e um amplia superfície de ataque.
  • FIX P2-1 (o mais irritante no uso diário): abrir um modal, começar a digitar
    num campo e o foco pular para fora sozinho. Causa: o effect do Modal tinha
    [onClose] nas deps e os 4 call sites passam arrow inline — identidade nova a
    cada render do pai. Qualquer re-render desmontava e remontava o effect, que
    no mount chama boxRef.focus(). Ou seja, o pai re-renderizava e o modal
    roubava o foco do input. onClose agora vive num ref e o effect roda com [].
    Medido no teste: com o código antigo, cada render do pai gerava um foco extra
    no box (1→2→3); agora fica em 1.
  • FIX P1-4: _compressImage podia AUMENTAR o arquivo. PNG era re-encodado como
    PNG com o parâmetro de quality ignorado, e o canvas descarta a paleta
    indexada do original — um screenshot PNG de 500KB saía com 600KB. Agora
    encoda WebP (que suporta alpha, então não há motivo para preservar PNG) e só
    aceita o resultado se ele realmente encolheu. O mesmo guard-rail vale para
    JPEG já bem comprimido, que antes era trocado pelo WebP mesmo quando o WebP
    ficava maior.
  • FIX P2-2: o sanitizer só rodava na ENTRADA do RichEditor. O que era SALVO era
    o innerHTML cru do contentEditable — e um paste traz markup arbitrário da
    origem, que ia direto para localStorage/Firestore e voltava como innerHTML no
    outro dispositivo. Agora os 3 pontos de save (emit, flushSave e a migração de
    imagens legadas) sanitizam. Sanitiza-se o VALOR salvo, nunca o DOM vivo:
    mexer no contentEditable durante a digitação mataria o cursor. O allowlist
    também ganhou srcdoc (executa HTML dentro de iframe), formaction (redireciona
    o submit para javascript:), data:text/html no teste de protocolo, o atributo
    action, e <base> na lista de remoção.
  • FIX P1-2: key posicional em 6 grades de imagem. Reordenar fazia o React
    reusar o elemento errado — a imagem pulava de célula e era redecodificada à
    toa. Com o reorder de entradas da v23 isso virou acionável. A src é a
    identidade; o índice só desempata quando a MESMA src aparece duas vezes, e aí
    os dois elementos são visualmente idênticos.
    NÃO alterado, apesar de estar na lista original: o key={idx} dos 4 slots fixos
    de imagem de referência do mentor. Ali a lista é [0,1,2,3] e a POSIÇÃO é a
    identidade — trocar pela src quebraria o slot vazio no meio.

  BoardHub v23.3 — P0-1: a nuvem estava apagando as referências de imagem local (jul/2026)
  DIAGNÓSTICO: uma única função misturava duas responsabilidades sem relação, e
  isso bastava para destruir imagens de forma irreversível. stripBase64() tratava
  "data:image/...;base64,..." e "idb://<key>" como a mesma coisa — "conteúdo local
  que não vai para a nuvem" — e substituía os dois por ''. Mas eles não são a
  mesma coisa: o primeiro é PAYLOAD (megabytes, estoura o limite de 1MB/documento
  do Firestore, tem que sair mesmo); o segundo é uma REFERÊNCIA de ~40 bytes que
  não ameaça limite nenhum. Como pushState() usava essa função, a nuvem gravava
  images:['','','']; como o listener aplica ARRAYS INTEIROS
  (setGalleryPosts(data.galleryPosts)), esses vazios voltavam para o estado local
  na sincronização seguinte — e a referência morria no próprio dispositivo que
  tinha o blob. 24h depois o gcIdb não encontrava mais a referência e apagava o
  blob. Sequência mínima: salvar offline → voltar online → push grava '' → próximo
  boot aplica o array vazio → gcIdb roda → arquivo perdido.
  • FIX P0-1 (data loss): stripBase64 → stripInlineImages. Remove só o payload
    data:image e PRESERVA idb://. Um dispositivo que não tem o blob mostra
    placeholder, o que é infinitamente melhor que destruir a referência no
    dispositivo que tem. Os 4 call sites (pushState, bhCapture, buildSyncPayload,
    guarda de tamanho) foram atualizados. Nota: o call site do bhCapture é o
    fallback de quota do HISTÓRICO DE BACKUPS — ou seja, o backup e o gcIdb (que
    lê referências do histórico) perdiam a informação juntos. Fechados os dois.
  • FIX P0-1 (gcIdb): "não está referenciado no estado agora" é evidência fraca
    demais para apagar um blob — uma aplicação remota ruim, um estado que não
    carregou ou um import pela metade produzem exatamente esse sintoma. O GC
    agora exige a chave sem referência em DUAS varreduras separadas por ≥24h
    (ledger em boardhub_gc_pending). Se a referência voltar (undo, restauração de
    backup, reconcile), a chave sai do ledger e o relógio zera. Custo: um órfão
    sobrevive ~1 dia a mais. Na dúvida, não coletar.
  • FIX (mesma família, encontrado no caminho): lsLoad() devolvendo null fazia o
    GC concluir "nada é referenciado" e apagar TUDO. É literalmente a classe de
    falha do incidente original — estado vazio destruindo dados reais. Agora
    aborta a varredura.
  • NEW: <Img>/<BgImg> distinguem "ainda carregando" de "este dispositivo não tem
    este arquivo". Precisou de sinal novo: resolver para '' chama setState com o
    mesmo valor e o React descarta a atualização — não havia re-render possível.
    useDisplayUrlState devolve [url,missing]; useDisplayUrl virou wrapper fino
    (Vid e chamadores diretos não mudaram). O placeholder é ícone + title/
    aria-label, não texto: as células vão de 16px a full-bleed e texto quebraria
    as pequenas.
  • Invariante da v23.2 verificada com instrumentação real em
    IDBObjectStore.prototype.get: havendo thumbnail, o original NUNCA é lido.
  • ATENÇÃO: este fix impede a destruição daqui pra frente; não recupera o que já
    foi apagado. Posts que hoje estão com images:['','',''] na nuvem já perderam
    a referência nos dois lados. O que ainda pode tê-la é o Histórico de Backups
    e blobs órfãos que o gcIdb ainda não coletou.
  ──────
  BoardHub v23.2 — Pipeline de imagens reescrito (jul/2026)
  DIAGNÓSTICO: v23 ficou mais lenta que a build anterior porque a grade passou a
  fazer o DOBRO do trabalho por célula. O resolver lia o ORIGINAL, pintava, e
  só então trocava pelo thumbnail — duas leituras em IndexedDB, dois decodes
  (um deles de uma fonte de 1400px dentro de uma célula de ~200px) e dois paints
  por imagem visível. Some a isso o warmer de boot, que carregava até 100 blobs
  full-res em transações separadas e enfileirava as leituras pequenas que a
  grade realmente precisava.
  • GRADE = SÓ THUMBNAIL. Uma leitura, um decode, um paint. Nenhuma superfície
    de grade/capa toca mais no original; full-res agora é exclusivo do lightbox
    (OBJURL_CAP 100→12, porque só uma imagem aparece por vez).
  • LEITURAS EM LOTE: cada idbGet abria a própria transação — uma tela de 40
    imagens = 40 transações enfileiradas, cada uma com seu commit. Leituras no
    mesmo tick agora colapsam em UMA transação com N gets (o React comita o
    efeito de todas as células visíveis no mesmo tick, então uma tela inteira
    vira uma transação só).
  • THUMBNAIL GERADO NO UPLOAD, não na primeira exibição — o custo cai onde o
    usuário já está esperando. Navegar nunca mais paga decode+encode.
  • WARMER DE BOOT AGORA AQUECE THUMBNAILS (antes: originais, e a função do
    changelog v23 sequer era chamada — rodava outra, full-res). Como os
    thumbnails ficam residentes, o resolver devolve a URL de forma SÍNCRONA no
    primeiro render: sem frame de placeholder, sem fade, sem segundo paint —
    que era exatamente a sensação de "instantâneo" da build antiga, só que
    custando ~40KB por imagem em vez de ~300KB.
  • Segunda passada do warmer gera thumbnails que ainda não existem (migração
    de acervo antigo), throttled em 3 concorrentes e limitada a 150/sessão.
  • Geração de thumbnail com UM decode (era dois: um probe de dimensões + um
    resize); downscale de alta qualidade no canvas dá o mesmo resultado.
  • LRU de thumbnails (THUMB_CAP=600, ~15-25MB) substitui o de full-res.
  • loading="lazy" removido de imagens locais (já têm gate próprio de viewport —
    era um segundo atraso sobre um recurso que já está em memória); fade de
    250ms mantido só para imagens de rede. Gate ampliado 400px→600px.
  • FIX: vídeo em getThumbUrl gerava um "thumbnail" que era o vídeo inteiro
    persistido sob thumb_<key>. Agora serve o original.

  BoardHub v23.1 — Correção crítica de perda de dados no 1º login (jul/2026)
  • FIX P0 (data loss): logging into an account for the FIRST TIME on a device
    could push the demo SEED over a real cloud save. Root cause: the "does local
    hold real data?" guard only tested for non-empty arrays, and the SEED ships
    with 3 demo projects + clients + mentors + notes. Any device that had merely
    OPENED the app once before logging in had that demo content persisted with a
    fresh edit timestamp, so last-write-wins compared "seed edited seconds ago"
    against "real data synced yesterday" and the seed won.
  • The deeper fix: last-write-wins is the wrong rule for first contact with an
    account on a device. At that moment the cloud holds accumulated history and
    local holds at most minutes of pre-login work. New rule — if this browser
    profile has never completed a sync with this account (boardhub_synced_uid),
    THE CLOUD ALWAYS WINS and timestamps are not consulted. Local state is
    archived to the backup history first ('Local antes do 1º login') and an
    on-screen notice explains what happened. LWW still applies afterwards, so
    genuine offline editing on a known device is unaffected.
  • Devices are marked as synced with an account after any successful apply or
    push; SEED-initialized profiles are flagged (boardhub_seeded) so demo content
    is never mistaken for real data again.

  BoardHub v23 — Auditoria & Retrabalho Claude (jul/2026)
  PERCEIVED PERFORMANCE (fast full-res warming, bounded for 100+ image posts)
  • Reconciled approach: the speed comes from warming full-res blobs into memory
    so the grid shows the original the instant it's cached — no thumbnail
    generation on the critical path. This is the fast behavior of the earlier
    build, now made safe for large posts by an LRU cap on the object-URL cache.
  • Warming happens two ways: a background idle pass pre-loads blobs so browsing
    feels pre-warmed, and opening a card eagerly warms its own images (first ~48)
    right away. Display shows full-res immediately, then swaps to the small
    thumbnail for render efficiency.
  • MEMORY: the full-res cache is capped (OBJURL_CAP=100). Past the cap the
    least-recently-shown blob is revoked; on-screen images were just touched so
    they're never the ones evicted. A 100+ image post no longer pins every blob
    for the session — scrolled-away images are reclaimed and re-read in ms if
    revisited. First paint is still never blocked by image I/O, and idb:// grid
    images remain viewport-gated so a huge post doesn't read all blobs at once.
  • FASTER generation: thumbnails now build via createImageBitmap (off-main-thread
    decode + resize) instead of new Image()+canvas, with a canvas fallback.
  • Full-res is used directly in the lightbox; thumbnails persist across sessions.  IDEAS
  • NEW: reordenar entradas dentro de um grupo — arrastar no desktop (grip +
    handle, mesmo padrão da barra lateral), setas ↑↓ no mobile (touch não faz
    HTML5 drag). A nova ordem sincroniza e entra no backup como o resto do estado.
  SYNC / DATA SAFETY
  • FIX P0: initial reconcile now runs BEFORE the pending-edit gate — a stray
    pre-login edit on a fresh device no longer lets a near-seed push overwrite
    the cloud (the class of the original data-loss incident). Stray pre-login
    edits are archived to backup history ('Edição pré-login').
  • FIX P0: push failures NEVER surrender _hasPendingLocalEdit anymore; retries
    back off 8s→30s→2min, DIRTY stays set, and a stale snapshot can no longer
    silently overwrite unpushed local edits. New explicit escape hatch in Sync:
    "Descartar locais e puxar da nuvem" (archives local first).
  • NEW: real last-write-wins on boot conflicts — local last-edit timestamp
    (boardhub_last_edit_at) vs remote _updated; loser is archived to history.
    Ties within 2min favor local (active work).
  • FIX P0: TDZ crash — idb:// prefetch ran at module eval before openIdb was
    initialized; any persisted local image crashed the app on load. Block moved.
  • NEW: global trash (v3.2) — soft-deleted items now sync across devices and
    are restorable anywhere; 30-day auto-purge (deletedAt stamp) bounds size.
    Previously trash was device-local and silently emptied by remote echoes.
  • FIX: per-document size guard (3× 950KB) replaces the whole-state 900KB check
    that blocked sync in scenarios the 3-doc split was built to survive; the
    offending doc is named in the UI (syncDetail).
  • FIX: fresh account no longer stuck on "Sincronizando..." (empty server
    snapshot now resolves to synced).
  • FIX: "Forçar sync" routed through App so pending/dirty flags clear on success.
  • Removed dead _isApplyingRemote mechanism (written, never read).
  CORRECTNESS
  • FIX: all "today" computations use localDateISO() (local tz) — pomodoro after
    21:00 BRT logged to tomorrow, deadline chips off-by-one at night, daily
    backup in the wrong weekday slot. Replaced: _seedDate, pomoTodayKey,
    pomoLoad migrations, todayISO, addDays, daily-backup slot, bhCapture dedup,
    gallery post date, export filename, Gantt week/month headers, streak.
  • FIX: Dashboard streak read days[key].total but values are numbers — streak
    was permanently 0; dead weekHeat (computed, never rendered) removed.
  • FIX: JSON import validates shapes (Array.isArray) and reports unrecognized
    files instead of corrupting state; new ErrorBoundary replaces the white
    screen with a recoverable error card.
  SECURITY / PRIVACY
  • NEW: allowlist sanitizer on rich-text HTML (import/cloud could carry
    <script>/on* handlers into innerHTML with a live Firebase session);
    insertImage escapes the src attribute.
  • NEW: Imgur fallback asks consent once per session (uploads are public by
    URL); declining stores the image locally instead.
  MAINTENANCE
  • NEW: IndexedDB GC on boot (delayed 8s) — deletes blobs unreferenced by the
    live state AND every backup-history snapshot; 24h age floor so a
    just-uploaded image can never be collected.
  • FIX: Modal — Escape closes only the top of the stack; minimal focus trap +
    focus restore; aria-modal/labels.
  • FIX: duplicated .rich-editor CSS block merged; .overlay recentered over the
    content area (was padded 80/160/160 asymmetrically).
  • navTick now also bumps on select/add project (route consistency);
    bhRetention docs corrected (7 weekly + 12 rotating ≈ 19 cap, by design).
  KNOWN TRADE-OFFS (accepted, documented)
  • Babel standalone transpiles ~360KB of JSX at every load (single-file
    constraint); execCommand remains (deprecated, no light replacement);
    session object-URLs are not revoked (GC covers the underlying blobs).

@media (hover:none),(pointer:coarse){.card .card-delete-btn{opacity:.85;}}
.card-click{cursor:pointer;}.card-click:hover{border-color:var(--text)!important;box-shadow:0 4px 20px rgba(28,25,23,.07)!important;}
.card-click:active{transform:scale(.985);box-shadow:0 1px 8px rgba(28,25,23,.06)!important;}
/* Buttons — improved hover lift + press feedback */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-family:'Figtree',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;transition:all .18s;border:none;outline:none;position:relative;}
.btn:focus-visible{box-shadow:0 0 0 2.5px var(--focus-ring);}
.btn-dark{background:var(--text);color:white;}.btn-dark:hover{box-shadow:0 2px 10px rgba(28,25,23,.2);transform:translateY(-1px);}.btn-dark:active{transform:translateY(0);box-shadow:none;opacity:.9;}
.btn-outline{background:transparent;color:var(--muted);border:1px solid var(--border);}.btn-outline:hover{border-color:var(--text);color:var(--text);}.btn-outline:active{background:var(--bg);}
.btn-ghost{background:transparent;color:var(--muted);border:none;padding:6px 10px;border-radius:6px;}.btn-ghost:hover{color:var(--text);background:var(--bg);}.btn-ghost:active{background:var(--border);}
.btn-danger{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;}.btn-danger:hover{background:#FEE2E2;}.btn-danger:active{background:#FECACA;}
/* Nav items with subtle left accent on active */
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:.85rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;background:transparent;border:none;outline:none;width:100%;font-family:'Figtree',sans-serif;letter-spacing:.01em;}
.nav-item:hover{background:rgba(28,25,23,.05);color:var(--text);}.nav-item.active{background:var(--text);color:white;box-shadow:0 1px 4px rgba(28,25,23,.15);}
.nav-item:focus-visible{box-shadow:0 0 0 2.5px var(--focus-ring);}
.tag{display:inline-block;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:4px;}
.tag-green{background:#E8F5EC;color:#276b3e;}.tag-yellow{background:#FEF9E7;color:#92700b;}.tag-gray{background:#F0EDE9;color:var(--muted);}.tag-red{background:#FDEDED;color:#9B1C1C;}.tag-blue{background:#EFF6FF;color:#1e40af;}
.input-bare{background:transparent;outline:none;border-bottom:1px solid var(--border);font-family:'Figtree',sans-serif;color:var(--text);transition:border-color .2s,box-shadow .2s;}.input-bare:focus{border-color:var(--text);box-shadow:0 1px 0 0 var(--text);}
/* Input — subtle focus glow */
.input-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-family:'Figtree',sans-serif;font-size:.85rem;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;width:100%;}.input-box:focus{border-color:var(--text);box-shadow:0 0 0 3px rgba(28,25,23,.06);}
input[type="date"]{font-family:'Figtree',sans-serif;}
.label{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
.tab-btn{padding:10px 0;margin-right:24px;background:none;border:none;cursor:pointer;font-family:'Figtree',sans-serif;font-size:.85rem;font-weight:500;transition:all .15s;margin-bottom:-1px;}
.tab-btn:focus-visible{box-shadow:0 0 0 2.5px var(--focus-ring);border-radius:4px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .35s ease both;}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
/* Overlay now has a visible backdrop */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;animation:overlayIn .2s ease;padding:24px;padding-left:244px;/* 220px sidebar + 24px — centers dialogs over the content area; mobile media query zeroes this */}
.modal{background:var(--surface);border-radius:18px;border:1px solid var(--border);padding:24px 28px;width:100%;animation:modalIn .25s ease;box-shadow:0 20px 60px rgba(28,25,23,.18);max-height:95vh;overflow-y:auto;}
.upload-zone{border:2px dashed var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,background .2s,transform .15s;padding:24px;text-align:center;color:var(--muted);}
.upload-zone:hover{border-color:var(--text);background:rgba(28,25,23,.02);color:var(--text);}.upload-zone:active{transform:scale(.98);}
.cover-wrap{position:relative;}.cover-edit-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;opacity:0;transition:all .25s;cursor:pointer;}
.cover-wrap:hover .cover-edit-overlay{background:rgba(0,0,0,.45);opacity:1;}
.task-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);transition:background .1s;}.task-row:last-child{border-bottom:none;}
/* Task checkbox with smooth fill animation */
.task-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border-2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.4,0,.2,1);background:transparent;}
.task-check:hover{border-color:var(--muted);}
.task-check.done{background:var(--text);border-color:var(--text);transform:scale(1);animation:checkPop .25s cubic-bezier(.34,1.56,.64,1);}
.task-check.done::after{content:'';width:5px;height:9px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px);display:block;animation:checkDraw .2s ease .05s both;}
@keyframes checkPop{0%{transform:scale(.8);}50%{transform:scale(1.1);}100%{transform:scale(1);}}
@keyframes checkDraw{from{opacity:0;transform:rotate(45deg) translate(-1px,-1px) scale(.5);}to{opacity:1;transform:rotate(45deg) translate(-1px,-1px) scale(1);}}
@keyframes lbIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
.lightbox{position:fixed;inset:0;background:rgba(10,8,6,.92);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center;cursor:zoom-out;}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px;animation:lbIn .2s ease;cursor:default;}
.ptask-pill{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:20px;cursor:pointer;border:none;font-family:'Figtree',sans-serif;transition:all .12s;}
.ptask-pill:active{transform:scale(.92);}
.ptask-Pendente{background:#F0EDE9;color:var(--muted);}.ptask-Fazendo{background:#FEF9E7;color:#92700b;}.ptask-Concluído{background:#E8F5EC;color:#276b3e;}.ptask-Atrasado{background:#FDEDED;color:#9B1C1C;}
@keyframes toastPop{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.95);}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}}
.save-toast{position:fixed;bottom:20px;left:calc(220px + 50%);transform:translateX(-50%);background:var(--text);color:white;padding:8px 18px;border-radius:30px;font-size:.78rem;font-weight:500;z-index:999;animation:toastPop .3s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:7px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(28,25,23,.2);}
.drag-handle{cursor:grab;color:var(--border-2);opacity:0;transition:opacity .15s;display:flex;align-items:center;flex-shrink:0;padding:2px 3px;}
.drag-handle:active{cursor:grabbing;}
.drag-row:hover .drag-handle,.drag-card:hover .drag-handle{opacity:1;}
.drag-over-top{border-top:2px solid var(--text)!important;}
.drag-over-left{outline:2px solid var(--text)!important;}

/* Gantt styles */
.gantt-bar{transition:opacity .12s,box-shadow .12s;}.gantt-bar:hover{opacity:.88;}
.gantt-row-left:hover{background:rgba(28,25,23,.04)!important;}
/* Gallery image hover zoom — replaces JS onMouseEnter/Leave handlers */
.img-zoom{transition:transform .4s;}.img-zoom:hover{transform:scale(1.06);}
.img-zoom-sm{transition:transform .3s;}.img-zoom-sm:hover{transform:scale(1.03);}

/* Hover utilities - replaces onMouseEnter/Leave JS handlers */

.hover-danger:hover{color:#DC2626!important;}
.hover-surface:hover{background:var(--surface);}
.hover-border-text:hover{border-color:var(--text)!important;}
.text-link{color:var(--muted);transition:color .15s;}.text-link:hover{color:var(--text)!important;}
.text-link-danger{color:var(--muted);transition:color .15s;}.text-link-danger:hover{color:#DC2626!important;}

/* Pomodoro stats slide-in panel */

@keyframes moreSheetIn{from{opacity:0;transform:translateY(100%);}to{opacity:1;transform:translateY(0);}}

/* - MOBILE-LAYOUT COMPONENT STYLES (always applied - used whenever isMobile=true) - */

.compact-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .1s,transform .1s;min-height:64px;}

.compact-row-meta{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.seg-tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px;}

.seg-tab:active:not(.active){background:rgba(28,25,23,.04);}
/* Vertical timeline */
.vtimeline-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);min-height:48px;}
.vtimeline-item:last-child{border-bottom:none;}
.vtimeline-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid var(--border-2);}
.vtimeline-dot.done{background:var(--text);border-color:var(--text);}
.vtimeline-text{flex:1;font-size:.9rem;font-weight:500;}
.vtimeline-date{font-size:.78rem;color:var(--muted);flex-shrink:0;}
.drag-item .drag-handle{opacity:0;transition:opacity .12s;}
.drag-item:hover .drag-handle{opacity:1;}
.drag-item.drag-over{outline:2px dashed var(--text);outline-offset:-2px;border-radius:8px;background:rgba(28,25,23,.02);}

/* - RESPONSIVE - */
@media(max-width:768px){
  /* Prevent horizontal scroll */
  html,body{overflow-x:hidden!important;max-width:100vw!important;}
  /* Global spacing - room for bottom tab */
  .main-mobile{margin-left:0!important;padding:16px 16px 72px!important;padding-top:0!important;min-height:calc(100vh - 56px)!important;overflow-x:hidden!important;width:100%!important;box-sizing:border-box!important;}
  .fade-up{animation:none!important;max-width:100%!important;box-sizing:border-box!important;}
  
  /* Overlay / Modals — slide up from bottom on mobile */
  .overlay,.overlay-offset{padding:0!important;padding-left:0!important;align-items:flex-end!important;}
  .modal{border-radius:18px 18px 0 0!important;max-height:92vh!important;padding:24px 20px!important;}
  
  /* Save toast - above tab bar */
  .save-toast{left:50%!important;bottom:72px!important;}
  
  /* Cards */
  .card{border-radius:12px;overflow:hidden;}
  
  /* Tag - readable on mobile */
  .tag{padding:5px 10px;font-size:.72rem;}
  
  /* Buttons - 48px touch targets */
  .btn{padding:12px 18px;font-size:.9rem;min-height:44px;}
  .btn-ghost{padding:10px 12px;min-height:44px;}
  .nav-item{padding:14px 16px;font-size:.95rem;}
  
  /* Input - 16px prevents iOS zoom */
  .input-box{padding:12px 14px;font-size:16px!important;min-height:48px;}
  textarea{font-size:16px!important;}
  select{font-size:16px!important;min-height:44px;}
  input{font-size:16px!important;}
  
  /* Label - readable */
  .label{font-size:.72rem;}
  
  /* Tab buttons - larger tap area */
  .tab-btn{margin-right:0;font-size:.88rem;padding:12px 16px;}
  
  /* Upload zone */
  .upload-zone{padding:20px;}
  
  /* Cover edit - always show on mobile (no hover) */
  .cover-wrap .cover-edit-overlay{background:rgba(0,0,0,.3)!important;opacity:1!important;}
}

/* === REDESIGN v2 === */
/* M2.1 — pêndulo do metrônomo. A duração vem do BPM por --beat (inline), e meia
   oscilação = uma semínima, então a haste cruza o centro uma vez por batida,
   como num metrônomo mecânico. O easing imita a física: rápido no meio, quase
   parado nos extremos — linear denunciaria na hora que é um retângulo girando.
   O pivô fica embaixo (transform-origin), que é onde fica o de verdade. */
@keyframes bhPendulum{from{transform:rotate(-26deg);}to{transform:rotate(26deg);}}
/* transform-box:view-box para que o pivô seja em COORDENADA DO SVG (38,70 = a
   base do mostrador). Sem isso, porcentagem em <g> resolve contra a bounding box
   do próprio grupo e a haste gira em volta de si mesma. */
/* O pivô vem de --pivot, escrito pelo JSX a partir de MET_PIVOT_Y. Deixar o
   número fixo aqui já quebrou uma vez: a geometria mudou, o CSS ficou para trás
   e a haste passou a girar em volta de um ponto que não existia mais. */
.bh-pendulum{transform-box:view-box;transform-origin:38px var(--pivot,34px);animation:bhPendulum var(--beat,.5s) cubic-bezier(.42,0,.58,1) infinite alternate;}
/* NÃO há supressão por prefers-reduced-motion aqui, e isso é deliberado. A
   primeira versão tinha, e transformava a funcionalidade em graveto morto: o
   pêndulo não é enfeite que aparece sozinho, é um controle OPT-IN que nasce
   desligado (metronomeLoad devolve false sem chave salva). Quem liga, ligou de
   propósito, e o tooltip diz o que é. O opt-in É o controle de acessibilidade;
   um @media por cima só sequestraria a escolha explícita do usuário.
   O que a preferência do sistema deve governar é o PADRÃO, e o padrão já é
   desligado para todo mundo. */
@keyframes viewEnter{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.view-enter{animation:viewEnter .28s cubic-bezier(.4,0,.2,1) both;}
@keyframes cmdIn{from{opacity:0;transform:scale(.97) translateY(-8px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes cmdOverlayIn{from{opacity:0;}to{opacity:1;}}
.cmd-overlay{position:fixed;inset:0;z-index:9999;background:rgba(28,25,23,.08);display:flex;align-items:flex-start;justify-content:center;padding-top:min(20vh,160px);animation:cmdOverlayIn .15s ease;}
.cmd-palette{width:min(560px,92vw);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 24px 80px rgba(28,25,23,.18),0 4px 16px rgba(28,25,23,.08);overflow:hidden;animation:cmdIn .2s cubic-bezier(.32,.72,.5,1.02);}
.cmd-input-wrap{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);}
.cmd-input{flex:1;border:none;outline:none;background:transparent;font-family:'Figtree',sans-serif;font-size:1rem;color:var(--text);}
.cmd-input::placeholder{color:var(--border-2);}
.cmd-results{max-height:340px;overflow-y:auto;padding:8px;}
.cmd-results::-webkit-scrollbar{width:4px;}.cmd-results::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.cmd-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:background .1s;font-size:.88rem;}
.cmd-item:hover,.cmd-item.cmd-active{background:var(--bg);}
.cmd-item-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg);color:var(--muted);}
.cmd-item.cmd-active .cmd-item-icon{background:var(--text);color:white;}
.cmd-item-title{font-weight:600;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmd-item-meta{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cmd-kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:5px;background:var(--bg);border:1px solid var(--border);font-size:.68rem;font-weight:600;color:var(--muted);font-family:'Figtree',sans-serif;}
.cmd-footer{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted);}
.cmd-empty{padding:32px 20px;text-align:center;color:var(--muted);font-size:.88rem;}
.progress-ring{transform:rotate(-90deg);}
.progress-ring-bg{stroke:var(--border);fill:none;}
.progress-ring-fill{fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
.sidebar-section-label{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--border-2);padding:0 12px;margin-top:20px;margin-bottom:6px;}
.sidebar-fav{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:6px;font-size:.8rem;color:var(--muted);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;font-family:'Figtree',sans-serif;text-align:left;}
.sidebar-fav:hover{background:rgba(28,25,23,.05);color:var(--text);}
.sidebar-fav .fav-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
@keyframes quickCaptureIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.quick-capture{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:85;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 32px rgba(28,25,23,.12),0 2px 8px rgba(28,25,23,.06);display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;animation:quickCaptureIn .25s cubic-bezier(.34,1.56,.64,1);min-width:320px;max-width:min(480px,90vw);}
.quick-capture input{flex:1;border:none;outline:none;background:transparent;font-family:'Figtree',sans-serif;font-size:.9rem;color:var(--text);}
.quick-capture input::placeholder{color:var(--border-2);}

    <div style="font-size:2.4rem;font-weight:500;letter-spacing:-0.02em;color:#1C1917">Board<span style="font-style:italic;font-weight:300">Hub</span></div>

      <div style="width:40%;height:100%;background:#1C1917;border-radius:3px;animation:splashBar 1.2s ease infinite"></div>
    </div>

    window.__splashTimeout=setTimeout(function(){
      var s=document.getElementById('splash');if(!s)return;
      s.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;gap:12px;font-family:sans-serif;padding:24px;text-align:center"><div style="font-size:2.4rem;font-weight:500;font-family:serif;color:#1C1917">BoardHub</div><div style="font-size:.8rem;color:#DC2626">Erro ao carregar. Verifique sua conexao e recarregue.</div><button onclick="location.reload()" style="margin-top:8px;padding:8px 20px;background:#1C1917;color:white;border:none;border-radius:8px;cursor:pointer">Recarregar</button></div>';
    },12000);
    window.addEventListener('error',function(e){
      clearTimeout(window.__splashTimeout);

    });
  </script>

<script type="text/x-boardhub-jsx" id="bh-jsx-source">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// - DATE HELPERS (local timezone) -
// The app runs in UTC-3 (Brazil). toISOString() gives the UTC date, which after
// 21:00 local is already *tomorrow* — pomodoro logged to the wrong day, deadline
// chips off-by-one at night, daily backup landing in the wrong weekday slot.
// Every "today" in the app must go through localDateISO().
const localDateISO=(d=new Date())=>{
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
};

// - LOCAL STORAGE -
const LS_KEY = 'boardhub_v2';
const DIRTY_KEY = 'boardhub_dirty'; // '1' = localStorage holds edits not yet confirmed pushed to cloud
const LAST_EDIT_KEY = 'boardhub_last_edit_at'; // ISO timestamp of the last USER edit — feeds last-write-wins
const lsLoad = () => { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch { return null; } };
const lsSave = s => {
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); }
  catch(e) {
    // Quota exceeded — strip any accidental base64 that slipped through (single pass)
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(s, (k,v)=>typeof v==='string'&&v.startsWith('data:image')?'':v));
    } catch { /* silent - idb:// refs and https:// URLs never cause quota issues */ }
  }
};
// - GLOBAL TRASH AUTO-PURGE -
// Soft-deleted items sync across devices (v3.2). To bound document size, items
// deleted more than 30 days ago are purged at boot. Pre-existing trash without
// a deletedAt stamp is grandfathered: stamped now, giving it a fresh 30 days.
const TRASH_TTL_MS=30*24*3600*1000;
const _purgeTrash=s=>{
  if(!s)return s;
  const now=Date.now();
  const prune=arr=>Array.isArray(arr)?arr.map(x=>{
    if(x&&x.deleted&&!x.deletedAt)return{...x,deletedAt:new Date().toISOString()};
    return x;
  }).filter(x=>{
    if(!x||!x.deleted||!x.deletedAt)return true;
    return now-new Date(x.deletedAt).getTime()<TRASH_TTL_MS;
  }):arr;
  ['projects','clients','mentors','notes','socialPosts','galleryPosts','galleryFolders']
    .forEach(k=>{if(s[k])s[k]=prune(s[k]);});
  return s;
};
const persisted = _purgeTrash(lsLoad());
// - DEVICE/ACCOUNT SYNC MARKERS -
// SYNCED_UID_KEY: the account this browser profile has actually completed a sync
// with. Absent/different = this is the FIRST contact with that account here, and
// the cloud must be treated as authoritative (see the reconcile state machine).
// SEEDED_KEY: this profile's state was initialized from SEED and has never been
// synced. Without it, persisted SEED data (3 demo projects, clients, mentors,
// notes) is indistinguishable from real user data — which is exactly how a phone
// that had been opened once before login pushed the demo content over a real
// cloud save.
const SYNCED_UID_KEY='boardhub_synced_uid';
const SEEDED_KEY='boardhub_seeded';
if(!persisted){try{localStorage.setItem(SEEDED_KEY,'1');}catch{}}

// - BACKUP HISTORY -
// Rotating snapshot history. Replaces the old two-slot system (pre_sync + daily),
// which kept only the 2 most recent snapshots — both would already be poisoned by
// the time a sync disaster was noticed. Design goals:
//   • multiple snapshots with tiered retention (recent kept densely, older thinned)
//   • dedup by content signature (no more "two identical backups 1 minute apart")
//   • NEVER capture an empty/seed state — a backup of nothing is not a backup
//   • quota-safe: drops oldest entries (and strips base64) before giving up
// F1: o histórico mora no IndexedDB, em BANCO PRÓPRIO. A chave abaixo é só a
// ORIGEM da migração — depois de migrada e verificada, ela deixa de existir.
const BH_HISTORY_KEY='boardhub_backup_history';
const BH_DB_NAME='boardhub_backups';
const BH_STORE='snapshots';   // entrada inteira, com state
const BH_META='meta';         // at/reason/sig/counts, sem state
const BH_DB_V=1;
const BH_KEEP_RECENT=6;   // most recent N rotating snapshots always kept
const BH_MAX_TOTAL=12;    // cap on the ROTATING tier only — the weekly tier adds
                          // up to 7 more (one per weekday), so the effective
                          // history ceiling is ~19 entries, by design
const bhStateHasData=s=>{
  if(!s)return false;
  const ne=a=>Array.isArray(a)&&a.length>0;
  return ne(s.projects)||ne(s.clients)||ne(s.mentors)||ne(s.notes)||ne(s.tasks)||ne(s.socialPosts)||ne(s.galleryPosts)||ne(s.noteGroups);
};
const bhSig=s=>{ // cheap content hash (djb2) for dedup — volatile-free copy
  const {pomoData,...rest}=s||{};
  const str=JSON.stringify(rest);
  let h=5381;
  for(let i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;}
  return String(h);
};
const bhCounts=s=>({
  projects:(s.projects||[]).filter(p=>!p.deleted).length,
  clients:(s.clients||[]).filter(c=>!c.deleted).length,
  notes:(s.notes||[]).filter(n=>!n.deleted).length,
  tasks:(s.tasks||[]).length,
});
// ── F1: armazenamento do histórico ──────────────────────────────────────────
// BANCO PRÓPRIO, não um store a mais no banco de imagens. O gcIdb varre o banco
// de imagens decidindo o que é blob órfão; se os snapshots morassem lá, a única
// coisa separando "backup" de "lixo a coletar" seria disciplina de prefixo de
// chave — e esse GC já apagou arquivo do usuário uma vez (v23.3). Bancos
// distintos tornam a confusão impossível por construção, não por convenção.
//
// Dois stores: `snapshots` guarda a entrada inteira (com state), `meta` guarda
// só at/reason/sig/counts. Decisão de dedup, retenção e a LISTA da tela de Sync
// leem `meta` — que é minúsculo — em vez de arrastar o acervo inteiro para a
// memória. O state só é lido por quem realmente precisa dele: o gcIdb e a
// restauração. Os dois stores são escritos na MESMA transação, então não existe
// meta sem snapshot.
let _bhDb=null,_bhDbP=null;
const _bhResetDb=()=>{_bhDb=null;_bhDbP=null;};
const bhIdbOpen=()=>{
  if(_bhDb)return Promise.resolve(_bhDb);
  if(_bhDbP)return _bhDbP;
  _bhDbP=new Promise((res,rej)=>{
    let req;
    try{req=indexedDB.open(BH_DB_NAME,BH_DB_V);}catch(e){_bhResetDb();rej(e);return;}
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(BH_STORE))db.createObjectStore(BH_STORE,{keyPath:'at'});
      if(!db.objectStoreNames.contains(BH_META))db.createObjectStore(BH_META,{keyPath:'at'});
    };
    req.onsuccess=e=>{
      _bhDb=e.target.result;_bhDbP=null;
      _bhDb.onclose=_bhResetDb;
      _bhDb.onversionchange=()=>{try{_bhDb.close();}catch{}_bhResetDb();};
      res(_bhDb);
    };
    req.onerror=e=>{_bhResetDb();rej(e.target.error);};
  });
  return _bhDbP;
};
// Grava entradas e remove as despejadas numa transação só: o histórico nunca
// fica num estado em que a retenção já apagou mas o novo snapshot não entrou.
const bhIdbWrite=(puts,dels)=>bhIdbOpen().then(db=>new Promise((res,rej)=>{
  let tx;
  try{tx=db.transaction([BH_STORE,BH_META],'readwrite');}catch(e){_bhResetDb();rej(e);return;}
  const s=tx.objectStore(BH_STORE),m=tx.objectStore(BH_META);
  try{
    puts.forEach(e=>{s.put(e);m.put({at:e.at,reason:e.reason,sig:e.sig,counts:e.counts});});
    (dels||[]).forEach(at=>{s.delete(at);m.delete(at);});
  }catch(e){rej(e);return;}
  tx.oncomplete=()=>res();
  tx.onerror=e=>rej((e.target&&e.target.error)||new Error('transação falhou'));
  tx.onabort=e=>rej((e.target&&e.target.error)||new Error('transação abortada'));
}));
const bhIdbAllMeta=()=>bhIdbOpen().then(db=>new Promise((res,rej)=>{
  let r;
  try{r=db.transaction(BH_META,'readonly').objectStore(BH_META).getAll();}catch(e){_bhResetDb();rej(e);return;}
  r.onsuccess=e=>res(e.target.result||[]);
  r.onerror=e=>rej(e.target.error);
}));
// PROPOSITALMENTE sem catch devolvendo []: quem chama (gcIdb) precisa distinguir
// "o histórico não referencia nada" de "não consegui ler o histórico". Engolir o
// erro aqui faria o GC concluir que nenhum blob está referenciado e apagar todos
// — a classe exata do incidente da v23.3, agora pelo lado do backup.
const bhHistoryFull=()=>bhIdbOpen().then(db=>new Promise((res,rej)=>{
  let r;
  try{r=db.transaction(BH_STORE,'readonly').objectStore(BH_STORE).getAll();}catch(e){_bhResetDb();rej(e);return;}
  r.onsuccess=e=>res((e.target.result||[]).sort((a,b)=>a.at<b.at?1:-1));
  r.onerror=e=>rej(e.target.error);
}));
// Um snapshot só, pela chave. A tela de Sync lista a partir do `meta` e chama
// isto no clique de restaurar — nenhum state entra em memória antes disso.
const bhHistoryGet=at=>bhIdbOpen().then(db=>new Promise((res,rej)=>{
  let r;
  try{r=db.transaction(BH_STORE,'readonly').objectStore(BH_STORE).get(at);}catch(e){_bhResetDb();rej(e);return;}
  r.onsuccess=e=>res(e.target.result||null);
  r.onerror=e=>rej(e.target.error);
}));
// Espelho em memória do `meta`, sempre o mais novo primeiro. Existe para que a
// decisão de dedup e a lista da tela continuem SÍNCRONAS, como eram no
// localStorage — os 7 call sites de bhCapture não mudaram de forma.
let _bhMeta=[];
let _bhReady=false;
const bhHistoryMeta=()=>_bhMeta;
// Migração (protocolo #4: escreve → VERIFICA → só então remove a origem).
const bhMigrateLegacy=async()=>{
  let raw=null;
  try{raw=localStorage.getItem(BH_HISTORY_KEY);}catch{}
  if(!raw)return;
  let list=null;
  try{list=JSON.parse(raw);}catch{return;} // ilegível: é a única cópia, NÃO apagar
  if(!Array.isArray(list)){return;}
  const valid=list.filter(e=>e&&typeof e.at==='string');
  if(!valid.length){try{localStorage.removeItem(BH_HISTORY_KEY);}catch{}return;}
  await bhIdbWrite(valid,[]);
  // Verificação: cada `at` da origem tem de estar no destino. Só depois disso a
  // origem pode ir embora. Se faltar um, estoura — a chave legada FICA e a
  // migração é tentada de novo no próximo boot.
  const gravados=new Set((await bhIdbAllMeta()).map(m=>m.at));
  const faltando=valid.filter(e=>!gravados.has(e.at));
  if(faltando.length)throw new Error('migração incompleta: '+faltando.length+'/'+valid.length+' não chegaram ao IDB');
  try{localStorage.removeItem(BH_HISTORY_KEY);}catch{}
  console.info('[BoardHub] F1: '+valid.length+' snapshot(s) migrados para o IndexedDB.');
};
let _bhInitP=null;
const bhHistoryInit=()=>{
  if(_bhInitP)return _bhInitP;
  _bhInitP=(async()=>{
    try{
      await bhMigrateLegacy();
      _bhMeta=(await bhIdbAllMeta()).sort((a,b)=>a.at<b.at?1:-1);
      _bhReady=true;
    }catch(e){
      // Falhar FECHADO: sem histórico legível, bhCapture não grava (não vai
      // inventar um histórico novo por cima) e o gcIdb aborta a varredura.
      _bhReady=false;
      console.warn('[BoardHub] histórico de backup indisponível:',e);
    }
    return _bhReady;
  })();
  return _bhInitP;
};
// v23.6 P1-3: o autosave chamava bhHistoryLoad() a CADA gravação só para ler
// list[0].at e decidir se já passaram 30 min desde o último snapshot. Com acervo
// grande isso é um JSON.parse de vários MB a cada 2,5 s — medido em ~24 ms para
// 12 snapshots de um estado de 1 MB, contra ~4 ms do lsSave que o plano
// apontava como o gargalo. O timestamp agora vive numa chave própria de ~30
// bytes; o histórico inteiro só é lido por quem precisa dele de verdade
// (bhCapture, gcIdb, a tela de Sync e o backup diário, todos fora do caminho
// quente). Se a chave sumir, cai para o histórico UMA vez por sessão.
const BH_LAST_AT_KEY='boardhub_backup_last_at';
let _bhLastAt=null;
const bhLastAt=()=>{
  if(_bhLastAt!==null)return _bhLastAt;
  try{const v=localStorage.getItem(BH_LAST_AT_KEY);if(v){_bhLastAt=v;return v;}}catch{}
  _bhLastAt=(_bhMeta[0]&&_bhMeta[0].at)||'';
  try{if(_bhLastAt)localStorage.setItem(BH_LAST_AT_KEY,_bhLastAt);}catch{}
  return _bhLastAt;
};
const bhMarkCaptured=at=>{_bhLastAt=at;try{localStorage.setItem(BH_LAST_AT_KEY,at);}catch{}};
const bhRetention=list=>{
  // Two tiers, one merged list (newest-first):
  //  • WEEKLY tier (reason 'daily'): one slot per weekday, captured on first open
  //    of the day; the newest entry per weekday wins, max 7. Immune to the
  //    rotating tier's thinning — guarantees 7 days of coverage no matter how
  //    fast auto/pre-sync snapshots churn.
  //  • ROTATING tier (everything else): BH_KEEP_RECENT most recent kept
  //    unconditionally, older thinned to one per calendar day, cap BH_MAX_TOTAL.
  const dailies=[];const others=[];
  list.forEach(e=>(e.reason==='daily'?dailies:others).push(e));
  const byWeekday=new Map(); // 0=dom..6=sáb → newest entry
  dailies.forEach(e=>{
    const wd=new Date(e.at).getDay();
    const cur=byWeekday.get(wd);
    if(!cur||e.at>cur.at)byWeekday.set(wd,e);
  });
  const keptDailies=[...byWeekday.values()];
  const keptOthers=[];const seenDays=new Set();
  others.forEach((e,i)=>{
    if(i<BH_KEEP_RECENT){keptOthers.push(e);seenDays.add(e.at.slice(0,10));return;}
    const day=e.at.slice(0,10);
    if(!seenDays.has(day)){keptOthers.push(e);seenDays.add(day);}
  });
  return [...keptDailies,...keptOthers.slice(0,BH_MAX_TOTAL)].sort((a,b)=>a.at<b.at?1:-1);
};
// F1: assíncrona por fora, mesma FORMA por dentro. Nenhum dos 7 call sites usa o
// retorno — todos são fire-and-forget dentro de try/catch —, então devolver uma
// Promise não muda o comportamento deles. A promessa nunca rejeita.
//
// As capturas são SERIALIZADAS numa fila: duas capturas concorrentes decidiriam
// a retenção sobre o mesmo _bhMeta e a segunda ressuscitaria o que a primeira
// acabou de despejar.
let _bhChain=Promise.resolve();
const bhCapture=(state,reason)=>{
  const run=async()=>{
    try{
      if(!bhStateHasData(state))return false; // never snapshot emptiness
      // Nunca capturar antes de saber o que já existe: com _bhMeta ainda vazio,
      // a retenção rodaria contra uma lista vazia e o primeiro autosave após o
      // boot despejaria o histórico inteiro.
      if(!_bhReady)await bhHistoryInit();
      if(!_bhReady)return false;
      const sig=bhSig(state);
      const list=_bhMeta;
      if(reason==='daily'){
        // Weekly-slot dedup: compare against the slot this capture would replace
        // (same weekday). Comparing against list[0] would wrongly skip today's
        // slot whenever nothing changed since the last auto snapshot.
        const wd=new Date().getDay();
        const sameSlot=list.find(e=>e.reason==='daily'&&new Date(e.at).getDay()===wd);
        if(sameSlot&&sameSlot.sig===sig&&sameSlot.at.slice(0,10)===localDateISO())return false;
      }else{
        if(list[0]&&list[0].sig===sig)return false; // identical to latest — skip
      }
      // `at` é a chave primária do store. Duas capturas no mesmo milissegundo
      // sobrescreveriam uma à outra em silêncio; empurra 1ms até ser única.
      let at=new Date().toISOString();
      while(list.some(e=>e.at===at))at=new Date(new Date(at).getTime()+1).toISOString();
      const counts=bhCounts(state);
      const entry={at,reason,sig,counts,state};
      const kept=bhRetention([{at,reason,sig,counts},...list]);
      const keptAts=new Set(kept.map(e=>e.at));
      if(!keptAts.has(at))return false; // a retenção descartou o próprio recém-nascido
      const dels=list.filter(e=>!keptAts.has(e.at)).map(e=>e.at);
      try{await bhIdbWrite([entry],dels);}
      catch(e){
        // Cota do IDB é ~2,8GB nesta origem, mas ela é derivada do disco livre e
        // pode acabar. Último recurso: a mesma entrada sem os data:image
        // embutidos — que preserva idb://, senão o backup perderia justamente as
        // referências que o gcIdb usa (v23.3).
        try{
          const lean={...entry,state:(typeof stripInlineImages==='function'?stripInlineImages(state):state)};
          await bhIdbWrite([lean],dels);
        }catch{return false;}
      }
      _bhMeta=kept;
      bhMarkCaptured(at);
      return true;
    }catch{return false;}
  };
  const p=_bhChain.then(run,run);
  _bhChain=p.then(()=>{},()=>{});
  return p;
};
// One-time migration: fold the old two-slot backups into the history, oldest first,
// so nothing that exists today is lost by the upgrade.
//

// Icon: renders lucide icons as pure React SVGs with one-time caching per icon name.
// Two strategies: (1) read directly from lucide.icons registry (fast, no DOM)
// (2) fallback: temporarily inject into document, let createIcons process, extract SVG.
const _svgCache={};
const _resolveIcon=(name)=>{
  if(_svgCache[name])return;
  // Strategy 1: lucide.icons registry — each entry is [tag, defaultAttrs, children]
  try{
    const pascal=name.replace(/(^|-)([a-z0-9])/g,(_,__,c)=>c.toUpperCase());
    const def=(lucide.icons||{})[pascal];
    if(def&&Array.isArray(def)&&def.length>=3&&Array.isArray(def[2])){
      _svgCache[name]=def[2].map(([tag,attrs])=>{
        const a=Object.entries(attrs||{}).map(([k,v])=>k+'="'+v+'"').join(' ');
        return '<'+tag+' '+a+'/>';
      }).join('');
      return;
    }
  }catch(e){}
  // Strategy 2: DOM fallback — append to body so createIcons can find it
  try{
    const tmp=document.createElement('div');
    tmp.style.cssText='position:fixed;left:-9999px;top:-9999px;pointer-events:none;opacity:0';
    tmp.innerHTML='<i data-lucide="'+name+'"></i>';
    document.body.appendChild(tmp);
    lucide.createIcons({nodes:[tmp]});
    const svg=tmp.querySelector('svg');
    if(svg)_svgCache[name]=svg.innerHTML;
    tmp.remove();
  }catch(e){}
};
const Icon=({name,size=16,style={}})=>{
  _resolveIcon(name);
  return React.createElement('svg',{xmlns:'http://www.w3.org/2000/svg',width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',style:{display:'inline-block',flexShrink:0,...style},dangerouslySetInnerHTML:{__html:_svgCache[name]||''}});
};
