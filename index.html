  };

  const appState={projects,clients,mentors,notes,tasks,socialPosts,galleryPosts,galleryFolders,pomoData,noteGroups,identity};

  // When importing data: store any base64 images in IDB, replace with idb:// refs
  const ingestImages=async obj=>{
    if(Array.isArray(obj))return Promise.all(obj.map(ingestImages));
    if(obj&&typeof obj==='object'){const out={};for(const k of Object.keys(obj))out[k]=await ingestImages(obj[k]);return out;}
    if(typeof obj==='string'&&obj.startsWith('data:image')){
      try{
        // Use atob pipeline — fetch() on data URLs is unreliable on mobile Safari/Android
        const [header,b64]=obj.split(',');
        const mime=(header.match(/:(.*?);/)||[])[1]||'image/jpeg';
        const bin=atob(b64);
        const arr=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
        const blob=new Blob([arr],{type:mime});
        const key='img_'+Date.now()+'_'+Math.random().toString(36).slice(2);await idbPut(key,blob);return 'idb://'+key;
      }catch(e){bhLog('migrate.dataUrlToIdb',e,'an inline data:image was not moved into the blob store and stays embedded in the state');}
    }
    return obj;
  };

  const handleImport=async data=>{
    // Shape validation. v22 checked truthiness only — an object where an array
    // was expected passed the check and crashed every .filter() downstream.
    // Mirrors the isArr guards the remote listener already applied.
    if(!data||typeof data!=='object'||Array.isArray(data))return false;
    const ingested=await ingestImages(data);
    const A=Array.isArray;
    let applied=0;
    if(A(ingested.projects)){setProjects(ingested.projects);applied++;}
    if(A(ingested.clients)){setClients(ingested.clients);applied++;}
    if(A(ingested.mentors)){setMentors(ingested.mentors);applied++;}
    if(A(ingested.notes)){setNotes(ingested.notes);applied++;}
    if(A(ingested.tasks)){setTasks(ingested.tasks);applied++;}
    if(A(ingested.socialPosts)){setSocialPosts(ingested.socialPosts);applied++;}
    if(A(ingested.galleryPosts)){setGalleryPosts(ingested.galleryPosts);applied++;}
    if(A(ingested.galleryFolders)){setGalleryFolders(ingested.galleryFolders);applied++;}
    if(A(ingested.noteGroups)){setNoteGroups(ingested.noteGroups);applied++;}
    if(ingested.pomoData&&typeof ingested.pomoData==='object'&&!A(ingested.pomoData)&&ingested.pomoData.days){setPomoData(ingested.pomoData);applied++;}
    if(ingested.identity&&typeof ingested.identity.hubName==='string'){saveIdentity(ingested.identity);setIdentity(ingested.identity);applied++;}
    return applied>0;
  };

  // Update page title when identity changes
  useEffect(()=>{
    if(identity){document.title=`${identity.hubName} — ${identity.osName}`;}
  },[identity]);

  const handleSetupDone=useCallback(id=>{setIdentity(id);},[]);

  return(
    <div style={{display:'flex',flexDirection:isMobile?'column':'row',minHeight:'100vh',overflowX:'hidden'}}>
      {/* The initial setup only appears AFTER signing in with Google. Opening the
          local file asks for nothing any more: with no identity the sidebar
          already falls back to the same defaults the modal would produce
          (splitHubName and osName have 'BoardHub'/'Storyboard OS' embedded), so
          skipping the screen leaves nothing undefined on screen.
          The !== 'syncing' avoids a flash of the full screen for someone who
          already has an identity in the cloud: on login the Firestore listener
          is still going to apply data.identity, and without that wait the modal
          would appear and vanish on its own at every sign-in.
          A genuinely new account arrives at 'synced' with no identity, and only
          then sees the setup. */}
      {!identity&&fbUser&&syncStatus!=='syncing'&&<SetupModal onDone={handleSetupDone}/>}
      {showCmdPalette&&<CommandPalette projects={projects} notes={notes} mentors={mentors} clients={clients} galleryPosts={galleryPosts} onNavigate={v=>{navigate(v);setShowCmdPalette(false);}} onSelectProject={p=>{handleSelectProject(p);setShowCmdPalette(false);}} onClose={()=>setShowCmdPalette(false)}/>}
      {showQuickCapture&&<QuickCapture type={quickCaptureType} onClose={()=>setShowQuickCapture(false)} onAddTask={t=>setTasks(prev=>[...prev,t])} onAddNote={n=>setNotes(prev=>[n,...prev])}/>}
      {showShortcuts&&<ShortcutsModal onClose={()=>setShowShortcuts(false)}/>}
      {showNewProject&&<NewProjectModal onSave={addProject} onClose={handleCloseNewProject} isMobile={isMobile}/>}
      {isMobile
        ?<SidebarMobile activeView={view} setView={navigate} saveFlash={saveFlash} setForceMobile={setForceMobile} hubName={identity?.hubName} onOpenCmd={()=>setShowCmdPalette(true)} theme={theme} onToggleTheme={toggleTheme}/>
        :<SidebarDesktop activeView={view} setView={navigate} saveFlash={saveFlash} isMobile={isMobile} setForceMobile={setForceMobile} hubName={identity?.hubName} osName={identity?.osName} projects={projects} tasks={tasks} onOpenCmd={()=>setShowCmdPalette(true)} onSelectProject={handleSelectProject} theme={theme} onToggleTheme={toggleTheme}/>
      }
      <main key={view} className={(isMobile?'main-mobile':'')+' view-enter'} style={isMobile?{flex:1,padding:'16px 16px 80px',overflowY:'auto',minHeight:'calc(100vh - 56px)',paddingTop:0}:{marginLeft:220,flex:1,padding:'clamp(16px, 2.5vh, 40px) clamp(20px, 3vw, 48px)',overflowY:view==='dashboard'?'hidden':'auto',height:'100vh',boxSizing:'border-box',display:'flex',flexDirection:'column'}}>
        {view==='dashboard'      &&<Dashboard projects={projects} notes={notes} mentors={mentors} tasks={tasks} setTasks={setTasks} setView={navigate} setNotes={setNotes} pomoData={pomoData} setPomoData={setPomoData} isMobile={isMobile} setSelectedProject={setSelectedProject}/>}
        {view==='projects'       &&<ProjectsList projects={projects} setProjects={setProjects} onSelect={handleSelectProject} onAdd={handleAddProject} isMobile={isMobile}/>}
        {view==='project-detail' &&selectedProject&&<ProjectDetail project={selectedProject} onBack={handleBackToProjects} onUpdate={handleUpdateProject} onSoftDelete={handleSoftDeleteSelected} globalMentors={mentors} onAddGlobalMentor={handleAddGlobalMentor} galleryPosts={galleryPosts} galleryFolders={galleryFolders} isMobile={isMobile}/>}
        {view==='gallery'        &&<Gallery posts={galleryPosts} setPosts={setGalleryPosts} folders={galleryFolders} setFolders={setGalleryFolders} navTick={navTick} isMobile={isMobile}/>}
        {view==='ideas'          &&<IdeasLab notes={notes} setNotes={setNotes} isMobile={isMobile}/>}
        {view==='mentors'        &&<MentorsHub mentors={mentors} setMentors={setMentors} isMobile={isMobile}/>}
        {view==='social'         &&<Social posts={socialPosts} setPosts={setSocialPosts} isMobile={isMobile}/>}
        {view==='clients'        &&<Clients clients={clients} setClients={setClients} isMobile={isMobile}/>}
        {view==='sync'           &&<SyncHub appState={appState} onImport={handleImport} onClearSave={clearSave} fbUser={fbUser} syncStatus={syncStatus} syncDetail={syncDetail} syncNotice={syncNotice} onDismissNotice={()=>setSyncNotice('')} onManualPush={manualPush} onDiscardLocal={discardLocalAndPull} isMobile={isMobile} onResetIdentity={handleResetIdentity}/>}
      </main>
    </div>
  );
};
// Mount immediately — first paint is not blocked by any image I/O. Images resolve
// on demand: grids/covers are viewport-gated (<Img>/<BgImg>), opening a card warms
// a bounded prefix of thumbnails, and full-res is fetched only in the lightbox.
// F3.2: the ConfirmHost sits OUTSIDE the App, as its sibling. Inside, any
// re-render or subtree unmount would take an open dialog down with it — and a
// pending promise resolved as a cancellation in the middle of a user action.
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/><ConfirmHost/></ErrorBoundary>);
// Pre-warm THUMBNAILS (not originals) during idle, once the first view has
// settled — so navigating to a post finds its images already in memory.
setTimeout(()=>_idleCb(warmThumbCache),1200);
</script>
<!-- ── BOOT LOADER (P1-1) ─────────────────────────────────────────────────
  DIAGNOSIS: the single-file design forced @babel/standalone (~400KB of download)
  to transpile 382KB of JSX on EVERY opening of the app. It was by far the biggest
  startup cost — bigger than everything optimised in the image layer. And it is
  100% repeated work: the same input text produces the same output JS.
  STRATEGY: fast hash of the source → look for the already-compiled bundle in
  IndexedDB.
    • hit  → run the cache. Babel is not even downloaded.
    • miss → inject Babel, transpile, run and store it for next time.
  The key includes the hash OF THE SOURCE, so editing the file invalidates it by
  itself — there is no "old cache of a new file" state.
  HONEST COST: the first load (and the first after each edit) is slightly SLOWER,
  because the Babel download only starts after the IDB lookup fails, instead of
  happening in parallel with React. Every other load saves ~400KB of network and
  the whole transpile.
-->
<script>
(function(){
  var BABEL_URL='https://unpkg.com/@babel/standalone@7.23.9/babel.min.js';
  var DB='boardhub_bundle', STORE='bundles', CACHE_V=1;
  var RECOVER='bh_bundle_recover';
  var el=document.getElementById('bh-jsx-source');
  var src=el?el.textContent:'';

  // FNV-1a 32-bit. A collision would require two sources OF THE SAME LENGTH with
  // the same hash — which is why the length goes into the key. Getting the
  // invalidation wrong here means running old code, so the pair is worth the
  // extra byte.
  function hash(str){
    var h=0x811c9dc5;
    for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*0x01000193)>>>0;}
    return h.toString(16)+'-'+str.length;
  }
  var KEY='bundle_v'+CACHE_V+'_'+hash(src);

  function openDb(){return new Promise(function(res,rej){
    if(!window.indexedDB)return rej(new Error('sem IndexedDB'));
    var r=indexedDB.open(DB,1);
    r.onupgradeneeded=function(e){try{e.target.result.createObjectStore(STORE);}catch(_){/*silent-ok: the store already exists; bhLog does not exist this early anyway*/}};
    r.onsuccess=function(e){res(e.target.result);};
    r.onerror=function(e){rej(e.target.error||new Error('open falhou'));};
  });}
  function get(db,k){return new Promise(function(res){
    try{var r=db.transaction(STORE,'readonly').objectStore(STORE).get(k);
      r.onsuccess=function(e){res(e.target.result);};r.onerror=function(){res(null);};
    }catch(_){res(null);}
  });}
  function put(db,k,v){return new Promise(function(res){
    try{var tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);
      tx.oncomplete=function(){res(true);};tx.onerror=function(){res(false);};tx.onabort=function(){res(false);};
    }catch(_){res(false);}
  });}
  // Only the current bundle stays: without this, every edit of the file would
  // leave another ~500KB bundle behind.
  function prune(db,keep){try{
    var os=db.transaction(STORE,'readwrite').objectStore(STORE), r=os.getAllKeys();
    r.onsuccess=function(e){(e.target.result||[]).forEach(function(k){if(k!==keep){try{os.delete(k);}catch(_){/*silent-ok: pruning a stale bundle is housekeeping; a leftover key is overwritten by hash next boot*/}}});};
  }catch(_){/*silent-ok: the prune is best-effort; failing it leaves a stale bundle that the source hash already ignores*/}}
  function wipe(){return new Promise(function(res){
    try{var r=indexedDB.deleteDatabase(DB);r.onsuccess=r.onerror=r.onblocked=function(){res(true);};}
    catch(_){res(false);}
  });}

  function loadBabel(){return new Promise(function(res,rej){
    if(window.Babel)return res();
    var t=document.createElement('script');
    t.src=BABEL_URL;
    t.onload=function(){window.Babel?res():rej(new Error('Babel carregou vazio'));};
    t.onerror=function(){rej(new Error('could not download Babel'));};
    document.head.appendChild(t);
  });}

  // new Function isolates the parse from the execution: a corrupted bundle throws
  // HERE, before any side effect, and the fallback to Babel stays clean.
  function compileOnly(code){return new Function(code);}

  function viaBabel(db){
    return loadBabel().then(function(){
      // runtime:'classic' EXPLICITLY. In @babel/standalone 7.23.9 the react
      // preset's default is already classic, but that default became 'automatic'
      // in Babel 8 — and automatic emits require("react/jsx-runtime"), which does
      // not exist on a page that loads React as a UMD global. The app would break
      // entirely, silently, the day the standalone URL went up a major. Pinning it
      // here costs nothing and removes the dependency on a default that has
      // already changed once.
      var out=window.Babel.transform(src,{presets:[['react',{runtime:'classic'}]],sourceType:'script'});
      var code=out.code;
      compileOnly(code)();
      window.__bhBundleCache.source='babel';
      if(db)put(db,KEY,{v:CACHE_V,code:code,at:Date.now()}).then(function(ok){if(ok)prune(db,KEY);});
    });
  }

  window.__bhBundleCache={
    key:KEY,
    source:'pendente',
    clear:function(){return wipe();}
  };

  var db=null;
  openDb().then(function(d){db=d;return get(d,KEY);},function(){return null;})
  .then(function(rec){
    var code=rec&&rec.v===CACHE_V&&typeof rec.code==='string'&&rec.code.length>1000?rec.code:null;
    if(!code)return viaBabel(db);
    var fn;
    try{fn=compileOnly(code);}
    catch(e){
      // Invalid syntax: nothing was executed. Discard it and carry on via Babel.
      console.warn('[BoardHub] invalid bundle cache, recompiling:',e.message);
      if(db)put(db,KEY,null);
      return viaBabel(db);
    }
    try{fn();window.__bhBundleCache.source='cache';}
    catch(e){
      // It parsed but threw partway through execution: the app may be half
      // initialised, so we CANNOT simply run Babel over the top. Clear the cache
      // and reload exactly once (guarded in sessionStorage).
      var once=false;try{once=sessionStorage.getItem(RECOVER)==='1';}catch(_){/*silent-ok: defaults to "not yet retried", so the one recovery reload still gets its chance*/}
      if(!once){
        // If this write fails the loop guard is gone, so a bundle that keeps
        // failing could reload forever. Accepted deliberately: without
        // sessionStorage there is no way to remember across a reload, and the
        // alternative — never retrying — turns a recoverable bad cache into a
        // permanently dead app. bhLog does not exist this early to report it.
        try{sessionStorage.setItem(RECOVER,'1');}catch(_){/*silent-ok: see the note above — the loop guard is best-effort by necessity*/}
        return wipe().then(function(){location.reload();});
      }
      throw e; // second failure: let the splash error handler show it
    }
    try{sessionStorage.removeItem(RECOVER);}catch(_){/*silent-ok: clearing the guard after a healthy boot; a leftover flag only costs the NEXT failure its retry*/}
  })
  .catch(function(e){
    console.error('[BoardHub] boot falhou:',e);
    window.dispatchEvent(new ErrorEvent('error',{message:'Falha ao inicializar: '+(e&&e.message||e)}));
  });
})();
</script>
</body>
</html>
