const Gallery = () => {
  const { galleryPosts, setGalleryPosts, galleryFolders, setGalleryFolders } = useContext(AppContext);
  const [activeFolder, setActiveFolder] = useState(galleryFolders[0]?.id);
  const [selected, setSelected] = useState(null); const [lightbox, setLightbox] = useState(null);
  const [trash, setTrash] = useState(false); const [uploading, setUploading] = useState(false);
  const [editingFolderId, setEditingFolderId] = useState(null); const [editingLabel, setEditingLabel] = useState('');
  const addImgRef = useRef(null);
  const liveFolders = galleryFolders.filter(f=>!f.deleted&&!f.archived);
  const archivedFolders = galleryFolders.filter(f=>f.archived);
  const trashedFolders = galleryFolders.filter(f=>f.deleted);
  const [folderTrash, setFolderTrash] = useState(false); const [folderArchive, setFolderArchive] = useState(false);
  const active = useMemo(()=>galleryPosts.filter(p=>trash?p.deleted:(!p.deleted&&p.folder===activeFolder)),[galleryPosts,trash,activeFolder]);
  const grouped = useMemo(()=>{const s=[...active].sort((a,b)=>((b.date||'').slice(0,10)).localeCompare((a.date||'').slice(0,10)));return s.reduce((acc,p)=>{const k=new Date((p.date||'').slice(0,10)+'T12:00:00').toLocaleString('pt-BR',{month:'long',year:'numeric'});if(!acc[k])acc[k]=[];acc[k].push(p);return acc;},{});},[active]);
  const upd = (f,v) => { const u={...selected,[f]:v}; setSelected(u); setGalleryPosts(p=>p.map(x=>x.id===u.id?u:x)); };
  const handleAddImages = async e => { const files=Array.from(e.target.files);setUploading(true);const urls=await uploadImages(files,(d,t)=>setUploading({done:d,total:t}));setUploading(false);upd('images',[...(selected.images||[]),...urls]);e.target.value=''; };
  const removeImg = i => { const imgs=[...selected.images];imgs.splice(i,1);upd('images',imgs); };
  const softDel = id => setGalleryPosts(p=>p.map(x=>x.id===id?{...x,deleted:true,deletedAt:new Date().toISOString()}:x));
  const restore = id => setGalleryPosts(p=>p.map(x=>x.id===id?{...x,deleted:false,deletedAt:null}:x));
  const hardDel = id => { if(confirm('Excluir permanentemente?'))setGalleryPosts(p=>p.filter(x=>x.id!==id)); };
  const addFolder = () => { const n={id:'folder-'+Date.now(),label:'Nova Pasta',deleted:false};setGalleryFolders(p=>[...p,n]);setActiveFolder(n.id);setEditingFolderId(n.id);setEditingLabel(n.label); };
  const renameFolder = (id,label) => { if(label.trim()) setGalleryFolders(p=>p.map(f=>f.id===id?{...f,label:label.trim()}:f)); };
  const trashFolder = id => { setGalleryFolders(p=>p.map(f=>f.id===id?{...f,deleted:true,deletedAt:new Date().toISOString()}:f)); if(activeFolder===id) setActiveFolder(liveFolders.find(f=>f.id!==id)?.id||''); };
  const restoreFolder = id => setGalleryFolders(p=>p.map(f=>f.id===id?{...f,deleted:false,deletedAt:null}:f));
  const hardDeleteFolder = id => { if(confirm('Excluir pasta permanentemente?')) setGalleryFolders(p=>p.filter(f=>f.id!==id)); };
  const archiveFolder = id => { setGalleryFolders(p=>p.map(f=>f.id===id?{...f,archived:true}:f)); if(activeFolder===id) setActiveFolder(liveFolders.find(f=>f.id!==id)?.id||''); };
  const unarchiveFolder = id => setGalleryFolders(p=>p.map(f=>f.id===id?{...f,archived:false}:f));
  const reorderFolders = (from,to) => { if(from===to)return; setGalleryFolders(prev=>{const live=prev.filter(f=>!f.deleted&&!f.archived);const rest=prev.filter(f=>f.deleted||f.archived);const next=[...live];const[m]=next.splice(from,1);next.splice(to,0,m);return[...next,...rest];}); };
  const folderDragRef = useRef(null);
  const handleUpload = async e => { const files=Array.from(e.target.files);setUploading(true);const urls=await uploadImages(files);setUploading(false);const newPosts=urls.map(url=>({id:Date.now()+Math.random(),folder:activeFolder,title:'Novo Estudo',date:localDateISO(),content:'',images:[url],deleted:false}));setGalleryPosts(p=>[...newPosts,...p]);e.target.value=''; };
  if(lightbox) return <div className="lightbox" onClick={()=>setLightbox(null)}><Img src={lightbox} full style={{maxWidth:'90vw',maxHeight:'90vh',objectFit:'contain'}}/><button onClick={()=>setLightbox(null)} style={{position:'fixed',top:20,right:20,background:'rgba(255,255,255,.12)',border:'none',borderRadius:'50%',width:40,height:40,color:'white',cursor:'pointer'}}>✕</button></div>;
  if(selected&&!trash) return <div className="fade-up"><input ref={addImgRef} type="file" accept="image/*,video/*,.gif" multiple hidden onChange={handleAddImages}/><div style={{display:'flex',justifyContent:'space-between',marginBottom:24}}><button className="btn btn-outline" onClick={()=>setSelected(null)}>← Voltar</button><button className="btn btn-danger" onClick={()=>{softDel(selected.id);setSelected(null);}}>🗑️ Lixeira</button></div><div className="card" style={{padding:24}}><input value={selected.title} onChange={e=>upd('title',e.target.value)} style={{fontFamily:'var(--font-heading)',fontSize:'1.8rem',background:'transparent',border:'none',borderBottom:'1px solid var(--glass-border)',width:'100%',marginBottom:16}}/><div style={{display:'flex',gap:8,marginBottom:20}}><span className="label">Pasta</span>{liveFolders.map(f=><button key={f.id} onClick={()=>upd('folder',f.id)} style={{padding:'3px 12px',borderRadius:20,border:`1px solid ${selected.folder===f.id?'var(--accent)':'var(--glass-border)'}`,background:selected.folder===f.id?'var(--accent)':'transparent',color:selected.folder===f.id?'white':'var(--text-secondary)'}}>{f.label}</button>)}</div><textarea value={selected.content} onChange={e=>upd('content',e.target.value)} placeholder="Análise..." style={{width:'100%',border:'1px solid var(--glass-border)',borderRadius:10,padding:16,minHeight:120,resize:'vertical',marginBottom:24}}/><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}>{selected.images.map((img,i,list)=><div key={imgKey(img,i,list)} style={{position:'relative',borderRadius:10,overflow:'hidden',aspectRatio:'16/9',background:'var(--bg)'}}>{isVideoSrc(img)?<Vid src={img} controls/>:<Img src={img} onClick={()=>setLightbox(img)} style={{cursor:'zoom-in',width:'100%',height:'100%',objectFit:'cover'}}/>}<button onClick={e=>{e.stopPropagation();removeImg(i);}} style={{position:'absolute',top:6,right:6,background:'rgba(0,0,0,.6)',border:'none',borderRadius:'50%',width:24,height:24,color:'white'}}>✕</button></div>)}<div className="upload-zone" style={{aspectRatio:'16/9',border:'2px dashed var(--glass-border)',borderRadius:10,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',cursor:'pointer'}} onClick={()=>addImgRef.current.click()}>+</div></div></div></div>;
  return <div className="fade-up" style={{display:'flex',flexDirection:'column',height:'calc(100vh - 80px)'}}>
    <div style={{display:'flex',justifyContent:'space-between',marginBottom:14}}><h2 style={{fontFamily:'var(--font-heading)'}}>Galeria</h2><div style={{display:'flex',gap:8}}><button onClick={()=>setTrash(!trash)} className={`btn ${trash?'btn-danger':'btn-outline'}`}>🗑️ {trash?'Sair':'Lixeira'}</button>{!trash&&<><button className="btn btn-dark" onClick={()=>{const n={id:Date.now(),folder:activeFolder,title:"Novo Estudo",date:localDateISO(),content:"",images:[],deleted:false};setGalleryPosts(p=>[n,...p]);setSelected(n);}}>+ Criar</button><label className="btn btn-outline" style={{cursor:'pointer'}}>⬆️ Upload<input type="file" accept="image/*,video/*,.gif" multiple hidden onChange={handleUpload}/></label></>}</div></div>
    {!trash&&<div style={{display:'flex',alignItems:'center',borderBottom:'1px solid var(--glass-border)',marginBottom:14,gap:4,overflowX:'auto'}}>
      {liveFolders.map((f,idx)=><div key={f.id} className="drag-item" draggable onDragStart={e=>{folderDragRef.current=idx;e.dataTransfer.effectAllowed='move';}} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();reorderFolders(folderDragRef.current,idx);}} style={{display:'flex',alignItems:'center'}}>
        {editingFolderId===f.id?<><input autoFocus value={editingLabel} onChange={e=>setEditingLabel(e.target.value)} onBlur={()=>{renameFolder(f.id,editingLabel);setEditingFolderId(null);}} onKeyDown={e=>{if(e.key==='Enter'){renameFolder(f.id,editingLabel);setEditingFolderId(null);}}} style={{background:'transparent',border:'none',outline:'none',fontSize:'.85rem',fontWeight:activeFolder===f.id?600:500,color:'var(--text)',width:Math.max(60,editingLabel.length*9)+'px',padding:'10px 0'}}/><button onMouseDown={e=>{e.preventDefault();archiveFolder(f.id);setEditingFolderId(null);}}>📦</button><button onMouseDown={e=>{e.preventDefault();trashFolder(f.id);setEditingFolderId(null);}}>🗑️</button></>:<button className="tab-btn" onClick={()=>setActiveFolder(f.id)} onDoubleClick={()=>{setEditingFolderId(f.id);setEditingLabel(f.label);}} style={{color:activeFolder===f.id?'var(--accent)':'var(--text-secondary)',borderBottom:'none',margin:0,padding:'10px 6px'}}>{f.label}</button>}
      </div>)}
      <button onClick={addFolder} className="tab-btn" style={{color:'var(--text-secondary)',opacity:.6}}>+</button>
      {archivedFolders.length>0&&<button onClick={()=>setFolderArchive(!folderArchive)} className="tab-btn" style={{color:folderArchive?'var(--accent)':'var(--text-secondary)',marginLeft:'auto'}}>📦 {archivedFolders.length}</button>}
      {trashedFolders.length>0&&<button onClick={()=>setFolderTrash(!folderTrash)} className="tab-btn" style={{color:folderTrash?'var(--accent)':'var(--text-secondary)'}}>🗑️ {trashedFolders.length}</button>}
    </div>}
    {folderTrash&&<div style={{background:'var(--bg)',borderRadius:10,padding:'12px 16px',marginBottom:16}}><span className="label">Pastas na lixeira</span>{trashedFolders.map(f=><div key={f.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0'}}><span>{f.label}</span><div><button className="btn btn-ghost" onClick={()=>restoreFolder(f.id)}>Restaurar</button><button className="btn btn-ghost text-link-danger" onClick={()=>hardDeleteFolder(f.id)}>Excluir</button></div></div>)}</div>}
    {folderArchive&&<div style={{background:'var(--bg)',borderRadius:10,padding:'12px 16px',marginBottom:16}}><span className="label">Pastas arquivadas</span>{archivedFolders.map(f=><div key={f.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0'}}><span>{f.label}</span><button className="btn btn-ghost" onClick={()=>unarchiveFolder(f.id)}>Desarquivar</button></div>)}</div>}
    {Object.keys(grouped).length===0?<div style={{textAlign:'center',padding:40,color:'var(--text-secondary)'}}>Pasta vazia.</div>:Object.entries(grouped).map(([month,posts])=><div key={month} style={{marginBottom:24}}><div className="label" style={{marginBottom:10}}>{month}</div><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(220px,1fr))',gap:14}}>{posts.map(post=><div key={post.id} className="card" style={{overflow:'hidden',cursor:'pointer'}} onClick={()=>!trash&&setSelected(post)}><div style={{aspectRatio:'16/9',background:'var(--bg)'}}>{post.images[0]&&<Img src={post.images[0]} style={{width:'100%',height:'100%',objectFit:'cover'}}/>}</div><div style={{padding:'12px 14px'}}><div style={{fontWeight:600}}>{post.title}</div></div></div>)}</div></div>)}
  </div>;
};

const RichEditor = ({ noteId, initialHTML, onSave }) => {
  const ref = useRef(null); const saveTimer = useRef(null); const lastId = useRef(null); const imgInputRef = useRef(null);
  useEffect(()=>{if(!ref.current)return;if(lastId.current!==noteId){ref.current.innerHTML=sanitizeHTML(initialHTML||'');lastId.current=noteId;}});
  const emit = useCallback(()=>{clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>{if(ref.current)onSave(sanitizeHTML(ref.current.innerHTML));},800);},[onSave]);
  const flushSave = useCallback(()=>{clearTimeout(saveTimer.current);if(ref.current)onSave(sanitizeHTML(ref.current.innerHTML));},[onSave]);
  const exec = (cmd,val) => { ref.current?.focus(); document.execCommand(cmd,false,val||null); emit(); };
  const insertImageFile = useCallback(async file => { const c=await _compressImage(file); const url=await uploadImage(c); ref.current?.focus(); document.execCommand('insertHTML',false,`<img src="${url}" style="max-width:100%;border-radius:8px;margin:10px 0;display:block;"/>`); emit(); },[emit]);
  const handlePaste = e => { const items=e.clipboardData?.items||[]; const img=[...items].find(i=>i.type.startsWith('image/')); if(img){e.preventDefault();insertImageFile(img.getAsFile());} };
  return <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0}}><div style={{display:'flex',gap:4,padding:'4px 0 8px',borderBottom:'1px solid var(--glass-border)',marginBottom:12,flexWrap:'wrap'}}>{[{cmd:'bold',icon:'B'},{cmd:'italic',icon:'I'},{cmd:'underline',icon:'U'}].map(b=><button key={b.cmd} className="rich-toolbar-btn" onMouseDown={e=>{e.preventDefault();exec(b.cmd);}} style={{fontWeight:b.cmd==='bold'?700:400,fontStyle:b.cmd==='italic'?'italic':'normal'}}>{b.icon}</button>)}<span style={{width:1,background:'var(--glass-border)',margin:'0 4px'}}/><button className="rich-toolbar-btn" onMouseDown={e=>{e.preventDefault();exec('insertUnorderedList');}}>•</button><button className="rich-toolbar-btn" onMouseDown={e=>{e.preventDefault();exec('insertOrderedList');}}>1.</button><span style={{width:1,background:'var(--glass-border)',margin:'0 4px'}}/><button className="rich-toolbar-btn" onMouseDown={e=>{e.preventDefault();exec('formatBlock','h1');}}>H1</button><button className="rich-toolbar-btn" onMouseDown={e=>{e.preventDefault();exec('formatBlock','h2');}}>H2</button><span style={{width:1,background:'var(--glass-border)',margin:'0 4px'}}/><label className="rich-toolbar-btn" title="Inserir imagem" style={{cursor:'pointer'}}>🖼️<input ref={imgInputRef} type="file" accept="image/*" hidden onChange={async e=>{const f=e.target.files[0];if(!f)return;await insertImageFile(f);e.target.value='';}}/></label></div><div ref={ref} className="rich-editor" contentEditable suppressContentEditableWarning data-placeholder="Comece a escrever..." onInput={emit} onBlur={flushSave} onPaste={handlePaste} style={{flex:1,fontSize:'.95rem',lineHeight:1.9}}/></div>;
};

const IdeasLab = () => {
  const { notes, setNotes } = useContext(AppContext);
  const [sid,setSid]=useState(null); const [showTrash,setShowTrash]=useState(false);
  const [entryId,setEntryId]=useState(null);
  const all = notes.filter(n=>!n.deleted); const trashed = notes.filter(n=>n.deleted);
  const item = notes.find(n=>n.id===sid);
  const isGroup = item?.type==='project';
  const entries = isGroup ? (item.entries||[]) : [];
  const activeEntry = entryId ? entries.find(e=>e.id===entryId)||null : null;
  const newNote = () => { const n={id:Date.now(),type:'note',title:'Nova Anotação',content:'',date:new Date().toLocaleDateString('pt-BR'),deleted:false}; setNotes(p=>[n,...p]); setSid(n.id); setEntryId(null); };
  const newGroup = () => { const p={id:Date.now(),type:'project',title:'Novo Grupo',date:new Date().toLocaleDateString('pt-BR'),deleted:false,entries:[]}; setNotes(p=>[p,...p]); setSid(p.id); setEntryId(null); };
  const trashItem = id => { setNotes(p=>p.map(n=>n.id===id?{...n,deleted:true,deletedAt:new Date().toISOString()}:n)); if(sid===id)setSid(null); };
  const restore = id => setNotes(p=>p.map(n=>n.id===id?{...n,deleted:false,deletedAt:null}:n));
  const hardDel = id => { if(confirm('Excluir?')){setNotes(p=>p.filter(n=>n.id!==id));if(sid===id)setSid(null);} };
  const updItem = (field,val) => setNotes(p=>p.map(n=>n.id===sid?{...n,[field]:val}:n));
  const addEntry = () => { const e={id:Date.now(),title:'Nova Entrada',content:'',date:new Date().toLocaleDateString('pt-BR')}; updItem('entries',[...entries,e]); setEntryId(e.id); };
  const updEntry = (field,val) => updItem('entries',entries.map(e=>e.id===entryId?{...e,[field]:val}:e));
  const deleteEntry = id => { updItem('entries',entries.filter(e=>e.id!==id)); if(entryId===id) setEntryId(null); };

  return <div className="fade-up" style={{display:'flex',gap:16,height:'calc(100vh - 80px)'}}>
    <div style={{width:200,overflowY:'auto',paddingRight:8}}>
      <div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:8}}><button className="btn btn-dark" style={{width:'100%'}} onClick={newNote}>📄 Nova Nota</button><button className="btn btn-dark" style={{width:'100%'}} onClick={newGroup}>📁 Novo Grupo</button></div>
      <button className="btn btn-outline" style={{width:'100%',marginBottom:8}} onClick={()=>setShowTrash(t=>!t)}>🗑️ {showTrash?'Sair':'Lixeira'}{trashed.length>0&&` (${trashed.length})`}</button>
      {(showTrash?trashed:all).map(n=><div key={n.id} onClick={()=>{setSid(n.id);setEntryId(null);}} style={{padding:'10px 12px',cursor:'pointer',borderRadius:8,background:sid===n.id?'var(--accent-glow)':'transparent',marginBottom:4}}><div style={{display:'flex',alignItems:'center',gap:6}}><span>{n.type==='project'?'📁':'📄'}</span><span style={{fontWeight:600}}>{n.title}</span></div></div>)}
    </div>

const SyncHub = () => {
  const appState = useContext(AppContext);
  const [hist,setHist]=useState(()=>bhHistoryLoad()); const impRef=useRef(null);
  const refresh=()=>setHist(bhHistoryLoad());
  const exportData = async () => {
    const resolveRefs = async obj => { if(Array.isArray(obj))return Promise.all(obj.map(resolveRefs)); if(obj&&typeof obj==='object'){const out={};for(const k of Object.keys(obj))out[k]=await resolveRefs(obj[k]);return out;} if(typeof obj==='string'&&obj.startsWith('idb://')){try{const blob=await idbGet(obj.slice(6));if(blob)return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});}catch{}}return obj; };
    const full = await resolveRefs(appState);
    const blob = new Blob([JSON.stringify({...full,_exported:new Date().toISOString()})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`boardhub-backup-${localDateISO()}.json`;a.click();
  };
  const handleImport = e => { const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{try{const data=JSON.parse(ev.target.result);const ingest=async obj=>{if(Array.isArray(obj))return Promise.all(obj.map(ingest));if(obj&&typeof obj==='object'){const out={};for(const k of Object.keys(obj))out[k]=await ingest(obj[k]);return out;}if(typeof obj==='string'&&obj.startsWith('data:image')){try{const[header,b64]=obj.split(',');const mime=(header.match(/:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);const blob=new Blob([arr],{type:mime});const key='img_'+Date.now()+'_'+Math.random().toString(36).slice(2);await idbPut(key,blob);return'idb://'+key;}catch{return'';}}return obj;};const ingested=await ingest(data);if(ingested.projects)appState.setProjects(ingested.projects);if(ingested.clients)appState.setClients(ingested.clients);if(ingested.mentors)appState.setMentors(ingested.mentors);if(ingested.notes)appState.setNotes(ingested.notes);if(ingested.tasks)appState.setTasks(ingested.tasks);if(ingested.socialPosts)appState.setSocialPosts(ingested.socialPosts);if(ingested.galleryPosts)appState.setGalleryPosts(ingested.galleryPosts);if(ingested.galleryFolders)appState.setGalleryFolders(ingested.galleryFolders);if(ingested.noteGroups)appState.setNoteGroups(ingested.noteGroups);if(ingested.pomoData)appState.setPomoData(ingested.pomoData);alert('Importado!');refresh();}catch{alert('Arquivo inválido');}};r.readAsText(f);e.target.value=''; };
  const restore = e => { if(!confirm('Restaurar backup?'))return;const s=e.state;if(s.projects)appState.setProjects(s.projects);if(s.clients)appState.setClients(s.clients);if(s.mentors)appState.setMentors(s.mentors);if(s.notes)appState.setNotes(s.notes);if(s.tasks)appState.setTasks(s.tasks);if(s.socialPosts)appState.setSocialPosts(s.socialPosts);if(s.galleryPosts)appState.setGalleryPosts(s.galleryPosts);if(s.galleryFolders)appState.setGalleryFolders(s.galleryFolders);if(s.noteGroups)appState.setNoteGroups(s.noteGroups);if(s.pomoData)appState.setPomoData(s.pomoData);refresh(); };
  const clearAll = () => { if(!confirm('Resetar TODOS os dados?'))return;appState.setProjects(SEED.projects);appState.setClients(SEED.clients);appState.setMentors(SEED.mentors);appState.setNotes(SEED.notes);appState.setTasks(SEED.tasks);appState.setSocialPosts(SEED.socialPosts);appState.setGalleryPosts(SEED.galleryPosts);appState.setGalleryFolders(SEED.galleryFolders);appState.setNoteGroups(SEED.noteGroups);appState.setPomoData({days:{}}); };
  return <div className="fade-up" style={{maxWidth:640,margin:'0 auto'}}><h2 style={{fontFamily:'var(--font-heading)'}}>Sincronizar</h2><div style={{display:'flex',gap:12,marginTop:16}}><button className="btn btn-outline" onClick={exportData}>📥 Exportar JSON</button><label className="btn btn-outline" style={{cursor:'pointer'}}>📤 Importar JSON<input ref={impRef} type="file" accept=".json" hidden onChange={handleImport}/></label></div>{hist.length>0&&<div className="card" style={{padding:18,marginTop:16}}><span className="label">Histórico ({hist.length})</span><div style={{maxHeight:200,overflowY:'auto',marginTop:8}}>{hist.map((e,i)=><div key={i} style={{padding:'8px 12px',display:'flex',justifyContent:'space-between',borderBottom:'1px solid var(--glass-border)'}}><span>{new Date(e.at).toLocaleString('pt-BR')}</span><button className="btn btn-outline" onClick={()=>restore(e)}>Restaurar</button></div>)}</div></div>}<div style={{marginTop:24,borderTop:'1px solid var(--glass-border)',paddingTop:12}}><button className="btn btn-danger" onClick={clearAll}>⚠️ Resetar todos os dados</button></div></div>;
};

// ══════════════════════════════════════════════════════════════
// COMMAND PALETTE, SHORTCUTS, QUICK CAPTURE
// ══════════════════════════════════════════════════════════════
const CommandPalette = ({ onClose }) => {
  const { projects, notes, mentors, clients, setView, setSelectedProject } = useContext(AppContext);
  const [q,setQ]=useState(''); const [idx,setIdx]=useState(0); const inpRef=useRef(null);
  useEffect(()=>{inpRef.current?.focus();},[]); useEffect(()=>{setIdx(0);},[q]);
  const navs = [{title:'Visão Geral',type:'Navegar',action:()=>{setView('dashboard');onClose();}},{title:'Projetos',type:'Navegar',action:()=>{setView('projects');onClose();}},{title:'Galeria',type:'Navegar',action:()=>{setView('gallery');onClose();}},{title:'Anotações',type:'Navegar',action:()=>{setView('ideas');onClose();}},{title:'Mentores',type:'Navegar',action:()=>{setView('mentors');onClose();}},{title:'Social',type:'Navegar',action:()=>{setView('social');onClose();}},{title:'Clientes',type:'Navegar',action:()=>{setView('clients');onClose();}},{title:'Sincronizar',type:'Navegar',action:()=>{setView('sync');onClose();}}];
  const items = useMemo(()=>{const ql=q.toLowerCase().trim();const r=[];if(!ql){r.push(...navs.slice(0,4));(projects||[]).filter(p=>!p.deleted).slice(0,4).forEach(p=>r.push({title:p.title,meta:p.client,type:'Projeto',action:()=>{setSelectedProject(p);setView('project-detail');onClose();}}));return r;}navs.forEach(n=>{if(n.title.toLowerCase().includes(ql))r.push(n);});(projects||[]).filter(p=>!p.deleted).forEach(p=>{if((p.title||'').toLowerCase().includes(ql)||(p.client||'').toLowerCase().includes(ql))r.push({title:p.title,meta:p.client,type:'Projeto',action:()=>{setSelectedProject(p);setView('project-detail');onClose();}});});(notes||[]).filter(n=>!n.deleted).forEach(n=>{if((n.title||'').toLowerCase().includes(ql)||(n.content||'').toLowerCase().includes(ql))r.push({title:n.title,meta:(n.content||'').slice(0,60),type:'Nota',action:()=>{setView('ideas');onClose();}});});(mentors||[]).filter(m=>!m.deleted).forEach(m=>{if((m.name||'').toLowerCase().includes(ql)||(m.area||'').toLowerCase().includes(ql))r.push({title:m.name,meta:m.area,type:'Mentor',action:()=>{setView('mentors');onClose();}});});(clients||[]).filter(c=>!c.deleted).forEach(c=>{if((c.name||'').toLowerCase().includes(ql)||(c.company||'').toLowerCase().includes(ql))r.push({title:c.name,meta:c.company,type:'Cliente',action:()=>{setView('clients');onClose();}});});return r.slice(0,12);},[q]);
  const run = i => { const it=items[i]; if(it)it.action(); };
  return ReactDOM.createPortal(<div className="cmd-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}><div className="cmd-palette" onKeyDown={e=>{if(e.key==='ArrowDown'){e.preventDefault();setIdx(i=>Math.min(i+1,items.length-1));}else if(e.key==='ArrowUp'){e.preventDefault();setIdx(i=>Math.max(i-1,0));}else if(e.key==='Enter'){e.preventDefault();run(idx);}else if(e.key==='Escape')onClose();}}><div className="cmd-input-wrap"><span>🔍</span><input ref={inpRef} className="cmd-input" placeholder="Buscar..." value={q} onChange={e=>setQ(e.target.value)}/><span className="cmd-kbd">ESC</span></div><div className="cmd-results">{items.length===0&&<div style={{padding:32,textAlign:'center',color:'var(--text-secondary)'}}>Nenhum resultado</div>}{items.map((it,i)=><div key={i} className={`cmd-item${i===idx?' cmd-active':''}`} onClick={()=>run(i)} onMouseEnter={()=>setIdx(i)}><div style={{flex:1}}><div className="cmd-item-title">{it.title}</div>{it.meta&&<div style={{fontSize:'.72rem',color:'var(--text-secondary)'}}>{it.meta}</div>}</div><span style={{fontSize:'.66rem',color:'var(--text-secondary)',fontWeight:600}}>{it.type}</span></div>)}</div><div className="cmd-footer"><span><span className="cmd-kbd">↑↓</span> navegar</span><span><span className="cmd-kbd">↵</span> abrir</span></div></div></div>,document.body);
};
const ShortcutsModal = ({ onClose }) => {
  const rows = [['Ctrl/⌘+K','Busca global'],['N','Nova nota'],['T','Nova atividade'],['?','Atalhos'],['Esc','Fechar']];
  return ReactDOM.createPortal(<div style={{position:'fixed',inset:0,zIndex:300,background:'rgba(10,8,6,.6)',display:'flex',alignItems:'center',justifyContent:'center'}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}><div className="card" style={{width:400,padding:28}} onClick={e=>e.stopPropagation()}><div style={{display:'flex',justifyContent:'space-between',marginBottom:20}}><h2 style={{fontFamily:'var(--font-heading)'}}>Atalhos</h2><button className="btn btn-ghost" onClick={onClose}>✕</button></div>{rows.map(([k,d])=><div key={k} style={{display:'flex',gap:12,padding:'4px 0'}}><kbd style={{fontWeight:600,background:'var(--bg)',border:'1px solid var(--glass-border)',borderRadius:6,padding:'3px 8px',minWidth:78,textAlign:'center'}}>{k}</kbd><span>{d}</span></div>)}</div></div>,document.body);
};
const QuickCapture = ({ type, onClose, onAddTask, onAddNote }) => {
  const [v,setV]=useState('');const ref=useRef(null);useEffect(()=>{ref.current?.focus();},[]);
  const submit = () => { if(!v.trim()){onClose();return;} if(type==='task')onAddTask({id:Date.now(),text:v.trim(),done:false,noteId:null}); else onAddNote({id:Date.now(),title:v.trim(),content:'',date:'Agora',deleted:false}); onClose(); };
  return ReactDOM.createPortal(<div className="quick-capture"><span>{type==='task'?'✅':'📄'}</span><input ref={ref} value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();submit();}if(e.key==='Escape')onClose();}} placeholder={type==='task'?'Nova atividade...':'Nova nota...'}/><button className="btn btn-dark" onClick={submit}>+</button><button className="btn btn-ghost" onClick={onClose}>✕</button></div>,document.body);
};

// ══════════════════════════════════════════════════════════════
// LAYOUT (Desktop + Mobile, theme, daily backup)
// ══════════════════════════════════════════════════════════════
const DesktopSidebar = ({ onOpenCmd, darkMode, setDarkMode }) => {
  const { setView } = useContext(AppContext);
  return <aside className="sidebar">
    <div style={{cursor:'pointer',marginBottom:20}} onClick={()=>setView('dashboard')}><h1 style={{fontFamily:'var(--font-heading)',fontSize:'2rem',fontWeight:500,color:'var(--accent)'}}>Board<span style={{fontStyle:'italic',fontWeight:300}}>Hub</span></h1></div>
    <button onClick={onOpenCmd} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:8,border:'1px solid var(--glass-border)',background:'var(--bg)',cursor:'pointer',fontFamily:'var(--font-ui)',fontSize:'.78rem',color:'var(--text-secondary)',width:'100%',marginBottom:16}}>🔍 Buscar...<span className="cmd-kbd" style={{marginLeft:'auto'}}>Cmd+K</span></button>
    <nav style={{display:'flex',flexDirection:'column',gap:4,flex:1}}>
      {['dashboard','projects','gallery','ideas','mentors','social','clients','sync'].map(id=><button key={id} onClick={()=>setView(id)} style={{textAlign:'left',width:'100%',padding:'10px 12px',border:'none',background:'transparent',color:'var(--text-secondary)',fontFamily:'var(--font-ui)',fontSize:'.85rem',cursor:'pointer',borderRadius:8}} onMouseEnter={e=>e.currentTarget.style.background='rgba(212,168,67,0.1)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>{id.charAt(0).toUpperCase()+id.slice(1).replace('-',' ')}</button>)}
    </nav>
    <button className="btn btn-ghost" onClick={()=>{const next=!darkMode;setDarkMode(next);document.body.classList.toggle('dark',next);try{localStorage.setItem(THEME_KEY,next?'dark':'light');}catch{}}} style={{justifyContent:'center',marginTop:8}}>{darkMode?'☀️ Claro':'🌙 Escuro'}</button>
  </aside>;
};

const MobileTabs = ({ activeView, setView, setMoreOpen }) => {
  const items = [{id:'dashboard',label:'Início'},{id:'projects',label:'Projetos'},{id:'ideas',label:'Notas'},{id:'gallery',label:'Galeria'},{id:'sync',label:'Sync'}];
  return <nav className="bottom-tab-bar">
    {items.map(it=><button key={it.id} onClick={()=>setView(it.id)} className={`bottom-tab-item ${activeView===it.id||(it.id==='projects'&&activeView==='project-detail')?'active':''}`}><span style={{fontSize:'1.1rem'}}>{it.id==='dashboard'?'🏠':it.id==='projects'?'📁':it.id==='ideas'?'📝':it.id==='gallery'?'🖼️':'☁️'}</span>{it.label}</button>)}
    <button className="bottom-tab-item" onClick={()=>setMoreOpen(true)}><span style={{fontSize:'1.1rem'}}>⋯</span>Mais</button>
  </nav>;
};

const Layout = () => {
  const { view, setView, setSelectedProject, tasks, setTasks, notes, setNotes } = useContext(AppContext);
  const [showCmd,setShowCmd]=useState(false); const [showShort,setShowShort]=useState(false);
  const [qc,setQc]=useState(null); const [moreOpen,setMoreOpen]=useState(false);
  const [dark,setDark]=useState(()=>getTheme()==='dark');
  const isMobile = window.innerWidth < 768;

  useEffect(() => {
    try {
      const today = localDateISO();
      const list = bhHistoryLoad();
      if (list.some(e => e.reason === 'daily' && e.at.slice(0, 10) === today)) return;
      const snap = lsLoad();
      if (snap) bhCapture(snap, 'daily');
    } catch {}
  }, []);

  useEffect(()=>{document.body.classList.toggle('dark',dark);try{localStorage.setItem(THEME_KEY,dark?'dark':'light');}catch{}},[dark]);
  useEffect(()=>{const h=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();setShowCmd(v=>!v);return;}if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;if(e.key==='n'&&!e.metaKey&&!e.ctrlKey)setQc({type:'note'});if(e.key==='t'&&!e.metaKey&&!e.ctrlKey)setQc({type:'task'});if(e.key==='?'){e.preventDefault();setShowShort(v=>!v);}};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);},[]);

  const MORE_ITEMS = [{id:'mentors',label:'Mentores'},{id:'social',label:'Social Media'},{id:'clients',label:'Clientes'}];

  return <div style={{display:'flex',height:'100vh'}}>
    {!isMobile && <DesktopSidebar onOpenCmd={()=>setShowCmd(true)} darkMode={dark} setDarkMode={setDark}/>}
    {isMobile && <div className="mobile-header"><span style={{fontFamily:'var(--font-heading)',fontSize:'1.2rem',fontWeight:500}}>Board<span style={{fontStyle:'italic',fontWeight:300}}>Hub</span></span><button className="btn btn-ghost" onClick={()=>{const n=!dark;setDark(n);document.body.classList.toggle('dark',n);}}>{dark?'☀️':'🌙'}</button></div>}
    <main className="main-content">
      {view==='dashboard'&&<Dashboard/>}
      {view==='projects'&&<ProjectsList/>}
      {view==='project-detail'&&<ProjectDetail/>}
      {view==='new-project'&&<NewProjectModal onClose={()=>setView('projects')}/>}
      {view==='gallery'&&<Gallery/>}
      {view==='ideas'&&<IdeasLab/>}
      {view==='mentors'&&<MentorsHub/>}
      {view==='social'&&<Social/>}
      {view==='clients'&&<Clients/>}
      {view==='sync'&&<SyncHub/>}
    </main>
    {isMobile && <MobileTabs activeView={view} setView={setView} setMoreOpen={setMoreOpen}/>}
    {isMobile && view==='projects' && <button className="fab" onClick={()=>setView('new-project')}>+</button>}
    {moreOpen && isMobile && <>
      <div className="more-sheet-overlay" onClick={()=>setMoreOpen(false)}/>
      <div className="more-sheet">
        <div className="more-sheet-handle"/>
        {MORE_ITEMS.map(item=><button key={item.id} onClick={()=>{setView(item.id);setMoreOpen(false);}} className={`more-sheet-item ${view===item.id?'active-sheet':''}`}>{item.label}</button>)}
        <button onClick={()=>{setShowCmd(true);setMoreOpen(false);}} className="more-sheet-item">🔍 Buscar</button>
        <button onClick={()=>{setMoreOpen(false);}} className="more-sheet-item" style={{color:'var(--text-secondary)',fontSize:'.88rem'}}>✕ Fechar</button>
      </div>
    </>}
    {showCmd && <CommandPalette onClose={()=>setShowCmd(false)}/>}
    {showShort && <ShortcutsModal onClose={()=>setShowShort(false)}/>}
    {qc && <QuickCapture type={qc.type} onClose={()=>setQc(null)} onAddTask={t=>setTasks(p=>[...p,t])} onAddNote={n=>setNotes(p=>[n,...p])}/>}
  </div>;
};

// ══════════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════════
const App = () => {
  const [projects,setProjects]=useState(lsLoad()?.projects||SEED.projects);
  const [clients,setClients]=useState(lsLoad()?.clients||SEED.clients);
  const [mentors,setMentors]=useState(lsLoad()?.mentors||SEED.mentors);
  const [notes,setNotes]=useState(lsLoad()?.notes||SEED.notes);
  const [tasks,setTasks]=useState(lsLoad()?.tasks||SEED.tasks);
  const [socialPosts,setSocialPosts]=useState(lsLoad()?.socialPosts||SEED.socialPosts);
  const [galleryPosts,setGalleryPosts]=useState(lsLoad()?.galleryPosts||SEED.galleryPosts);
  const [galleryFolders,setGalleryFolders]=useState(lsLoad()?.galleryFolders||SEED.galleryFolders);
  const [noteGroups,setNoteGroups]=useState(lsLoad()?.noteGroups||SEED.noteGroups);
  const [pomoData,setPomoData]=useState(()=>{try{return JSON.parse(localStorage.getItem('boardhub_pomo_v3'))||{days:{}};}catch{return{days:{}};}});
  const [view,setView]=useState('dashboard');
  const [selectedProject,setSelectedProject]=useState(null);

  useEffect(()=>{const s={projects,clients,mentors,notes,tasks,socialPosts,galleryPosts,galleryFolders,noteGroups,pomoData};lsSave(s);bhCapture(s,'auto');},[projects,clients,mentors,notes,tasks,socialPosts,galleryPosts,galleryFolders,noteGroups,pomoData]);
  useEffect(()=>{localStorage.setItem('boardhub_pomo_v3',JSON.stringify(pomoData));},[pomoData]);

  // Trash auto-purge (30 days)
  useEffect(() => {
    const purge = (s) => {
      if (!s) return s;
      const now = Date.now();
      const prune = (arr) => Array.isArray(arr) ? arr.map(x => {
        if (x && x.deleted && !x.deletedAt) return { ...x, deletedAt: new Date().toISOString() };
        return x;
      }).filter(x => {
        if (!x || !x.deleted || !x.deletedAt) return true;
        return now - new Date(x.deletedAt).getTime() < 30 * 24 * 3600 * 1000;
      }) : arr;
      ['projects', 'clients', 'mentors', 'notes', 'socialPosts', 'galleryPosts'].forEach(k => {
        if (s[k]) s[k] = prune(s[k]);
      });
      return s;
    };
    const cleaned = purge(lsLoad());
    if (cleaned) {
      setProjects(cleaned.projects || SEED.projects);
      setClients(cleaned.clients || SEED.clients);
      setMentors(cleaned.mentors || SEED.mentors);
      setNotes(cleaned.notes || SEED.notes);
      setTasks(cleaned.tasks || SEED.tasks);
      setSocialPosts(cleaned.socialPosts || []);
      setGalleryPosts(cleaned.galleryPosts || []);
    }
  }, []);

  const ctx = useMemo(()=>({projects,setProjects,clients,setClients,mentors,setMentors,notes,setNotes,tasks,setTasks,socialPosts,setSocialPosts,galleryPosts,setGalleryPosts,galleryFolders,setGalleryFolders,noteGroups,setNoteGroups,pomoData,setPomoData,view,setView,selectedProject,setSelectedProject}),[projects,clients,mentors,notes,tasks,socialPosts,galleryPosts,galleryFolders,noteGroups,pomoData,view,selectedProject]);

  return <AppContext.Provider value={ctx}><Layout/></AppContext.Provider>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
